    :root {
      --bg-deep: #070b14;
      --bg-card: #111827;
      --bg-card-elevated: #192338;
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.35);
      --accent-gold: #f59e0b;
      --accent-gold-glow: rgba(245, 158, 11, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #03060c;
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-sport {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.02em;
    }

    /* Mobile App Shell */
    #app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: radial-gradient(circle at top center, #11223b 0%, var(--bg-deep) 55%);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
    }

    /* FIFA/EA FC Style Player Card */
    .fut-card {
      position: relative;
      border-radius: 20px;
      padding: 16px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .fut-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 10%, rgba(255,255,255,0.18) 0%, transparent 55%),
                  repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 10px);
      pointer-events: none;
    }

      background: linear-gradient(145deg, #5c3a21 0%, #3d2413 45%, #23140a 100%);
      border-color: rgba(217, 152, 95, 0.45);

      background: linear-gradient(145deg, #475569 0%, #273244 50%, #151c27 100%);
      border-color: rgba(203, 213, 225, 0.45);
    }

      background: linear-gradient(145deg, #855c12 0%, #4d350a 48%, #221705 100%);
      border-color: rgba(251, 191, 36, 0.65);

      border-color: rgba(52, 211, 153, 0.75);
      box-shadow: 0 14px 40px rgba(16, 185, 129, 0.3);

    .glass-panel {

      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);

      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #03140e;
      font-weight: 800;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
      transition: transform 0.12s ease, filter 0.15s ease;
    }
    .btn-primary:active {
      transform: scale(0.97);
      filter: brightness(1.08);
    }

    .btn-gold {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #1c1002;
      font-weight: 800;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
      transition: transform 0.12s ease;
    }
    .btn-gold:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.2);
      font-weight: 600;
      border-radius: 14px;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn-secondary:active {
      transform: scale(0.97);
      background: rgba(51, 65, 85, 0.95);
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(9, 14, 26, 0.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);

      font-size: 10px;
      font-weight: 600;
      transition: color 0.2s ease, transform 0.15s ease;
      position: relative;

    .nav-btn.active {

      content: "";
      position: absolute;
      top: 0;
      width: 24px;
      height: 3px;
      background: #10b981;
      border-radius: 0 0 4px 4px;
      box-shadow: 0 2px 10px #10b981;

    /* Animations */

      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

      animation: fadeSlideUp 0.28s ease-out forwards;

     * 1. TELEGRAM WEBAPP SDK INTEGRATION & HAPTIC / AUDIO HELPERS
     *************************************************************************/
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

    function initTelegram() {
      try {
        if (tg) {
          tg.ready();
          tg.expand();
          if (tg.setHeaderColor) tg.setHeaderColor('#070b14');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#070b14');
        }
      } catch (e) {
        console.warn('Telegram SDK fallback mode:', e);
      }
    }

    function haptic(type = 'light') {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === 'success' || type === 'error' || type === 'warning') {
            tg.HapticFeedback.notificationOccurred(type);
          } else {
            tg.HapticFeedback.impactOccurred(type);
          }
        }
      } catch (_) {}
    }

    // Lightweight Web Audio synth for crisp feedback (no external audio URLs)
    let audioCtx = null;
    function playSfx(kind) {
      if (!state || !state.settings || !state.settings.sound) return;
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (kind === 'goal') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.09);
          osc.frequency.setValueAtTime(783.99, now + 0.18);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.46);
        } else if (kind === 'fail') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.22);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (kind === 'train') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(660, now + 0.14);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.19);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.07);
        }
      } catch (_) {}
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        success: 'bg-emerald-950/95 border-emerald-500/60 text-emerald-200',
        error: 'bg-rose-950/95 border-rose-500/60 text-rose-200',
        gold: 'bg-amber-950/95 border-amber-400/70 text-amber-200',
        info: 'bg-slate-900/95 border-slate-600/60 text-slate-100'
      };
      const el = document.createElement('div');
      el.className = `toast-anim px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-xl backdrop-blur-md text-center ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity 0.3s ease';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 320);
      }, 2400);
    }

    function calcOVR(stats, posKey) {
      const w = POSITIONS[posKey].weights;
      const raw =
        stats.pac * w.pac +
        stats.sho * w.sho +
        stats.pas * w.pas +
        stats.dri * w.dri +
        stats.def * w.def +
        stats.phy * w.phy;
      return Math.min(99, Math.max(40, Math.round(raw)));
    }

    function calcMarketValue(p) {
      const ovr = calcOVR(p.stats, p.pos);
      const league = getLeagueById(p.leagueId);
      // Exponential curve so 62 OVR ≈ €1.2M, 75 OVR ≈ €14M, 85 OVR ≈ €68M, 93 OVR ≈ €180M+
      let base = Math.pow(Math.max(1, ovr - 55), 2.38) * 32000;
      // Age multiplier
      let ageMult = 1.0;
      if (p.age <= 21) ageMult = 1.35;
      else if (p.age <= 26) ageMult = 1.15;
      else if (p.age >= 32) ageMult = Math.max(0.25, 1 - (p.age - 31) * 0.14);
      // Season performance bonus
      const perfMult = 1 + Math.min(0.45, (p.seasonStats.goals * 0.025 + p.seasonStats.assists * 0.015));
      const val = Math.round((base * ageMult * league.prestige * perfMult) / 100000) * 100000;
      return Math.max(500000, val);
    }

    /*************************************************************************
     * 4. SEASON SCHEDULE & LEAGUE SIMULATION ENGINE
     *************************************************************************/
    // Generates an 18-round double round-robin schedule for 10 teams
    function generateLeagueSchedule(clubs) {
      const ids = clubs.map(c => c.id);
      const n = ids.length; // 10
      const half = n / 2;
      const rounds = [];
      const arr = [...ids];

      for (let r = 0; r < n - 1; r++) {
        const matches = [];
        for (let i = 0; i < half; i++) {
          const home = (r % 2 === 0) ? arr[i] : arr[n - 1 - i];
          const away = (r % 2 === 0) ? arr[n - 1 - i] : arr[i];
          matches.push({ home, away });
        }
        rounds.push(matches);
        // Rotate all except first element
        const last = arr.pop();
        arr.splice(1, 0, last);
      }
      // Second half (swapped home/away)
      const secondHalf = rounds.map(r => r.map(m => ({ home: m.away, away: m.home })));
      return [...rounds, ...secondHalf];
    }

    function initSeasonTables() {
      const tables = {};
      const schedules = {};
      LEAGUES.forEach(l => {
        tables[l.id] = l.clubs.map(c => ({
          clubId: c.id,
          played: 0,
          w: 0,
          d: 0,
          l: 0,
          gf: 0,
          ga: 0,
          pts: 0
        }));
        schedules[l.id] = generateLeagueSchedule(l.clubs);
      });
      return { tables, schedules };
    }

    function sortTable(rows) {
      return [...rows].sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        const gdA = a.gf - a.ga;
        const gdB = b.gf - b.ga;
        if (gdB !== gdA) return gdB - gdA;
        if (b.gf !== a.gf) return b.gf - a.gf;
        return a.clubId.localeCompare(b.clubId);
      });
    }

    function simulateAIMatchScore(homeClub, awayClub) {
      // Home advantage +2 OVR
      const diff = (homeClub.ovr + 2) - awayClub.ovr;
      const homeExp = Math.max(0.35, 1.35 + diff * 0.065);
      const awayExp = Math.max(0.30, 1.15 - diff * 0.055);
      const poisson = (lambda) => {
        let L = Math.exp(-lambda);
        let k = 0, p = 1;
        do { k++; p *= Math.random(); } while (p > L && k < 7);
        return k - 1;
      };
      return { hg: poisson(homeExp), ag: poisson(awayExp) };
    }

    function applyMatchToTable(leagueId, homeId, awayId, hg, ag) {
      const table = state.tables[leagueId];
      const hRow = table.find(r => r.clubId === homeId);
      const aRow = table.find(r => r.clubId === awayId);
      if (!hRow || !aRow) return;

      hRow.played++; aRow.played++;
      hRow.gf += hg; hRow.ga += ag;
      aRow.gf += ag; aRow.ga += hg;

      if (hg > ag) {
        hRow.w++; hRow.pts += 3; aRow.l++;
      } else if (ag > hg) {
        aRow.w++; aRow.pts += 3; hRow.l++;
      } else {
        hRow.d++; hRow.pts += 1; aRow.d++; aRow.pts += 1;
      }
    }

    function simulateOtherLeagueMatches(roundIdx, excludeLeagueId, excludeMatch) {
      LEAGUES.forEach(league => {
        const roundMatches = state.schedules[league.id][roundIdx];
        if (!roundMatches) return;
        roundMatches.forEach(m => {
          if (league.id === excludeLeagueId && excludeMatch &&
              m.home === excludeMatch.home && m.away === excludeMatch.away) {
            return;
          }
          const hc = getClubById(m.home);
          const ac = getClubById(m.away);
          const { hg, ag } = simulateAIMatchScore(hc, ac);
          applyMatchToTable(league.id, m.home, m.away, hg, ag);
        });
      });
    }

    function getNextPlayerMatch() {
      const p = state.player;
      // Check Champions League stage
      if (state.ucl && state.ucl.active && !state.ucl.finished) {
        return {
          type: 'ucl',
          stage: state.ucl.stage, // 'semi' | 'final'
          home: state.ucl.currentOpponentHome ? state.ucl.opponentId : p.clubId,
          away: state.ucl.currentOpponentHome ? p.clubId : state.ucl.opponentId,
          opponentId: state.ucl.opponentId,
          isHome: !state.ucl.currentOpponentHome
        };
      }
      if (state.round >= 18) return null;
      const roundMatches = state.schedules[p.leagueId][state.round];
      const match = roundMatches.find(m => m.home === p.clubId || m.away === p.clubId);
      if (!match) return null;
      const isHome = match.home === p.clubId;
      return {
        type: 'league',
        round: state.round + 1,
        home: match.home,
        away: match.away,
        opponentId: isHome ? match.away : match.home,
        isHome
      };
    }

    function calcActionChance(statKey, oppOvr, difficultyMod = 0) {
      const p = state.player;
      const bonuses = getPlayerGearBonuses();
      const playerStat = p.stats[statKey] + bonuses.matchBonus;
      const formMod = (p.form - 65) * 0.28;
      const energyMod = p.energy < 35 ? -10 : (p.energy > 80 ? 3 : 0);
      const raw = 54 + (playerStat - oppOvr) * 1.45 + formMod + energyMod + difficultyMod;
      return Math.max(15, Math.min(93, Math.round(raw)));
    }

    function startInteractiveMatch() {
      const p = state.player;
      const next = getNextPlayerMatch();
      const myClub = getClubById(p.clubId);
      const oppClub = getClubById(next.opponentId);
      const role = getRoleLabel(p.trust);

      // Schedule moment minutes
      const count = role.moments;
      const momentMins = [];
      const startMin = role.label === 'Запасной' ? 52 : 12;
      const step = Math.floor((86 - startMin) / count);
      for (let i = 0; i < count; i++) {
        momentMins.push(startMin + i * step + Math.floor(Math.random() * 6));
      }

      liveMatch = {
        next,
        myClub,
        oppClub,
        minute: 0,
        myScore: 0,
        oppScore: 0,
        playerGoals: 0,
        playerAssists: 0,
        playerSaves: 0,
        rating: 6.2,
        momentMins,
        momentIdx: 0,
        activeMoment: null,
        log: [
          { min: 0, text: `Стартовый свисток! ${next.isHome ? myClub.name : oppClub.name} против ${next.isHome ? oppClub.name : myClub.name}.`, type: 'info' }
        ],
        timer: null,
        finished: false,
        goalFlash: false
      };

      if (role.label === 'Запасной') {
        liveMatch.log.unshift({ min: 1, text: 'Вы начинаете матч на скамейке запасных. Тренер выпустит вас во втором тайме.', type: 'muted' });
      }

      haptic('medium');
      renderLiveMatchModal();
      resumeMatchTimer();
    }

    function resumeMatchTimer() {
      if (!liveMatch || liveMatch.finished) return;
      clearInterval(liveMatch.timer);
      liveMatch.timer = setInterval(() => {
        if (!liveMatch || liveMatch.activeMoment) return;
        liveMatch.minute += 2;

        // Background team goals simulation
        const diff = (liveMatch.myClub.ovr + (liveMatch.next.isHome ? 2 : 0)) - liveMatch.oppClub.ovr;
        const myBgChance = Math.max(0.008, 0.022 + diff * 0.0012);
        const oppBgChance = Math.max(0.008, 0.022 - diff * 0.0012);

        if (Math.random() < myBgChance && liveMatch.minute > 4 && liveMatch.minute < 89) {
          liveMatch.myScore++;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `⚽ ГОЛ! Партнёр по ${liveMatch.myClub.name} открывает счёт в атаке!`, type: 'good' });
        } else if (Math.random() < oppBgChance && liveMatch.minute > 4 && liveMatch.minute < 89) {
          liveMatch.oppScore++;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `🔴 ${liveMatch.oppClub.name} забивает после быстрой комбинации.`, type: 'bad' });
        }

        // Check if subbed in
        if (liveMatch.minute === 50 && getRoleLabel(state.player.trust).label === 'Запасной') {
          liveMatch.log.unshift({ min: 50, text: `🔄 Замена! Вы выходите на поле под аплодисменты трибун!`, type: 'info' });
        }

        // Trigger interactive moment
        const targetMin = liveMatch.momentMins[liveMatch.momentIdx];
        if (targetMin && liveMatch.minute >= targetMin) {
          clearInterval(liveMatch.timer);
          liveMatch.activeMoment = buildMomentScenario(state.player.pos, liveMatch.oppClub);
          liveMatch.momentIdx++;
          haptic('medium');
          renderLiveMatchModal();
          return;
        }

        // End of match
        if (liveMatch.minute >= 90) {
          liveMatch.minute = 90;
          clearInterval(liveMatch.timer);

          // UCL tie-breaker (no draws allowed in knockout)
          if (liveMatch.next.type === 'ucl' && liveMatch.myScore === liveMatch.oppScore) {
            const winPen = Math.random() < (0.5 + (liveMatch.myClub.ovr - liveMatch.oppClub.ovr) * 0.02);
            if (winPen) {
              liveMatch.myScore++;
              liveMatch.log.unshift({ min: 90, text: '🏆 Серия пенальти! Ваша команда вырывает победу!', type: 'good' });
            } else {
              liveMatch.oppScore++;
              liveMatch.log.unshift({ min: 90, text: '💔 Серия пенальти... Соперник оказался точнее.', type: 'bad' });
            }
          }

          liveMatch.finished = true;
          liveMatch.log.unshift({ min: 90, text: '🏁 Финальный свисток! Матч завершён.', type: 'info' });
          renderLiveMatchModal();
          return;
        }

        renderLiveMatchModal();
      }, 170);
    }

    function resolveMomentChoice(choiceIdx) {
      if (!liveMatch || !liveMatch.activeMoment) return;
      const choice = liveMatch.activeMoment.choices[choiceIdx];
      const success = Math.random() * 100 < choice.chance;

      if (success) {
        haptic('success');
        playSfx('goal');
        if (choice.outcomeType === 'goal') {
          liveMatch.myScore++;
          liveMatch.playerGoals++;
          liveMatch.rating = Math.min(10, liveMatch.rating + 1.15);
          liveMatch.goalFlash = true;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `⚽ ГОЛ! ${choice.successText}`, type: 'good' });
        } else if (choice.outcomeType === 'assist') {
          liveMatch.myScore++;
          liveMatch.playerAssists++;
          liveMatch.rating = Math.min(10, liveMatch.rating + 0.85);
          liveMatch.goalFlash = true;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `🎯 АССИСТ! ${choice.successText}`, type: 'good' });
        } else if (choice.outcomeType === 'save') {
          liveMatch.playerSaves++;
          liveMatch.rating = Math.min(10, liveMatch.rating + 0.7);
          liveMatch.log.unshift({ min: liveMatch.minute, text: `🛡️ ОТБОР! ${choice.successText}`, type: 'good' });
        }
      } else {
        haptic('error');
        playSfx('fail');
        liveMatch.rating = Math.max(4.5, liveMatch.rating - 0.35);
        if (liveMatch.activeMoment.isDefense) {
          liveMatch.oppScore++;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `🔴 ПРОПУСТИЛИ! ${choice.failText}`, type: 'bad' });
        } else {
          liveMatch.log.unshift({ min: liveMatch.minute, text: `❌ Момент упущен: ${choice.failText}`, type: 'bad' });
        }
      }

      liveMatch.activeMoment = null;
      renderLiveMatchModal();
      setTimeout(() => {
        if (liveMatch) liveMatch.goalFlash = false;
        resumeMatchTimer();
      }, 550);
    }

    function resolvePenaltyShot(direction) {
      if (!liveMatch || !liveMatch.activeMoment) return;
      const dirs = ['left', 'center', 'right'];
      const dirLabels = { left: 'левый угол', center: 'центр', right: 'правый угол' };
      const keeperDir = dirs[Math.floor(Math.random() * 3)];

      // Base penalty conversion chance boosted by SHO
      const shoChance = calcActionChance('sho', liveMatch.oppClub.ovr, 18);
      const scored = (direction !== keeperDir)
        ? (Math.random() * 100 < Math.min(96, shoChance + 15))
        : (Math.random() * 100 < Math.max(25, shoChance - 35));

      if (scored) {
        haptic('success');
        playSfx('goal');
        liveMatch.myScore++;
        liveMatch.playerGoals++;
        liveMatch.rating = Math.min(10, liveMatch.rating + 1.0);
        liveMatch.goalFlash = true;
        liveMatch.log.unshift({
          min: liveMatch.minute,
          text: `⚽ ГООООЛ с пенальти! Вы пробили в ${dirLabels[direction]}, а вратарь прыгнул в ${dirLabels[keeperDir]}!`,
          type: 'good'
        });
      } else {
        haptic('error');
        playSfx('fail');
        liveMatch.rating = Math.max(4.5, liveMatch.rating - 0.55);
        liveMatch.log.unshift({
          min: liveMatch.minute,
          text: `🧤 СЕЙВ ВРАТАРЯ! Голкипер угадал направление (${dirLabels[direction]}) и отбил пенальти!`,
          type: 'bad'
        });
      }

      liveMatch.activeMoment = null;
      renderLiveMatchModal();
      setTimeout(() => {
        if (liveMatch) liveMatch.goalFlash = false;
        resumeMatchTimer();
      }, 650);

    function runQuickSimMatch() {
      const p = state.player;
      const next = getNextPlayerMatch();
      const myClub = getClubById(p.clubId);
      const oppClub = getClubById(next.opponentId);
      const role = getRoleLabel(p.trust);
      const bonuses = getPlayerGearBonuses();

      const homeClub = next.isHome ? myClub : oppClub;
      const awayClub = next.isHome ? oppClub : myClub;
      const score = simulateAIMatchScore(homeClub, awayClub);
      let myScore = next.isHome ? score.hg : score.ag;
      let oppScore = next.isHome ? score.ag : score.hg;

      // Player contribution based on OVR, pos, role
      const ovr = calcOVR(p.stats, p.pos) + bonuses.matchBonus;
      const eff = (ovr - oppClub.ovr + (p.form - 60) * 0.25) / 100;
      let pGoals = 0, pAssists = 0;

      for (let i = 0; i < role.moments; i++) {
        const roll = Math.random();
        const goalProb = p.pos === 'FWD' ? 0.28 + eff : (p.pos === 'MID' ? 0.16 + eff : 0.07 + eff * 0.5);
        const astProb = p.pos === 'MID' ? 0.26 + eff : (p.pos === 'FWD' ? 0.14 + eff : 0.08 + eff * 0.5);
        if (roll < Math.max(0.05, goalProb)) pGoals++;
        else if (roll < Math.max(0.1, goalProb + astProb)) pAssists++;
      }

      if (pGoals > myScore) myScore = pGoals;
      if (pAssists > myScore) myScore = Math.max(myScore, pAssists);

      // UCL tie-breaker
      if (next.type === 'ucl' && myScore === oppScore) {
        if (Math.random() < 0.52) myScore++; else oppScore++;
      }

      const winBonus = myScore > oppScore ? 0.6 : (myScore === oppScore ? 0.1 : -0.3);
      const rating = Math.min(10, Math.max(5.2, 6.2 + pGoals * 1.05 + pAssists * 0.75 + winBonus + (Math.random() * 0.6 - 0.3)));

      finalizeMatch({
        next,
        myClub,
        oppClub,
        myScore,
        oppScore,
        playerGoals: pGoals,
        playerAssists: pAssists,
        rating: Number(rating.toFixed(1))
      });
    }

    function finalizeMatchFromLive() {
      if (!liveMatch) return;
      const result = {
        next: liveMatch.next,
        myClub: liveMatch.myClub,
        oppClub: liveMatch.oppClub,
        myScore: liveMatch.myScore,
        oppScore: liveMatch.oppScore,
        playerGoals: liveMatch.playerGoals,
        playerAssists: liveMatch.playerAssists,
        rating: Number(liveMatch.rating.toFixed(1))
      };
      liveMatch = null;
      finalizeMatch(result);
    }

    function finalizeMatch(res) {
      const p = state.player;
      const bonuses = getPlayerGearBonuses();
      const { next, myClub, oppClub, myScore, oppScore, playerGoals, playerAssists, rating } = res;
      const won = myScore > oppScore;
      const draw = myScore === oppScore;

      // Update League Table or UCL
      if (next.type === 'league') {
        const hg = next.isHome ? myScore : oppScore;
        const ag = next.isHome ? oppScore : myScore;
        applyMatchToTable(p.leagueId, next.home, next.away, hg, ag);
        simulateOtherLeagueMatches(state.round, p.leagueId, { home: next.home, away: next.away });
        state.round++;
      } else if (next.type === 'ucl') {
        if (won) {
          if (next.stage === 'semi') {
            state.ucl.stage = 'final';
            // Pick strongest opponent from another league
            const otherTop = LEAGUES.filter(l => l.id !== p.leagueId).map(l => sortTable(state.tables[l.id])[0].clubId);
            const candidates = otherTop.filter(id => id !== state.ucl.opponentId);
            state.ucl.opponentId = candidates[Math.floor(Math.random() * candidates.length)] || otherTop[0];
            state.ucl.currentOpponentHome = Math.random() < 0.5;
          } else {
            state.ucl.finished = true;
            state.ucl.won = true;
            p.trophies.ucl++;
            p.fans += 250000;
          }
        } else {
          state.ucl.finished = true;
          state.ucl.won = false;
        }
      }

      // MOTM check
      const isMotm = rating >= 8.2 || (won && (playerGoals + playerAssists >= 2));

      // Update stats
      p.seasonStats.matches++;
      p.seasonStats.goals += playerGoals;
      p.seasonStats.assists += playerAssists;
      p.seasonStats.ratingSum += rating;
      if (isMotm) p.seasonStats.motm++;

      p.careerStats.matches++;
      p.careerStats.goals += playerGoals;
      p.careerStats.assists += playerAssists;
      p.careerStats.ratingSum += rating;
      if (isMotm) p.careerStats.motm++;

      // Economy: salary + sponsor bonuses
      let sponsorIncome = 0;
      if (p.activeSponsorId) {
        const sp = SPONSORS.find(s => s.id === p.activeSponsorId);
        if (sp) sponsorIncome = sp.perMatch + sp.perGoal * playerGoals;
      }
      const winBonusMoney = won ? Math.round(p.salary * 0.25) : 0;
      const totalEarned = p.salary + sponsorIncome + winBonusMoney;
      p.money += totalEarned;

      // Energy, Form, Trust, Fans deltas
      const energyCost = Math.max(12, 26 - bonuses.energyRegen);
      const prevEnergy = p.energy;
      p.energy = Math.max(5, Math.min(100, p.energy - energyCost + 10)); // +10 natural week recovery

      const formDelta = (won ? 5 : (draw ? 1 : -4)) + (rating >= 7.5 ? 4 : (rating < 6.0 ? -4 : 0)) + Math.round(bonuses.moraleBonus / 3);
      p.form = Math.max(20, Math.min(100, p.form + formDelta));

      const trustDelta = (rating >= 8.0 ? 8 : (rating >= 7.0 ? 4 : (rating >= 6.3 ? 1 : -5))) + (playerGoals * 2) + playerAssists;
      p.trust = Math.max(10, Math.min(100, p.trust + trustDelta));

      const fansGain = Math.round((playerGoals * 4200 + playerAssists * 2400 + (isMotm ? 7000 : 0) + (won ? 1500 : 300)) * (myClub.tier * 0.55));
      p.fans += fansGain;

      // Injury risk check (high when playing below 35 energy)
      let injuredNow = false;
      if (prevEnergy < 35) {
        const baseRisk = (38 - prevEnergy) * 0.018; // up to ~55% at 8 energy
        const finalRisk = baseRisk * (1 - bonuses.injuryRed);
        if (Math.random() < finalRisk) {
          p.injuryRounds = Math.random() < 0.65 ? 1 : 2;
          injuredNow = true;
        }
      }

      // Reset weekly training slots
      state.weekActionsLeft = 3;

      // Trigger Winter Transfer Window after Round 9
      let windowNotice = '';
      if (next.type === 'league' && state.round === 9) {
        state.transferWindowOpen = true;
        generateTransferOffers();
        windowNotice = '❄️ Открылось зимнее трансферное окно! Проверьте вкладку «Трансферы».';
      } else if (next.type === 'league' && state.round === 18) {
        // Check Champions League qualification (Top 2)
        const sorted = sortTable(state.tables[p.leagueId]);
        const posIdx = sorted.findIndex(r => r.clubId === p.clubId);
        if (posIdx <= 1) {
          const otherLeaders = LEAGUES.filter(l => l.id !== p.leagueId).map(l => sortTable(state.tables[l.id])[0].clubId);
          state.ucl = {
            active: true,
            stage: 'semi',
            opponentId: otherLeaders[Math.floor(Math.random() * otherLeaders.length)],
            currentOpponentHome: Math.random() < 0.5,
            finished: false,
            won: false
          };
          windowNotice = '🏆 Ваш клуб в Топ-2 лиги и вышел в полуфинал Лиги Чемпионов!';
        }
      }

      saveState();
      haptic(won ? 'success' : 'light');

      // Show Post-Match Summary Modal
      const resultBadge = won
        ? '<span class="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 font-bold text-xs">ПОБЕДА</span>'
        : (draw ? '<span class="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 font-bold text-xs">НИЧЬЯ</span>'
                : '<span class="px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 font-bold text-xs">ПОРАЖЕНИЕ</span>');

      openModal(`
        <div class="w-full max-w-[420px] glass-panel p-5 animate-in">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs text-slate-400 font-semibold">Итоги матча</span>
            ${resultBadge}
          </div>

          <div class="bg-slate-900/90 rounded-2xl p-4 border border-white/10 flex items-center justify-between">
            <div class="flex flex-col items-center w-[36%]">
              ${renderClubCrest(next.isHome ? myClub : oppClub, 42)}
              <span class="text-[11px] font-bold mt-1 text-center truncate w-full">${(next.isHome ? myClub : oppClub).short}</span>
            </div>
            <div class="font-sport text-4xl font-bold text-white">
              ${next.isHome ? myScore : oppScore} : ${next.isHome ? oppScore : myScore}
            </div>
            <div class="flex flex-col items-center w-[36%]">
              ${renderClubCrest(next.isHome ? oppClub : myClub, 42)}
              <span class="text-[11px] font-bold mt-1 text-center truncate w-full">${(next.isHome ? oppClub : myClub).short}</span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 mt-3 text-center">
            <div class="bg-slate-900/70 rounded-xl p-2.5 border border-white/5">
              <div class="text-[10px] text-slate-400">Оценка</div>
              <div class="font-sport text-xl font-bold text-amber-300">${rating.toFixed(1)} ⭐</div>
            </div>
            <div class="bg-slate-900/70 rounded-xl p-2.5 border border-white/5">
              <div class="text-[10px] text-slate-400">Голы</div>
              <div class="font-sport text-xl font-bold text-emerald-400">${playerGoals}</div>
            </div>
            <div class="bg-slate-900/70 rounded-xl p-2.5 border border-white/5">
              <div class="text-[10px] text-slate-400">Ассисты</div>
              <div class="font-sport text-xl font-bold text-sky-400">${playerAssists}</div>
            </div>
          </div>

          ${isMotm ? `
            <div class="mt-3 p-2.5 rounded-xl bg-amber-500/15 border border-amber-400/40 text-amber-200 text-xs font-bold text-center">
              🏆 ИГРОК МАТЧА! Пресса в восторге от вашей игры!
            </div>
          ` : ''}

          <div class="mt-3 space-y-1.5 text-xs bg-slate-900/60 rounded-xl p-3 border border-white/5">
            <div class="flex justify-between"><span class="text-slate-400">Зарплата и премиальные</span><span class="font-bold text-emerald-400">+${formatMoney(p.salary + winBonusMoney)}</span></div>
            ${sponsorIncome > 0 ? `<div class="flex justify-between"><span class="text-slate-400">Бонус спонсора</span><span class="font-bold text-amber-300">+${formatMoney(sponsorIncome)}</span></div>` : ''}
            <div class="flex justify-between"><span class="text-slate-400">Доверие тренера</span><span class="font-bold ${trustDelta >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${trustDelta >= 0 ? '+' : ''}${trustDelta}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Новые фанаты</span><span class="font-bold text-sky-300">+${formatFans(fansGain)}</span></div>

          ${injuredNow ? `

          ${windowNotice ? `

        openSeasonSummaryModal();
      } else {
        render();

    function openInjuryModal() {
      const p = state.player;
      const healCost = Math.max(25000, Math.round(p.salary * 1.4));
      openModal(`
        <div class="w-full max-w-[400px] glass-panel p-5 animate-in">

          </p>
          <div class="flex flex-col gap-2.5 mt-5">

            </button>

    function healInjury(cost) {
      if (state.player.money < cost) {
        haptic('error');
        showToast('Недостаточно средств на клинику!', 'error');
        return;
      }
      state.player.money -= cost;
      state.player.injuryRounds = 0;
      state.player.energy = Math.min(100, state.player.energy + 20);
      saveState();
      haptic('success');
      closeModal();
      render();
      showToast('Вы полностью восстановились и готовы к матчу!', 'success');
    }

    function skipInjuredRound() {
      const p = state.player;
      const next = getNextPlayerMatch();
      if (next && next.type === 'league') {
        simulateOtherLeagueMatches(state.round, null, null);
        state.round++;
      } else if (next && next.type === 'ucl') {
        // Team plays without you
        const myClub = getClubById(p.clubId);
        const oppClub = getClubById(next.opponentId);
        const won = Math.random() < (0.45 + (myClub.ovr - oppClub.ovr) * 0.02);
        if (won && next.stage === 'semi') {
          state.ucl.stage = 'final';
          const otherTop = LEAGUES.filter(l => l.id !== p.leagueId).map(l => sortTable(state.tables[l.id])[0].clubId);
          state.ucl.opponentId = otherTop[Math.floor(Math.random() * otherTop.length)];
        } else {
          state.ucl.finished = true;
          state.ucl.won = won && next.stage === 'final';
          if (state.ucl.won) p.trophies.ucl++;
        }
      }
      p.injuryRounds = Math.max(0, p.injuryRounds - 1);
      p.energy = Math.min(100, p.energy + 30);
      state.weekActionsLeft = 3;
      saveState();
      closeModal();
      if (state.round >= 18 && (!state.ucl.active || state.ucl.finished)) {
        openSeasonSummaryModal();
      } else {
        render();
        showToast('Вы пропустили матч и восстановили силы.', 'info');
      }
    }

    /*************************************************************************
     * 9. SEASON SUMMARY, AWARDS & NEXT SEASON TRANSITION
     *************************************************************************/
    function openSeasonSummaryModal() {
      const p = state.player;
      const league = getLeagueById(p.leagueId);
      const sorted = sortTable(state.tables[p.leagueId]);
      const posRank = sorted.findIndex(r => r.clubId === p.clubId) + 1;
      const isChamp = posRank === 1;

      // Golden Boot threshold for an 18-round season (~14+ goals)
      const aiTopScorer = 12 + Math.floor(Math.random() * 5); // 12..16
      const wonGoldenBoot = p.seasonStats.goals >= aiTopScorer && p.seasonStats.goals >= 12;

      // Ballon d'Or check
      const avgRating = p.seasonStats.matches > 0 ? p.seasonStats.ratingSum / p.seasonStats.matches : 0;
      const ovr = calcOVR(p.stats, p.pos);
      const bdorScore =
        ovr * 0.5 +
        p.seasonStats.goals * 1.7 +
        p.seasonStats.assists * 1.2 +
        avgRating * 5 +
        (isChamp ? 14 : 0) +
        (state.ucl.won ? 24 : 0) +
        Math.min(15, p.fans / 120000);
      const wonBallonDor = bdorScore >= 118 && ovr >= 82 && p.seasonStats.matches >= 12;

      // Award trophies once
      if (!state.seasonAwardsGranted) {
        if (isChamp) { p.trophies.league++; p.fans += 120000; p.money += 250000; }
        if (wonGoldenBoot) { p.trophies.goldenBoot++; p.fans += 90000; p.money += 150000; }
        if (wonBallonDor) { p.trophies.ballonDor++; p.fans += 500000; p.money += 1000000; }

        p.history.unshift({
          season: state.season,
          age: p.age,
          club: getClubById(p.clubId).name,
          league: league.name,
          rank: posRank,
          goals: p.seasonStats.goals,
          assists: p.seasonStats.assists,
          avgRating: avgRating.toFixed(1),
          ballonDor: wonBallonDor
        });

        state.seasonAwardsGranted = true;
        state.transferWindowOpen = true;
        generateTransferOffers(true);
        saveState();

      haptic(wonBallonDor || isChamp || state.ucl.won ? 'success' : 'medium');

      openModal(`
        <div class="w-full max-w-[430px] glass-panel p-5 animate-in max-h-[90vh] overflow-y-auto">
          <div class="text-center">
            <div class="text-xs font-bold uppercase tracking-widest text-amber-400">Итоги сезона ${state.season}</div>
            <h2 class="font-sport text-2xl font-bold mt-1">${league.flag} ${league.fullName}</h2>
            <div class="text-sm text-slate-300 mt-0.5">${getClubById(p.clubId).name} — <span class="font-bold text-white">${posRank}-е место</span></div>
          </div>

          <div class="grid grid-cols-3 gap-2 mt-4 text-center">
            <div class="bg-slate-900/80 rounded-xl p-2.5 border border-white/5">
              <div class="text-[10px] text-slate-400">Голы</div>
              <div class="font-sport text-xl font-bold text-emerald-400">${p.seasonStats.goals}</div>
            </div>
            <div class="bg-slate-900/80 rounded-xl p-2.5 border border-white/5">
              <div class="text-[10px] text-slate-400">Ассисты</div>
              <div class="font-sport text-xl font-bold text-sky-400">${p.seasonStats.assists}</div>
            </div>
            <div class="bg-slate-900/80 rounded-xl p-2.5 border border-white/5">
              <div class="text-[10px] text-slate-400">Ср. оценка</div>
              <div class="font-sport text-xl font-bold text-amber-300">${avgRating.toFixed(1)}</div>
            </div>
          </div>

          <div class="mt-4 space-y-2">
            ${isChamp ? `<div class="p-3 rounded-xl bg-emerald-500/15 border border-emerald-400/40 text-emerald-200 text-xs font-bold flex items-center gap-2"><span>🏆</span> ЧЕМПИОН ${league.name.toUpperCase()}! (+€250 тыс.)</div>` : ''}
            ${state.ucl.won ? `<div class="p-3 rounded-xl bg-sky-500/20 border border-sky-400/50 text-sky-200 text-xs font-bold flex items-center gap-2"><span>🌟</span> ПОБЕДИТЕЛЬ ЛИГИ ЧЕМПИОНОВ!</div>` : ''}
            ${wonGoldenBoot ? `<div class="p-3 rounded-xl bg-amber-500/15 border border-amber-400/40 text-amber-200 text-xs font-bold flex items-center gap-2"><span>👟</span> ЗОЛОТАЯ БУТСА ЛИГИ! (+€150 тыс.)</div>` : ''}
            ${wonBallonDor ? `<div class="p-3.5 rounded-xl bg-gradient-to-r from-amber-500/30 to-yellow-500/20 border border-amber-300 text-amber-100 text-xs font-extrabold flex items-center gap-2 shadow-lg"><span>🌕</span> ЗОЛОТОЙ МЯЧ (BALLON D'OR)! ВЫ ЛУЧШИЙ ИГРОК МИРА! (+€1 млн)</div>` : ''}
            ${(!isChamp && !state.ucl.won && !wonGoldenBoot && !wonBallonDor) ? `<div class="p-3 rounded-xl bg-slate-900/70 border border-white/5 text-slate-300 text-xs text-center">Достойный сезон! Продолжайте качаться и подпишите контракт с топ-клубом.</div>` : ''}

              💼 Посмотреть трансферные офферы (${state.transferOffers.length})

              🚀 Начать Сезон ${state.season + 1}

    function goToSummerTransfers() {
      closeModal();
      activeTab = 'transfers';
      render();
    }

    function startNextSeason() {
      const p = state.player;
      p.age++;

      // Realistic aging curve: after 33 stats gradually decline
      let declineMsg = '';
      if (p.age >= 34) {
        const drop = p.age >= 36 ? 2 : 1;
        p.stats.pac = Math.max(40, p.stats.pac - drop);
        p.stats.phy = Math.max(40, p.stats.phy - drop);
        if (p.age >= 36) {
          p.stats.dri = Math.max(40, p.stats.dri - 1);
          p.stats.sho = Math.max(40, p.stats.sho - 1);
        }
        declineMsg = ` Возраст берёт своё (${p.age} лет): физические показатели немного снизились.`;
      }

      const { tables, schedules } = initSeasonTables();
      state.season++;
      state.round = 0;
      state.tables = tables;
      state.schedules = schedules;
      state.ucl = { active: false, stage: null, opponentId: null, finished: false, won: false };
      state.seasonAwardsGranted = false;
      state.transferWindowOpen = false;
      state.transferOffers = [];
      state.weekActionsLeft = 3;

      p.energy = 100;
      p.injuryRounds = 0;
      p.seasonStats = { matches: 0, goals: 0, assists: 0, motm: 0, ratingSum: 0 };

      selectedTableLeague = p.leagueId;
      activeTab = 'career';
      saveState();
      closeModal();
      render();
      showToast(`Сезон ${state.season} начался!${declineMsg}`, 'success');
    }

    /*************************************************************************
     * 10. TRAINING & RECOVERY LOGIC
     *************************************************************************/
    function getTrainSuccessChance(currentVal) {
      const bonuses = getPlayerGearBonuses();
      // Easier at 60 (85%), harder at 88+ (24%), boosted by coach & boots
      let base = 92 - Math.max(0, currentVal - 58) * 2.15;
      base = base * (1 + bonuses.trainBonus);
      return Math.max(15, Math.min(96, Math.round(base)));
    }

    function performStatTraining(statKey) {
      const p = state.player;
      const meta = STAT_META.find(s => s.key === statKey);
      if (state.weekActionsLeft <= 0) {
        haptic('error');
        showToast('Слоты подготовки на эту неделю закончились! Сыграйте матч.', 'error');
        return;
      }
      if (p.energy < meta.energy) {
        haptic('error');
        showToast('Недостаточно энергии! Отдохните перед тренировкой.', 'error');
        return;
      }
      if (p.stats[statKey] >= 99) {
        showToast('Этот навык уже на максимуме (99)!', 'gold');
        return;
      }

      const chance = getTrainSuccessChance(p.stats[statKey]);
      p.energy = Math.max(0, p.energy - meta.energy);
      state.weekActionsLeft--;

      const success = Math.random() * 100 < chance;
      if (success) {
        p.stats[statKey] = Math.min(99, p.stats[statKey] + 1);
        haptic('success');
        playSfx('train');
        showToast(`🔥 Прогресс! ${meta.name} +1 (теперь ${p.stats[statKey]})`, 'success');
      } else {
        p.form = Math.min(100, p.form + 2);
        haptic('light');
        playSfx('click');
        showToast(`Хорошая сессия! Навык не вырос, но Форма +2.`, 'info');
      }
      saveState();
      render();
    }

    function performTeamTraining() {
      const p = state.player;
      if (state.weekActionsLeft <= 0) {
        haptic('error');
        showToast('Слоты подготовки закончились! Сыграйте матч.', 'error');
        return;
      }
      if (p.energy < 12) {
        haptic('error');
        showToast('Слишком мало энергии для командной тренировки.', 'error');
        return;
      }
      p.energy -= 12;
      p.trust = Math.min(100, p.trust + 7);
      p.form = Math.min(100, p.form + 6);
      state.weekActionsLeft--;
      haptic('medium');
      playSfx('train');
      saveState();
      render();
      showToast('Командная тренировка: Доверие +7, Форма +6!', 'success');
    }

    function performRest() {
      const p = state.player;
      if (state.weekActionsLeft <= 0) {
        haptic('error');
        showToast('Слоты подготовки на эту неделю закончились!', 'error');
        return;
      }
      if (p.energy >= 100) {
        showToast('Энергия уже на максимуме!', 'info');
        return;
      }
      const gain = 28;
      p.energy = Math.min(100, p.energy + gain);
      p.form = Math.min(100, p.form + 2);
      state.weekActionsLeft--;
      haptic('light');
      playSfx('click');
      saveState();
      render();
      showToast(`Отличный отдых! Энергия +${gain}%, Форма +2.`, 'success');
    }

    /*************************************************************************
     * 11. TRANSFERS, AGENT & CONTRACT NEGOTIATIONS
     *************************************************************************/
    function generateTransferOffers(isSummer = false) {
      const p = state.player;
      const ovr = calcOVR(p.stats, p.pos);
      const agent = AGENTS[p.agentId] || AGENTS[0];

      // Flatten all clubs except current
      const allClubs = [];
      LEAGUES.forEach(l => {
        l.clubs.forEach(c => {
          if (c.id !== p.clubId) {
            allClubs.push({ ...c, leagueId: l.id, leagueName: l.name, leagueFlag: l.flag, prestige: l.prestige });
          }
        });
      });

      // Target club OVR range based on player OVR + agent pull + season goals
      const maxReach = ovr + 5 + Math.round(agent.bonusTop * 0.22) + (p.seasonStats.goals >= 10 ? 3 : 0);
      const minReach = Math.max(66, ovr - 6);

      let candidates = allClubs.filter(c => c.ovr <= maxReach && c.ovr >= minReach);
      if (candidates.length < 3) {
        candidates = allClubs.sort((a, b) => Math.abs(a.ovr - ovr) - Math.abs(b.ovr - ovr)).slice(0, 6);
      }

      // Shuffle and pick 3-4 offers
      candidates.sort(() => Math.random() - 0.5);
      const count = isSummer ? 4 : 3;
      const picked = candidates.slice(0, count);

      state.transferOffers = picked.map((club, idx) => {
        const baseSal = Math.round((Math.pow(club.tier, 2.05) * 9500 + Math.max(0, ovr - 65) * 4200) / 1000) * 1000;
        const role = ovr >= club.ovr - 2 ? 'Ключевой игрок' : (ovr >= club.ovr - 6 ? 'Основа / Ротация' : 'Игрок ротации');
        const startTrust = ovr >= club.ovr - 2 ? 75 : (ovr >= club.ovr - 6 ? 55 : 38);
        return {
          offerId: `off_${Date.now()}_${idx}`,
          clubId: club.id,
          salary: Math.max(15000, baseSal),
          role,
          startTrust,
          negotiated: false,
          collapsed: false
        };
      });
      saveState();
    }

    function requestAgentOffers() {
      const p = state.player;
      const ovr = calcOVR(p.stats, p.pos);
      if (!state.transferWindowOpen && ovr < 72 && p.agentId === 0) {
        haptic('error');
        showToast('Клубы проявят интерес в трансферное окно (после 9 и 18 тура) или наймите агента!', 'info');
        return;
      }
      generateTransferOffers(false);
      haptic('medium');
      playSfx('click');
      render();
      showToast('Агент собрал свежие предложения от клубов!', 'success');
    }

    function negotiateOffer(offerId) {
      const offer = state.transferOffers.find(o => o.offerId === offerId);
      if (!offer || offer.negotiated || offer.collapsed) return;

      const agent = AGENTS[state.player.agentId] || AGENTS[0];
      const successChance = 42 + agent.negBonus + (state.player.form > 75 ? 10 : 0);
      offer.negotiated = true;

      if (Math.random() * 100 < successChance) {
        offer.salary = Math.round((offer.salary * 1.22) / 1000) * 1000;
        haptic('success');
        playSfx('train');
        showToast(`Успешные торги! Зарплата повышена до ${formatMoney(offer.salary)}/матч!`, 'gold');
      } else {
        offer.collapsed = true;
        haptic('error');
        playSfx('fail');
        showToast('Клуб посчитал требования завышенными и отозвал предложение!', 'error');
      }
      saveState();
      render();
    }

    function acceptOffer(offerId) {
      const offer = state.transferOffers.find(o => o.offerId === offerId);
      if (!offer || offer.collapsed) return;
      const club = getClubById(offer.clubId);
      const p = state.player;

      p.clubId = club.id;
      p.leagueId = club.leagueId;
      p.salary = offer.salary;
      p.trust = offer.startTrust;
      p.fans += club.tier * 12000;

      // Clear offers after signing
      state.transferOffers = [];
      state.transferWindowOpen = false;
      selectedTableLeague = club.leagueId;

      haptic('success');
      playSfx('goal');
      saveState();
      render();
      showToast(`HERE WE GO! Вы перешли в ${club.name} (${formatMoney(p.salary)}/матч)!`, 'gold');
    }

    function hireAgent(agentId) {
      const ag = AGENTS[agentId];
      const p = state.player;
      if (p.agentId >= agentId) return;
      if (p.money < ag.cost) {
        haptic('error');
        showToast('Недостаточно денег для контракта с этим агентом!', 'error');
        return;
      }
      p.money -= ag.cost;
      p.agentId = agentId;
      haptic('success');
      playSfx('train');
      saveState();
      render();
      showToast(`Новый агент: ${ag.name}! Топ-клубы обратят на вас внимание.`, 'gold');
    }

    /*************************************************************************
     * 12. LIFE, SHOP & SPONSORS LOGIC
     *************************************************************************/
    function buyItem(itemId, type) {
      const p = state.player;
      if (p.ownedItems.includes(itemId)) return;
      const list = type === 'lifestyle' ? LIFESTYLE_ITEMS : GEAR_STAFF;
      const item = list.find(i => i.id === itemId);
      if (!item) return;

      if (p.money < item.cost) {
        haptic('error');
        showToast('Недостаточно средств на балансе!', 'error');
        return;
      }
      p.money -= item.cost;
      p.ownedItems.push(item.id);
      if (item.fans) p.fans += item.fans;
      if (item.moraleBonus) p.form = Math.min(100, p.form + item.moraleBonus);

      haptic('success');
      playSfx('train');
      saveState();
      render();
      showToast(`Куплено: ${item.name}!`, 'success');
    }

    function signSponsor(sponsorId) {
      const p = state.player;
      const sp = SPONSORS.find(s => s.id === sponsorId);
      if (!sp) return;
      if (p.fans < sp.reqFans) {
        haptic('error');
        showToast(`Нужно минимум ${formatFans(sp.reqFans)} фанатов!`, 'error');
        return;
      }
      p.activeSponsorId = sp.id;
      haptic('success');
      playSfx('goal');
      saveState();
      render();
      showToast(`Подписан спонсор: ${sp.name}!`, 'gold');
    }

            ${renderStatusBar('Доверие тренера', p.trust, 'bg-sky-400', '🤝')}
            <div class="pt-2 border-t border-white/5 flex items-center justify-between text-xs">
              <span class="text-slate-300">📣 Фанаты и медийность</span>
              <span class="font-sport text-sm font-bold text-purple-300">${formatFans(p.fans)}</span>
            </div>
          </div>

          <!-- Current Season Mini Stats -->
          <div class="glass-panel p-3.5 grid grid-cols-4 gap-2 text-center">
            <div>
              <div class="text-[10px] text-slate-400">Матчи</div>
              <div class="font-sport text-lg font-bold">${p.seasonStats.matches}</div>
            </div>
            <div>
              <div class="text-[10px] text-slate-400">Голы</div>
              <div class="font-sport text-lg font-bold text-emerald-400">${p.seasonStats.goals}</div>
            </div>
            <div>
              <div class="text-[10px] text-slate-400">Ассисты</div>
              <div class="font-sport text-lg font-bold text-sky-400">${p.seasonStats.assists}</div>
            </div>
            <div>
              <div class="text-[10px] text-slate-400">Ср. оц.</div>
              <div class="font-sport text-lg font-bold text-amber-300">${p.seasonStats.matches > 0 ? (p.seasonStats.ratingSum / p.seasonStats.matches).toFixed(1) : '—'}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderTrainingTab() {
      const p = state.player;
      const bonuses = getPlayerGearBonuses();

      return `
        <div class="p-4 space-y-4 animate-in">
          <div class="glass-panel p-4 flex items-center justify-between">
            <div>
              <div class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Подготовка к туру</div>
              <div class="text-[11px] text-slate-400 mt-0.5">Слоты обновляются после каждого матча</div>
            </div>
            <div class="text-right">
              <div class="font-sport text-2xl font-bold text-white">${state.weekActionsLeft} / 3</div>
              <div class="text-[10px] text-slate-400">Слотов осталось</div>
            </div>
          </div>

          <!-- Energy & Bonus summary -->
          <div class="flex items-center justify-between px-1 text-xs">
            <span class="text-slate-300">⚡ Энергия: <strong class="${p.energy < 35 ? 'text-rose-400' : 'text-emerald-400'}">${p.energy}%</strong></span>
            <span class="text-slate-400">Бонус тренера/бутс: <strong class="text-amber-300">+${Math.round(bonuses.trainBonus * 100)}%</strong></span>
          </div>

          <!-- Team Training & Rest -->
          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="performTeamTraining()" class="glass-panel p-3.5 text-left active:scale-[0.98] transition border-sky-500/30">
              <div class="flex justify-between items-start">
                <span class="text-xl">🤝</span>
                <span class="text-[10px] px-2 py-0.5 rounded-md bg-rose-500/20 text-rose-300 font-bold">-12 ⚡</span>
              </div>
              <div class="text-xs font-bold mt-2">С командой</div>
              <div class="text-[10px] text-slate-400 mt-0.5">+7 Доверие, +6 Форма</div>
            </button>

            <button onclick="performRest()" class="glass-panel p-3.5 text-left active:scale-[0.98] transition border-emerald-500/30">
              <div class="flex justify-between items-start">
                <span class="text-xl">🛌</span>
                <span class="text-[10px] px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 font-bold">+28 ⚡</span>
              </div>
              <div class="text-xs font-bold mt-2">Восстановление</div>
              <div class="text-[10px] text-slate-400 mt-0.5">Отдых, спа и массаж</div>
            </button>
          </div>

          <!-- 6 Stat Trainings -->
          <div class="space-y-2">
            ${STAT_META.map(s => {
              const val = p.stats[s.key];
              const chance = getTrainSuccessChance(val);
              const disabled = state.weekActionsLeft <= 0 || p.energy < s.energy || val >= 99;
              return `
                <button onclick="performStatTraining('${s.key}')" class="w-full glass-panel p-3.5 flex items-center justify-between transition active:scale-[0.98] ${disabled ? 'opacity-50' : 'hover:border-emerald-500/40'}">
                  <div class="flex items-center gap-3 text-left">
                    <div class="w-10 h-10 rounded-xl bg-slate-900 border border-white/10 flex items-center justify-center text-lg">${s.icon}</div>
                    <div>
                      <div class="text-xs font-bold text-white flex items-center gap-2">
                        <span>${s.trainTitle}</span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-sky-300 font-bold">${s.label} ${val}</span>
                      </div>
                      <div class="text-[10px] text-slate-400 mt-0.5">Шанс +1 к стату: <strong class="text-emerald-400">${chance}%</strong></div>
                    </div>
                  </div>
                  <div class="text-right shrink-0">
                    <span class="px-2.5 py-1 rounded-lg bg-slate-900 border border-white/10 text-[11px] font-bold text-amber-300">-${s.energy} ⚡</span>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setTableLeague(lid) {
      selectedTableLeague = lid;
      haptic('light');
      render();
    }

    function renderTableTab() {
      const p = state.player;
      const lid = selectedTableLeague || p.leagueId;
      const league = getLeagueById(lid);
      const rows = sortTable(state.tables[lid]);

      return `
        <div class="p-4 space-y-3.5 animate-in">
          <!-- League Selector Pills -->
          <div class="flex gap-1.5 overflow-x-auto pb-1">
            ${LEAGUES.map(l => {
              const active = l.id === lid;
              return `
                <button onclick="setTableLeague('${l.id}')" class="px-3 py-2 rounded-xl text-xs font-bold shrink-0 border transition ${active ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300' : 'bg-slate-900/80 border-white/10 text-slate-400'}">
                  ${l.flag} ${l.name}
                </button>
              `;
            }).join('')}
          </div>

          ${state.ucl.active ? `
            <div class="p-3 rounded-xl bg-gradient-to-r from-sky-900/60 to-indigo-900/60 border border-sky-400/40 text-xs flex items-center justify-between">
              <div>
                <div class="font-bold text-sky-200">🏆 Лига Чемпионов</div>
                <div class="text-[11px] text-slate-300">
                  ${state.ucl.finished ? (state.ucl.won ? 'Вы выиграли Лигу Чемпионов!' : 'Вылет из турнира') : `Стадия: ${state.ucl.stage === 'semi' ? 'Полуфинал' : 'Финал'}`}
                </div>
              </div>
              <span class="text-lg">${state.ucl.won ? '🥇' : '⚽'}</span>
            </div>
          ` : ''}

          <!-- Standings Table -->
          <div class="glass-panel overflow-hidden">
            <div class="px-3.5 py-2.5 bg-slate-900/80 border-b border-white/10 flex justify-between items-center">
              <span class="text-xs font-bold">${league.flag} ${league.fullName}</span>
              <span class="text-[10px] text-slate-400">18 туров</span>
            </div>

            <div class="grid grid-cols-12 text-[10px] font-bold text-slate-400 px-3 py-2 border-b border-white/5 uppercase">
              <div class="col-span-1">#</div>
              <div class="col-span-5">Клуб</div>
              <div class="col-span-1 text-center">И</div>
              <div class="col-span-2 text-center">В/Н/П</div>
              <div class="col-span-1 text-center">РМ</div>
              <div class="col-span-2 text-right">Очки</div>
            </div>

            <div class="divide-y divide-white/5">
              ${rows.map((r, idx) => {
                const club = getClubById(r.clubId);
                const isMe = r.clubId === p.clubId;
                const gd = r.gf - r.ga;
                const zoneBar = idx < 2 ? 'border-l-2 border-l-emerald-400' : (idx >= 8 ? 'border-l-2 border-l-rose-500' : 'border-l-2 border-l-transparent');
                return `
                  <div class="grid grid-cols-12 items-center px-3 py-2.5 text-xs ${zoneBar} ${isMe ? 'bg-emerald-500/15' : ''}">
                    <div class="col-span-1 font-sport font-bold ${idx < 2 ? 'text-emerald-400' : (idx >= 8 ? 'text-rose-400' : 'text-slate-400')}">${idx + 1}</div>
                    <div class="col-span-5 flex items-center gap-1.5 min-w-0">
                      ${renderClubCrest(club, 20)}
                      <span class="truncate ${isMe ? 'font-extrabold text-emerald-300' : 'font-semibold text-slate-200'}">${club.name}</span>
                    </div>
                    <div class="col-span-1 text-center text-slate-400">${r.played}</div>
                    <div class="col-span-2 text-center text-[10px] text-slate-400">${r.w}/${r.d}/${r.l}</div>
                    <div class="col-span-1 text-center text-[11px] ${gd >= 0 ? 'text-slate-300' : 'text-rose-400'}">${gd > 0 ? '+' + gd : gd}</div>
                    <div class="col-span-2 text-right font-sport font-bold text-sm text-white">${r.pts}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="flex items-center gap-4 px-1 text-[10px] text-slate-400">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-emerald-400 inline-block"></span> Топ-2: Лига Чемпионов</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-rose-500 inline-block"></span> Зона вылета</span>
          </div>
        </div>
      `;
    }

    function renderTransfersTab() {
      const p = state.player;
      const myClub = getClubById(p.clubId);
      const marketVal = calcMarketValue(p);
      const currentAgent = AGENTS[p.agentId];

      return `
        <div class="p-4 space-y-4 animate-in">
          <!-- Current Contract -->
          <div class="glass-panel p-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                ${renderClubCrest(myClub, 38)}
                <div>
                  <div class="text-xs font-bold text-white">${myClub.name}</div>
                  <div class="text-[11px] text-slate-400">Зарплата: <span class="text-emerald-400 font-bold">${formatMoney(p.salary)}/матч</span></div>
                </div>
              </div>
              <div class="text-right">
                <div class="text-[10px] text-slate-400">Цена на рынке</div>
                <div class="font-sport text-base font-bold text-amber-300">${formatMoney(marketVal)}</div>
              </div>
            </div>
          </div>

          <!-- Transfer Offers Section -->
          <div class="glass-panel p-4">
            <div class="flex items-center justify-between mb-3">
              <div>
                <div class="text-xs font-bold uppercase tracking-wider text-emerald-400">Предложения клубов</div>
                <div class="text-[10px] text-slate-400">${state.transferWindowOpen ? 'Трансферное окно открыто!' : 'Окна открываются после 9 и 18 тура'}</div>
              </div>
              <button onclick="requestAgentOffers()" class="px-3 py-1.5 rounded-xl bg-slate-800 border border-white/15 text-[11px] font-bold text-sky-300 active:scale-95">
                🔍 Запросить
              </button>
            </div>

            ${state.transferOffers.length === 0 ? `
              <div class="text-center py-6 text-xs text-slate-400 bg-slate-900/50 rounded-xl border border-white/5">
                Пока нет активных предложений.<br>Нажмите «Запросить» или дождитесь трансферного окна.
              </div>
            ` : `
              <div class="space-y-3">
                ${state.transferOffers.map(o => {
                  const club = getClubById(o.clubId);
                  if (o.collapsed) {
                    return `
                      <div class="p-3 rounded-xl bg-rose-950/30 border border-rose-500/30 text-xs text-rose-300 flex items-center justify-between opacity-70">
                        <span>${club.name} — сделка сорвалась</span>
                        <span>❌</span>
                      </div>
                    `;
                  }
                  return `
                    <div class="p-3.5 rounded-xl bg-slate-900/90 border border-white/10 space-y-2.5">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                          ${renderClubCrest(club, 36)}
                          <div>
                            <div class="text-xs font-bold text-white">${club.name}</div>
                            <div class="text-[10px] text-slate-400">${club.leagueFlag} ${club.leagueName} • OVR ${club.ovr}</div>
                          </div>
                        </div>
                        <div class="text-right">
                          <div class="text-xs font-bold text-emerald-400">${formatMoney(o.salary)}/матч</div>
                          <div class="text-[10px] text-amber-300">${o.role}</div>
                        </div>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <button onclick="acceptOffer('${o.offerId}')" class="btn-primary py-2 text-xs">✍️ Подписать</button>
                        <button onclick="negotiateOffer('${o.offerId}')" ${o.negotiated ? 'disabled' : ''} class="btn-secondary py-2 text-xs ${o.negotiated ? 'opacity-40' : ''}">
                          ${o.negotiated ? 'Торги окончены' : '💬 Торг (+22%)'}
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <!-- Agents Market -->
          <div class="glass-panel p-4">
            <div class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2.5">Ваш футбольный агент</div>
            <div class="space-y-2">
              ${AGENTS.map(ag => {
                const isCurrent = p.agentId === ag.id;
                const owned = p.agentId >= ag.id;
                return `
                  <div class="p-3 rounded-xl border flex items-center justify-between gap-2 ${isCurrent ? 'bg-amber-500/15 border-amber-400/50' : 'bg-slate-900/70 border-white/5'}">
                    <div class="flex items-center gap-2.5">
                      <span class="text-2xl">${ag.emoji}</span>
                      <div>
                        <div class="text-xs font-bold text-white">${ag.name} ${isCurrent ? '<span class="text-amber-300">(Ваш)</span>' : ''}</div>
                        <div class="text-[10px] text-slate-400 leading-snug">${ag.desc}</div>
                      </div>
                    </div>
                    ${owned
                      ? `<span class="text-xs font-bold text-emerald-400 shrink-0">✓</span>`
                      : `<button onclick="hireAgent(${ag.id})" class="px-3 py-1.5 rounded-lg bg-amber-500/20 border border-amber-400/40 text-amber-200 text-[11px] font-bold shrink-0">${formatMoney(ag.cost)}</button>`
                    }
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderLifeTab() {
      const p = state.player;
      const owned = p.ownedItems || [];

      return `
        <div class="p-4 space-y-4 animate-in">
          <!-- Sponsors -->
          <div class="glass-panel p-4">
            <div class="flex items-center justify-between mb-2.5">
              <div class="text-xs font-bold uppercase tracking-wider text-sky-400">📣 Спонсорские контракты</div>
              <span class="text-[11px] text-purple-300 font-bold">${formatFans(p.fans)} фанов</span>
            </div>
            <div class="space-y-2">
              ${SPONSORS.map(sp => {
                const isActive = p.activeSponsorId === sp.id;
                const unlocked = p.fans >= sp.reqFans;
                return `
                  <div class="p-3 rounded-xl border flex items-center justify-between gap-2 ${isActive ? 'bg-emerald-500/15 border-emerald-400/50' : 'bg-slate-900/75 border-white/5'}">
                    <div class="flex items-center gap-2.5">
                      <span class="text-2xl">${sp.icon}</span>
                      <div>
                        <div class="text-xs font-bold text-white">${sp.name}</div>
                        <div class="text-[10px] text-emerald-300">+${formatMoney(sp.perMatch)}/матч • +${formatMoney(sp.perGoal)}/гол</div>
                        <div class="text-[10px] text-slate-400">Требуется: ${formatFans(sp.reqFans)} фанов</div>
                      </div>
                    </div>
                    ${isActive
                      ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-500/25 text-emerald-300 text-[10px] font-bold shrink-0">Активен</span>`
                      : `<button onclick="signSponsor('${sp.id}')" class="px-3 py-1.5 rounded-lg text-[11px] font-bold shrink-0 ${unlocked ? 'bg-sky-500/20 border border-sky-400/50 text-sky-200' : 'bg-slate-800 text-slate-500'}">${unlocked ? 'Выбрать' : '🔒'}</button>`
                    }
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Gear & Staff -->
          <div class="glass-panel p-4">
            <div class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2.5">⚡ Экипировка и персонал</div>
            <div class="space-y-2">
              ${GEAR_STAFF.map(item => {
                const has = owned.includes(item.id);
                return `
                  <div class="p-3 rounded-xl bg-slate-900/75 border border-white/5 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5">
                      <span class="text-2xl">${item.icon}</span>
                      <div>
                        <div class="text-xs font-bold text-white">${item.name}</div>
                        <div class="text-[10px] text-slate-400 leading-snug">${item.desc}</div>
                      </div>
                    </div>
                    ${has
                      ? `<span class="text-emerald-400 text-xs font-bold shrink-0">Куплено ✓</span>`
                      : `<button onclick="buyItem('${item.id}', 'gear')" class="px-3 py-1.5 rounded-lg bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-[11px] font-bold shrink-0">${formatMoney(item.cost)}</button>`
                    }
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Lifestyle -->
          <div class="glass-panel p-4">
            <div class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2.5">✨ Лайфстайл и статус</div>
            <div class="space-y-2">
              ${LIFESTYLE_ITEMS.map(item => {
                const has = owned.includes(item.id);
                return `
                  <div class="p-3 rounded-xl bg-slate-900/75 border border-white/5 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5">
                      <span class="text-2xl">${item.icon}</span>
                      <div>
                        <div class="text-xs font-bold text-white">${item.name}</div>
                        <div class="text-[10px] text-slate-400 leading-snug">${item.desc}</div>
                      </div>
                    </div>
                    ${has
                      ? `<span class="text-amber-300 text-xs font-bold shrink-0">В собственности ✓</span>`
                      : `<button onclick="buyItem('${item.id}', 'lifestyle')" class="px-3 py-1.5 rounded-lg bg-amber-500/20 border border-amber-400/40 text-amber-200 text-[11px] font-bold shrink-0">${formatMoney(item.cost)}</button>`
                    }
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      haptic('light');
      playSfx('click');
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function renderBottomNav() {
      const items = [
        { id: 'career', label: 'Карьера', icon: '⚽' },
        { id: 'training', label: 'Тренировки', icon: '🏋️', badge: state.weekActionsLeft > 0 ? state.weekActionsLeft : null },
        { id: 'table', label: 'Таблица', icon: '🏆' },
        { id: 'transfers', label: 'Трансферы', icon: '💼', badge: state.transferOffers.filter(o => !o.collapsed).length || null },
        { id: 'life', label: 'Жизнь', icon: '✨' }
      ];

      return `
        <nav class="bottom-nav grid grid-cols-5">
          ${items.map(it => `
            <button onclick="switchTab('${it.id}')" class="nav-btn ${activeTab === it.id ? 'active' : ''}">
              <div class="relative text-lg leading-none mb-1">
                ${it.icon}
                ${it.badge ? `<span class="absolute -top-1 -right-2.5 min-w-[15px] h-[15px] px-1 rounded-full bg-emerald-500 text-slate-950 text-[9px] font-extrabold flex items-center justify-center">${it.badge}</span>` : ''}
              </div>
              <span>${it.label}</span>
            </button>
          `).join('')}
        </nav>
      `;
    }

    function render() {
      const root = document.getElementById('root');
      if (!state || !state.player) {
        root.innerHTML = renderCreationScreen();
        return;
      }

      let content = '';
      if (activeTab === 'career') content = renderCareerTab();
      else if (activeTab === 'training') content = renderTrainingTab();
      else if (activeTab === 'table') content = renderTableTab();
      else if (activeTab === 'transfers') content = renderTransfersTab();
      else if (activeTab === 'life') content = renderLifeTab();

      root.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 pb-20">
          ${content}
        </main>
        ${renderBottomNav()}
      `;
    }

    /*************************************************************************
     * 16. BOOTSTRAP
     *************************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      initTelegram();
      loadState();
      render();
    });
  </script>
</body>
</html>
