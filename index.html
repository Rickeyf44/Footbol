<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PRO CAREER: TOP 5 + РПЛ</title>

  <!-- 1. ЗАЩИТНЫЙ ПЕРЕХВАТЧИК В <head> (ЛОВИТ ЛЮБЫЕ ОШИБКИ И СТРАХУЕТ ЗАГРУЗКУ) -->
  <script>
    (function () {
      window.__BOOT_DONE = false;
      window.__hardResetApp = function () {
        try { localStorage.clear(); } catch (e) {}
        try { location.reload(); } catch (e) {}
      };
      window.__showFatalError = function (msg, line) {
        try {
          var b = document.getElementById('boot-screen');
          if (b) b.style.display = 'none';
          var root = document.getElementById('app') || document.body;
          var safe = String(msg || 'Неизвестная ошибка').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          var ln = line ? (' (стр. ' + line + ')') : '';
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#070b14;color:#f8fafc;font-family:sans-serif">' +
              '<div style="width:100%;max-width:400px;background:#0f172a;border:1.5px solid #f43f5e;border-radius:16px;padding:18px">' +
                '<div style="font-size:17px;font-weight:900;color:#fda4af;margin-bottom:8px">⚠️ Ошибка запуска игры</div>' +
                '<div style="font-size:12px;color:#94a3b8;margin-bottom:10px">Защитный перехватчик предотвратил зависание:</div>' +
                '<div style="background:rgba(0,0,0,0.45);padding:10px;border-radius:10px;font-family:monospace;font-size:11px;color:#fecdd3;word-break:break-word;margin-bottom:14px">' + safe + ln + '</div>' +
                '<button onclick="window.__hardResetApp()" style="width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#f43f5e,#be123c);color:#fff;font-weight:800;font-size:14px;cursor:pointer">🔄 Сбросить сохранение и перезапустить</button>' +
              '</div>' +
            '</div>';
        } catch (e) {}
      };
      window.onerror = function (msg, src, line) { window.__showFatalError(msg, line); return true; };
      window.onunhandledrejection = function (ev) {
        var r = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Promise error';
        window.__showFatalError(r, '');
      };
      setTimeout(function () {
        if (!window.__BOOT_DONE) {
          var st = document.getElementById('boot-status');
          var btn = document.getElementById('boot-reset-btn');
          if (st) st.textContent = 'Загрузка затянулась. Можно безопасно сбросить кэш:';
          if (btn) btn.style.display = 'inline-flex';
        }
      }, 2500);
    })();
  </script>

  <!-- Внешние SDK строго async defer, чтобы НИКОГДА не блокировать старт -->
  <script src="https://telegram.org/js/telegram-web-app.js" async defer></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js" async defer></script>

  <style>
    :root {
      --bg0: #060a13;
      --bg1: #0e1628;
      --card: rgba(15, 24, 42, 0.94);
      --brd: rgba(255, 255, 255, 0.09);
      --brd-hi: rgba(255, 255, 255, 0.19);
      --t0: #f8fafc;
      --t1: #cbd5e1;
      --t2: #94a3b8;
      --grn: #10b981;
      --grn-hi: #34d399;
      --gld: #f59e0b;
      --gld-hi: #fbbf24;
      --blu: #38bdf8;
      --ucl: #2563eb;
      --ucl-hi: #60a5fa;
      --red: #f43f5e;
      --pur: #a855f7;
      --r: 16px;
      --rsm: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; min-height: 100%;
      background: var(--bg0);
      background-image: radial-gradient(circle at 50% -15%, #172b52 0%, #060a13 55%, #04070d 100%);
      color: var(--t0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.4; overflow-x: hidden;
    }
    input, button { font-family: inherit; outline: none; }
    input { user-select: text; }
    button { border: none; background: none; color: inherit; cursor: pointer; padding: 0; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Boot screen overlay */
    #boot-screen {
      position: fixed; inset: 0; z-index: 200;
      background: radial-gradient(circle at 50% 10%, #172b52 0%, #060a13 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center; gap: 12px;
    }
    .boot-logo {
      width: 68px; height: 68px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
      font-size: 34px; background: linear-gradient(145deg, #1d4ed8, #0f172a);
      border: 1.5px solid rgba(96, 165, 250, 0.5); box-shadow: 0 10px 28px rgba(37, 99, 235, 0.35);
    }
    .spinner {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(96, 165, 250, 0.2); border-top-color: #60a5fa;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* App Shell */
    #app {
      width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto;
      display: flex; flex-direction: column; padding-bottom: 82px;
    }
    .main { padding: 10px 11px; display: flex; flex-direction: column; gap: 10px; flex: 1; }

    /* Sticky HUD (360px ready) */
    .hud {
      position: sticky; top: 0; z-index: 40;
      background: rgba(6, 10, 19, 0.96);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--brd);
      padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .hud-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .hud-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .hud-club { font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-sub { font-size: 11px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-wallets { display: grid; grid-template-columns: auto 1fr 1fr; gap: 5px; align-items: center; }
    .pill {
      padding: 4px 7px; border-radius: 999px; font-weight: 800; font-size: 11px;
      border: 1px solid var(--brd); background: rgba(255,255,255,0.05);
      display: inline-flex; align-items: center; justify-content: center; gap: 3px;
      white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; transition: 0.2s;
    }
    .pill-en { color: var(--gld-hi); border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.12); }
    .pill-eur { color: var(--grn-hi); border-color: rgba(16,185,129,0.28); background: rgba(16,185,129,0.1); opacity: 0.78; }
    .pill-eur.active-w { opacity: 1; border-color: rgba(52,211,153,0.9); background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(5,150,105,0.2)); box-shadow: 0 0 10px rgba(16,185,129,0.3); }
    .pill-coin { color: #fde047; border-color: rgba(168,85,247,0.35); background: rgba(168,85,247,0.14); opacity: 0.78; }
    .pill-coin.active-w { opacity: 1; border-color: rgba(250,204,21,0.9); background: linear-gradient(135deg, rgba(147,51,234,0.36), rgba(217,119,6,0.28)); box-shadow: 0 0 12px rgba(168,85,247,0.36); }

    /* Bottom Navigation (5 tabs) */
    .bnav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; z-index: 45;
      background: rgba(6, 10, 19, 0.97);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--brd);
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px;
      padding: 6px 5px calc(6px + env(safe-area-inset-bottom, 0px));
    }
    .bnav-btn {
      position: relative; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; padding: 6px 2px; border-radius: 10px;
      font-size: 10px; font-weight: 800; color: var(--t2); transition: 0.15s;
    }
    .bnav-btn .ico { font-size: 18px; line-height: 1.1; }
    .bnav-btn.active { color: var(--grn-hi); background: rgba(16,185,129,0.15); }
    .bnav-dot {
      position: absolute; top: 4px; right: 12px; width: 7px; height: 7px;
      border-radius: 50%; background: var(--gld-hi); box-shadow: 0 0 8px var(--gld);
    }

    /* Cards & Layout */
    .card {
      background: var(--card); border: 1px solid var(--brd);
      border-radius: var(--r); padding: 12px; box-shadow: 0 8px 22px rgba(0,0,0,0.42);
    }
    .card-ucl {
      background: linear-gradient(145deg, rgba(16, 33, 84, 0.96), rgba(14, 18, 48, 0.96));
      border: 1px solid rgba(96, 165, 250, 0.55); box-shadow: 0 10px 28px rgba(37, 99, 235, 0.28);
    }
    .card-intl {
      background: linear-gradient(145deg, rgba(66, 44, 11, 0.92), rgba(22, 18, 12, 0.95));
      border: 1px solid rgba(251, 191, 36, 0.5);
    }
    .card-pvp {
      background: linear-gradient(145deg, rgba(12, 42, 46, 0.94), rgba(13, 21, 38, 0.95));
      border: 1px solid rgba(52, 211, 153, 0.42);
    }
    .sec-t { font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
    .muted { color: var(--t2); font-size: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    /* Buttons & Badges */
    .btn {
      width: 100%; padding: 11px 12px; border-radius: var(--rsm);
      font-weight: 800; font-size: 13px; text-align: center;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.12s;
    }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn-sm { padding: 7px 10px; font-size: 12px; width: auto; }
    .btn-grn { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 5px 14px rgba(16,185,129,0.28); }
    .btn-gld { background: linear-gradient(135deg, #f59e0b, #d97706); color: #060a13; box-shadow: 0 5px 14px rgba(245,158,11,0.25); }
    .btn-ucl { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; box-shadow: 0 5px 16px rgba(37,99,235,0.36); }
    .btn-red { background: linear-gradient(135deg, #f43f5e, #be123c); color: #fff; }
    .btn-pur { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }
    .btn-gh { background: rgba(255,255,255,0.07); border: 1px solid var(--brd); color: var(--t0); }

    .bdg {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 800;
      border: 1px solid var(--brd); background: rgba(255,255,255,0.08); white-space: nowrap;
    }
    .b-ucl { background: rgba(37,99,235,0.28); border-color: rgba(96,165,250,0.65); color: #93c5fd; }
    .b-gld { background: rgba(245,158,11,0.22); border-color: rgba(251,191,36,0.55); color: var(--gld-hi); }
    .b-grn { background: rgba(16,185,129,0.2); border-color: rgba(52,211,153,0.5); color: var(--grn-hi); }
    .b-red { background: rgba(244,63,94,0.2); border-color: rgba(244,63,94,0.55); color: #fda4af; }

    .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1; min-width: fit-content; padding: 7px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 800; color: var(--t2);
      background: rgba(255,255,255,0.05); border: 1px solid var(--brd); white-space: nowrap; text-align: center;
    }
    .tab-btn.active { background: rgba(16,185,129,0.22); border-color: var(--grn); color: #fff; }
    .tab-btn.active-ucl { background: rgba(37,99,235,0.34); border-color: var(--ucl-hi); color: #fff; }

    .bar-w { width: 100%; height: 8px; background: rgba(255,255,255,0.09); border-radius: 999px; overflow: hidden; }
    .bar-f { height: 100%; border-radius: 999px; transition: width 0.25s; }
    .inp {
      width: 100%; padding: 11px 12px; border-radius: 12px;
      background: rgba(255,255,255,0.07); border: 1px solid var(--brd-hi);
      color: #fff; font-size: 14px; font-weight: 700;
    }
    .choice {
      width: 100%; text-align: left; padding: 10px 11px; border-radius: 12px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--brd-hi);
      display: flex; flex-direction: column; gap: 2px; transition: 0.12s;
    }
    .choice:active { background: rgba(16,185,129,0.2); border-color: var(--grn); }

    /* EA FC Player Card */
    .fc {
      border-radius: 18px; padding: 14px; overflow: hidden;
      border: 1.5px solid rgba(255,255,255,0.22); box-shadow: 0 12px 26px rgba(0,0,0,0.52);
    }
    .fc-bronze { background: linear-gradient(145deg, #4b3322 0%, #241710 60%, #140c08 100%); border-color: #b47b4e; }
    .fc-silver { background: linear-gradient(145deg, #4b5563 0%, #1f2937 60%, #0f172a 100%); border-color: #cbd5e1; }
    .fc-gold { background: linear-gradient(145deg, #855a0e 0%, #422b07 58%, #1c1304 100%); border-color: #fbbf24; }
    .fc-elite { background: linear-gradient(145deg, #1d3a8a 0%, #3b0764 58%, #090d1f 100%); border-color: #60a5fa; }
    .fc-ovr { font-size: 36px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
    .fc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,0.14); }
    .fc-st { background: rgba(0,0,0,0.28); border-radius: 10px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; }
    .fc-st span { font-size: 10px; color: var(--t2); font-weight: 800; }
    .fc-st b { font-size: 15px; font-weight: 900; }

    /* 2D Pitch, Timing & 6-zone Goal */
    .pitch { border-radius: 14px; overflow: hidden; border: 1px solid var(--brd-hi); background: #0c3b22; }
    .pitch-ucl { border-color: rgba(96,165,250,0.75); box-shadow: 0 0 20px rgba(37,99,235,0.35); }
    .pitch-intl { border-color: rgba(251,191,36,0.75); }
    .scorebug {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 8px 10px; background: rgba(6,10,19,0.92); border-bottom: 1px solid var(--brd);
      font-weight: 900; font-size: 12px;
    }
    .score-num { background: rgba(255,255,255,0.1); padding: 3px 9px; border-radius: 8px; font-size: 16px; color: var(--gld-hi); }
    .t-track {
      position: relative; width: 100%; height: 34px; border-radius: 10px; overflow: hidden;
      background: linear-gradient(90deg, #991b1b 0%, #b45309 28%, #b45309 72%, #991b1b 100%);
      border: 2px solid rgba(255,255,255,0.25); margin: 6px 0;
    }
    .t-green { position: absolute; top: 0; bottom: 0; background: linear-gradient(180deg, #34d399, #059669); box-shadow: 0 0 12px rgba(52,211,153,0.7); }
    .t-cur { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: #fff; border-radius: 4px; box-shadow: 0 0 12px #fff; }
    .goal-fr {
      background: linear-gradient(180deg, rgba(15,23,42,0.95), rgba(6,78,59,0.55));
      border: 4px solid #e2e8f0; border-bottom: none; border-radius: 12px 12px 0 0;
      padding: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    }
    .goal-z {
      padding: 13px 4px; border-radius: 10px;
      background: rgba(255,255,255,0.08); border: 1px dashed rgba(255,255,255,0.32);
      font-size: 11px; font-weight: 800; text-align: center; color: #fff;
    }
    .goal-z:active { background: rgba(16,185,129,0.45); transform: scale(0.96); }

    /* Tables & Zones */
    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tbl th { color: var(--t2); font-weight: 700; text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--brd); font-size: 11px; }
    .tbl td { padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .tbl tr.me { background: rgba(16,185,129,0.16); font-weight: 800; }
    .z-ucl td:first-child { border-left: 3px solid #3b82f6; padding-left: 6px; }
    .z-pro td:first-child { border-left: 3px solid #10b981; padding-left: 6px; }
    .z-rel td:first-child { border-left: 3px solid #f43f5e; padding-left: 6px; }
    .z-non td:first-child { border-left: 3px solid transparent; padding-left: 6px; }

    /* Online UI */
    .ow-card {
      background: linear-gradient(135deg, rgba(88, 28, 135, 0.55), rgba(30, 27, 75, 0.92) 55%, rgba(120, 53, 15, 0.45));
      border: 1px solid rgba(250, 204, 21, 0.5); border-radius: var(--r); padding: 11px 12px;
    }
    .pvp-cnt {
      font-size: 18px; font-weight: 900; color: var(--grn-hi);
      background: rgba(16,185,129,0.16); border: 1px solid rgba(52,211,153,0.45);
      padding: 4px 10px; border-radius: 10px; white-space: nowrap;
    }
    .pvp-cnt.done { color: var(--gld-hi); background: rgba(245,158,11,0.16); border-color: rgba(251,191,36,0.45); }
    .pvp-slot {
      border-radius: 10px; padding: 7px 4px; text-align: center; font-size: 11px; font-weight: 800;
      border: 1px solid var(--brd); display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .pvp-slot.played { background: rgba(245,158,11,0.22); border-color: rgba(251,191,36,0.65); color: var(--gld-hi); }
    .pvp-slot.avail { background: rgba(16,185,129,0.18); border-color: rgba(52,211,153,0.5); color: var(--grn-hi); }
    .pvp-slot.extra { background: rgba(168,85,247,0.22); border-color: rgba(192,132,252,0.65); color: #e9d5ff; }
    .vip-row { background: linear-gradient(90deg, rgba(245,158,11,0.24), rgba(168,85,247,0.18)) !important; outline: 1px solid rgba(251,191,36,0.6); }
    .sb-st { padding: 8px 10px; border-radius: 11px; font-size: 12px; font-weight: 700; word-break: break-word; }
    .sb-ok { background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.42); color: var(--grn-hi); }
    .sb-err { background: rgba(244,63,94,0.14); border: 1px solid rgba(244,63,94,0.45); color: #fda4af; }
    .sb-wt { background: rgba(56,189,248,0.14); border: 1px solid rgba(56,189,248,0.42); color: #7dd3fc; }
    .log-box { max-height: 130px; overflow-y: auto; background: rgba(0,0,0,0.32); border: 1px solid var(--brd); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
    .tie { background: rgba(255,255,255,0.04); border: 1px solid var(--brd); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
    .tie.me { border-color: var(--ucl-hi); background: rgba(37,99,235,0.18); }

    /* Modals & Toast */
    .toast {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      max-width: 440px; width: calc(100% - 24px); z-index: 95;
      padding: 10px 14px; border-radius: 12px; font-weight: 800; font-size: 13px;
      background: rgba(15, 23, 42, 0.97); border: 1px solid var(--grn);
      box-shadow: 0 12px 28px rgba(0,0,0,0.6); text-align: center; pointer-events: none;
    }
    .modal-bg {
      position: fixed; inset: 0; z-index: 85; background: rgba(3, 6, 12, 0.85);
      backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 14px;
    }
    .modal-box {
      width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto;
      background: #0d1526; border: 1px solid var(--brd-hi); border-radius: 18px; padding: 15px;
    }
  </style>
</head>
<body>
  <!-- Видимый экран загрузки (гарантированно скрывается в finally внутри boot()) -->
  <div id="boot-screen">
    <div class="boot-logo">⚽</div>
    <div style="font-size:19px;font-weight:900;letter-spacing:0.3px">PRO CAREER: TOP 5 + РПЛ</div>
    <div class="spinner"></div>
    <div class="muted" id="boot-status">Инициализация 120 клубов (Д1/Д2) и Лиги Чемпионов…</div>
    <button id="boot-reset-btn" class="btn btn-red" style="display:none;max-width:260px;margin-top:6px" onclick="window.__hardResetApp()">🔄 Сбросить кэш и перезапустить</button>
  </div>

  <div id="app"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script>
  (function () {
    'use strict';

    /* =====================================================================
       1. CONFIG & STORAGE KEYS
       ===================================================================== */

    function timeToMidnight() {
      var n = new Date(), m = new Date(n);
      m.setHours(24, 0, 0, 0);
      var s = Math.max(0, Math.floor((m - n) / 1000));
      var hh = String(Math.floor(s / 3600)).padStart(2, '0');
      var mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      var ss = String(s % 60).padStart(2, '0');
      return hh + ':' + mm + ':' + ss;

    /* =====================================================================
       4. DIVISION TABLES, SIMULATION & CHAMPIONS LEAGUE (24 CLUBS)
       ===================================================================== */
    function initDivRosters() {
      var r = {};
      LEAGUE_DEFS.forEach(function (lg) {
        r[lg.id] = { d1: lg.initD1.slice(), d2: lg.initD2.slice() };
      });
      return r;
    }
    function createEmptyTable(clubIds) {
      return clubIds.map(function (id) { return { id: id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });
    }
    function createAllTables(rosters) {
      var t = {};
      LEAGUE_DEFS.forEach(function (lg) {
        t[lg.id] = { d1: createEmptyTable(rosters[lg.id].d1), d2: createEmptyTable(rosters[lg.id].d2) };
      });
      return t;
    }
    function sortTable(tbl) {
      return tbl.slice().sort(function (a, b) {
        if (b.pts !== a.pts) return b.pts - a.pts;
        var gd = (b.gf - b.ga) - (a.gf - a.ga);
        if (gd !== 0) return gd;
        return b.gf - a.gf;
      });
    }
    function applyScore(tbl, hId, aId, hg, ag) {
      var h = tbl.find(function (r) { return r.id === hId; });
      var a = tbl.find(function (r) { return r.id === aId; });
      if (!h || !a) return;
      h.p++; a.p++; h.gf += hg; h.ga += ag; a.gf += ag; a.ga += hg;
      if (hg > ag) { h.w++; h.pts += 3; a.l++; }
      else if (ag > hg) { a.w++; a.pts += 3; h.l++; }
      else { h.d++; a.d++; h.pts++; a.pts++; }
    }
    function simScore(hId, aId, homeAdv) {
      var hc = getClub(hId), ac = getClub(aId);
      var diff = (hc.ovr + (homeAdv || 2) - ac.ovr) / 14;
      var hg = clamp(Math.round(Math.max(0, 1.25 + diff + (Math.random() - 0.5) * 2.2)), 0, 5);
      var ag = clamp(Math.round(Math.max(0, 1.05 - diff + (Math.random() - 0.5) * 2.1)), 0, 5);
      return [hg, ag];
    }
    function simFullDivRound(tbl, skipIds) {
      var ids = tbl.map(function (r) { return r.id; }).filter(function (id) { return !skipIds || skipIds.indexOf(id) === -1; });
      for (var i = ids.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
      }
      for (var k = 0; k < ids.length - 1; k += 2) {
        var sc = simScore(ids[k], ids[k + 1], 2);
        applyScore(tbl, ids[k], ids[k + 1], sc[0], sc[1]);
      }
    }
    function findClubLocation(clubId, rosters) {
      for (var i = 0; i < LEAGUE_DEFS.length; i++) {
        var lg = LEAGUE_DEFS[i];
        var r = rosters[lg.id];
        if (r.d1.indexOf(clubId) !== -1) return { lgId: lg.id, div: 1 };
        if (r.d2.indexOf(clubId) !== -1) return { lgId: lg.id, div: 2 };
      }
      return { lgId: 'ru', div: 2 };
    }

    function buildUclSeason(seasonNum, rosters, prevTables) {
      var list = [];
      LEAGUE_DEFS.forEach(function (lg) {
        var ids = prevTables && prevTables[lg.id] ? sortTable(prevTables[lg.id].d1).map(function (r) { return r.id; }) : rosters[lg.id].d1.slice();
        for (var i = 0; i < lg.uclQuota && i < ids.length; i++) list.push(ids[i]);
      });
      EURO_GIANTS.forEach(function (g) { list.push(g.id); });
      list.sort(function (a, b) { return getClub(b).ovr - getClub(a).ovr; });

      var rounds = [];
      for (var r = 0; r < 6; r++) {
        var pool = list.slice();
        for (var i = pool.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        }
        var matches = [];
        while (pool.length >= 2) {
          var h = pool.shift();
          var oppIdx = pool.findIndex(function (cid) { return getClub(cid).lgId !== getClub(h).lgId; });
          if (oppIdx === -1) oppIdx = 0;
          var a = pool.splice(oppIdx, 1)[0];
          matches.push({ h: h, a: a, hg: null, ag: null, played: false });
        }
        rounds.push(matches);
      }
      return {
        season: seasonNum, participants: list, table: createEmptyTable(list),
        rounds: rounds, playedRounds: 0, stage: 'league',
        bracket: { r16: [], qf: [], sf: [], final: [] }, champion: null
      };
    }

    var UCL_LEAGUE_TOURS = [2, 4, 6, 8, 10, 12];
    function getPendingUcl(st) {
      if (!st || !st.ucl) return null;
      var u = st.ucl, done = st.tour - 1;
      if (u.stage === 'league' && u.playedRounds < 6 && done >= UCL_LEAGUE_TOURS[u.playedRounds]) {
        var ms = u.rounds[u.playedRounds] || [];
        var mm = ms.find(function (m) { return !m.played && (m.h === st.clubId || m.a === st.clubId); });
        return { type: 'league', idx: u.playedRounds, label: 'Общий этап • Тур ' + (u.playedRounds + 1) + '/6', myMatch: mm || null };
      }
      if (u.stage === 'r16' && done >= 13) return { type: 'r16', label: '1/8 финала ЛЧ', myMatch: u.bracket.r16.find(function (m) { return !m.played && (m.h === st.clubId || m.a === st.clubId); }) || null };
      if (u.stage === 'qf' && done >= 15) return { type: 'qf', label: '1/4 финала ЛЧ', myMatch: u.bracket.qf.find(function (m) { return !m.played && (m.h === st.clubId || m.a === st.clubId); }) || null };
      if (u.stage === 'sf' && done >= 17) return { type: 'sf', label: 'Полуфинал ЛЧ', myMatch: u.bracket.sf.find(function (m) { return !m.played && (m.h === st.clubId || m.a === st.clubId); }) || null };
      if (u.stage === 'final' && done >= 18) return { type: 'final', label: 'ФИНАЛ ЛИГИ ЧЕМПИОНОВ', myMatch: u.bracket.final.find(function (m) { return !m.played && (m.h === st.clubId || m.a === st.clubId); }) || null };
      return null;
    }

    function advanceUclStage(st, ev, playerRes) {
      var u = st.ucl;
      if (ev.type === 'league') {
        var ms = u.rounds[ev.idx];
        ms.forEach(function (m) {
          if (m.played) return;
          if (playerRes && (m.h === st.clubId || m.a === st.clubId)) {
            m.hg = playerRes.hg; m.ag = playerRes.ag;
          } else {
            var sc = simScore(m.h, m.a, 1); m.hg = sc[0]; m.ag = sc[1];
          }
          m.played = true;
          applyScore(u.table, m.h, m.a, m.hg, m.ag);
        });
        u.playedRounds++;
        if (u.playedRounds >= 6) {
          var top16 = sortTable(u.table).slice(0, 16).map(function (r) { return r.id; });
          u.bracket.r16 = [];
          for (var i = 0; i < 8; i++) u.bracket.r16.push({ h: top16[i], a: top16[15 - i], hg: null, ag: null, pen: null, win: null, played: false });
          u.stage = 'r16';
        }
      } else {
        var arr = u.bracket[ev.type];
        var winners = [];
        arr.forEach(function (m) {
          if (!m.played) {
            if (playerRes && (m.h === st.clubId || m.a === st.clubId)) {
              m.hg = playerRes.hg; m.ag = playerRes.ag; m.pen = playerRes.pen || null; m.win = playerRes.win;
            } else {
              var sc = simScore(m.h, m.a, 1); m.hg = sc[0]; m.ag = sc[1];
              if (m.hg > m.ag) m.win = m.h;
              else if (m.ag > m.hg) m.win = m.a;
              else { m.win = Math.random() < 0.5 ? m.h : m.a; m.pen = m.win === m.h ? '5:4 пен.' : '4:5 пен.'; }
            }
            m.played = true;
          }
          winners.push(m.win);
        });
        if (ev.type === 'r16') {
          u.bracket.qf = [];
          for (var q = 0; q < 8; q += 2) u.bracket.qf.push({ h: winners[q], a: winners[q + 1], hg: null, ag: null, pen: null, win: null, played: false });
          u.stage = 'qf';
        } else if (ev.type === 'qf') {
          u.bracket.sf = [];
          for (var s = 0; s < 4; s += 2) u.bracket.sf.push({ h: winners[s], a: winners[s + 1], hg: null, ag: null, pen: null, win: null, played: false });
          u.stage = 'sf';
        } else if (ev.type === 'sf') {
          u.bracket.final = [{ h: winners[0], a: winners[1], hg: null, ag: null, pen: null, win: null, played: false }];
          u.stage = 'final';
        } else if (ev.type === 'final') {
          u.champion = winners[0];
          u.stage = 'done';
        }
      }
    }

    function migrateState(raw) {
      var def = defaultState();
      if (!raw || typeof raw !== 'object') return def;
      var s = Object.assign({}, def, raw);
      s.version = 5;

      // Safe stats & age
      var rs = (raw.stats && typeof raw.stats === 'object') ? raw.stats : {};
      s.stats = {
        sho: clamp(Number(rs.sho) || 54, 40, 99),
        pas: clamp(Number(rs.pas) || 52, 40, 99),
        dri: clamp(Number(rs.dri) || 54, 40, 99),
        phy: clamp(Number(rs.phy) || 52, 40, 99)
      };
      s.season = Math.max(1, Number(raw.season) || 1);
      s.age = (typeof raw.age === 'number' && raw.age >= 16 && raw.age <= 45) ? Math.round(raw.age) : (16 + s.season - 1);
      s.tour = clamp(Number(raw.tour) || 1, 1, 19);
      s.money = Math.max(0, Number(raw.money) || 0);
      s.onlineBalance = (typeof raw.onlineBalance === 'number' && !isNaN(raw.onlineBalance)) ? Math.max(0, Math.round(raw.onlineBalance)) : 10000;
      s.salary = Math.max(800, Number(raw.salary) || 900);
      s.energy = clamp(Number(raw.energy) || 80, 0, 100);
      s.happiness = clamp(Number(raw.happiness) || 75, 0, 100);
      s.trust = clamp(Number(raw.trust) || 60, 0, 100);
      s.fans = Math.max(0, Number(raw.fans) || 150);
      s.injuryTours = Math.max(0, Number(raw.injuryTours) || 0);
      s.hotStreak = Math.max(0, Number(raw.hotStreak) || 0);

      s.trophies = Object.assign({}, def.trophies, (raw.trophies && typeof raw.trophies === 'object') ? raw.trophies : {});
      s.careerStats = Object.assign({}, def.careerStats, (raw.careerStats && typeof raw.careerStats === 'object') ? raw.careerStats : {});
      s.windowUsed = Object.assign({}, def.windowUsed, (raw.windowUsed && typeof raw.windowUsed === 'object') ? raw.windowUsed : {});
      s.onlineBuffs = Object.assign({}, def.onlineBuffs, (raw.onlineBuffs && typeof raw.onlineBuffs === 'object') ? raw.onlineBuffs : {});
      s.pvp = Object.assign({}, def.pvp, (raw.pvp && typeof raw.pvp === 'object') ? raw.pvp : {});
      s.bought = (raw.bought && typeof raw.bought === 'object') ? raw.bought : {};
      s.claimedTasks = (raw.claimedTasks && typeof raw.claimedTasks === 'object') ? raw.claimedTasks : {};
      s.intlDoneTours = Array.isArray(raw.intlDoneTours) ? raw.intlDoneTours : [];
      s.interviewDoneTours = Array.isArray(raw.interviewDoneTours) ? raw.interviewDoneTours : [];
      s.matchLogs = Array.isArray(raw.matchLogs) ? raw.matchLogs : [];

      // Validate rosters & tables
      var badRosters = !s.divRosters || typeof s.divRosters !== 'object';
      if (!badRosters) {
        LEAGUE_DEFS.forEach(function (lg) {
          var r = s.divRosters[lg.id];
          if (!r || !Array.isArray(r.d1) || r.d1.length !== 10 || !Array.isArray(r.d2) || r.d2.length !== 10 || !ALL_CLUBS[r.d1[0]] || !ALL_CLUBS[r.d2[0]]) badRosters = true;
        });
      }
      if (badRosters) s.divRosters = initDivRosters();

      var badTables = !s.tables || typeof s.tables !== 'object';
      if (!badTables) {
        LEAGUE_DEFS.forEach(function (lg) {
          var t = s.tables[lg.id];
          if (!t || !Array.isArray(t.d1) || t.d1.length !== 10 || !Array.isArray(t.d2) || t.d2.length !== 10) badTables = true;
        });
      }
      if (badTables) s.tables = createAllTables(s.divRosters);

      // Validate clubId
      if (!ALL_CLUBS[s.clubId] || ALL_CLUBS[s.clubId].lgId === 'eu') {
        s.clubId = s.divRosters.ru.d2[9];
      }
      var loc = findClubLocation(s.clubId, s.divRosters);
      s.lgId = loc.lgId; s.div = loc.div;

      // Validate UCL
      if (!s.ucl || !Array.isArray(s.ucl.participants) || s.ucl.participants.length !== 24 || !ALL_CLUBS[s.ucl.participants[0]]) {
        s.ucl = buildUclSeason(s.season, s.divRosters, null);
      }

      // Daily PvP reset
      var td = todayStr();
      s.online = Object.assign({}, def.online, (raw.online && typeof raw.online === 'object') ? raw.online : {});
      if (s.online.pvpDate !== td) {
        s.online.pvpDate = td; s.online.pvpCount = 0; s.online.pvpExtra = 0; s.online.marathonDate = '';
      } else {
        s.online.pvpExtra = clamp(Number(s.online.pvpExtra) || 0, 0, CONFIG.DAILY_PVP_EXTRA_MAX);
        s.online.pvpCount = clamp(Number(s.online.pvpCount) || 0, 0, CONFIG.DAILY_PVP_LIMIT + s.online.pvpExtra);
      }

      if (!COUNTRIES.some(function (c) { return c.id === s.countryId; })) s.countryId = 'ru';
      if (!POSITIONS.some(function (p) { return p.id === s.pos; })) s.pos = 'ST';
      s.peakOvr = Math.max(Number(raw.peakOvr) || 54, calcOVR(s.stats, s.pos));
      return s;
    }

          '<div style="font-size:16px;font-weight:900">PRO CAREER PARTNER</div>' +
          '<div class="muted">' + esc(reasonText) + '</div>' +
          '<div id="demoAdCnt" style="font-size:28px;font-weight:900;color:var(--gld-hi);margin:6px 0">' + sec + ' сек.</div>' +
          '<button id="demoAdBtn" class="btn btn-grn" disabled onclick="window.__demoAdDone()">Забрать награду</button>' +
        '</div>'
      );
      var iv = setInterval(function () {
        sec--;
        var c = document.getElementById('demoAdCnt'), b = document.getElementById('demoAdBtn');
        if (!c || !b) { clearInterval(iv); return; }
        if (sec <= 0) {
          clearInterval(iv);
          c.textContent = '✅ Готово!';
          b.disabled = false;
        } else {
          c.textContent = sec + ' сек.';
        }
      }, 1000);
    }

    /* =====================================================================
       7. SUPABASE CLIENT (STRICTLY NO Authorization: Bearer FOR sb_publishable_)
       ===================================================================== */
    function sbHeaders(extra) {
      var h = { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
      if (CONFIG.SUPABASE_ANON_KEY.indexOf('sb_publishable_') !== 0) {
        h['Authorization'] = 'Bearer ' + CONFIG.SUPABASE_ANON_KEY;
      }
      if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
      return h;
    }

    function sbFetch(path, opts) {
      var url = CONFIG.SUPABASE_URL + '/rest/v1/' + path;
      return fetch(url, opts).then(function (res) {
        if (!res.ok) return res.text().then(function (t) { throw new Error('HTTP ' + res.status + ': ' + t.slice(0, 90)); });
        return res.status === 204 ? null : res.json();
      });
    }

    function syncCloud(silent) {
      if (!state.created) return;
      if (!silent) { ui.cloudStatus = 'wait'; ui.cloudMsg = 'Синхронизация с Supabase…'; render(); }
      var club = getClub(state.clubId);
      var displayName = state.name + (state.onlineBuffs.vipFrame ? ' 👑' : '');
      var payload = {
        tg_id: tgUser.id,
        name: displayName,
        club: club.name,
        position: state.pos,
        ovr: calcOVR(state.stats, state.pos),
        tactic: state.pvp.tactic || 'press',
        rating: state.pvp.elo,
        wins: state.pvp.wins,
        draws: state.pvp.draws,
        losses: state.pvp.losses,
        updated_at: new Date().toISOString()
      };
      sbFetch('players', { method: 'POST', headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(payload) })
        .then(function () {
          return sbFetch('players?select=*&order=rating.desc&limit=50', { method: 'GET', headers: sbHeaders() });
        })
        .then(function (rows) {
          ui.leaderboard = (Array.isArray(rows) && rows.length) ? rows : FALLBACK_BOTS.slice();
          ui.cloudStatus = 'ok';
          ui.cloudMsg = 'Облако активно • Игроков в рейтинге: ' + ui.leaderboard.length;
          if (!ui.pvpOpp) pickPvpOpponent();
          loadCloudExtras();
          render();
        })
        .catch(function (err) {
          ui.cloudStatus = 'err';
          ui.cloudMsg = 'Офлайн-режим (' + (err.message || 'нет сети') + ')';
          if (!ui.pvpOpp) pickPvpOpponent();
          render();
        });
    }

    function loadCloudExtras() {
      sbFetch('match_logs?defender_tg_id=eq.' + encodeURIComponent(tgUser.id) + '&revenged=eq.false&order=created_at.desc&limit=10', { method: 'GET', headers: sbHeaders() })
        .then(function (rows) { if (Array.isArray(rows)) { ui.revengeLogs = rows; render(); } }).catch(function () {});
      sbFetch('tasks?active=eq.true', { method: 'GET', headers: sbHeaders() })
        .then(function (rows) { if (Array.isArray(rows) && rows.length) { ui.tasks = rows; render(); } }).catch(function () {});
      sbFetch('referrals?referrer_tg_id=eq.' + encodeURIComponent(tgUser.id), { method: 'GET', headers: sbHeaders() })
        .then(function (rows) { if (Array.isArray(rows)) { ui.referrals = rows; render(); } }).catch(function () {});
    }

    function recordIncomingRef() {
      if (state.refRecorded || !tgUser.startParam || tgUser.startParam.indexOf('ref_') !== 0) return;
      var refId = tgUser.startParam.slice(4);
      if (!refId || refId === tgUser.id) return;
      state.refRecorded = true; saveState();
      sbFetch('referrals', {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify({ referred_tg_id: tgUser.id, referrer_tg_id: refId, referred_name: state.name || 'Юниор', claimed: false })
      }).catch(function () {});
    }

    function claimReferrals() {
      var unclaimed = ui.referrals.filter(function (r) { return !r.claimed; });
      if (!unclaimed.length) { showToast('Нет новых наград за друзей'); return; }
      var addEur = unclaimed.length * 20000;
      var addCoin = unclaimed.length * 5000;
      state.money += addEur;
      state.onlineBalance += addCoin;
      unclaimed.forEach(function (r) {
        r.claimed = true;
        sbFetch('referrals?referred_tg_id=eq.' + encodeURIComponent(r.referred_tg_id), {
          method: 'PATCH', headers: sbHeaders(), body: JSON.stringify({ claimed: true })
        }).catch(function () {});
      });
      saveState();
      showToast('🎁 За друзей получено +' + fmtEur(addEur) + ' и +' + fmtCoin(addCoin) + '!');
      render();
    }

    /* =====================================================================
       8. TRANSFER & CONTRACT WINDOWS (SEASON 1 CLOSED; S2+: TOURS 1-2 & 9-10)
       ===================================================================== */
    function getWindowInfo() {
      if (state.season === 1) return { open: false, key: '', name: 'Закрыто (1-й сезон • 16 лет)', next: 'Откроется в начале 2-го сезона (туры 1–2)' };
      if (state.tour <= 2) return { open: true, key: 's' + state.season + '_sum', name: '☀️ Летнее окно (туры 1–2)', next: 'Закроется после 2-го тура' };
      if (state.tour === 9 || state.tour === 10) return { open: true, key: 's' + state.season + '_win', name: '❄️ Зимнее окно (туры 9–10)', next: 'Закроется после 10-го тура' };
      return { open: false, key: '', name: 'Окно закрыто', next: state.tour < 9 ? 'Откроется на 9–10 туре' : 'Откроется в Сезоне ' + (state.season + 1) };
    }

    function renewContract() {
      var w = getWindowInfo();
      if (!w.open || state.windowUsed.renewKey === w.key) return;
      var ovr = calcOVR(state.stats, state.pos);
      var peakM = (state.age >= 25 && state.age <= 30) ? 1.15 : 1;
      var base = state.div === 1 ? 2600 : 1200;
      var newSal = Math.round(Math.max(state.salary + 350, base + Math.max(0, ovr - 55) * 420 + (state.trust - 50) * 20) * peakM);
      var bonus = Math.round(newSal * 1.5);
      state.salary = newSal; state.money += bonus;
      state.windowUsed.renewKey = w.key;
      state.happiness = clamp(state.happiness + 8, 0, 100);
      saveState();
      showToast('✍️ Новый контракт: ' + fmtEur(newSal) + '/тур + бонус ' + fmtEur(bonus));
      render();
    }

    function makeTransfer(clubId) {
      var w = getWindowInfo();
      if (!w.open || state.windowUsed.transferKey === w.key) return;
      var c = getClub(clubId), loc = findClubLocation(clubId, state.divRosters);
      var ovr = calcOVR(state.stats, state.pos);
      var req = c.ovr - ((state.age >= 20 && state.age <= 24) ? 11 : 9);
      if (ovr < req) { showToast('Клуб требует OVR ' + req + '+'); return; }
      var peakM = (state.age >= 25 && state.age <= 30) ? 1.15 : 1;
      var newSal = Math.round(((loc.div === 1 ? 2800 : 1100) + Math.max(0, c.ovr - 62) * 520 + Math.max(0, ovr - 58) * 220) * peakM);
      var bonus = Math.round(newSal * 2.2);
      state.clubId = clubId; state.lgId = loc.lgId; state.div = loc.div;
      state.salary = newSal; state.money += bonus;
      state.trust = 62; state.happiness = clamp(state.happiness + 12, 0, 100);
      state.windowUsed.transferKey = w.key;
      ui.leagueCountry = loc.lgId; ui.leagueSub = loc.div === 1 ? 'd1' : 'd2';
      saveState();
      showToast('✈️ Переход в ' + c.name + ' (Д' + loc.div + ')! Бонус +' + fmtEur(bonus));
      render();
    }

    /* =====================================================================
       9. INTERACTIVE 2D MATCH ENGINE (TIMING, 6-ZONE GOAL, CONTEXT, COURAGE)
       ===================================================================== */
    function startMatch(mode, meta) {
      stopAnim();
      var myClub = getClub(state.clubId);
      var oppClub = meta.oppClub;
      var role = getRoleStatus(state.energy);

      if (state.injuryTours > 0) {
        finishMatch({
          mode: mode, meta: meta, myClub: myClub, oppClub: oppClub,
          myScore: randInt(0, 2), oppScore: randInt(0, 2), playerGoals: 0, playerAssists: 0,
          missed: 'Пропуск из-за травмы (осталось туров: ' + state.injuryTours + ')', log: ['🏥 Вы наблюдали матч с трибун.']
        });
        return;
      }
      if (role.type === 'reserve') {
        finishMatch({
          mode: mode, meta: meta, myClub: myClub, oppClub: oppClub,
          myScore: randInt(0, 2), oppScore: randInt(1, 3), playerGoals: 0, playerAssists: 0,
          missed: 'Вы в резерве (энергия < 25%) — тренер не выпустил на поле', log: ['🪑 Не попали в заявку из-за усталости.']
        });
        return;
      }

      var moments = role.type === 'starter' ? [14, 38, 63, 86] : [58, 76, 89];
      liveMatch = {
        mode: mode, meta: meta, myClub: myClub, oppClub: oppClub,
        myScore: 0, oppScore: 0, playerGoals: 0, playerAssists: 0,
        idx: 0, moments: moments, minute: moments[0],
        phase: 'choice', yellow: false, red: false,
        ballX: 160, ballY: 72,
        tPos: 50, tDir: 1, tStart: 38, tW: 24, tAct: null,
        penScore: [0, 0], penStep: 0, penResult: null,
        log: ['🎙️ Свисток! ' + myClub.name + ' против ' + oppClub.name + (role.type === 'bench' ? ' (выход на замену)' : '')]
      };
      render();
    }

    function getMatchChoices(m) {
      var min = m.minute, pos = state.pos;
      var list = [];
      if (pos === 'GK') {
        list.push({ id: 'save', t: '🧤 Выход на перехват', s: 'Тайминг-шкала • Сейв команды', type: 'timing', stat: 'phy' });
        list.push({ id: 'long', t: '🎯 Длинный пас в атаку', s: 'Надёжный выход из обороны', type: 'direct', stat: 'pas' });
      } else if (pos === 'CB' || pos === 'CDM') {
        list.push({ id: 'tackle', t: '🦵 Жёсткий отбор', s: 'Тайминг-шкала • Срыв атаки (риск ЖК)', type: 'timing', stat: 'phy' });
        list.push({ id: 'pass', t: '🎯 Разрезающий пас', s: 'Шанс ассиста и гола команды', type: 'direct', stat: 'pas' });
        list.push({ id: 'shot', t: '🚀 Подключение на стандарт', s: '6-зонная сетка ворот!', type: 'goal', stat: 'sho' });
      } else {
        list.push({ id: 'shot', t: '🎯 Момент 1 на 1 — выбрать угол!', s: '6-зонная сетка ворот • Гол!', type: 'goal', stat: 'sho' });
        list.push({ id: 'power', t: '⚡ Мощный удар (Тайминг)', s: 'Шкала удара • Высокий шанс гола', type: 'timing', stat: 'sho' });
        list.push({ id: 'pass', t: '🅰️ Скрытый пас партнёру', s: 'Игра на команду (+доверие)', type: 'direct', stat: 'pas' });
      }
      // Контекстные решения в концовке (75+ мин)
      if (min >= 75 && m.myScore < m.oppScore) {
        list.push({ id: 'dive', t: '🎭 Симулировать в штрафной', s: 'Шанс на пенальти • Риск жёлтой!', type: 'dive', stat: 'dri' });
        list.push({ id: 'sprint', t: '🔥 Рывок на последних силах', s: '-15% энергии • Опаснейший выход!', type: 'goal', stat: 'dri', extraEn: 15 });
      } else if (min >= 75 && m.myScore > m.oppScore) {
        list.push({ id: 'waste', t: '⏱️ Тянуть время у флажка', s: 'Сбивает темп соперника', type: 'direct', stat: 'dri' });
        list.push({ id: 'foul', t: '🟨 Тактический фол в центре', s: 'Гасит атаку (риск ЖК)', type: 'foul', stat: 'phy' });
      } else {
        list.push({ id: 'drib', t: '🕺 Обыграть 1 в 1', s: 'Шанс заработать опасный момент', type: 'timing', stat: 'dri' });
      }
      return list.slice(0, 4);
    }

    function pickMatchChoice(cid) {
      var m = liveMatch;
      if (!m || m.phase !== 'choice') return;
      var ch = getMatchChoices(m).find(function (c) { return c.id === cid; });
      if (!ch) return;
      if (ch.extraEn) {
        state.energy = clamp(state.energy - ch.extraEn, 0, 100);
        if (state.energy < 25 && Math.random() < 0.25) {
          state.injuryTours = 2;
          m.log.unshift('🚑 Перегруз на рывке! Микротравма на 2 тура.');
        }
      }
      var vetB = (state.age >= 31 && state.age <= 35) ? 0.10 : 0;
      var courB = (state.hotStreak >= 2 ? 0.15 : 0) + vetB;

      if (ch.type === 'timing') {
        var stVal = state.stats[ch.stat] || 55;
        var gW = clamp(Math.round(14 + (stVal - 50) * 0.45 + state.energy * 0.08), 14, 38);
        m.tW = gW; m.tStart = randInt(24, 76 - gW); m.tPos = 10; m.tDir = 1; m.tAct = ch;
        m.phase = 'timing';
        render();
        runTimingAnim(false);
        return;
      }
      if (ch.type === 'goal') {
        m.phase = 'goal'; m.tAct = ch; m.ballX = 235; m.ballY = 72;
        render(); return;
      }
      if (ch.type === 'dive') {
        if (Math.random() < 0.46 + courB) {
          m.log.unshift('🎭 ' + m.minute + "' Судья поверил! ПЕНАЛЬТИ в ворота соперника!");
          m.phase = 'goal'; m.tAct = { id: 'pen', stat: 'sho' }; render(); return;
        }
        m.yellow = true; state.trust = clamp(state.trust - 5, 0, 100);
        m.log.unshift('🟨 ' + m.minute + "' Судья раскусил симуляцию! Жёлтая карточка.");
        nextMatchMoment(false); return;
      }
      if (ch.type === 'foul') {
        m.log.unshift('🟨 ' + m.minute + "' Грамотный тактический фол сорвал выход 2 в 1!");
        if (m.yellow) { m.red = true; m.log.unshift('🟥 Вторая жёлтая! Удаление!'); }
        else m.yellow = true;
        nextMatchMoment(true, true); return;
      }
      // Direct action
      var sv = state.stats[ch.stat] || 55;
      var chance = clamp(0.45 + (sv - m.oppClub.ovr) * 0.015 + courB, 0.2, 0.9);
      var ok = Math.random() < chance;
      if (ch.id === 'waste') {
        m.log.unshift(ok ? ('⏱️ ' + m.minute + "' Идеально укрыли мяч корпусом, съев 3 минуты!") : ('⚠️ ' + m.minute + "' Мяч потерян у бровки!"));
        nextMatchMoment(ok, ok);
      } else if (ok) {
        if (ch.id === 'pass' && Math.random() < 0.58) {
          m.myScore++; m.playerAssists++; m.ballX = 278; m.ballY = 72;
          m.log.unshift('🅰️ ' + m.minute + "' ГОЛЕВАЯ ПЕРЕДАЧА! Партнёр замкнул в касание!");
        } else {
          m.ballX = 225; m.ballY = 58;
          m.log.unshift('✅ ' + m.minute + "' Отличное действие! Команда держит инициативу.");
        }
        nextMatchMoment(true);
      } else {
        m.ballX = 95; m.ballY = 85;
        m.log.unshift('❌ ' + m.minute + "' Перехват соперника!");
        nextMatchMoment(false);
      }
    }

    function runTimingAnim(isTrain) {
      stopAnim();
      var last = performance.now();
      function step(now) {
        var dt = Math.min(40, now - last) / 1000; last = now;
        var obj = isTrain ? trainGame : liveMatch;
        if (!obj) return;
        var spd = isTrain ? (82 + obj.round * 14) : (98 - (state.energy * 0.22));
        if (isTrain) {
          obj.pos += obj.dir * spd * dt;
          if (obj.pos >= 97) { obj.pos = 97; obj.dir = -1; }
          if (obj.pos <= 3) { obj.pos = 3; obj.dir = 1; }
          var el = document.getElementById('trCur');
          if (el) el.style.left = obj.pos + '%';
        } else {
          obj.tPos += obj.tDir * spd * dt;
          if (obj.tPos >= 97) { obj.tPos = 97; obj.tDir = -1; }
          if (obj.tPos <= 3) { obj.tPos = 3; obj.tDir = 1; }
          var el2 = document.getElementById('mCur');
          if (el2) el2.style.left = obj.tPos + '%';
        }
        animId = requestAnimationFrame(step);
      }
      animId = requestAnimationFrame(step);
    }

    function stopMatchTiming() {
      var m = liveMatch;
      if (!m || m.phase !== 'timing') return;
      stopAnim();
      var inG = m.tPos >= m.tStart && m.tPos <= (m.tStart + m.tW);
      var inY = !inG && m.tPos >= 22 && m.tPos <= 78;
      var act = m.tAct;
      var ok = inG || (inY && Math.random() < 0.52 + (state.hotStreak >= 2 ? 0.15 : 0));
      if (act.id === 'power') {
        if (inG || ok) {
          m.myScore++; m.playerGoals++; m.ballX = 285; m.ballY = 68;
          m.log.unshift('⚽ ' + m.minute + "' " + (inG ? 'ПУШКА В ДЕВЯТКУ! Идеальный тайминг!' : 'ГОЛ! Вратарь не дотянулся!'));
        } else {
          m.ballX = 260; m.ballY = 26;
          m.log.unshift('💨 ' + m.minute + "' Срыв удара — мяч ушёл выше ворот.");
        }
      } else if (act.id === 'tackle' || act.id === 'save') {
        if (ok) {
          m.ballX = 140; m.ballY = 72;
          m.log.unshift('🛡️ ' + m.minute + "' Безупречный " + (act.id === 'save' ? 'сейв!' : 'чистый подкат!'));
        } else {
          if (act.id === 'tackle' && Math.random() < 0.5) {
            if (m.yellow) { m.red = true; m.log.unshift('🟥 ' + m.minute + "' Опоздали в подкат — ВТОРАЯ ЖЁЛТАЯ!"); }
            else { m.yellow = true; m.log.unshift('🟨 ' + m.minute + "' Фол в подкате — жёлтая карточка."); }
          } else {
            m.log.unshift('⚠️ ' + m.minute + "' Соперник ушёл от опеки!");
          }
        }
      } else {
        if (ok) {
          if (Math.random() < 0.5) { m.myScore++; m.playerGoals++; m.ballX = 285; m.log.unshift('⚽ ' + m.minute + "' Сольный проход и ГОЛ!"); }
          else { m.myScore++; m.playerAssists++; m.ballX = 278; m.log.unshift('🅰️ ' + m.minute + "' Обыграл двоих и выкатил на пустые!"); }
        } else {
          m.ballX = 110; m.log.unshift('❌ ' + m.minute + "' Защитник прочитал финт.");
        }
      }
      nextMatchMoment(ok, act.id === 'tackle' && ok);
    }

    function pickGoalZone(zIdx) {
      var m = liveMatch;
      if (!m || m.phase !== 'goal') return;
      var gk = randInt(0, 5);
      var isTop = zIdx < 3;
      var sv = state.stats.sho || 55;
      var vetB = (state.age >= 31 && state.age <= 35) ? 0.10 : 0;
      var courB = (state.hotStreak >= 2 ? 0.15 : 0) + vetB;
      var goalChance = (zIdx === gk ? 0.22 : (isTop ? 0.78 : 0.72)) + (sv - m.oppClub.ovr) * 0.008 + courB;
      var ok = Math.random() < clamp(goalChance, 0.15, 0.94);
      if (ok) {
        m.myScore++; m.playerGoals++; m.ballX = 286; m.ballY = isTop ? 58 : 84;
        m.log.unshift('⚽ ' + m.minute + "' ГООООЛ! Точно в угол, вратарь бессилен!");
      } else {
        m.ballX = 270; m.ballY = 48;
        m.log.unshift(zIdx === gk ? ('🧤 ' + m.minute + "' Вратарь угадал угол и потащил!") : ('💥 ' + m.minute + "' ШТАНГА! Миллиметры от гола!"));
      }
      nextMatchMoment(ok);
    }

    function nextMatchMoment(wasSuccess, safeDef) {
      var m = liveMatch;
      if (wasSuccess) state.hotStreak++; else state.hotStreak = 0;

      // Ответный момент соперника
      var oppRisk = safeDef ? 0.08 : (wasSuccess ? 0.16 : 0.34);
      oppRisk += (m.oppClub.ovr - m.myClub.ovr) * 0.009;
      if (Math.random() < clamp(oppRisk, 0.06, 0.62)) {
        m.oppScore++;
        m.ballX = 35; m.ballY = 72;
        m.log.unshift('😱 ' + (m.minute + 2) + "' Соперник отвечает голом! Счёт " + m.myScore + ':' + m.oppScore);
      }

      m.idx++;
      if (m.red || m.idx >= m.moments.length) {
        // Пенальти в плей-офф ЛЧ или финале сборной при ничьей
        var needPen = m.myScore === m.oppScore && ((m.mode === 'ucl' && m.meta.ev.type !== 'league') || (m.mode === 'intl' && m.meta.isFinal));
        if (needPen) {
          m.phase = 'penalty'; m.penScore = [0, 0]; m.penStep = 0;
          m.log.unshift('🔥 Ничья в основное время! Серия пенальти (3 удара)!');
          render(); return;
        }
        finishMatch(m);
        return;
      }
      m.minute = m.moments[m.idx];
      m.phase = 'choice';
      render();
    }

    function takeMatchPenalty(zIdx) {
      var m = liveMatch;
      if (!m || m.phase !== 'penalty') return;
      var gk = randInt(0, 5);
      var myHit = zIdx !== gk || Math.random() < 0.35;
      var oppHit = Math.random() < 0.68;
      if (myHit) m.penScore[0]++;
      if (oppHit) m.penScore[1]++;
      m.penStep++;
      m.log.unshift('🎯 Пенальти ' + m.penStep + ': Вы ' + (myHit ? '✅' : '❌') + ' | Соперник ' + (oppHit ? '✅' : '❌') + ' (' + m.penScore[0] + ':' + m.penScore[1] + ')');
      if (m.penStep >= 3 && m.penScore[0] !== m.penScore[1]) {
        m.penResult = m.penScore[0] + ':' + m.penScore[1] + ' пен.';
        finishMatch(m);
      } else if (m.penStep >= 5) {
        if (m.penScore[0] === m.penScore[1]) m.penScore[0]++;
        m.penResult = m.penScore[0] + ':' + m.penScore[1] + ' пен.';
        finishMatch(m);
      } else {
        render();
      }
    }

    function finishMatch(m) {
      stopAnim();
      var won = m.penResult ? (m.penScore[0] > m.penScore[1]) : (m.myScore > m.oppScore);
      var draw = !m.penResult && m.myScore === m.oppScore;
      var lines = [];

      if (m.missed) {
        lines.push('⚠️ ' + m.missed);
        if (state.injuryTours > 0) state.injuryTours--;
        state.energy = clamp(state.energy + (state.age <= 19 ? 24 : 18), 0, 100);
      } else {
        var vetDrain = (state.age >= 31 && state.age <= 35) ? 3 : 0;
        var vetTrust = (state.age >= 31 && state.age <= 35) ? 1 : 0;
        state.energy = clamp(state.energy - (randInt(15, 21) + vetDrain), 0, 100);
        state.careerStats.apps++;
        state.careerStats.goals += m.playerGoals;
        state.careerStats.assists += m.playerAssists;
        if (won) { state.trust = clamp(state.trust + 5 + vetTrust, 0, 100); state.happiness = clamp(state.happiness + 4, 0, 100); state.fans += 160 + m.playerGoals * 140; }
        else if (draw) { state.trust = clamp(state.trust + 1 + vetTrust, 0, 100); state.fans += 60 + m.playerGoals * 90; }
        else { state.trust = clamp(state.trust - 3, 0, 100); state.happiness = clamp(state.happiness - 3, 0, 100); }
      }

      if (m.mode === 'league') {
        var peakM = (state.age >= 25 && state.age <= 30) ? 1.15 : 1;
        var pay = Math.round((state.salary + (won ? Math.round(state.salary * 0.25) : 0) + m.playerGoals * 350) * peakM);
        state.money += pay;
        lines.push('💵 Зарплата и бонусы: +' + fmtEur(pay));

        // Записываем наш матч и симулируем все остальные 12 дивизионов на этот тур
        var myDivKey = state.div === 1 ? 'd1' : 'd2';
        var myTbl = state.tables[state.lgId][myDivKey];
        applyScore(myTbl, m.myClub.id, m.oppClub.id, m.myScore, m.oppScore);
        simFullDivRound(myTbl, [m.myClub.id, m.oppClub.id]);
        LEAGUE_DEFS.forEach(function (lg) {
          ['d1', 'd2'].forEach(function (dk) {
            if (lg.id === state.lgId && dk === myDivKey) return;
            simFullDivRound(state.tables[lg.id][dk], null);
          });
        });

        var playedTour = state.tour;
        state.tour++;

        // Прокрутка ЛЧ, если наш клуб там не играет на этом этапе
        var pUcl = getPendingUcl(state);
        if (pUcl && !pUcl.myMatch) advanceUclStage(state, pUcl, null);

        // Интервью каждый 3-й тур
        if (playedTour % 3 === 0 && state.interviewDoneTours.indexOf(playedTour) === -1) {
          state.interviewDoneTours.push(playedTour);
          state.pendingInterview = {
            q: won ? 'Отличная победа! В чём секрет такой игры в ' + state.age + ' лет?' : 'Матч вышел тяжёлым. Что скажете болельщикам?',
            opts: [
              { l: '«Вся заслуга — у команды и тренера!»', m: '+7 доверия, +200 фанатов', eff: { trust: 7, fans: 200 } },
              { l: '«Я готов к большим клубам и Д1!»', m: '+550 фанатов, -4 доверия', eff: { trust: -4, fans: 550 } },
              { l: '«Разберём ошибки и вернёмся сильнее»', m: '+4 доверия, +5 счастья', eff: { trust: 4, hap: 5 } }
            ]
          };
        } else if (Math.random() < 0.42) {
          state.pendingEvent = pick(LIFE_EVENTS);
        }

        // Вызовы в сборную: туры 6, 12, 18
        if ((playedTour === 6 || playedTour === 12 || playedTour === 18) && state.intlDoneTours.indexOf(playedTour) === -1) {
          state.intlDoneTours.push(playedTour);
          var ctry = getCountry(state.countryId);
          var ovr = calcOVR(state.stats, state.pos);
          if (ovr >= ctry.req || (ovr >= ctry.req - 4 && state.trust >= 80)) {
            var oppC = pick(COUNTRIES.filter(function (c) { return c.id !== ctry.id; }));
            state.pendingIntl = { tour: playedTour, isFinal: playedTour === 18, title: playedTour === 18 ? '🏆 Кубок Наций • Финал' : '🌍 Матч за сборную', opp: oppC };
          }
        }
        if (state.season >= 2 && state.tour === 9) lines.push('❄️ Открылось Зимнее окно трансферов и контрактов (туры 9–10)!');
      } else if (m.mode === 'ucl') {
        state.careerStats.uclGoals += m.playerGoals;
        var ev = m.meta.ev;
        var isH = ev.myMatch.h === state.clubId;
        var pRes = { hg: isH ? m.myScore : m.oppScore, ag: isH ? m.oppScore : m.myScore, pen: m.penResult, win: won ? state.clubId : m.oppClub.id };
        advanceUclStage(state, ev, pRes);
        var uPay = won ? 18000 : (draw ? 8000 : 3500);
        if (ev.type === 'final' && won) { state.trophies.ucl++; uPay += 65000; lines.push('🏆⭐ ВЫ ВЫИГРАЛИ ЛИГУ ЧЕМПИОНОВ! +65 000 €!'); }
        state.money += uPay;
        lines.push('⭐ Призовые УЕФА: +' + fmtEur(uPay));
      } else if (m.mode === 'intl') {
        state.careerStats.intlGoals += m.playerGoals;
        var iPay = won ? 14000 : 5000;
        if (won && m.meta.isFinal) { state.trophies.intl++; iPay += 25000; lines.push('🏆 ПОБЕДА В КУБКЕ НАЦИЙ!'); }
        state.money += iPay; state.fans += won ? 1200 : 350;
        lines.push('🌍 Призовые сборной: +' + fmtEur(iPay));
        state.pendingIntl = null;
      }

      state.peakOvr = Math.max(state.peakOvr || 54, calcOVR(state.stats, state.pos));
      liveMatch = {
        phase: 'done', mode: m.mode, myClub: m.myClub, oppClub: m.oppClub,
        myScore: m.myScore, oppScore: m.oppScore, penResult: m.penResult,
        playerGoals: m.playerGoals, playerAssists: m.playerAssists,
        won: won, draw: draw, lines: lines, log: m.log || []
      };
      saveState();
      render();
    }

    /* =====================================================================
       10. SEASON END: PROMOTION (TOP 2 D2) & RELEGATION (BOTTOM 2 D1)
       ===================================================================== */
    function finishSeason() {
      // Доигрываем ЛЧ если оставалась
      var safety = 0;
      while (safety++ < 6) {
        var pu = getPendingUcl(state);
        if (!pu) break;
        advanceUclStage(state, pu, null);
      }

      var myDivKey = state.div === 1 ? 'd1' : 'd2';
      var mySorted = sortTable(state.tables[state.lgId][myDivKey]);
      var myPos = mySorted.findIndex(function (r) { return r.id === state.clubId; }) + 1;
      var lg = getLeagueDef(state.lgId);
      var msg = 'Сезон ' + state.season + ': ' + myPos + '-е место (' + (state.div === 1 ? lg.d1Name : lg.d2Name) + ')';

      if (state.div === 1) {
        if (myPos === 1) { state.trophies.d1++; state.money += 40000; state.fans += 4000; msg = '🏆 ЧЕМПИОН ' + lg.d1Name + '! +40 000 €!'; }
        else if (myPos <= lg.uclQuota) { state.money += 18000; msg += ' • ⭐ Выход в ЛЧ!'; }
        else if (myPos >= 9) { msg += ' • ⬇️ Вылет в ' + lg.d2Name; }
      } else {
        if (myPos === 1) { state.trophies.d2++; state.money += 16000; state.fans += 1500; msg = '🏆 ЧЕМПИОН ' + lg.d2Name + ' & ⬆️ ВЫХОД В ' + lg.d1Name + '!'; }
        else if (myPos === 2) { state.money += 10000; state.fans += 900; msg = '⬆️ 2-е место — ПОВЫШЕНИЕ в ' + lg.d1Name + ' (+10 000 €)!'; }
      }

      // Применяем повышение (места 1–2 Д2) и вылет (места 9–10 Д1) во всех 6 странах
      var prevTables = state.tables;
      var nextRosters = {};
      LEAGUE_DEFS.forEach(function (l) {
        var s1 = sortTable(prevTables[l.id].d1).map(function (r) { return r.id; });
        var s2 = sortTable(prevTables[l.id].d2).map(function (r) { return r.id; });
        var stayD1 = s1.slice(0, 8), relD1 = s1.slice(8, 10);
        var proD2 = s2.slice(0, 2), stayD2 = s2.slice(2, 10);
        nextRosters[l.id] = { d1: stayD1.concat(proD2), d2: relD1.concat(stayD2) };
      });

      state.divRosters = nextRosters;
      var newLoc = findClubLocation(state.clubId, nextRosters);
      state.lgId = newLoc.lgId; state.div = newLoc.div;
      state.season++;
      state.age++;
      state.tour = 1;
      state.tables = createAllTables(nextRosters);
      state.ucl = buildUclSeason(state.season, nextRosters, prevTables);
      state.intlDoneTours = [];
      state.interviewDoneTours = [];
      state.energy = 100;
      state.injuryTours = 0;
      liveMatch = null;
      ui.leagueCountry = state.lgId;
      ui.leagueSub = state.div === 1 ? 'd1' : 'd2';
      saveState();
      showToast(msg + ' 🎂 Вам ' + state.age + ' лет! ☀️ Открыто Летнее окно!');
      render();
    }

    /* =====================================================================
       11. 3-ROUND TIMING TRAINING MINI-GAME
       ===================================================================== */
    function startTrain(statKey) {
      var val = state.stats[statKey];
      var cost = 700 + Math.max(0, val - 50) * 190;
      if (state.energy < 18) { showToast('Нужно минимум 18% энергии!'); return; }
      if (state.money < cost) { showToast('Не хватает ' + fmtEur(cost)); return; }
      state.money -= cost;
      state.energy = clamp(state.energy - 18, 0, 100);
      var gW = clamp(28 - Math.floor((val - 50) / 5), 14, 30);
      trainGame = {
        statKey: statKey, round: 1, hits: 0, done: false,
        pos: 10, dir: 1, gStart: randInt(22, 78 - gW), gW: gW,
        msg: 'Раунд 1/3 — поймайте зелёную зону!'
      };
      saveState();
      render();
      runTimingAnim(true);
    }

    function tapTrain() {
      if (!trainGame || trainGame.done) return;
      stopAnim();
      var hit = trainGame.pos >= trainGame.gStart && trainGame.pos <= (trainGame.gStart + trainGame.gW);
      if (hit) trainGame.hits++;
      if (trainGame.round < 3) {
        trainGame.round++;
        trainGame.gStart = randInt(20, 80 - trainGame.gW);
        trainGame.msg = (hit ? '✅ Попадание! ' : '❌ Мимо! ') + 'Раунд ' + trainGame.round + '/3';
        render();
        runTimingAnim(true);
      } else {
        trainGame.done = true;
        var gain = trainGame.hits === 3 ? 2 : (trainGame.hits >= 1 ? 1 : 0);
        var bonus = false;
        if (gain > 0 && state.age <= 19 && Math.random() < 0.15) { gain++; bonus = true; }
        if (gain > 0) {
          state.stats[trainGame.statKey] = clamp(state.stats[trainGame.statKey] + gain, 40, 99);
          state.peakOvr = Math.max(state.peakOvr || 54, calcOVR(state.stats, state.pos));
        }
        state.trust = clamp(state.trust + (gain > 0 ? 2 : 1), 0, 100);
        saveState();
        var sm = STAT_META.find(function (m) { return m.k === trainGame.statKey; });
        trainGame.msg = 'Итог ' + trainGame.hits + '/3 → ' + (gain > 0 ? ('+' + gain + ' ' + sm.lbl + (bonus ? ' (🌱 Вундеркинд!)' : '!')) : 'без прироста, +1 доверия');
        render();
      }
    }

    /* =====================================================================
       12. ONLINE PvP (4 MATCHES/DAY, BETS, PENALTIES, SHOP, REVENGE)
       ===================================================================== */
    function getPvpLimit() { return CONFIG.DAILY_PVP_LIMIT + (state.online.pvpExtra || 0); }
    function checkDailyPvpReset() {
      var td = todayStr();
      if (state.online.pvpDate !== td) {
        state.online.pvpDate = td; state.online.pvpCount = 0; state.online.pvpExtra = 0; state.online.marathonDate = '';
        saveState();
      }
    }
    function pickPvpOpponent() {
      var pool = ui.leaderboard.filter(function (p) { return p.tg_id !== tgUser.id; });
      if (!pool.length) pool = FALLBACK_BOTS;
      ui.pvpOpp = pick(pool);
      state.pvp.scoutedId = '';
    }

    function playPvp(oppObj, revengeLog) {
      checkDailyPvpReset();
      if (!revengeLog && state.online.pvpCount >= getPvpLimit()) {
        showToast('Лимит матчей на сегодня исчерпан! Купите билет в 🛒 Шопе.'); return;
      }
      var opp = oppObj || ui.pvpOpp;
      if (!opp) { pickPvpOpponent(); opp = ui.pvpOpp; }
      var stake = revengeLog ? 0 : (state.pvp.stake || 0);
      if (stake > state.onlineBalance) { showToast('Не хватает ' + fmtCoin(stake) + ' для ставки!'); return; }

      var myOvr = calcOVR(state.stats, state.pos);
      var dopB = state.onlineBuffs.doping ? 8 : 0;
      state.onlineBuffs.doping = false;
      var myTac = TACTICS.find(function (t) { return t.id === state.pvp.tactic; }) || TACTICS[0];
      var oppTac = opp.tactic || 'press';
      var tacB = myTac.beats === oppTac ? 6 : (TACTICS.find(function (t) { return t.id === oppTac; }) || TACTICS[0]).beats === myTac.id ? -6 : 0;

      var diff = (myOvr + dopB + tacB - (opp.ovr || 70)) / 10;
      var myG = clamp(Math.round(1.3 + diff + (Math.random() - 0.5) * 2.2), 0, 5);
      var opG = clamp(Math.round(1.2 - diff + (Math.random() - 0.5) * 2.2), 0, 5);

      if (myG === opG) {
        ui.pvpPen = { opp: opp, stake: stake, revLog: revengeLog || null, baseScore: myG + ':' + opG, sc: [0, 0], step: 0, log: ['Ничья ' + myG + ':' + opG + '! Серия из 3 пенальти!'] };
        render(); return;
      }
      finalizePvp(opp, myG, opG, stake, revengeLog || null, null);
    }

    function takePvpPen(zIdx) {
      var p = ui.pvpPen;
      if (!p) return;
      var gk = randInt(0, 5);
      var myHit = zIdx !== gk || Math.random() < 0.35;
      var opHit = Math.random() < 0.65;
      if (myHit) p.sc[0]++;
      if (opHit) p.sc[1]++;
      p.step++;
      p.log.unshift('Удар ' + p.step + ': Вы ' + (myHit ? '✅' : '❌') + ' | Соперник ' + (opHit ? '✅' : '❌') + ' (' + p.sc[0] + ':' + p.sc[1] + ')');
      if (p.step >= 3 && p.sc[0] !== p.sc[1]) {
        var penRes = p.sc[0] + ':' + p.sc[1] + ' пен.';
        var b = p.baseScore.split(':');
        ui.pvpPen = null;
        finalizePvp(p.opp, Number(b[0]), Number(b[1]), p.stake, p.revLog, { won: p.sc[0] > p.sc[1], txt: penRes });
      } else if (p.step >= 5) {
        if (p.sc[0] === p.sc[1]) p.sc[0]++;
        var b2 = p.baseScore.split(':');
        ui.pvpPen = null;
        finalizePvp(p.opp, Number(b2[0]), Number(b2[1]), p.stake, p.revLog, { won: p.sc[0] > p.sc[1], txt: p.sc[0] + ':' + p.sc[1] + ' пен.' });
      } else {
        render();
      }
    }

    function finalizePvp(opp, myG, opG, stake, revLog, penObj) {
      var won = penObj ? penObj.won : (myG > opG);
      var mult = revLog ? 1.5 : 1;
      var eloDelta = won ? Math.round(22 * mult) : -16;
      var shieldUsed = false;
      if (!won && state.onlineBuffs.eloShield) { eloDelta = 0; state.onlineBuffs.eloShield = false; shieldUsed = true; }

      state.pvp.elo = Math.max(500, state.pvp.elo + eloDelta);
      if (won) state.pvp.wins++; else state.pvp.losses++;

      var coinDelta = won ? Math.round(2000 * mult) + Math.round(stake * 0.9) : (300 - stake);
      state.onlineBalance = Math.max(0, state.onlineBalance + coinDelta);

      var marathonMsg = '';
      if (!revLog) {
        state.online.pvpCount++;
        if (state.online.pvpCount >= CONFIG.DAILY_PVP_LIMIT && state.online.marathonDate !== todayStr()) {
          state.online.marathonDate = todayStr();
          state.onlineBalance += 10000;
          marathonMsg = ' 🏅 Марафон 4/4: +10 000 🪙!';
        }
      } else {
        ui.revengeLogs = ui.revengeLogs.filter(function (x) { return x.id !== revLog.id; });
        sbFetch('match_logs?id=eq.' + revLog.id, { method: 'PATCH', headers: sbHeaders(), body: JSON.stringify({ revenged: true }) }).catch(function () {});
      }

      if (won && opp.tg_id && opp.tg_id.indexOf('bot_') !== 0) {
        sbFetch('match_logs', {
          method: 'POST', headers: sbHeaders(),
          body: JSON.stringify({ attacker_tg_id: tgUser.id, attacker_name: state.name, defender_tg_id: opp.tg_id, score: myG + ':' + opG, elo_change: Math.abs(eloDelta), revenged: false })
        }).catch(function () {});
      }

      pickPvpOpponent();
      saveState();
      syncCloud(true);
      showToast((won ? '🏆 Победа ' : '😤 Поражение ') + myG + ':' + opG + (penObj ? ' (' + penObj.txt + ')' : '') +
        ' | ' + (eloDelta >= 0 ? '+' : '') + eloDelta + ' ELO' + (shieldUsed ? ' (🛡️ Щит!)' : '') +
        ' | ' + (coinDelta >= 0 ? '+' : '') + fmtCoin(coinDelta) + marathonMsg);
      render();
    }
