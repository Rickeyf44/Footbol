<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PRO CAREER: TOP 5 + РПЛ</title>
  <!-- Non-blocking SDKs -->
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js" async></script>
  <style>
    /* =========================================================================
       DESIGN TOKENS & BASE RESET (DARK STADIUM THEME)
       ========================================================================= */
    :root {
      --bg-0: #060b14;
      --bg-1: #0b1322;
      --bg-2: #111c30;
      --bg-card: rgba(15, 23, 42, 0.88);
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-0: #f8fafc;
      --text-1: #cbd5e1;
      --text-2: #94a3b8;
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --gold: #f59e0b;
      --gold-bright: #fbbf24;
      --sky: #38bdf8;
      --rose: #f43f5e;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: radial-gradient(circle at 50% -10%, #162a4a 0%, var(--bg-0) 55%, #04070d 100%);
      color: var(--text-0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    input, button, select {
      font-family: inherit;
      outline: none;
    }

    input {
      user-select: text;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      padding: 0;
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    /* =========================================================================
       LAYOUT & SHELL
       ========================================================================= */
    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 78px;
    }

    .hud {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(6, 11, 20, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hud-club {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .hud-club-meta {
      min-width: 0;
    }

    .hud-club-name {
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .hud-sub {
      font-size: 11px;
      color: var(--text-2);
      font-weight: 600;
    }

    .hud-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-strong);
      white-space: nowrap;
    }

    .pill-money {
      color: var(--emerald-bright);
      border-color: rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.12);
    }

    .pill-energy-hi { color: var(--emerald-bright); border-color: rgba(16, 185, 129, 0.35); }
    .pill-energy-md { color: var(--gold-bright); border-color: rgba(245, 158, 11, 0.4); }
    .pill-energy-lo { color: #fb7185; border-color: rgba(244, 63, 94, 0.45); background: rgba(244, 63, 94, 0.12); }

    .main-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 45;
      background: rgba(7, 12, 22, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-strong);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 2px;
      border-radius: 10px;
      color: var(--text-2);
      font-size: 10px;
      font-weight: 700;
      position: relative;
      transition: all 0.15s ease;
    }

    .nav-btn .ico {
      font-size: 17px;
      line-height: 1.1;
    }

    .nav-btn.active {
      color: var(--emerald-bright);
      background: rgba(16, 185, 129, 0.12);
    }

    .nav-dot {
      position: absolute;
      top: 4px;
      right: 12px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald-bright);
      box-shadow: 0 0 8px var(--emerald-bright);
      animation: pulse 1.6s infinite;
    }

    /* =========================================================================
       CARDS, TYPOGRAPHY & BUTTONS
       ========================================================================= */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .card-highlight {
      border-color: rgba(16, 185, 129, 0.4);
      background: linear-gradient(155deg, rgba(16, 185, 129, 0.13), rgba(15, 23, 42, 0.94));
    }

    .card-gold {
      border-color: rgba(245, 158, 11, 0.45);
      background: linear-gradient(155deg, rgba(245, 158, 11, 0.14), rgba(15, 23, 42, 0.94));
    }

    .card-sky {
      border-color: rgba(56, 189, 248, 0.4);
      background: linear-gradient(155deg, rgba(56, 189, 248, 0.12), rgba(15, 23, 42, 0.94));
    }

    .card-rose {
      border-color: rgba(244, 63, 94, 0.42);
      background: linear-gradient(155deg, rgba(244, 63, 94, 0.14), rgba(15, 23, 42, 0.95));
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text-0);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .muted { color: var(--text-2); }
    .small { font-size: 11px; }
    .xs { font-size: 10px; }
    .bold { font-weight: 800; }
    .center { text-align: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 13px;
      transition: transform 0.12s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-sm {
      min-height: 36px;
      padding: 7px 12px;
      font-size: 12px;
      width: auto;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #032217;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.3);
    }

    .btn-gold {
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #1f1102;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.28);
    }

    .btn-sky {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #041b2c;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.25);
    }

    .btn-purple {
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.3);
    }

    .btn-sec {
      background: rgba(30, 41, 59, 0.9);
      color: var(--text-0);
      border: 1px solid var(--border-strong);
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.16);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.4);
    }

    /* Segmented Sub-tabs */
    .seg-tabs {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      padding: 4px;
      border-radius: 13px;
      border: 1px solid var(--border);
    }

    .seg-btn {
      padding: 8px 6px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-2);
      text-align: center;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--emerald);
      color: #032217;
      box-shadow: 0 3px 12px rgba(16, 185, 129, 0.3);
    }

    /* Badges & Progress */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .badge-green { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-gold  { background: rgba(245, 158, 11, 0.2);  color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.45); }
    .badge-rose  { background: rgba(244, 63, 94, 0.2);   color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.45); }
    .badge-sky   { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-slate { background: rgba(148, 163, 184, 0.14); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

    .bar-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* =========================================================================
       EA FC STYLE PLAYER CARD
       ========================================================================= */
    .fc-card {
      position: relative;
      border-radius: 22px;
      padding: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.55);
    }

    .fc-bronze {
      background: linear-gradient(145deg, #4b2e19 0%, #8c5a32 45%, #3b2211 100%);
      border-color: #d49b6a;
      color: #fff7ed;
    }

    .fc-silver {
      background: linear-gradient(145deg, #334155 0%, #94a3b8 48%, #1e293b 100%);
      border-color: #e2e8f0;
      color: #ffffff;
    }

    .fc-gold {
      background: linear-gradient(145deg, #784b06 0%, #eab308 46%, #452603 100%);
      border-color: #fef08a;
      color: #fffbeb;
    }

    .fc-elite {
      background: linear-gradient(145deg, #064e3b 0%, #0ea5e9 45%, #312e81 100%);
      border-color: #5eead4;
      color: #ffffff;
      box-shadow: 0 18px 40px rgba(14, 165, 233, 0.32);
    }

    .fc-shine {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 10%, rgba(255,255,255,0.28), transparent 55%);
      pointer-events: none;
    }

    .fc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .fc-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 68px;
    }

    .fc-ovr {
      font-size: 42px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-shadow: 0 3px 10px rgba(0,0,0,0.45);
    }

    .fc-pos {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-top: 2px;
      opacity: 0.95;
    }

    .fc-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .fc-avatar {
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.45));
    }

    .fc-name-bar {
      position: relative;
      z-index: 2;
      text-align: center;
      margin: 10px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
    }

    .fc-name {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .fc-clubline {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.9;
      margin-top: 2px;
    }

    .fc-stats {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px 10px;
    }

    .fc-stat {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.24);
      padding: 5px 6px;
      border-radius: 9px;
    }

    .fc-stat-val {
      font-size: 15px;
      font-weight: 900;
    }

    .fc-stat-lbl {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.85;
    }

    /* =========================================================================
       GRIDS, LISTS, TABLES & INPUTS
       ========================================================================= */
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .text-input {
      width: 100%;
      background: rgba(10, 17, 30, 0.95);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 11px 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }
    .text-input:focus {
      border-color: var(--emerald-bright);
    }

    .chip-btn {
      padding: 8px 6px;
      border-radius: 11px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      text-align: center;
      transition: all 0.15s ease;
    }

    .chip-btn.selected {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--emerald-bright);
      color: #fff;
    }

    .league-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .league-scroll::-webkit-scrollbar { display: none; }

    .league-pill {
      flex-shrink: 0;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--text-1);
    }
    .league-pill.active {
      background: var(--emerald);
      color: #032217;
      border-color: var(--emerald-bright);
    }

    /* Tables */
    .tbl-wrap {
      width: 100%;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th {
      text-align: left;
      font-size: 10px;
      color: var(--text-2);
      text-transform: uppercase;
      padding: 6px 4px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 7px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    tr.me-row {
      background: rgba(16, 185, 129, 0.16);
    }

    /* 2D Pitch & Scoreboard */
    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0b1629, #0f223d);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .sb-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 34%;
      text-align: center;
    }
    .sb-score {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #fff;
    }
    .sb-min {
      font-size: 11px;
      font-weight: 800;
      color: var(--emerald-bright);
      background: rgba(16, 185, 129, 0.15);
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .pitch-box {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(52, 211, 153, 0.35);
      box-shadow: 0 10px 24px rgba(0,0,0,0.45);
    }

    .match-log {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 11px;
    }

    .log-item {
      padding: 6px 9px;
      border-radius: 9px;
      background: rgba(15, 23, 42, 0.9);
      border-left: 3px solid var(--sky);
    }
    .log-item.goal { border-left-color: var(--emerald-bright); background: rgba(16, 185, 129, 0.14); }
    .log-item.opp  { border-left-color: var(--rose); background: rgba(244, 63, 94, 0.12); }

    /* =========================================================================
       MODALS & TOASTS
       ========================================================================= */
    #modal-root {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(2, 6, 14, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #modal-root.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      max-height: 90vh;
      overflow-y: auto;
      background: #0d1626;
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      animation: fadeUp 0.2s ease-out;
    }

    #toast-root {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 440px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .toast {
      padding: 10px 14px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--border-strong);
      color: #fff;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.2s ease-out;
    }
    .toast-ok   { border-color: rgba(16, 185, 129, 0.6); color: #a7f3d0; }
    .toast-gold { border-color: rgba(245, 158, 11, 0.65); color: #fde68a; }
    .toast-err  { border-color: rgba(244, 63, 94, 0.65); color: #fecdd3; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.25); opacity: 0.65; }
    }
    @keyframes dicePop {
      0%   { transform: scale(1) rotate(0deg); }
      40%  { transform: scale(1.12) rotate(-12deg); }
      75%  { transform: scale(0.95) rotate(8deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .anim { animation: fadeUp 0.2s ease-out; }
    .dice-pop { animation: dicePop 0.3s ease-out; }
  </style>
</head>

    let tg = null;

    function initTelegram() {
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();
          if (tg.setHeaderColor) tg.setHeaderColor('#060b14');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#060b14');
          const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
          if (u && u.id) {
            tgUser = {
              id: String(u.id),
              firstName: [u.first_name, u.last_name].filter(Boolean).join(' ').trim() || u.username || 'Футболист'
            };
            try { localStorage.setItem('pc_tg_id', tgUser.id); } catch (e) {}
          }
        }
        // Fallback persistent guest ID if outside Telegram
        if (tgUser.id.startsWith('guest_')) {
          const savedId = localStorage.getItem('pc_tg_id');
          if (savedId) tgUser.id = savedId;
          else localStorage.setItem('pc_tg_id', tgUser.id);
        }
      } catch (e) {}
    }

    function haptic(type) {
      try {
        if (!tg || !tg.HapticFeedback) return;
        if (type === 'success' || type === 'error' || type === 'warning') {
          tg.HapticFeedback.notificationOccurred(type);
        } else {
          tg.HapticFeedback.impactOccurred(type || 'light');
        }
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function fmtMoney(n) {
      return Math.round(Number(n) || 0).toLocaleString('ru-RU') + ' €';
    }

    function fmtNum(n) {
      return Math.round(Number(n) || 0).toLocaleString('ru-RU');
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function todayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function showToast(text, kind) {
      try {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const el = document.createElement('div');
        el.className = 'toast ' + (kind === 'error' ? 'toast-err' : kind === 'gold' ? 'toast-gold' : 'toast-ok');
        el.textContent = text;
        root.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 3200);
      } catch (e) {}
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.innerHTML = '<div class="modal-box">' + html + '</div>';
      root.classList.add('open');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.classList.remove('open');
      root.innerHTML = '';
    }

    function copyTextSafe(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast('Ссылка скопирована в буфер!', 'ok');
          haptic('success');
          return;
        }
      } catch (e) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('Ссылка скопирована!', 'ok');
          haptic('success');
        }).catch(() => showToast('Не удалось скопировать', 'error'));
      }
    }

    function getSupabaseHeaders(extra) {
      const key = (CONFIG.SUPABASE_ANON_KEY || '').trim();
      const headers = {
        'apikey': key,
        'Content-Type': 'application/json'

      // Strictly ONLY add Authorization Bearer if key starts with eyJ
      if (key.startsWith('eyJ')) {
        headers['Authorization'] = 'Bearer ' + key;
      }
      if (extra) {
        Object.keys(extra).forEach(k => { headers[k] = extra[k]; });
      }
      return headers;
    }

    function calcOvr(stats, posCode) {
      const pos = POSITIONS[posCode] || POSITIONS.ST;
      const w = pos.w;
      const val =
        stats.pac * w.pac +
        stats.sho * w.sho +
        stats.pas * w.pas +
        stats.dri * w.dri +
        stats.def * w.def +
        stats.phy * w.phy;
      return clamp(Math.round(val), 45, 99);
    }

    function getSquadStatus(energy) {
      if (energy >= 50) return { key: 'starter',  label: '🟢 Основа',  desc: 'Выходишь с 1-й минуты (3 момента)', cls: 'badge-green' };
      if (energy >= 25) return { key: 'bench',    label: '🟡 Лавка',   desc: 'Усталость: выход на 68-й мин. (1 момент)', cls: 'badge-gold' };
      return                  { key: 'reserves', label: '🔴 Резерв',  desc: 'Вне заявки из-за усталости (-5 Доверие, +18% ⚡)', cls: 'badge-rose' };
    }

    function buildLeagueTable(league) {
      return league.clubs.map(c => ({
        clubId: c.id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0
      }));
    }

    // 18-round double round-robin for 10 clubs
    function buildLeagueSchedule(league) {
      const ids = league.clubs.map(c => c.id);
      const n = ids.length; // 10
      const arr = ids.slice();
      const firstHalf = [];
      for (let r = 0; r < n - 1; r++) {
        const pairs = [];
        for (let i = 0; i < n / 2; i++) {
          const home = (r % 2 === 0) ? arr[i] : arr[n - 1 - i];
          const away = (r % 2 === 0) ? arr[n - 1 - i] : arr[i];
          pairs.push([home, away]);
        }
        firstHalf.push(pairs);
        const last = arr.pop();
        arr.splice(1, 0, last);
      }
      const secondHalf = firstHalf.map(round => round.map(([h, a]) => [a, h]));
      return firstHalf.concat(secondHalf); // 18 rounds
    }

    function buildAllTables() {
      const obj = {};
      LEAGUES.forEach(lg => { obj[lg.id] = buildLeagueTable(lg); });
      return obj;
    }

    function buildAllSchedules() {
      const obj = {};
      LEAGUES.forEach(lg => { obj[lg.id] = buildLeagueSchedule(lg); });
      return obj;
    }

    function saveState() {
      try {
        if (state) localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.player || !parsed.player.stats) return null;
        // Ensure integrity for any missing fields
        parsed.season = parsed.season || 1;
        parsed.round = Number(parsed.round) || 0;
        parsed.trainLeft = typeof parsed.trainLeft === 'number' ? parsed.trainLeft : 2;
        parsed.adEnergyRound = typeof parsed.adEnergyRound === 'number' ? parsed.adEnergyRound : -1;
        parsed.adTrainRound = typeof parsed.adTrainRound === 'number' ? parsed.adTrainRound : -1;
        parsed.lastInterviewRound = typeof parsed.lastInterviewRound === 'number' ? parsed.lastInterviewRound : -1;
        parsed.lastDilemmaRound = typeof parsed.lastDilemmaRound === 'number' ? parsed.lastDilemmaRound : -1;
        parsed.lastDilemmaId = parsed.lastDilemmaId || '';
        parsed.intlDoneRounds = Array.isArray(parsed.intlDoneRounds) ? parsed.intlDoneRounds : [];
        parsed.pendingIntl = parsed.pendingIntl || null;
        parsed.lastRenewalWinKey = parsed.lastRenewalWinKey || '';
        parsed.lastTransferWinKey = parsed.lastTransferWinKey || '';
        parsed.transferOffersWinKey = parsed.transferOffersWinKey || '';
        parsed.transferOffers = Array.isArray(parsed.transferOffers) ? parsed.transferOffers : [];
        parsed.ownedItems = Array.isArray(parsed.ownedItems) ? parsed.ownedItems : [];
        parsed.referrals = parsed.referrals || { verifiedCount: 0, totalEarned: 0 };
        parsed.online = parsed.online || { rating: 1000, wins: 0, draws: 0, losses: 0, lastDay: '', playedToday: 0, extraAdDay: '' };
        if (!parsed.tables) parsed.tables = buildAllTables();
        if (!parsed.schedules) parsed.schedules = buildAllSchedules();
        if (!parsed.player.intl) parsed.player.intl = { caps: 0, goals: 0, trophies: 0 };
        return parsed;
      } catch (e) {
        return null;
      }
    }

    /* =========================================================================
       8. TRANSFER & CONTRACT WINDOW RULES (STRICT!)
       ========================================================================= */
    function getWindowInfo() {
      const season = state ? state.season : 1;
      const nextTour = state ? (state.round + 1) : 1; // 1..19

      if (season <= 1) {
        return {
          open: false,
          key: '',
          name: 'Заблокировано в 1-м сезоне',
          countdown: 'Откроется в начале 2-го сезона (1-й тур)'
        };
      }
      if (nextTour >= 1 && nextTour <= 2) {
        return {
          open: true,
          key: 'S' + season + '_SUMMER',
          name: 'Летнее окно (туры 1–2)',
          countdown: 'Открыто сейчас!'
        };
      }
      if (nextTour >= 9 && nextTour <= 10) {
        return {
          open: true,
          key: 'S' + season + '_WINTER',
          name: 'Зимнее окно (туры 9–10)',
          countdown: 'Открыто сейчас!'
        };
      }
      if (nextTour < 9) {
        return {
          open: false,
          key: '',
          name: 'Окно закрыто',
          countdown: 'Откроется в середине сезона (9-й тур)'
        };
      }
      return {
        open: false,
        key: '',
        name: 'Окно закрыто',
        countdown: 'Откроется в начале ' + (season + 1) + '-го сезона'
      };
    }

    function ensureTransferOffersForWindow() {
      if (!state) return;
      const win = getWindowInfo();
      if (!win.open) return;
      if (state.transferOffersWinKey === win.key && state.transferOffers.length > 0) return;

      const p = state.player;
      const ovr = calcOvr(p.stats, p.pos);
      const allClubs = Object.values(CLUB_MAP).filter(c => c.id !== p.clubId);
      // Match clubs around player OVR (-4 to +9)
      let candidates = allClubs.filter(c => c.ovr >= ovr - 4 && c.ovr <= ovr + 9);
      if (candidates.length < 4) candidates = allClubs;
      // Shuffle & pick 4
      const shuffled = candidates.slice().sort(() => Math.random() - 0.5).slice(0, 4);

      state.transferOffers = shuffled.map(c => {
        const baseSal = Math.round((3600 + Math.max(0, ovr - 60) * 520 + Math.max(0, c.ovr - 64) * 280) * c.prestige / 100) * 100;
        const salary = Math.max(p.salary + 400, baseSal);
        const bonus = Math.round(salary * (2.2 + Math.random() * 1.4) / 100) * 100;
        return { clubId: c.id, salary, bonus };
      });
      state.transferOffersWinKey = win.key;
      saveState();
    }

    function renewContract() {
      const win = getWindowInfo();
      if (!win.open) return showToast(win.countdown, 'error');
      if (state.lastRenewalWinKey === win.key) return showToast('В этом окне контракт уже переподписан!', 'error');

      const p = state.player;
      const ovr = calcOvr(p.stats, p.pos);
      const club = getClub(p.clubId);
      const formFactor = p.seasonApps > 0 ? (p.seasonRatingSum / p.seasonApps) : 6.8;
      const raise = Math.max(600, Math.round((700 + Math.max(0, ovr - 60) * 160 + (formFactor - 6.5) * 450) * club.prestige / 100) * 100);
      const bonus = Math.round(raise * 1.5);

      p.salary += raise;
      p.money += bonus;
      p.coachTrust = clamp(p.coachTrust + 6, 5, 100);
      state.lastRenewalWinKey = win.key;
      saveState();
      haptic('success');
      showToast(`✍️ Контракт обновлён! +${fmtMoney(raise)} к ЗП и бонус ${fmtMoney(bonus)}`, 'gold');
      render();
    }

    function acceptTransfer(clubId) {
      const win = getWindowInfo();
      if (!win.open) return showToast(win.countdown, 'error');
      if (state.lastTransferWinKey === win.key) return showToast('Лимит: 1 трансфер за окно!', 'error');

      const off = state.transferOffers.find(o => o.clubId === clubId);
      if (!off) return;
      const newClub = getClub(clubId);
      const p = state.player;

      p.clubId = newClub.id;
      p.leagueId = newClub.leagueId;
      p.salary = off.salary;
      p.money += off.bonus;
      p.coachTrust = 58;
      p.fans += Math.round(2500 * newClub.prestige);
      state.lastTransferWinKey = win.key;
      leagueViewId = newClub.leagueId;
      saveState();
      haptic('success');
      showToast(`✈️ Трансфер в «${newClub.name}»! Подписной бонус +${fmtMoney(off.bonus)}`, 'gold');
      render();
    }

    function runRewardedAd(rewardLabel, onReward) {
      try {
        if (window.Adsgram && typeof window.Adsgram.init === 'function' && CONFIG.ADSGRAM_BLOCK_ID) {

        }

      // Clean 5-second demo fallback for browser preview
      let sec = 5;
      openModal(`
        <div class="center stack" style="gap:14px;">
          <div class="badge badge-gold" style="margin:0 auto;">🎬 ADSGRAM DEMO</div>
          <div style="font-size:16px;font-weight:900;">Просмотр спонсорского ролика</div>
          <div class="small muted">Награда: <b style="color:#34d399;">${escapeHtml(rewardLabel)}</b></div>
          <div id="ad-timer" style="font-size:36px;font-weight:900;color:#fbbf24;">5</div>
          <button id="ad-claim-btn" disabled class="btn btn-primary">Подождите 5 сек...</button>

      `);

        sec--;

          tEl.textContent = '✓';

          bEl.textContent = 'Забрать награду!';
          bEl.onclick = () => {
            closeModal();
            onReward();
          };
        }
      }, 1000);
    }

    function trainStat(statKey) {
      const p = state.player;
      if (state.trainLeft <= 0) return showToast('Лимит тренировок перед туром исчерпан!', 'error');
      if (p.energy < 18) return showToast('Слишком мало энергии (нужно 18% ⚡)!', 'error');
      const cur = p.stats[statKey];
      if (cur >= 99) return showToast('Характеристика уже на максимуме (99)!', 'gold');
      const fee = 500 + Math.max(0, cur - 60) * 65;
      if (p.money < fee) return showToast('Не хватает денег (' + fmtMoney(fee) + ')!', 'error');

      p.money -= fee;
      p.energy = clamp(p.energy - 18, 0, 100);
      p.stats[statKey] = clamp(cur + 1, 1, 99);
      p.coachTrust = clamp(p.coachTrust + 2, 0, 100);
      state.trainLeft--;
      saveState();
      haptic('medium');
      const meta = STAT_META.find(s => s.key === statKey);
      showToast(`💪 +1 ${meta ? meta.ru : statKey.toUpperCase()} (${p.stats[statKey]})!`, 'ok');
      render();
    }

    function restPlayer() {
      const p = state.player;
      if (state.trainLeft <= 0) return showToast('Вы уже использовали слоты подготовки перед туром!', 'error');
      p.energy = clamp(p.energy + 35, 0, 100);
      p.happiness = clamp(p.happiness + 4, 0, 100);
      state.trainLeft--;
      saveState();
      haptic('light');
      showToast('🛌 Отдых завершён: +35% ⚡ и +4% настроения!', 'ok');
      render();
    }

      if (state.adEnergyRound === state.round) return showToast('Уже использовано перед этим туром!', 'error');
      runRewardedAd('100% энергии ⚡', () => {
        state.player.energy = 100;
        state.adEnergyRound = state.round;
        saveState();
        haptic('success');
        showToast('⚡ Энергия полностью восстановлена (100%)!', 'gold');

    function watchAdSpecialTrain() {
      if (state.adTrainRound === state.round) return showToast('Спец-тренировка уже пройдена перед этим туром!', 'error');
      runRewardedAd('+1 ко всем ключевым статам (+1 OVR)', () => {
        const p = state.player;
        const pos = POSITIONS[p.pos] || POSITIONS.ST;
        // Boost top 2 weighted stats for position
        const topStats = Object.keys(pos.w).sort((a, b) => pos.w[b] - pos.w[a]).slice(0, 3);
        topStats.forEach(k => { p.stats[k] = clamp(p.stats[k] + 1, 1, 99); });
        state.adTrainRound = state.round;
        saveState();
        haptic('success');
        showToast('🔥 Спец-тренировка пройдена! Рейтинг OVR вырос!', 'gold');

    function buyLifestyleItem(itemId) {
      const item = LIFESTYLE_ITEMS.find(i => i.id === itemId);
      if (!item) return;
      if (state.ownedItems.includes(itemId)) return showToast('Уже куплено!', 'ok');
      if (state.player.money < item.cost) return showToast('Недостаточно средств!', 'error');

      state.player.money -= item.cost;
      state.player.happiness = clamp(state.player.happiness + item.happy, 0, 100);
      state.player.fans += item.fans;
      state.ownedItems.push(itemId);
      saveState();
      haptic('success');
      showToast(`${item.icon} Куплено: ${item.name}!`, 'gold');
      render();
    }

    function getPassiveEnergyRecovery() {
      return state.ownedItems.reduce((sum, id) => {
        const it = LIFESTYLE_ITEMS.find(i => i.id === id);
        return sum + (it ? it.rec : 0);
      }, 0);
    }

    /* =========================================================================
       11. 2D SVG PITCH INTERACTIVE MATCH ENGINE (LEAGUE & INTERNATIONAL)
       ========================================================================= */
    function getNextLeagueFixture() {
      const lgId = state.player.leagueId;
      const sched = state.schedules[lgId];
      if (!sched || state.round >= 18) return null;
      const pairs = sched[state.round];
      const pair = pairs.find(([h, a]) => h === state.player.clubId || a === state.player.clubId);
      if (!pair) return null;
      const isHome = pair[0] === state.player.clubId;
      return {
        isHome,
        home: getClub(pair[0]),
        away: getClub(pair[1]),
        opp: getClub(isHome ? pair[1] : pair[0])
      };
    }

    function simulateOtherMatchesInRound(roundIdx, skipClubId) {
      LEAGUES.forEach(lg => {
        const pairs = state.schedules[lg.id][roundIdx];
        const tbl = state.tables[lg.id];
        if (!pairs || !tbl) return;
        pairs.forEach(([hId, aId]) => {
          if (hId === skipClubId || aId === skipClubId) return;
          const hc = getClub(hId), ac = getClub(aId);
          const diff = (hc.ovr - ac.ovr) * 0.045 + 0.2;
          const hg = clamp(Math.round(Math.max(0, 1.15 + diff + (Math.random() - 0.5) * 2.2)), 0, 5);
          const ag = clamp(Math.round(Math.max(0, 1.0 - diff + (Math.random() - 0.5) * 2.2)), 0, 5);
          recordTableResult(tbl, hId, aId, hg, ag);
        });
      });
    }

    function recordTableResult(tbl, hId, aId, hg, ag) {
      const hr = tbl.find(r => r.clubId === hId);
      const ar = tbl.find(r => r.clubId === aId);
      if (!hr || !ar) return;
      hr.p++; ar.p++;
      hr.gf += hg; hr.ga += ag;
      ar.gf += ag; ar.ga += hg;
      if (hg > ag) { hr.w++; hr.pts += 3; ar.l++; }
      else if (hg < ag) { ar.w++; ar.pts += 3; hr.l++; }
      else { hr.d++; ar.d++; hr.pts++; ar.pts++; }
    }

    function startLeagueMatch() {
      if (state.round >= 18) return openSeasonEndModal();
      const fix = getNextLeagueFixture();
      if (!fix) return;

      const p = state.player;
      const sq = getSquadStatus(p.energy);

      // CASE: RESERVES (Energy < 25%) — Left out of matchday squad!
      if (sq.key === 'reserves') {
        const myClub = getClub(p.clubId);
        const oppClub = fix.opp;
        const diff = (myClub.ovr - oppClub.ovr) * 0.04 + (fix.isHome ? 0.2 : -0.1);
        const ms = clamp(Math.round(Math.max(0, 1.0 + diff + (Math.random() - 0.5) * 2.1)), 0, 4);
        const os = clamp(Math.round(Math.max(0, 1.1 - diff + (Math.random() - 0.5) * 2.1)), 0, 4);
        const hg = fix.isHome ? ms : os;
        const ag = fix.isHome ? os : ms;

        recordTableResult(state.tables[p.leagueId], fix.home.id, fix.away.id, hg, ag);
        simulateOtherMatchesInRound(state.round, p.clubId);

        state.round++;
        state.trainLeft = 2;
        const pay = Math.round(p.salary * 0.5);
        p.money += pay;
        p.energy = clamp(p.energy + 18 + getPassiveEnergyRecovery(), 0, 100);
        p.coachTrust = clamp(p.coachTrust - 5, 5, 100);

        lastMatchCtx = {
          won: ms > os, draw: ms === os, score: `${ms}:${os}`,
          pg: 0, pa: 0, squad: 'reserves', club: myClub.name, opp: oppClub.name
        };
        checkWindowOpeningToast();
        saveState();
        haptic('warning');

        openModal(`
          <div class="center stack" style="gap:12px;">
            <div class="badge badge-rose" style="margin:0 auto;">🔴 ВНЕ ЗАЯВКИ (РЕЗЕРВ)</div>
            <div style="font-size:18px;font-weight:900;">Ты смотрел матч с трибуны</div>
            <div class="small muted">Энергия была ниже 25%, и тренер оставил тебя в резерве.</div>
            <div class="card" style="padding:12px;">
              <div class="row" style="justify-content:center;gap:14px;">
                <div class="center">${renderClubBadge(fix.home, 34)}<div class="xs bold" style="margin-top:4px;">${escapeHtml(fix.home.short)}</div></div>
                <div style="font-size:26px;font-weight:900;">${hg} : ${ag}</div>
                <div class="center">${renderClubBadge(fix.away, 34)}<div class="xs bold" style="margin-top:4px;">${escapeHtml(fix.away.short)}</div></div>
              </div>
            </div>
            <div class="grid-3">
              <div class="card center" style="padding:8px;"><div class="xs muted">50% ЗП</div><div class="bold" style="color:#34d399;">+${fmtMoney(pay)}</div></div>
              <div class="card center" style="padding:8px;"><div class="xs muted">Доверие</div><div class="bold" style="color:#fb7185;">-5%</div></div>
              <div class="card center" style="padding:8px;"><div class="xs muted">Энергия</div><div class="bold" style="color:#38bdf8;">+18% ⚡</div></div>
            </div>
            <button onclick="afterLeagueMatchModal()" class="btn btn-primary">Продолжить →</button>
          </div>
        `);
        render();
        return;
      }

      // CASE: STARTER (3 moments) OR BENCH (1 moment at 68')
      const myClub = getClub(p.clubId);
      const moments = sq.key === 'starter' ? [22, 54, 81] : [76];
      liveMatch = {
        mode: 'league',
        isHome: fix.isHome,
        home: fix.home,
        away: fix.away,
        myClub,
        oppClub: fix.opp,
        squad: sq.key,
        minute: sq.key === 'starter' ? 1 : 68,
        ms: 0,
        os: 0,
        pg: 0,
        pa: 0,
        rating: sq.key === 'starter' ? 6.5 : 6.2,
        moments,
        momentIdx: 0,
        awaitingChoice: false,
        ballX: 160,
        ballY: 90,
        pulseColor: '#34d399',
        log: [
          sq.key === 'starter'
            ? { t: '1\' Стартовый свисток! Ты в основном составе.', cls: '' }
            : { t: '68\' Выход на замену со скамейки запасных!', cls: '' }
        ]
      };

      // If bench, pre-simulate score up to 68'
      if (sq.key === 'bench') {
        const preDiff = (myClub.ovr - fix.opp.ovr) * 0.03;
        if (Math.random() < 0.35 + preDiff) liveMatch.ms++;
        if (Math.random() < 0.38 - preDiff) liveMatch.os++;
        liveMatch.log.unshift({ t: `К 68-й минуте счёт ${liveMatch.ms}:${liveMatch.os}.`, cls: '' });
      }

      activeTab = 'match';
      render();
      advanceLiveMatch();
    }

    function startInternationalMatch() {
      const intl = state.pendingIntl;
      if (!intl) return;
      const myNat = getCountry(state.player.countryId);
      const oppNat = getCountry(intl.oppId);
      const myBadge = { id: 'nat_' + myNat.id, name: myNat.name, short: myNat.id, ovr: myNat.ovr, color1: myNat.c1, color2: myNat.c2 };
      const oppBadge = { id: 'nat_' + oppNat.id, name: oppNat.name, short: oppNat.id, ovr: oppNat.ovr, color1: oppNat.c1, color2: oppNat.c2 };

      liveMatch = {
        mode: 'intl',
        stage: intl.stage,
        isHome: true,
        home: myBadge,
        away: oppBadge,
        myClub: myBadge,
        oppClub: oppBadge,
        squad: 'starter',
        minute: 1,
        ms: 0,
        os: 0,
        pg: 0,
        pa: 0,
        rating: 6.6,
        moments: [25, 58, 84],
        momentIdx: 0,
        awaitingChoice: false,
        ballX: 160,
        ballY: 90,
        pulseColor: '#fbbf24',
        log: [{ t: `1' ${intl.stage}: ${myNat.flag} ${myNat.name} против ${oppNat.flag} ${oppNat.name}!`, cls: '' }]
      };

      closeModal();
      activeTab = 'match';
      render();
      advanceLiveMatch();
    }

    function advanceLiveMatch() {
      if (!liveMatch) return;
      const lm = liveMatch;

      if (lm.momentIdx < lm.moments.length) {
        const targetMin = lm.moments[lm.momentIdx];
        // Random background goal chance between moments
        const diff = (lm.myClub.ovr - lm.oppClub.ovr) * 0.015;
        if (Math.random() < 0.16 + diff) {
          lm.ms++;
          lm.log.unshift({ t: `${Math.max(lm.minute, targetMin - 8)}' ⚽ Партнёр по команде открыл момент и забил!`, cls: 'goal' });
        } else if (Math.random() < 0.17 - diff) {
          lm.os++;
          lm.log.unshift({ t: `${Math.max(lm.minute, targetMin - 5)}' ❌ Соперник реализовал контратаку.`, cls: 'opp' });
        }
        lm.minute = targetMin;
        lm.ballX = 215 + Math.floor(Math.random() * 55);
        lm.ballY = 38 + Math.floor(Math.random() * 104);
        lm.pulseColor = '#fbbf24';
        lm.awaitingChoice = true;
        lm.currentPrompt = buildMomentPrompt(lm.minute);
        render();
        return;
      }

      // Finish match at 90'
      lm.minute = 90;
      lm.ballX = 160;
      lm.ballY = 90;
      lm.awaitingChoice = false;
      finishLiveMatch();
    }

    function buildMomentPrompt(min) {
      const p = state.player;
      const isDef = p.pos === 'CB' || p.pos === 'GK' || p.pos === 'CDM';
      if (isDef && Math.random() < 0.5) {
        return {
          title: `${min}' Опасная атака соперника!`,
          options: [
            { label: '🛡️ Жёсткий перехват', stat: 'def', kind: 'def', desc: `ЗАЩ ${p.stats.def}` },
            { label: '⚡ Начать контратаку пасом', stat: 'pas', kind: 'pass', desc: `ПАС ${p.stats.pas}` },
            { label: '🔒 Сыграть надёжно позиционно', stat: 'phy', kind: 'safe', desc: `ФИЗ ${p.stats.phy}` }
          ]
        };
      }
      return {
        title: `${min}' Ключевой момент у штрафной!`,
        options: [
          { label: '🎯 Пробить в девятку', stat: 'sho', kind: 'shoot', desc: `УДР ${p.stats.sho}` },
          { label: '👟 Отдать пас вразрез', stat: 'pas', kind: 'pass', desc: `ПАС ${p.stats.pas}` },
          { label: '🌪️ Пойти в дриблинг', stat: 'dri', kind: 'drib', desc: `ДРБ ${p.stats.dri}` },
          { label: '🤝 Сыграть надёжно', stat: 'pac', kind: 'safe', desc: 'Стабильно' }
        ]
      };
    }

    function pickMatchAction(idx) {
      if (!liveMatch || !liveMatch.awaitingChoice) return;
      const lm = liveMatch;
      const opt = lm.currentPrompt.options[idx];
      if (!opt) return;

      const p = state.player;
      const statVal = p.stats[opt.stat] || 60;
      const oppFactor = (lm.oppClub.ovr - 65) * 0.008;
      const chance = clamp(0.36 + (statVal - 55) * 0.014 - oppFactor, 0.22, 0.86);
      const roll = Math.random();

      if (opt.kind === 'shoot') {
        if (roll < chance) {
          lm.ms++; lm.pg++; lm.rating = clamp(lm.rating + 1.1, 5, 10);
          lm.ballX = 304; lm.ballY = 90; lm.pulseColor = '#34d399';
          lm.log.unshift({ t: `${lm.minute}' ⚽ ГОООЛ! Ты неотразимо пробил в угол!`, cls: 'goal' });
          haptic('success');
        } else {
          lm.rating = clamp(lm.rating - 0.2, 5, 10);
          lm.ballX = 290; lm.ballY = 42; lm.pulseColor = '#f43f5e';
          lm.log.unshift({ t: `${lm.minute}' Вратарь в прыжке потащил твой удар.`, cls: '' });
          haptic('light');
        }
      } else if (opt.kind === 'pass') {
        if (roll < chance + 0.06) {
          lm.ms++; lm.pa++; lm.rating = clamp(lm.rating + 0.85, 5, 10);
          lm.ballX = 300; lm.ballY = 94; lm.pulseColor = '#34d399';
          lm.log.unshift({ t: `${lm.minute}' 👟 АССИСТ! Твой разрезающий пас стал голевым!`, cls: 'goal' });
          haptic('success');
        } else {
          lm.ballX = 225; lm.ballY = 120; lm.pulseColor = '#38bdf8';
          lm.log.unshift({ t: `${lm.minute}' Защитник успел перехватить передачу.`, cls: '' });
          haptic('light');
        }
      } else if (opt.kind === 'drib') {
        if (roll < chance - 0.04) {
          lm.ms++; lm.pg++; lm.rating = clamp(lm.rating + 1.25, 5, 10);
          lm.ballX = 302; lm.ballY = 86; lm.pulseColor = '#fbbf24';
          lm.log.unshift({ t: `${lm.minute}' 🔥 ШЕДЕВР! Прошёл двоих на дриблинге и забил!`, cls: 'goal' });
          haptic('success');
        } else {
          lm.rating = clamp(lm.rating - 0.35, 5, 10);
          lm.ballX = 180; lm.ballY = 135; lm.pulseColor = '#f43f5e';
          lm.log.unshift({ t: `${lm.minute}' Соперник чисто выбил мяч в подкате.`, cls: '' });
          haptic('warning');
        }
      } else if (opt.kind === 'def') {
        if (roll < chance + 0.08) {
          lm.rating = clamp(lm.rating + 0.8, 5, 10);
          lm.ballX = 75; lm.ballY = 90; lm.pulseColor = '#34d399';
          lm.log.unshift({ t: `${lm.minute}' 🛡️ Блестящий отбор! Спас команду от гола.`, cls: 'goal' });
          haptic('success');
        } else {
          lm.os++; lm.rating = clamp(lm.rating - 0.5, 5, 10);
          lm.ballX = 18; lm.ballY = 90; lm.pulseColor = '#f43f5e';
          lm.log.unshift({ t: `${lm.minute}' ❌ Соперник ушёл от опеки и забил.`, cls: 'opp' });
          haptic('error');
        }
      } else {
        // Safe play
        lm.rating = clamp(lm.rating + 0.25, 5, 10);
        lm.ballX = 165; lm.ballY = 90; lm.pulseColor = '#38bdf8';
        lm.log.unshift({ t: `${lm.minute}' Уверенный контроль мяча без риска.`, cls: '' });
        haptic('light');
      }

      lm.awaitingChoice = false;
      lm.momentIdx++;
      render();
      setTimeout(() => advanceLiveMatch(), 420);
    }

    function finishLiveMatch() {
      const lm = liveMatch;
      const p = state.player;
      const won = lm.ms > lm.os;
      const draw = lm.ms === lm.os;
      const finalRating = Number(clamp(lm.rating + (won ? 0.3 : draw ? 0 : -0.25), 5.0, 10.0).toFixed(1));

      if (lm.mode === 'intl') {
        p.intl.caps++;
        p.intl.goals += lm.pg;
        const wonCup = won && lm.stage === 'Финал Кубка Сборных';
        if (wonCup) p.intl.trophies++;
        const bonus = won ? 6000 : draw ? 3000 : 1500;
        const fansAdd = Math.round(1800 + lm.pg * 2200 + (wonCup ? 8000 : 0));
        p.money += bonus;
        p.fans += fansAdd;
        p.energy = clamp(p.energy - 16, 0, 100);
        state.pendingIntl = null;
        liveMatch = null;
        saveState();

        openModal(`
          <div class="center stack" style="gap:12px;">
            <div class="badge badge-gold" style="margin:0 auto;">🌍 ${escapeHtml(lm.stage)}</div>
            <div style="font-size:20px;font-weight:900;">${won ? 'ПОБЕДА СБОРНОЙ!' : draw ? 'БОЕВАЯ НИЧЬЯ' : 'ПОРАЖЕНИЕ СБОРНОЙ'}</div>
            <div class="card" style="padding:12px;">
              <div class="row" style="justify-content:center;gap:16px;">
                <div>${renderClubBadge(lm.home, 38)}<div class="xs bold" style="margin-top:4px;">${escapeHtml(lm.home.name)}</div></div>
                <div style="font-size:28px;font-weight:900;">${lm.ms} : ${lm.os}</div>
                <div>${renderClubBadge(lm.away, 38)}<div class="xs bold" style="margin-top:4px;">${escapeHtml(lm.away.name)}</div></div>
              </div>
            </div>
            <div class="grid-3">
              <div class="card center" style="padding:8px;"><div class="xs muted">Оценка</div><div class="bold" style="color:#fbbf24;">${finalRating}</div></div>
              <div class="card center" style="padding:8px;"><div class="xs muted">Гол / Пас</div><div class="bold">${lm.pg} / ${lm.pa}</div></div>
              <div class="card center" style="padding:8px;"><div class="xs muted">Премия</div><div class="bold" style="color:#34d399;">+${fmtMoney(bonus)}</div></div>
            </div>
            ${wonCup ? '<div class="badge badge-gold" style="margin:0 auto;">🏆 КУБОК СБОРНЫХ ЗАВОЁВАН!</div>' : ''}
            <button onclick="afterIntlMatchModal()" class="btn btn-primary">Вернуться в клуб →</button>
          </div>
        `);
        render();
        return;
      }

      // LEAGUE MATCH FINISH
      const hg = lm.isHome ? lm.ms : lm.os;
      const ag = lm.isHome ? lm.os : lm.ms;
      recordTableResult(state.tables[p.leagueId], lm.home.id, lm.away.id, hg, ag);
      simulateOtherMatchesInRound(state.round, p.clubId);

      const energyCost = lm.squad === 'starter' ? 24 : 11;
      const passiveRec = getPassiveEnergyRecovery();
      const pay = p.salary + (lm.pg * 500) + (lm.pa * 300) + (won ? 400 : 0);
      const fansAdd = Math.round((450 + lm.pg * 1400 + lm.pa * 700 + (won ? 600 : 100)) * lm.myClub.prestige);
      const trustDelta = finalRating >= 7.5 ? 5 : finalRating >= 6.5 ? 2 : -4;

      p.money += pay;
      p.fans += fansAdd;
      p.energy = clamp(p.energy - energyCost + passiveRec, 0, 100);
      p.coachTrust = clamp(p.coachTrust + trustDelta, 5, 100);
      p.happiness = clamp(p.happiness + (won ? 4 : draw ? 0 : -3), 10, 100);

      p.seasonApps++; p.careerApps++;
      p.seasonGoals += lm.pg; p.careerGoals += lm.pg;
      p.seasonAssists += lm.pa; p.careerAssists += lm.pa;
      p.seasonRatingSum += finalRating;

      state.round++;
      state.trainLeft = 2;

      lastMatchCtx = {
        won, draw, score: `${lm.ms}:${lm.os}`,
        pg: lm.pg, pa: lm.pa, squad: lm.squad,
        club: lm.myClub.name, opp: lm.oppClub.name
      };

      liveMatch = null;
      checkWindowOpeningToast();
      saveState();

      openModal(`
        <div class="center stack" style="gap:12px;">
          <div class="badge ${won ? 'badge-green' : draw ? 'badge-gold' : 'badge-rose'}" style="margin:0 auto;">
            ${won ? '🏆 ПОБЕДА • ТУР ' + state.round : draw ? '🤝 НИЧЬЯ • ТУР ' + state.round : '❌ ПОРАЖЕНИЕ • ТУР ' + state.round}
          </div>
          <div class="card" style="padding:12px;">
            <div class="row" style="justify-content:center;gap:14px;">
              <div class="center">${renderClubBadge(lm.home, 36)}<div class="xs bold" style="margin-top:4px;">${escapeHtml(lm.home.short)}</div></div>
              <div style="font-size:28px;font-weight:900;">${hg} : ${ag}</div>
              <div class="center">${renderClubBadge(lm.away, 36)}<div class="xs bold" style="margin-top:4px;">${escapeHtml(lm.away.short)}</div></div>
            </div>
          </div>
          <div class="grid-3">
            <div class="card center" style="padding:8px;"><div class="xs muted">Оценка</div><div class="bold" style="color:#fbbf24;font-size:16px;">${finalRating}</div></div>
            <div class="card center" style="padding:8px;"><div class="xs muted">Гол / Пас</div><div class="bold" style="font-size:16px;">${lm.pg} / ${lm.pa}</div></div>
            <div class="card center" style="padding:8px;"><div class="xs muted">Зарплата</div><div class="bold" style="color:#34d399;">+${fmtMoney(pay)}</div></div>
          </div>
          <div class="row small muted" style="justify-content:center;gap:12px;">
            <span>👥 +${fmtNum(fansAdd)} фанатов</span>
            <span>⚡ -${energyCost}%${passiveRec ? ' (+' + passiveRec + '% дом)' : ''}</span>
          </div>
          <button onclick="afterLeagueMatchModal()" class="btn btn-primary">Продолжить →</button>
        </div>
      `);
      render();
    }

    function checkWindowOpeningToast() {
      if (state.season >= 2 && state.round === 8) {
        ensureTransferOffersForWindow();
        showToast('🟢 Открылось Зимнее трансферное и контрактное окно (туры 9–10)!', 'gold');
      }
    }

    /* =========================================================================
       12. POST-MATCH CHAIN: INTERVIEWS (EVERY 3RD), DILEMMAS, INTL, SEASON END
       ========================================================================= */
    function afterLeagueMatchModal() {
      closeModal();

      // 1) Every 3rd match -> Post-Match Flash Interview
      if (state.round > 0 && state.round % 3 === 0 && state.lastInterviewRound !== state.round && lastMatchCtx) {
        openFlashInterview();
        return;
      }

      // 2) Non-interview rounds -> ~40% chance for Career/Life Dilemma
      if (state.round > 0 && state.round % 3 !== 0 && state.lastDilemmaRound !== state.round && Math.random() < 0.40) {
        openCareerDilemma();
        return;
      }

      afterInterviewOrDilemma();
    }

    function afterInterviewOrDilemma() {
      // 3) Check National Team Call-up at rounds 6, 12, 18
      if ([6, 12, 18].includes(state.round) && !state.intlDoneRounds.includes(state.round)) {
        state.intlDoneRounds.push(state.round);
        const p = state.player;
        const nat = getCountry(p.countryId);
        const ovr = calcOvr(p.stats, p.pos);
        const avgRat = p.seasonApps > 0 ? (p.seasonRatingSum / p.seasonApps) : 6.5;

        if (ovr >= nat.callUpOvr || avgRat >= 7.4) {
          const opps = COUNTRIES.filter(c => c.id !== nat.id);
          const opp = opps[Math.floor(Math.random() * opps.length)];
          const stage = state.round === 6 ? 'Товарищеский матч' : state.round === 12 ? 'Отбор на турнир' : 'Финал Кубка Сборных';
          state.pendingIntl = { oppId: opp.id, stage };
          saveState();
          openModal(`
            <div class="center stack" style="gap:12px;">
              <div class="badge badge-gold" style="margin:0 auto;">🌍 ВЫЗОВ В СБОРНУЮ!</div>
              <div style="font-size:36px;">${nat.flag}</div>
              <div style="font-size:18px;font-weight:900;">Сборная ${nat.name} вызывает тебя!</div>
              <div class="small muted">${stage} против ${opp.flag} <b>${opp.name}</b> (OVR ${opp.ovr}).</div>
              <button onclick="startInternationalMatch()" class="btn btn-gold">⚽ Сыграть за сборную</button>
              <button onclick="skipInternationalMatch()" class="btn btn-sec">Отказаться (остаться в клубе)</button>
            </div>
          `);
          render();
          return;
        }
        saveState();
      }

      // 4) Season End after round 18
      if (state.round >= 18) {
        openSeasonEndModal();
        return;
      }

      render();
    }

    function skipInternationalMatch() {
      state.pendingIntl = null;
      saveState();
      closeModal();
      if (state.round >= 18) openSeasonEndModal();
      else render();
    }

    function afterIntlMatchModal() {
      closeModal();
      if (state.round >= 18) openSeasonEndModal();
      else render();
    }

    function applyDeltas(ef) {
      const p = state.player;
      if (ef.money)  p.money = Math.max(0, p.money + ef.money);
      if (ef.energy) p.energy = clamp(p.energy + ef.energy, 5, 100);
      if (ef.happy)  p.happiness = clamp(p.happiness + ef.happy, 10, 100);
      if (ef.trust)  p.coachTrust = clamp(p.coachTrust + ef.trust, 5, 100);
      if (ef.fans)   p.fans = Math.max(0, p.fans + ef.fans);
      if (ef.stat) {
        Object.keys(ef.stat).forEach(k => {
          if (typeof p.stats[k] === 'number') p.stats[k] = clamp(p.stats[k] + ef.stat[k], 1, 99);
        });
      }
    }

    function renderDeltaChips(ef) {
      const arr = [];
      if (ef.money)  arr.push(`<span class="badge ${ef.money > 0 ? 'badge-green' : 'badge-rose'}">${ef.money > 0 ? '+' : ''}${fmtMoney(ef.money)}</span>`);
      if (ef.trust)  arr.push(`<span class="badge ${ef.trust > 0 ? 'badge-sky' : 'badge-rose'}">${ef.trust > 0 ? '+' : ''}${ef.trust}% Доверие</span>`);

    async function registerIncomingReferralIfAny() {
      try {
        let startParam = '';
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
          startParam = String(tg.initDataUnsafe.start_param);
        } else {
          const sp = new URLSearchParams(window.location.search);

        const referrerId = startParam.slice(4).trim();

        await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/referrals`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Prefer': 'resolution=ignore-duplicates,return=minimal' }),
          body: JSON.stringify({
            referred_tg_id: tgUser.id,
            referrer_tg_id: referrerId,
            referred_name: tgUser.firstName || 'Игрок',
            claimed: false
          })
        });
      } catch (e) {}
    }

    async function checkAndClaimReferrals() {
      const btn = document.getElementById('ref-check-btn');
      if (btn) { btn.disabled = true; btn.textContent = '⏳ Проверка базы Supabase...'; }
      try {
        const res = await fetch(
          `${CONFIG.SUPABASE_URL}/rest/v1/referrals?referrer_tg_id=eq.${encodeURIComponent(tgUser.id)}&claimed=eq.false&select=referred_tg_id,referred_name`,
          { method: 'GET', headers: getSupabaseHeaders() }
        );
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const rows = await res.json();

        if (!Array.isArray(rows) || rows.length === 0) {
          showToast('Новых подтверждённых друзей пока нет. Попроси друга открыть бота по твоей ссылке!', 'ok');
          render();
          return;
        }

        // Mark as claimed in Supabase
        const patch = await fetch(
          `${CONFIG.SUPABASE_URL}/rest/v1/referrals?referrer_tg_id=eq.${encodeURIComponent(tgUser.id)}&claimed=eq.false`,
          {
            method: 'PATCH',
            headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
            body: JSON.stringify({ claimed: true })
          }
        );
        if (!patch.ok) throw new Error('PATCH HTTP ' + patch.status);

        const reward = rows.length * CONFIG.REFERRAL_REWARD;
        state.player.money += reward;
        state.referrals.verifiedCount += rows.length;
        state.referrals.totalEarned += reward;
        saveState();
        haptic('success');
        showToast(`🎉 Подтверждено друзей: ${rows.length}! Начислено +${fmtMoney(reward)}`, 'gold');
        render();
      } catch (err) {
        showToast('Ошибка проверки рефералов: ' + err.message, 'error');
        render();
      }
    }

    /* =========================================================================
       14. ONLINE MODE ("PRO LEAGUE LIVE" + SUPABASE `players`)
       ========================================================================= */
    async function syncOnlineProfile(silent) {
      if (!state) return;
      onlineState.status = 'syncing';
      if (!silent) render();

      const p = state.player;
      const club = getClub(p.clubId);
      const ovr = calcOvr(p.stats, p.pos);
      const payload = {
        tg_id: tgUser.id,
        name: p.name,
        club: club.name,
        position: p.pos,
        ovr: ovr,
        tactic: onlineState.myTactic,
        rating: state.online.rating,
        wins: state.online.wins,
        draws: state.online.draws,
        losses: state.online.losses,
        updated_at: new Date().toISOString()
      };

      try {
        const upRes = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/players?on_conflict=tg_id`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
          body: JSON.stringify(payload)
        });
        if (!upRes.ok) {
          const txt = await upRes.text();
          throw new Error(`HTTP ${upRes.status}: ${txt.slice(0, 90)}`);
        }

        const lbRes = await fetch(
          `${CONFIG.SUPABASE_URL}/rest/v1/players?select=tg_id,name,club,position,ovr,tactic,rating,wins,draws,losses&order=rating.desc&limit=50`,
          { method: 'GET', headers: getSupabaseHeaders() }
        );
        if (!lbRes.ok) {
          const txt = await lbRes.text();
          throw new Error(`HTTP ${lbRes.status}: ${txt.slice(0, 90)}`);
        }
        const rows = await lbRes.json();
        onlineState.leaderboard = Array.isArray(rows) ? rows : [];
        onlineState.status = 'ok';
        onlineState.errorText = '';
        onlineState.lastSyncedAt = Date.now();
        pickOnlineOpponent();
        if (!silent) render();
      } catch (err) {
        onlineState.status = 'err';
        onlineState.errorText = err.message || 'Нет связи';
        pickOnlineOpponent();
        if (!silent) render();
      }
    }

    function getMidnightCountdown() {
      const now = new Date();
      const mid = new Date(now);
      mid.setHours(24, 0, 0, 0);
      const sec = Math.max(0, Math.floor((mid - now) / 1000));
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      return `${h}ч ${m}м`;
    }

    function tacticLabel(t) {
      if (t === 'press') return '🔥 Прессинг';
      if (t === 'counter') return '⚡ Контратаки';
      return '🎯 Тики-така';
    }

    function playOnlinePvP() {
      const daily = getOnlineDailyInfo();
      if (!daily.canPlay) return showToast('Лимит PvP на сегодня исчерпан! Новый тур в 00:00.', 'error');
      if (!onlineState.selectedOpp) pickOnlineOpponent();
      const opp = onlineState.selectedOpp;
      const myOvr = calcOvr(state.player.stats, state.player.pos);

      // Rock-paper-scissors: press > tiki > counter > press (±12%)
      let tacMult = 1.0;
      let tacText = 'Равная тактическая борьба';
      const mt = onlineState.myTactic;
      const ot = opp.tactic || 'press';
      if ((mt === 'press' && ot === 'tiki') || (mt === 'tiki' && ot === 'counter') || (mt === 'counter' && ot === 'press')) {
        tacMult = 1.12;
        tacText = '✅ Твоя тактика переиграла соперника (+12%)!';
      } else if (mt !== ot) {
        tacMult = 0.88;
        tacText = '⚠️ Соперник поймал тебя контр-тактикой (-12%)';
      }

      const myPow = myOvr * tacMult + (Math.random() * 10 - 5);
      const oppPow = (opp.ovr || 68) + (Math.random() * 10 - 5);
      let ms = clamp(Math.round(1.2 + (myPow - oppPow) * 0.08 + Math.random() * 1.4), 0, 5);
      let os = clamp(Math.round(1.2 + (oppPow - myPow) * 0.08 + Math.random() * 1.4), 0, 5);
      if (myPow > oppPow + 2 && ms <= os) ms = os + 1;
      if (oppPow > myPow + 2 && os <= ms) os = ms + 1;

      const won = ms > os, draw = ms === os;
      const eloDelta = won ? 24 : draw ? 4 : -16;
      const prize = won ? 4500 : draw ? 2000 : 800;

      state.online.rating = Math.max(600, state.online.rating + eloDelta);
      if (won) state.online.wins++; else if (draw) state.online.draws++; else state.online.losses++;
      state.online.playedToday++;
      state.player.money += prize;
      saveState();
      haptic(won ? 'success' : 'medium');

      openModal(`
        <div class="center stack" style="gap:12px;">
          <div class="badge ${won ? 'badge-green' : draw ? 'badge-gold' : 'badge-rose'}" style="margin:0 auto;">
            ${won ? '🏆 ПОБЕДА В PRO LEAGUE LIVE' : draw ? '🤝 НИЧЬЯ В PvP' : '❌ ПОРАЖЕНИЕ В PvP'}
          </div>
          <div style="font-size:28px;font-weight:900;">${ms} : ${os}</div>
          <div class="small muted">Против <b>${escapeHtml(opp.name)}</b> (OVR ${opp.ovr} • ${tacticLabel(ot)})</div>
          <div class="card small" style="padding:10px;">${tacText}</div>
          <div class="grid-2">
            <div class="card center" style="padding:8px;"><div class="xs muted">Рейтинг ELO</div><div class="bold" style="color:${eloDelta >= 0 ? '#34d399' : '#fb7185'};">${eloDelta >= 0 ? '+' : ''}${eloDelta} (${state.online.rating})</div></div>
            <div class="card center" style="padding:8px;"><div class="xs muted">Призовые</div><div class="bold" style="color:#fbbf24;">+${fmtMoney(prize)}</div></div>
          </div>
          <button onclick="closeModal(); syncOnlineProfile(false);" class="btn btn-primary">Обновить таблицу мира →</button>
        </div>
      `);
      syncOnlineProfile(true);
    }
