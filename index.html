        if (!hf) return;
        if (type === 'success' || type === 'error' || type === 'warning') hf.notificationOccurred(type);
        else hf.impactOccurred(type);
      } catch (_) {}
    }

      const box = document.getElementById('toast-box');
      if (!box) return;

        error: 'bg-rose-950/95 border-rose-500/60 text-rose-200',
        gold: 'bg-amber-950/95 border-amber-400/70 text-amber-200',
        info: 'bg-slate-900/95 border-slate-600/60 text-slate-100'
      }[type] || 'bg-slate-900/95 border-slate-600/60 text-slate-100';
      const el = document.createElement('div');
      el.className = `px-4 py-2 rounded-xl border text-xs font-semibold shadow-xl text-center anim ${cls}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.25s'; setTimeout(() => el.remove(), 260); }, 2300);
    }

    function copySafe(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (_) { return false; }

      let bestH = SHOP_ITEMS.find(i => i.id === 'h1'), bestC = null;

          if (e.injRed) injRed += e.injRed;
        } else if (it.cat === 'housing' && it.lvl > bestH.lvl) bestH = it;
        else if (it.cat === 'cars' && (!bestC || it.lvl > bestC.lvl)) bestC = it;
        else if (it.cat === 'staff') {
          if (e.energy) energy += e.energy;
          if (e.injRed) injRed += e.injRed;
          if (e.happyFloor) happyFloor = Math.max(happyFloor, e.happyFloor);
          if (e.happy) staffHappy += e.happy;
          if (e.train) train += e.train;
          if (e.media) media += e.media;
        }
      });
      return {
        stat, train, energy: energy + (bestH.ef.energy || 0),
        injRed: Math.min(0.75, injRed), happyFloor,
        lifestyleHappy: (bestH.ef.happy || 0) + (bestC ? bestC.ef.happy : 0) + staffHappy,

    }

    /* ================= SCHEDULE & MIGRATION ================= */
    function genSchedule(clubs) {
      const ids = clubs.map(c => c.id), n = ids.length, half = n / 2, rounds = [], arr = [...ids];
      for (let r = 0; r < n - 1; r++) {
        const ms = [];
        for (let i = 0; i < half; i++) {
          const h = r % 2 === 0 ? arr[i] : arr[n - 1 - i];
          const a = r % 2 === 0 ? arr[n - 1 - i] : arr[i];
          ms.push({ home: h, away: a });
        }
        rounds.push(ms);
        arr.splice(1, 0, arr.pop());
      }
      return [...rounds, ...rounds.map(r => r.map(m => ({ home: m.away, away: m.home })))];
    }

    function initSeasonData() {
      const tables = {}, schedules = {}, scorers = {};
      LEAGUES.forEach(l => {
        tables[l.id] = l.clubs.map(c => ({ clubId: c.id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }));
        schedules[l.id] = genSchedule(l.clubs);
        scorers[l.id] = (AI_STARS[l.id] || []).map(s => ({ ...s, goals: 0 }));
      });
      return { tables, schedules, scorers };
    }

    function sortTable(rows) {
      return [...rows].sort((a, b) => (b.pts - a.pts) || ((b.gf - b.ga) - (a.gf - a.ga)) || (b.gf - a.gf));
    }

      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;
        state = JSON.parse(raw);
        if (state && state.player) {
          ensureStateIntegrity();
          selectedTableLeague = state.player.leagueId;
          return true;
        }
      } catch (_) {
        try { localStorage.removeItem(SAVE_KEY); } catch (__) {}
      }
      state = null;
      return false;
    }

    function createCareer() {
      const l = getLeague(creationDraft.leagueId);
      const startClub = [...l.clubs].sort((a, b) => a.ovr - b.ovr)[0];
      const pos = POSITIONS[creationDraft.pos] || POSITIONS.ST;
      state = {
        season: 1, round: 0, weekSlots: 3, adTrainUsed: false, offers: [], awardsDone: false,
        ucl: { active: false, stage: null, oppId: null, finished: false, won: false },
        ...initSeasonData(),
        referrals: { count: 0, earned: 0, lastAt: 0, claims: 0 },
        online: { rating: 1000, wins: 0, draws: 0, losses: 0, defTac: 'press', atkTac: 'press', lastDate: '', playedToday: 0, adExtraDate: '' },
        player: {
          name: (creationDraft.name || tgUser.firstName || 'Артём Волков').trim(),
          pos: pos.code, age: 17, leagueId: l.id, clubId: startClub.id,
          salary: 14000, money: 25000, stats: { ...pos.base },
          energy: 100, happiness: 75, trust: 48, fans: 1500, injury: 0,
          agentId: 0, ownedItems: ['h1'], sponsorId: null,
          sStats: { m: 0, g: 0, a: 0, rSum: 0 },
          cStats: { m: 0, g: 0, a: 0, rSum: 0 },
          trophies: { league: 0, ucl: 0, boot: 0, bdor: 0 }
        }
      };
      selectedTableLeague = l.id;
      activeTab = 'home';
      saveState();
      haptic('success');
      render();
      showToast(`Добро пожаловать в ${startClub.name}!`, 'success');
    }

    /* ================= MATCH ENGINE ================= */
    function simScore(h, a) {
      const diff = (h.ovr + 2) - a.ovr;
      const pois = lam => { let L = Math.exp(-lam), k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L && k < 7); return k - 1; };
      return { hg: pois(Math.max(0.35, 1.35 + diff * 0.06)), ag: pois(Math.max(0.3, 1.15 - diff * 0.05)) };
    }

    function applyTable(lid, hid, aid, hg, ag) {
      const t = state.tables[lid];
      const hr = t.find(x => x.clubId === hid), ar = t.find(x => x.clubId === aid);
      if (!hr || !ar) return;
      hr.p++; ar.p++; hr.gf += hg; hr.ga += ag; ar.gf += ag; ar.ga += hg;
      if (hg > ag) { hr.w++; hr.pts += 3; ar.l++; }
      else if (ag > hg) { ar.w++; ar.pts += 3; hr.l++; }
      else { hr.d++; hr.pts++; ar.d++; ar.pts++; }
      (state.scorers[lid] || []).forEach(sc => {
        if (sc.clubId === hid && hg > 0 && Math.random() < 0.55) sc.goals++;
        if (sc.clubId === aid && ag > 0 && Math.random() < 0.5) sc.goals++;
      });
    }

    function simOtherMatches(rIdx, exLid, exMatch) {
      LEAGUES.forEach(l => {
        const ms = state.schedules[l.id][rIdx] || [];
        ms.forEach(m => {
          if (l.id === exLid && exMatch && m.home === exMatch.home && m.away === exMatch.away) return;
          const s = simScore(getClub(m.home), getClub(m.away));
          applyTable(l.id, m.home, m.away, s.hg, s.ag);
        });
      });
    }

    function getNextMatch() {
      const p = state.player;
      if (state.ucl.active && !state.ucl.finished) {
        return { type: 'ucl', stage: state.ucl.stage, oppId: state.ucl.oppId, home: p.clubId, away: state.ucl.oppId, isHome: true };
      }
      if (state.round >= 18) return null;
      const m = (state.schedules[p.leagueId][state.round] || []).find(x => x.home === p.clubId || x.away === p.clubId);
      if (!m) return null;
      const isHome = m.home === p.clubId;
      return { type: 'league', round: state.round + 1, home: m.home, away: m.away, oppId: isHome ? m.away : m.home, isHome };
    }

    function actionChance(statKey, oppOvr, mod = 0) {
      const p = state.player, b = getBonuses(), hp = getHappyInfo(p.happiness);
      const eff = p.stats[statKey] + (b.stat[statKey] || 0);
      const enMod = p.energy < 30 ? -10 : (p.energy > 80 ? 3 : 0);
      return Math.max(12, Math.min(95, Math.round(53 + (eff - oppOvr) * 1.4 + hp.matchMod + enMod + mod)));
    }

    function makeMoment(opp) {
      const o = opp.ovr;
      const pool = [
        { title: 'Выход 1 на 1!', icon: '🔥', desc: `Вы вырываетесь к воротам ${opp.name}!`, choices: [
          { label: 'Ударить в угол', stat: 'sho', ch: actionChance('sho', o, 2), type: 'goal', ok: 'ГОЛ! Пушечный удар в девятку!', fail: 'Вратарь перевёл на угловой.' },
          { label: 'Обыграть вратаря', stat: 'dri', ch: actionChance('dri', o, -2), type: 'goal', ok: 'ГОЛ! Хладнокровный финт!', fail: 'Голкипер забрал мяч в ногах.' },
          { label: 'Пас партнёру', stat: 'pas', ch: actionChance('pas', o, 8), type: 'assist', ok: 'АССИСТ! Партнёр забивает в пустые!', fail: 'Защитник перехватил пас.' }
        ]},
        { title: 'Прорыв по флангу!', icon: '💨', desc: 'Вы набираете скорость и входите в штрафную.', choices: [
          { label: 'Сместиться и пробить', stat: 'dri', ch: actionChance('dri', o, 0), type: 'goal', ok: 'ГОЛ! Закрутил в дальний угол!', fail: 'Удар заблокирован.' },
          { label: 'Прострел в центр', stat: 'pas', ch: actionChance('pas', o, 7), type: 'assist', ok: 'АССИСТ! Идеальный прострел!', fail: 'Никто не успел замкнуть.' }
        ]},
        { title: 'Контратака соперника!', icon: '🛡️', isDef: true, desc: `${opp.name} летит на ваши ворота!`, choices: [
          { label: 'Чистый подкат', stat: 'def', ch: actionChance('def', o, 3), type: 'save', ok: 'Блестящий отбор!', fail: 'Соперник прошёл и забил...' },
          { label: 'Силовая борьба', stat: 'phy', ch: actionChance('phy', o, 2), type: 'save', ok: 'Оттеснили форварда корпусом!', fail: 'Форвард устоял и забил.' }
        ]},
        { title: 'ПЕНАЛЬТИ!', icon: '⚽', isPen: true, desc: 'Судья указывает на 11-метровую точку! Выберите угол:' }
      ];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function openPreMatch() {
      const next = getNextMatch();
      if (!next) { openSeasonSummary(); return; }
      if (state.player.injury > 0) { openInjuryModal(); return; }
      const my = getClub(state.player.clubId), opp = getClub(next.oppId);

            ${next.type === 'ucl' ? (next.stage === 'semi' ? '🏆 ЛЧ — 1/2 финала' : '🏆 ФИНАЛ ЛЧ') : `${my.flag} ${my.name} • Тур ${next.round}/18`}
          </div>
          <div class="flex items-center justify-between bg-slate-900/80 rounded-2xl p-4 border border-white/10">
            <div class="flex flex-col items-center w-[40%]">${crest(my, 46)}<div class="text-xs font-bold mt-1.5 text-center">${my.name}</div><div class="text-[10px] text-slate-400">OVR ${my.ovr}</div></div>
            <div class="font-sport text-2xl font-bold text-slate-400">VS</div>
            <div class="flex flex-col items-center w-[40%]">${crest(opp, 46)}<div class="text-xs font-bold mt-1.5 text-center">${opp.name}</div><div class="text-[10px] text-slate-400">OVR ${opp.ovr}</div></div>
          </div>

            <div class="bg-slate-900/70 rounded-xl p-2"><div class="text-[10px] text-slate-400">Энергия</div><div class="font-bold ${state.player.energy < 35 ? 'text-rose-400' : 'text-emerald-400'}">${state.player.energy}%</div></div>
            <div class="bg-slate-900/70 rounded-xl p-2"><div class="text-[10px] text-slate-400">Счастье</div><div class="font-bold ${hp.cls}">${hp.em} ${state.player.happiness}%</div></div>
          </div>

            <button onclick="startLiveMatch()" class="btn-primary py-3.5 text-sm">⚽ Играть ключевые моменты</button>
            <button onclick="quickSimMatch()" class="btn-sec py-3 text-xs">⏩ Быстрая симуляция</button>
            <button onclick="closeModal()" class="text-xs text-slate-400 py-1">Отмена</button>

    }

    function startLiveMatch() {
      const next = getNextMatch(), my = getClub(state.player.clubId), opp = getClub(next.oppId);
      const cnt = getRole(state.player.trust).moments;
      const mins = Array.from({ length: cnt }, (_, i) => 16 + i * Math.floor(68 / cnt) + Math.floor(Math.random() * 5));
      liveMatch = { next, my, opp, min: 0, ms: 0, os: 0, pg: 0, pa: 0, missPen: 0, rat: 6.2, mins, idx: 0, mom: null, log: [{ m: 0, t: `Стартовый свисток! ${my.name} — ${opp.name}`, c: 'info' }], timer: null, done: false };
      renderLiveMatch();
      resumeLiveMatch();
    }

    function resumeLiveMatch() {
      if (!liveMatch || liveMatch.done) return;
      clearInterval(liveMatch.timer);
      liveMatch.timer = setInterval(() => {
        if (!liveMatch || liveMatch.mom) return;
        liveMatch.min += 3;
        const diff = liveMatch.my.ovr - liveMatch.opp.ovr;
        if (Math.random() < Math.max(0.01, 0.025 + diff * 0.001) && liveMatch.min < 88) {
          liveMatch.ms++; liveMatch.log.unshift({ m: liveMatch.min, t: `⚽ Партнёр по ${liveMatch.my.name} забивает!`, c: 'good' });
        } else if (Math.random() < Math.max(0.01, 0.025 - diff * 0.001) && liveMatch.min < 88) {
          liveMatch.os++; liveMatch.log.unshift({ m: liveMatch.min, t: `🔴 ${liveMatch.opp.name} забивает мяч.`, c: 'bad' });
        }
        if (liveMatch.mins[liveMatch.idx] && liveMatch.min >= liveMatch.mins[liveMatch.idx]) {
          clearInterval(liveMatch.timer);
          liveMatch.mom = makeMoment(liveMatch.opp);
          liveMatch.idx++;
          haptic('medium');
          renderLiveMatch();
          return;
        }
        if (liveMatch.min >= 90) {
          liveMatch.min = 90; clearInterval(liveMatch.timer);
          if (liveMatch.next.type === 'ucl' && liveMatch.ms === liveMatch.os) {
            if (Math.random() < 0.52) { liveMatch.ms++; liveMatch.log.unshift({ m: 90, t: '🏆 Победа по пенальти!', c: 'good' }); }
            else { liveMatch.os++; liveMatch.log.unshift({ m: 90, t: '💔 Поражение по пенальти...', c: 'bad' }); }
          }
          liveMatch.done = true;
          liveMatch.log.unshift({ m: 90, t: '🏁 Финальный свисток!', c: 'info' });
        }
        renderLiveMatch();
      }, 170);
    }

    function pickMoment(i) {
      if (!liveMatch || !liveMatch.mom) return;
      const c = liveMatch.mom.choices[i];
      const ok = Math.random() * 100 < c.ch;
      if (ok) {
        haptic('success');
        if (c.type === 'goal') { liveMatch.ms++; liveMatch.pg++; liveMatch.rat = Math.min(10, liveMatch.rat + 1.1); }
        else if (c.type === 'assist') { liveMatch.ms++; liveMatch.pa++; liveMatch.rat = Math.min(10, liveMatch.rat + 0.8); }
        else liveMatch.rat = Math.min(10, liveMatch.rat + 0.7);
        liveMatch.log.unshift({ m: liveMatch.min, t: c.ok, c: 'good' });
      } else {
        haptic('error');
        liveMatch.rat = Math.max(4.5, liveMatch.rat - 0.35);
        if (liveMatch.mom.isDef) liveMatch.os++;
        liveMatch.log.unshift({ m: liveMatch.min, t: c.fail, c: 'bad' });
      }
      liveMatch.mom = null;
      renderLiveMatch();
      setTimeout(resumeLiveMatch, 420);
    }

    function shootPen(dir) {
      if (!liveMatch || !liveMatch.mom) return;
      const keep = ['left', 'center', 'right'][Math.floor(Math.random() * 3)];
      const ch = actionChance('sho', liveMatch.opp.ovr, 16);
      const ok = dir !== keep ? Math.random() * 100 < Math.min(95, ch + 15) : Math.random() * 100 < Math.max(20, ch - 35);
      if (ok) {
        haptic('success'); liveMatch.ms++; liveMatch.pg++; liveMatch.rat = Math.min(10, liveMatch.rat + 1.0);
        liveMatch.log.unshift({ m: liveMatch.min, t: '⚽ ГОЛ с пенальти!', c: 'good' });
      } else {
        haptic('error'); liveMatch.missPen++; liveMatch.rat = Math.max(4.5, liveMatch.rat - 0.6);
        liveMatch.log.unshift({ m: liveMatch.min, t: '🧤 Вратарь отбил пенальти (-6 счастья)!', c: 'bad' });
      }
      liveMatch.mom = null;
      renderLiveMatch();
      setTimeout(resumeLiveMatch, 420);
    }

    function renderLiveMatch() {
      if (!liveMatch) return;
      const lm = liveMatch;
      let momHtml = '';
      if (lm.mom) {
        if (lm.mom.isPen) {
          momHtml = `
            <div class="mt-3 p-3.5 rounded-2xl bg-slate-900 border border-emerald-500/50 anim">
              <div class="text-xs font-bold text-emerald-400 mb-2">⚽ ${lm.mom.title}</div>
              <div class="goal-net h-28 grid grid-cols-3 gap-1.5 p-2">
                <button onclick="shootPen('left')" class="rounded-lg border border-dashed border-emerald-400/50 bg-black/30 text-xs font-bold">↖️ ЛЕВЫЙ</button>
                <button onclick="shootPen('center')" class="rounded-lg border border-dashed border-emerald-400/50 bg-black/30 text-xs font-bold">🧤 ЦЕНТР</button>
                <button onclick="shootPen('right')" class="rounded-lg border border-dashed border-emerald-400/50 bg-black/30 text-xs font-bold">↗️ ПРАВЫЙ</button>
              </div>
            </div>`;
        } else {
          momHtml = `
            <div class="mt-3 p-3.5 rounded-2xl bg-slate-900 border border-emerald-500/50 anim">
              <div class="text-xs font-bold text-emerald-400">${lm.mom.icon} ${lm.mom.title}</div>
              <div class="text-[11px] text-slate-300 mt-1 mb-2.5">${lm.mom.desc}</div>
              <div class="flex flex-col gap-1.5">
                ${lm.mom.choices.map((c, idx) => `
                  <button onclick="pickMoment(${idx})" class="w-full p-2.5 rounded-xl bg-slate-800 border border-white/10 flex justify-between items-center text-left active:scale-[0.98]">
                    <span class="text-xs font-bold">${c.label} <span class="text-[10px] text-sky-300">(${c.stat.toUpperCase()})</span></span>
                    <span class="font-sport text-sm font-bold ${c.ch >= 65 ? 'text-emerald-400' : 'text-amber-300'}">${c.ch}%</span>
                  </button>`).join('')}
              </div>
            </div>`;
        }
      }
      openModal(`
        <div class="w-full max-w-[430px] glass p-4 flex flex-col max-h-[90vh]">
          <div class="bg-slate-950 rounded-2xl p-3 border border-white/10">
            <div class="flex justify-between text-[11px] mb-1.5">
              <span class="text-slate-400">${lm.next.type === 'ucl' ? '🏆 ЛЧ' : 'Тур ' + lm.next.round}</span>
              <span class="font-sport font-bold text-emerald-400">${lm.min}'</span>
              <span class="text-amber-300 font-bold">⭐ ${lm.rat.toFixed(1)}</span>
            </div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 w-[38%]">${crest(lm.my, 32)}<span class="text-xs font-bold truncate">${lm.my.short}</span></div>
              <div class="font-sport text-3xl font-bold">${lm.ms} : ${lm.os}</div>
              <div class="flex items-center justify-end gap-2 w-[38%]"><span class="text-xs font-bold truncate">${lm.opp.short}</span>${crest(lm.opp, 32)}</div>
            </div>
          </div>
          ${momHtml}
          <div class="mt-3 flex-1 overflow-y-auto space-y-1.5 max-h-40">
            ${lm.log.map(x => `<div class="text-[11px] px-2.5 py-1.5 rounded-lg border ${x.c === 'good' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : (x.c === 'bad' ? 'bg-rose-500/10 border-rose-500/30 text-rose-200' : 'bg-slate-900 border-white/5 text-slate-300')}"><b>${x.m}'</b> ${x.t}</div>`).join('')}
          </div>
          ${lm.done ? `<button onclick="finishLiveMatch()" class="btn-primary py-3 text-sm mt-3 w-full">К итогам матча →</button>` : ''}
        </div>
      `);
    }

    function finishLiveMatch() {
      const lm = liveMatch; liveMatch = null;
      finalizeMatch({ next: lm.next, my: lm.my, opp: lm.opp, ms: lm.ms, os: lm.os, pg: lm.pg, pa: lm.pa, missPen: lm.missPen, rat: Number(lm.rat.toFixed(1)) });
    }

    function quickSimMatch() {
      const next = getNextMatch(), my = getClub(state.player.clubId), opp = getClub(next.oppId);
      const s = simScore(my, opp);
      let ms = s.hg, os = s.ag;
      if (next.type === 'ucl' && ms === os) { if (Math.random() < 0.52) ms++; else os++; }
      const pg = ms > 0 && Math.random() < 0.55 ? 1 : 0;
      const pa = ms > pg && Math.random() < 0.45 ? 1 : 0;
      const rat = Number(Math.min(10, Math.max(5.5, 6.3 + pg * 1.1 + pa * 0.7 + (ms > os ? 0.5 : -0.2))).toFixed(1));
      finalizeMatch({ next, my, opp, ms, os, pg, pa, missPen: 0, rat });
    }

    function finalizeMatch(r) {
      const p = state.player, b = getBonuses(), hp = getHappyInfo(p.happiness);
      const won = r.ms > r.os, draw = r.ms === r.os;
      if (r.next.type === 'league') {
        const hg = r.next.isHome ? r.ms : r.os, ag = r.next.isHome ? r.os : r.ms;
        applyTable(p.leagueId, r.next.home, r.next.away, hg, ag);
        simOtherMatches(state.round, p.leagueId, { home: r.next.home, away: r.next.away });
        state.round++;
      } else {
        if (won) {
          if (r.next.stage === 'semi') {
            state.ucl.stage = 'final';
            const oth = LEAGUES.filter(l => l.id !== p.leagueId).map(l => sortTable(state.tables[l.id])[0].clubId);
            state.ucl.oppId = oth[Math.floor(Math.random() * oth.length)];
          } else { state.ucl.finished = true; state.ucl.won = true; p.trophies.ucl++; p.fans += Math.round(250000 * b.media); }
        } else { state.ucl.finished = true; state.ucl.won = false; }
      }

      p.sStats.m++; p.sStats.g += r.pg; p.sStats.a += r.pa; p.sStats.rSum += r.rat;
      p.cStats.m++; p.cStats.g += r.pg; p.cStats.a += r.pa; p.cStats.rSum += r.rat;

      let spInc = 0;
      if (p.sponsorId) {
        const sp = SPONSORS.find(x => x.id === p.sponsorId);
        if (sp) spInc = Math.round((sp.match + sp.goal * r.pg) * b.media);
      }
      const sal = p.salary + (won ? Math.round(p.salary * 0.25) : 0);
      p.money += sal + spInc;
      lastSalaryAd = sal; postAdUsed = false;

      const prevEn = p.energy;
      p.energy = Math.max(5, Math.min(100, p.energy - Math.max(10, 25 - b.energy) + 10));
      let injNow = false;
      const risk = ((prevEn < 35 ? (38 - prevEn) * 0.016 : 0.01) + hp.injAdd) * (1 - b.injRed);
      if ((prevEn < 35 || hp.injAdd > 0) && Math.random() < risk) { p.injury = Math.random() < 0.65 ? 1 : 2; injNow = true; }

      const wDelta = getHappyFactors().reduce((s, f) => s + f.d, 0);
      const eDelta = (won ? 4 : (draw ? 0 : -4)) + r.pg * 3 + r.pa * 2 - r.missPen * 6 - (injNow ? 12 : 0);
      addHappy(wDelta + eDelta);

      p.trust = Math.max(10, Math.min(100, p.trust + (r.rat >= 8 ? 7 : (r.rat >= 7 ? 3 : -3)) + r.pg * 2));
      p.fans += Math.round((r.pg * 4000 + r.pa * 2000 + (won ? 1500 : 300)) * r.my.tier * 0.5 * b.media);
      state.weekSlots = 3; state.adTrainUsed = false;

      if (r.next.type === 'league' && state.round === 9) genOffers(false);
      if (r.next.type === 'league' && state.round === 18) {
        const rank = sortTable(state.tables[p.leagueId]).findIndex(x => x.clubId === p.clubId);
        if (rank <= 1) {
          const oth = LEAGUES.filter(l => l.id !== p.leagueId).map(l => sortTable(state.tables[l.id])[0].clubId);
          state.ucl = { active: true, stage: 'semi', oppId: oth[Math.floor(Math.random() * oth.length)], finished: false, won: false };
        }
      }
      saveState();

      openModal(`
        <div class="w-full max-w-[410px] glass p-5 anim">
          <div class="text-center font-sport text-2xl font-bold ${won ? 'text-emerald-400' : (draw ? 'text-amber-300' : 'text-rose-400')}">
            ${won ? 'ПОБЕДА!' : (draw ? 'НИЧЬЯ' : 'ПОРАЖЕНИЕ')} (${r.ms} : ${r.os})
          </div>
          <div class="grid grid-cols-3 gap-2 my-3 text-center">
            <div class="bg-slate-900 rounded-xl p-2"><div class="text-[10px] text-slate-400">Оценка</div><div class="font-sport text-xl text-amber-300">${r.rat} ⭐</div></div>
            <div class="bg-slate-900 rounded-xl p-2"><div class="text-[10px] text-slate-400">Голы</div><div class="font-sport text-xl text-emerald-400">${r.pg}</div></div>
            <div class="bg-slate-900 rounded-xl p-2"><div class="text-[10px] text-slate-400">Ассисты</div><div class="font-sport text-xl text-sky-400">${r.pa}</div></div>
          </div>
          <div class="text-xs space-y-1 bg-slate-900/70 rounded-xl p-3 border border-white/5">
            <div class="flex justify-between"><span class="text-slate-400">Зарплата</span><span class="font-bold text-emerald-400">+${fmtMoney(sal)}</span></div>

    /* ================= INJURIES & SEASON END ================= */

    function openSeasonSummary() {
      const p = state.player, l = getLeague(p.leagueId);
      const rank = sortTable(state.tables[p.leagueId]).findIndex(x => x.clubId === p.clubId) + 1;
      const isChamp = rank === 1;

      const boot = p.sStats.g >= aiMax && p.sStats.g >= 10;
      const ovr = calcOVR(p.stats, p.pos);
      const bdor = ovr >= 82 && p.sStats.g >= 14 && (isChamp || state.ucl.won);
      if (!state.awardsDone) {
        if (isChamp) { p.trophies.league++; p.money += 250000; }
        if (boot) { p.trophies.boot++; p.money += 150000; }

      openModal(`

    function nextSeason() {
      const p = state.player;
      p.age++;
      Object.assign(state, initSeasonData());
      state.season++; state.round = 0; state.weekSlots = 3; state.adTrainUsed = false; state.awardsDone = false;
      state.ucl = { active: false, stage: null, oppId: null, finished: false, won: false };
      p.energy = 100; p.injury = 0; p.sStats = { m: 0, g: 0, a: 0, rSum: 0 };
      saveState(); closeModal(); render();
    }

    /* ================= TRAINING, SHOP, TRANSFERS, REFERRALS ================= */
    function trainChance(v) {
      const b = getBonuses(), hp = getHappyInfo(state.player.happiness);
      return Math.max(12, Math.min(97, Math.round((92 - Math.max(0, v - 58) * 2.1) * (1 + b.train + hp.trainMod))));
    }
    function doTrain(key) {
      const p = state.player, m = STAT_META.find(x => x.key === key);
      if (state.weekSlots <= 0) return showToast('Слоты закончились!', 'error');
      if (p.energy < m.energy) return showToast('Мало энергии!', 'error');
      if (p.stats[key] >= 99) return showToast('Максимум 99!', 'gold');
      p.energy -= m.energy; state.weekSlots--;
      if (p.energy < 20) addHappy(-4);
      if (Math.random() * 100 < trainChance(p.stats[key])) {
        p.stats[key]++; addHappy(2); haptic('success'); showToast(`🔥 ${m.name} +1 (${p.stats[key]})`, 'success');
      } else { haptic('light'); showToast('Тренировка завершена, без роста.', 'info'); }
      saveState(); render();
    }
    function doRest() {
      if (state.weekSlots <= 0) return showToast('Слоты закончились!', 'error');
      state.player.energy = Math.min(100, state.player.energy + 28);
      addHappy(5); state.weekSlots--; saveState(); render();
      showToast('+28% энергии, +5% счастья!', 'success');
    }
    function doTeamTrain() {
      if (state.weekSlots <= 0 || state.player.energy < 12) return showToast('Нет слотов или энергии!', 'error');
      state.player.energy -= 12; state.player.trust = Math.min(100, state.player.trust + 7);
      addHappy(3); state.weekSlots--; saveState(); render();
      showToast('+7 доверия тренера!', 'success');
    }

    function buyItem(id) {
      const it = SHOP_ITEMS.find(x => x.id === id), p = state.player;
      if (!it || (!it.cons && p.ownedItems.includes(id))) return;
      if (p.money < it.cost) return showToast('Недостаточно средств!', 'error');
      p.money -= it.cost;
      const e = it.ef || {};
      if (it.cons) {
        if (e.happyNow) addHappy(e.happyNow);
        if (e.energyNow) p.energy = Math.min(100, p.energy + e.energyNow);
        showToast(`${it.icon} Отличный отдых!`, 'success');
      } else {
        p.ownedItems.push(id);
        if (e.fans) p.fans += e.fans;
        if (it.cat === 'housing' || it.cat === 'cars') addHappy(6);
        if (id === 's3' && p.happiness < 45) p.happiness = 45;
        showToast(`Куплено: ${it.name}!`, 'gold');
      }
      saveState(); render();
    }

    function genOffers(summer) {
      const p = state.player, ovr = calcOVR(p.stats, p.pos), ag = AGENTS[p.agentId] || AGENTS[0];
      const all = [];
      LEAGUES.forEach(l => l.clubs.forEach(c => { if (c.id !== p.clubId) all.push({ ...c, lid: l.id, lname: l.name, flag: l.flag }); }));
      const maxR = ovr + 5 + Math.round(ag.bonusTop * 0.22);
      let cands = all.filter(c => c.ovr <= maxR && c.ovr >= Math.max(66, ovr - 6));
      if (cands.length < 3) cands = all.sort((a, b) => Math.abs(a.ovr - ovr) - Math.abs(b.ovr - ovr)).slice(0, 6);
      cands.sort(() => Math.random() - 0.5);
      state.offers = cands.slice(0, summer ? 4 : 3).map((c, i) => ({
        id: 'of_' + Date.now() + '_' + i, clubId: c.id,
        sal: Math.max(15000, Math.round((Math.pow(c.tier, 2) * 9500 + Math.max(0, ovr - 65) * 4000) / 1000) * 1000),
        neg: false, fail: false
      }));
      saveState();
    }
    function negOffer(id) {
      const o = state.offers.find(x => x.id === id);
      if (!o || o.neg || o.fail) return;
      o.neg = true;
      const ch = 45 + (AGENTS[state.player.agentId]?.neg || 0);
      if (Math.random() * 100 < ch) { o.sal = Math.round(o.sal * 1.22 / 1000) * 1000; showToast(`Зарплата повышена до ${fmtMoney(o.sal)}!`, 'gold'); }
      else { o.fail = true; showToast('Клуб отозвал предложение!', 'error'); }
      saveState(); render();
    }
    function acceptOffer(id) {
      const o = state.offers.find(x => x.id === id);
      if (!o || o.fail) return;
      const c = getClub(o.clubId);
      state.player.clubId = c.id; state.player.leagueId = c.leagueId;
      state.player.salary = o.sal; state.player.trust = 60;
      addHappy(10); state.offers = []; selectedTableLeague = c.leagueId;
      saveState(); render(); showToast(`Переход в ${c.name}!`, 'gold');
    }

    function getRefLink() {
      const uid = (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) || tgUser.id || 'pro';
      const bot = CONFIG.BOT_USERNAME.replace(/^@/, '').trim();
      return CONFIG.APP_SHORT_NAME ? `https://t.me/${bot}/${CONFIG.APP_SHORT_NAME}?startapp=ref_${uid}` : `https://t.me/${bot}?start=ref_${uid}`;
    }
    function shareRef() {
      const link = getRefLink(), txt = '⚽ Залетай в PRO CAREER: TOP 5 и забери +20 000 € на старт!';
      const url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(txt)}`;
      inviteSent = true;
      try { if (window.Telegram?.WebApp?.openTelegramLink) window.Telegram.WebApp.openTelegramLink(url); else window.open(url, '_blank'); } catch (_) { window.open(url, '_blank'); }
      render();
    }
    function copyRef() { inviteSent = true; copySafe(getRefLink()); showToast('Ссылка скопирована!', 'success'); render(); }
    function claimRef() {
      const r = state.referrals;
      if (!inviteSent) return showToast('Сначала отправьте ссылку другу!', 'info');
      if (Date.now() - r.lastAt < 25000) return showToast('Подождите немного перед следующей проверкой.', 'info');
      r.count++; r.earned += CONFIG.REFERRAL_REWARD; r.lastAt = Date.now(); inviteSent = false;
      state.player.money += CONFIG.REFERRAL_REWARD; addHappy(5);
      saveState(); render(); showToast(`+${fmtMoney(CONFIG.REFERRAL_REWARD)} за друга!`, 'gold');
    }

    /* ================= ONLINE: PRO LEAGUE LIVE + SUPABASE ================= */
    const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    function untilMidnight() {
      const now = new Date(), nxt = new Date(now); nxt.setHours(24,0,0,0);
      const s = Math.max(0, Math.floor((nxt - now) / 1000));
      return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    }
    function pvpLimit() { return 1 + (state.online.adExtraDate === todayStr() ? 1 : 0); }
    function pvpPlayed() { return state.online.lastDate === todayStr() ? (state.online.playedToday || 0) : 0; }
    function pvpAvail() { return pvpPlayed() < pvpLimit(); }

    function myOnlineRow() {
      const p = state.player, c = getClub(p.clubId);
      return {
        tg_id: String(tgUser.id || 'demo_1001'), name: p.name, club: c.name, position: p.pos,
        ovr: calcOVR(p.stats, p.pos), tactic: state.online.defTac || 'press',
        rating: state.online.rating, wins: state.online.wins, draws: state.online.draws, losses: state.online.losses,
        updated_at: new Date().toISOString()
      };
    }

    function sbHeaders(extra = {}) {
      return { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', ...extra };
    }

    async function syncSupabase() {
      try {
        const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/players?on_conflict=tg_id`, {
          method: 'POST', headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
          body: JSON.stringify(myOnlineRow())
        });
        return res.ok;
      } catch (_) { return false; }
    }

    function demoBoard() {
      const list = [...DEMO_ONLINE.map(x => ({ ...x })), myOnlineRow()];
      return list.sort((a, b) => (b.rating - a.rating) || (b.ovr - a.ovr)).slice(0, 50);
    }

    async function fetchLeaderboard(silent = false) {
      onlineLoading = true;
      if (!silent && activeTab === 'online') render();
      try {
        await syncSupabase();
        const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/players?select=*&order=rating.desc,ovr.desc&limit=50`, { headers: sbHeaders() });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const rows = await res.json();
        onlineBoard = Array.isArray(rows) && rows.length ? rows : demoBoard();
      } catch (_) {
        onlineBoard = demoBoard();
      } finally {
        onlineLoading = false;
        if (!pvpOpp) pickOpp(true);
        if (activeTab === 'online') render();
      }
    }

    function pickOpp(silent = false) {
      const myId = String(tgUser.id || 'demo_1001');
      const pool = (onlineBoard.length > 1 ? onlineBoard : DEMO_ONLINE).filter(x => String(x.tg_id) !== myId);
      const src = pool.length ? pool : DEMO_ONLINE;
      pvpOpp = { ...src[Math.floor(Math.random() * src.length)] };
      pvpScouted = false;
      if (!silent) { render(); showToast(`Соперник: ${pvpOpp.name}`, 'info'); }
    }

    function startPvp() {
      if (!pvpAvail()) return showToast('Лимит матчей на сегодня исчерпан!', 'info');
      if (!pvpOpp) pickOpp(true);
      const p = state.player, opp = pvpOpp;
      const myTac = TACTICS[state.online.atkTac] || TACTICS.press;
      const oppTac = TACTICS[opp.tactic] || TACTICS.press;
      const tacMod = myTac.beats === oppTac.id ? 12 : (myTac.losesTo === oppTac.id ? -12 : 0);
      const myOvr = calcOVR(p.stats, p.pos);
      const winCh = Math.max(20, Math.min(82, 50 + (myOvr - (opp.ovr || 75)) * 1.6 + tacMod));

      let ms = 0, os = 0;
      const steps = [15, 34, 55, 73, 88].map(m => {
        const r = Math.random() * 100;
        if (r < winCh * 0.55) { ms++; return { m, s: 'my', t: `⚽ ${p.name} забивает гол!`, ms, os }; }
        if (r < winCh * 0.55 + (100 - winCh) * 0.55) { os++; return { m, s: 'opp', t: `🔴 ${opp.name} поражает ворота!`, ms, os }; }
        return { m, s: 'n', t: '🧤 Опасный момент, но вратарь спасает!', ms, os };
      });
      livePvp = { opp, myTac, oppTac, tacMod, steps, shown: 0, ms, os, done: false, timer: null };
      renderPvpModal();
      livePvp.timer = setInterval(() => {
        livePvp.shown++;
        if (livePvp.shown >= livePvp.steps.length) {
          clearInterval(livePvp.timer);
          livePvp.done = true;
          const t = todayStr();
          state.online.playedToday = state.online.lastDate === t ? state.online.playedToday + 1 : 1;
          state.online.lastDate = t;
          const rd = ms > os ? 30 : (ms === os ? 10 : -15);
          const rew = ms > os ? 25000 : (ms === os ? 10000 : 5000);
          if (ms > os) state.online.wins++; else if (ms === os) state.online.draws++; else state.online.losses++;
          state.online.rating = Math.max(500, state.online.rating + rd);
          state.player.money += rew;
          livePvp.rd = rd; livePvp.rew = rew;
          saveState();
          fetchLeaderboard(true);
        }
        renderPvpModal();
      }, 750);
    }

    function renderPvpModal() {
      if (!livePvp) return;
      const lp = livePvp, sh = lp.steps.slice(0, lp.shown);
      const cm = sh.length ? sh[sh.length - 1].ms : 0, co = sh.length ? sh[sh.length - 1].os : 0;
      openModal(`
        <div class="w-full max-w-[420px] glass p-5 anim">
          <div class="text-center text-xs font-bold text-indigo-300 mb-2">⚔️ PRO LEAGUE LIVE</div>
          <div class="bg-slate-900 rounded-2xl p-3.5 border border-white/10 text-center">
            <div class="flex justify-between items-center">
              <div class="w-[38%] text-xs font-bold text-emerald-300 truncate">${state.player.name}<div class="text-[10px] text-slate-400">${lp.myTac.icon} ${lp.myTac.short}</div></div>
              <div class="font-sport text-3xl font-bold">${cm} : ${co}</div>
              <div class="w-[38%] text-xs font-bold text-amber-300 truncate">${lp.opp.name}<div class="text-[10px] text-slate-400">${lp.oppTac.icon} ${lp.oppTac.short}</div></div>
            </div>
            <div class="text-[11px] font-bold mt-2 ${lp.tacMod > 0 ? 'text-emerald-400' : (lp.tacMod < 0 ? 'text-rose-400' : 'text-slate-400')}">
              ${lp.tacMod > 0 ? 'Контр-тактика (+12%)' : (lp.tacMod < 0 ? 'Тактика проиграна (-12%)' : 'Равные тактики (0%)')}
            </div>
          </div>
          <div class="mt-3 space-y-1.5 min-h-[140px]">
            ${sh.map(x => `<div class="p-2 rounded-xl text-xs border ${x.s==='my'?'bg-emerald-500/15 border-emerald-400/40 text-emerald-200':(x.s==='opp'?'bg-rose-500/15 border-rose-400/40 text-rose-200':'bg-slate-900 border-white/10 text-slate-300')}"><b>${x.m}'</b> ${x.t}</div>`).join('')}
          </div>
          ${lp.done ? `
            <div class="mt-3 p-3 rounded-xl bg-slate-900 text-xs space-y-1">
              <div class="flex justify-between"><span>Рейтинг</span><b class="${lp.rd>=0?'text-emerald-400':'text-rose-400'}">${lp.rd>=0?'+':''}${lp.rd} (${state.online.rating})</b></div>
              <div class="flex justify-between"><span>Награда</span><b class="text-amber-300">+${fmtMoney(lp.rew)}</b></div>
            </div>
            <button onclick="livePvp=null; closeModal(); pickOpp(true); render();" class="btn-primary w-full py-3 text-sm mt-3">Забрать</button>
          ` : ''}
        </div>
      `);
    }

    function renderCreate() {

      return `

    function switchTab(t) {
      activeTab = t;
      haptic('light');
      clearInterval(countdownTimer);
      if (t === 'online') {
        countdownTimer = setInterval(() => { const el = document.getElementById('pvp-cd'); if (el) el.textContent = untilMidnight(); }, 1000);
        if (!onlineSynced) { onlineSynced = true; fetchLeaderboard(false); }
        else if (!pvpOpp) pickOpp(true);
      }
      render();
      window.scrollTo(0, 0);
    }

    function render() {
      const root = document.getElementById('root');
      if (!root) return;
      try {
        if (!state || !state.player) { root.innerHTML = renderCreate(); return; }
        ensureStateIntegrity();
        const p = state.player, c = getClub(p.clubId), hp = getHappyInfo(p.happiness);
        const nav = [
          ['home', 'Главная', '🏠'],
          ['match', 'Матч', '⚽'],
          ['training', 'Тренир.', '🏋️'],
          ['shop', 'Магазин', '🛍️'],
          ['career', 'Карьера', '💼'],
          ['online', 'Онлайн', '🌍']
        ];
        const pages = { home: renderHome, match: renderMatchTab, training: renderTraining, shop: renderShop, career: renderCareer, online: renderOnline };
        root.innerHTML = `
          <header class="sticky top-0 z-30 px-3 py-2 bg-[#060913]/95 backdrop-blur-md border-b border-white/5 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2 min-w-0">${crest(c, 28)}<div class="min-w-0"><div class="text-xs font-bold truncate">${c.name}</div><div class="text-[10px] text-slate-400">С${state.season} • Тур ${Math.min(18, state.round+1)}/18</div></div></div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="openHappyModal()" class="px-2 py-1 rounded-xl border text-[10px] font-bold ${hp.bg} ${hp.cls}">${hp.em} ${p.happiness}%</button>
              <div class="px-2.5 py-1 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 font-sport text-xs font-bold">${fmtMoney(p.money)}</div>
            </div>
          </header>
          <main class="flex-1 pb-20">${(pages[activeTab] || renderHome)()}</main>
          <nav class="bottom-nav grid grid-cols-6">
            ${nav.map(([id, lbl, ic]) => `
              <button onclick="switchTab('${id}')" class="nav-btn ${activeTab===id?'active':''}">
                <div class="relative text-base leading-none mb-1">${ic}${id==='online'&&pvpAvail()?'<span class="online-dot absolute -top-0.5 -right-1.5 w-2 h-2 rounded-full bg-emerald-400"></span>':''}</div>
                <span>${lbl}</span>
              </button>`).join('')}
          </nav>
        `;
      } catch (e) {
        root.innerHTML = `<div class="p-6 text-center space-y-3"><div class="text-rose-400 font-bold text-sm">Ошибка рендера: ${e.message}</div><button onclick="localStorage.removeItem(SAVE_KEY); state=null; render();" class="btn-primary px-5 py-2.5 text-xs">Сбросить и перезапустить</button></div>`;
      }
    }

    // Мгновенный запуск без ожидания внешних SDK
    try { initTelegram(); loadState(); } catch (_) {}
    render();
  </script>
</body>
</html>
