              '<div class="row"><div class="row">' + badgeSVG(c, 32) + '<div><b>' + esc(c.name) + '</b><div class="muted">Сила клуба: ' + c.ovr + ' OVR • Д2</div></div></div>' +
              '<span class="bdg b-grn">' + fmtEur(of.salary) + '/тур</span></div>' +
            '</button>';
          }).join('') +
          '<div class="g2"><button class="btn btn-gh" data-act="wizBack">← Назад</button><button class="btn btn-grn" data-act="wizNext">К подписанию →</button></div>' +
        '</div>';
      } else {
        var of4 = ui.wizOffers.find(function (o) { return o.clubId === ui.wizClub; }) || ui.wizOffers[0];
        var cc = getClub(of4.clubId), pos4 = getPos(ui.wizPos);
        var st4 = { sho: pos4.base[0], pas: pos4.base[1], dri: pos4.base[2], phy: pos4.base[3] };
        html += '<div class="card col" style="border-color:var(--gld)">' +
          '<div class="sec-t"><span>✍️ Первый молодёжный контракт</span><span class="bdg b-gld">16 лет</span></div>' +
          '<div class="row" style="padding:10px;background:rgba(255,255,255,0.05);border-radius:12px">' +
            badgeSVG(cc, 44) +
            '<div style="flex:1"><div style="font-size:16px;font-weight:900">' + esc(ui.wizName) + '</div>' +
            '<div class="muted">' + ctry.flag + ' ' + ctry.name + ' • ' + ui.wizPos + ' (OVR ' + calcOVR(st4, ui.wizPos) + ') • ' + esc(cc.name) + '</div></div>' +
          '</div>' +
          '<div class="g2">' + miniBox('💵 Зарплата (Д2)', fmtEur(of4.salary) + '/тур') + miniBox('🪙 Онлайн-кошелёк', '10 000 🪙') + '</div>' +
          '<div class="g2"><button class="btn btn-gh" data-act="wizBack">← Назад</button><button class="btn btn-gld" data-act="wizStart">⚽ Начать карьеру!</button></div>' +
        '</div>';
      }
      return html + '</div>';
    }

    function renderHallOfFame() {
      var c = getClub(state.clubId), ct = getCountry(state.countryId);
      return '<div class="main"><div class="card col" style="border-color:var(--gld);background:linear-gradient(145deg,rgba(120,53,15,0.7),rgba(15,23,42,0.96))">' +
        '<div style="text-align:center"><div style="font-size:40px">🏛️</div><div style="font-size:11px;font-weight:900;color:var(--gld-hi);letter-spacing:1.2px">ЗАЛ СЛАВЫ МИРОВОГО ФУТБОЛА</div>' +
        '<div style="font-size:21px;font-weight:900;margin-top:4px">' + esc(state.name) + '</div>' +
        '<div class="muted">' + ct.flag + ' ' + ct.name + ' • ' + state.pos + ' • Завершил карьеру в ' + state.age + ' лет</div></div>' +
        '<div class="row" style="justify-content:center">' + badgeSVG(c, 36) + '<div><b>' + esc(c.name) + '</b><div class="muted">Сезонов: ' + state.season + ' • Пик OVR: ' + state.peakOvr + '</div></div></div>' +
        '<div class="g3">' + miniBox('⚽ Матчи', state.careerStats.apps) + miniBox('🥅 Голы', state.careerStats.goals) + miniBox('🅰️ Ассисты', state.careerStats.assists) + '</div>' +
        '<div class="g3">' + miniBox('🏅 Титулы Д1/Д2', state.trophies.d1 + '/' + state.trophies.d2) + miniBox('⭐ ЛЧ', state.trophies.ucl) + miniBox('🌍 Сборная', state.trophies.intl) + '</div>' +
        '<button class="btn btn-gld" data-act="newCareerHof">🌱 Начать новую карьеру с 16 лет</button>' +
        '<div class="muted" style="text-align:center">Онлайн-кошелёк (🪙) и ELO сохраняются!</div></div></div>';
    }

    function renderProfileTab() {
      var ovr = calcOVR(state.stats, state.pos);
      var tier = ovr >= 85 ? 'fc-elite' : (ovr >= 75 ? 'fc-gold' : (ovr >= 65 ? 'fc-silver' : 'fc-bronze'));
      var club = getClub(state.clubId), ctry = getCountry(state.countryId);
      var role = getRoleStatus(state.energy), stg = getAgeStage(state.age), win = getWindowInfo();
      var inUcl = state.ucl.participants.indexOf(state.clubId) !== -1;

      var html = '<div class="fc ' + tier + '">' +
        '<div class="row">' +
          '<div style="text-align:center;min-width:54px"><div class="fc-ovr">' + ovr + '</div><div style="font-size:12px;font-weight:900;color:var(--gld-hi)">' + state.pos + '</div></div>' +
          '<div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:900">' + esc(state.name) + '</div>' +
            '<div class="muted" style="color:#e2e8f0">' + ctry.flag + ' ' + state.age + ' лет • ' + esc(club.name) + ' (Д' + state.div + ')</div>' +
            '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px">' +
              '<span class="bdg" style="color:' + stg.col + ';border-color:' + stg.col + '">' + stg.lbl + '</span>' +
              '<span class="bdg ' + role.cls + '">' + role.lbl + '</span>' +
              (inUcl ? '<span class="bdg b-ucl">⭐ ЛЧ</span>' : '') +
              (state.hotStreak >= 2 ? '<span class="bdg b-gld">🔥 Кураж</span>' : '') +
            '</div></div>' + badgeSVG(club, 42) +
        '</div>' +
        '<div class="fc-stats">' + STAT_META.map(function (m) {
          return '<div class="fc-st"><span>' + m.lbl + '</span><b>' + state.stats[m.k] + '</b></div>';
        }).join('') + '</div></div>';

      // Тренировочная мини-игра прямо на вкладке Профиль
      if (trainGame) {
        var tm = STAT_META.find(function (m) { return m.k === trainGame.statKey; });
        html += '<div class="card col" style="border-color:var(--grn)">' +
          '<div class="sec-t"><span>🏋️ Тренировка: ' + tm.name + '</span><span class="bdg b-gld">' + trainGame.hits + '/3</span></div>' +
          '<div style="font-weight:800;text-align:center">' + esc(trainGame.msg) + '</div>' +
          '<div class="t-track"><div class="t-green" style="left:' + trainGame.gStart + '%;width:' + trainGame.gW + '%"></div><div id="trCur" class="t-cur" style="left:' + trainGame.pos + '%"></div></div>' +
          (trainGame.done ? '<button class="btn btn-grn" data-act="trainClose">✅ Завершить</button>' : '<button class="btn btn-gld" data-act="trainTap">⚡ СТОП! ПОЙМАТЬ</button>') +
        '</div>';
      } else {
        var restGain = state.age <= 19 ? 38 : 30;
        html += '<div class="card col">' +
          '<div class="sec-t"><span>📊 Состояние и восстановление</span><span class="bdg b-gld">З/П: ' + fmtEur(state.salary) + '</span></div>' +
          '<div class="muted" style="font-size:11px;padding:6px 8px;background:rgba(255,255,255,0.04);border-radius:9px;border-left:3px solid ' + stg.col + '"><b>' + stg.lbl + ':</b> ' + stg.desc + '</div>' +
          barRow('⚡ Энергия', state.energy + '%', state.energy, state.energy >= 50 ? '#10b981' : (state.energy >= 25 ? '#f59e0b' : '#f43f5e')) +
          barRow('🤝 Доверие тренера', state.trust + '%', state.trust, '#38bdf8') +
          barRow('😊 Счастье', state.happiness + '%', state.happiness, '#a855f7') +
          '<div class="g2"><button class="btn btn-gh" data-act="rest">😴 Отдых (+' + restGain + '%)</button><button class="btn btn-pur" data-act="adEnergy">🎬 Реклама (+40%)</button></div>' +
        '</div>';

        html += '<div class="card col">' +
          '<div class="sec-t"><span>🏋️ 3-раундовая тренировка</span><span class="muted">-18% эн.</span></div>' +
          '<div class="muted">3/3 попаданий → <b>+2 к навыку</b>, 1–2/3 → <b>+1</b>' + (state.age <= 19 ? ' (🌱 +15% бонус)' : '') + '</div>' +
          '<div class="g2">' + STAT_META.map(function (m) {
            var val = state.stats[m.k], cost = 700 + Math.max(0, val - 50) * 190;
            return '<button class="choice" data-act="startTrain" data-id="' + m.k + '"><div class="row"><b>' + m.lbl + ' (' + val + ')</b><span class="bdg b-grn">' + fmtEur(cost) + '</span></div><span class="muted">' + m.name + '</span></button>';
          }).join('') + '</div></div>';
      }

      var renDone = win.open && state.windowUsed.renewKey === win.key;
      html += '<div class="card col">' +
        '<div class="sec-t"><span>✍️ Контракт и карьера</span><span class="bdg ' + (win.open ? 'b-grn' : 'b-red') + '">' + (win.open ? 'Окно открыто' : 'Закрыто') + '</span></div>' +
        '<div class="g3">' + miniBox('👥 Фанаты', state.fans.toLocaleString('ru-RU')) + miniBox('⚽ Гол/Пас', state.careerStats.goals + '/' + state.careerStats.assists) + miniBox('🏆 Трофеи', '🏅' + (state.trophies.d1 + state.trophies.d2) + ' ⭐' + state.trophies.ucl) + '</div>' +
        '<div class="muted">' + win.name + ' • ' + win.next + '</div>' +
        (win.open ? '<button class="btn btn-gld" data-act="renew" ' + (renDone ? 'disabled' : '') + '>' + (renDone ? '✅ Контракт продлён' : '✍️ Продлить контракт (повысить з/п)') + '</button>' : '') +
      '</div>';
      return html;
    }

    function renderMatchTab() {
      // 1. Активный интерактивный матч
      if (liveMatch) {
        var m = liveMatch;
        if (m.phase === 'done') {
          return '<div class="card col ' + (m.mode === 'ucl' ? 'card-ucl' : '') + '">' +
            '<div class="sec-t"><span>🏁 Финальный свисток</span><span class="bdg ' + (m.won ? 'b-grn' : (m.draw ? 'b-gld' : 'b-red')) + '">' + (m.won ? 'ПОБЕДА' : (m.draw ? 'НИЧЬЯ' : 'ПОРАЖЕНИЕ')) + '</span></div>' +
            '<div class="row" style="justify-content:center;gap:14px;padding:6px 0">' +
              badgeSVG(m.myClub, 42) + '<div style="font-size:26px;font-weight:900;color:var(--gld-hi)">' + m.myScore + ' : ' + m.oppScore + '</div>' + badgeSVG(m.oppClub, 42) +
            '</div>' +
            (m.penResult ? '<div style="text-align:center;font-weight:800;color:var(--blu)">Пенальти: ' + m.penResult + '</div>' : '') +
            '<div class="g2">' + miniBox('⚽ Ваши голы', m.playerGoals) + miniBox('🅰️ Ассисты', m.playerAssists) + '</div>' +
            m.lines.map(function (l) { return '<div style="font-size:12px;font-weight:700;padding:6px 9px;background:rgba(255,255,255,0.06);border-radius:9px">' + esc(l) + '</div>'; }).join('') +
            '<div class="log-box">' + m.log.map(function (x) { return '<div>' + esc(x) + '</div>'; }).join('') + '</div>' +
            '<button class="btn btn-grn" data-act="closeMatch">Продолжить →</button>' +
          '</div>';
        }

        var pitchCls = m.mode === 'ucl' ? 'pitch-ucl' : (m.mode === 'intl' ? 'pitch-intl' : '');
        var h = '<div class="pitch ' + pitchCls + '">' +
          '<div class="scorebug">' +
            '<div class="row" style="gap:5px">' + badgeSVG(m.myClub, 22) + '<span>' + esc(m.myClub.short) + '</span></div>' +
            '<div class="score-num">' + m.myScore + ' : ' + m.oppScore + '</div>' +
            '<div class="row" style="gap:5px"><span>' + esc(m.oppClub.short) + '</span>' + badgeSVG(m.oppClub, 22) + '</div>' +
            '<span class="bdg b-gld">' + m.minute + "'</span>" +
          '</div>' +
          '<svg viewBox="0 0 320 144" style="display:block;width:100%;height:auto">' +
            '<rect width="320" height="144" fill="' + (m.mode === 'ucl' ? '#0b3b2c' : '#0f4c2b') + '"/>' +
            '<rect x="12" y="10" width="296" height="124" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>' +
            '<line x1="160" y1="10" x2="160" y2="134" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>' +
            '<circle cx="160" cy="72" r="22" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>' +
            '<rect x="12" y="42" width="38" height="60" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>' +
            '<rect x="270" y="42" width="38" height="60" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>' +
            '<circle cx="' + (m.ballX - 18) + '" cy="' + m.ballY + '" r="7" fill="' + m.myClub.c1 + '" stroke="#fff" stroke-width="2"/>' +
            '<circle cx="' + (m.ballX + 20) + '" cy="' + (m.ballY + 8) + '" r="7" fill="' + m.oppClub.c1 + '" stroke="#fff" stroke-width="1.5"/>' +
            '<circle cx="' + m.ballX + '" cy="' + m.ballY + '" r="4.5" fill="#fff"/>' +
          '</svg></div>';

        if (m.phase === 'choice') {
          h += '<div class="card col"><div class="sec-t"><span>⚡ Ключевой момент (' + m.minute + "')</span>" +
            (state.hotStreak >= 2 ? '<span class="bdg b-gld">🔥 Кураж +15%</span>' : '') + '</div>' +
            getMatchChoices(m).map(function (c) {
              return '<button class="choice" data-act="mChoice" data-id="' + c.id + '"><b>' + c.t + '</b><span class="muted">' + c.s + '</span></button>';
            }).join('') + '</div>';
        } else if (m.phase === 'timing') {
          h += '<div class="card col" style="border-color:var(--gld)"><div class="sec-t"><span>🎯 Тайминг-шкала удара</span><span class="bdg b-grn">Поймай зелёную!</span></div>' +
            '<div class="t-track"><div class="t-green" style="left:' + m.tStart + '%;width:' + m.tW + '%"></div><div id="mCur" class="t-cur" style="left:' + m.tPos + '%"></div></div>' +
            '<button class="btn btn-gld" data-act="mStop">⚡ УДАРИТЬ / СЫГРАТЬ!</button></div>';
        } else if (m.phase === 'goal' || m.phase === 'penalty') {
          var isP = m.phase === 'penalty';
          var zLabels = ['↖️ Девятка', '⬆️ Под перекладину', '↗️ Девятка', '↙️ Нижний угол', '⬇️ По центру', '↘️ Нижний угол'];
          h += '<div class="card col" style="border-color:var(--grn)"><div class="sec-t"><span>' + (isP ? '🔥 Пенальти (' + m.penScore[0] + ':' + m.penScore[1] + ')' : '🥅 Выберите угол ворот!') + '</span></div>' +
            '<div class="goal-fr">' + zLabels.map(function (lbl, i) {
              return '<button class="goal-z" data-act="' + (isP ? 'mPen' : 'mGoal') + '" data-id="' + i + '">' + lbl + '</button>';
            }).join('') + '</div></div>';
        }
        h += '<div class="log-box">' + m.log.slice(0, 6).map(function (x) { return '<div>' + esc(x) + '</div>'; }).join('') + '</div>';
        return h;
      }

      // 2. Интервью / Событие / Сборная / ЛЧ / Конец сезона / Очередной тур
      if (state.pendingInterview) {
        var iv = state.pendingInterview;
        return '<div class="card col" style="border-color:var(--blu)"><div class="sec-t"><span>🎙️ Флеш-интервью</span><span class="bdg">Пресса</span></div>' +
          '<div style="font-weight:800">' + esc(iv.q) + '</div>' +
          iv.opts.map(function (o, i) { return '<button class="choice" data-act="ansInt" data-id="' + i + '"><b>' + esc(o.l) + '</b><span class="muted">' + esc(o.m) + '</span></button>'; }).join('') +
        '</div>';
      }
      if (state.pendingEvent) {
        var ev = state.pendingEvent;
        return '<div class="card col" style="border-color:var(--pur)"><div class="sec-t"><span>🎲 Событие недели</span></div>' +
          '<div style="font-weight:900;font-size:15px">' + esc(ev.t) + '</div><div class="muted">' + esc(ev.d) + '</div>' +
          ev.o.map(function (o, i) { return '<button class="choice" data-act="ansEv" data-id="' + i + '"><b>' + esc(o.l) + '</b><span class="muted">' + esc(o.m) + '</span></button>'; }).join('') +
        '</div>';
      }
      if (state.pendingIntl) {
        var pi = state.pendingIntl, mc = getCountry(state.countryId);
        return '<div class="card card-intl col"><div class="sec-t"><span>' + esc(pi.title) + '</span><span class="bdg b-gld">ВЫЗОВ В СБОРНУЮ</span></div>' +
          '<div style="text-align:center;font-size:17px;font-weight:900;padding:8px 0">' + mc.flag + ' ' + mc.name + ' — ' + pi.opp.flag + ' ' + pi.opp.name + '</div>' +
          '<button class="btn btn-gld" data-act="playIntl">🌍 Выйти за сборную!</button></div>';
      }

      var uclEv = getPendingUcl(state);
      if (uclEv && uclEv.myMatch) {
        var oppId = uclEv.myMatch.h === state.clubId ? uclEv.myMatch.a : uclEv.myMatch.h;
        var oc = getClub(oppId);
        return '<div class="card card-ucl col"><div class="sec-t"><span>⭐ Лига Чемпионов</span><span class="bdg b-ucl">' + esc(uclEv.label) + '</span></div>' +
          '<div class="row" style="justify-content:center;gap:14px;padding:6px 0">' + badgeSVG(getClub(state.clubId), 44) + '<b>VS</b>' + badgeSVG(oc, 44) + '</div>' +
          '<div style="text-align:center;font-weight:900;font-size:15px">' + esc(getClub(state.clubId).name) + ' — ' + esc(oc.name) + '</div>' +
          '<button class="btn btn-ucl" data-act="playUcl">⭐ Выйти на матч Лиги Чемпионов!</button></div>';
      }

      if (state.tour > 18) {
        var lg = getLeagueDef(state.lgId);
        var tbl = sortTable(state.tables[state.lgId][state.div === 1 ? 'd1' : 'd2']);
        var place = tbl.findIndex(function (r) { return r.id === state.clubId; }) + 1;
        var canRet = state.age >= 36, mustRet = state.age >= 40;
        var zoneTxt = state.div === 2
          ? (place <= 2 ? '⬆️ ПОЗДРАВЛЯЕМ! Ваш клуб выходит в ' + lg.d1Name + '!' : 'Клуб остаётся в ' + lg.d2Name + '.')
          : (place <= lg.uclQuota ? '⭐ Клуб квалифицировался в Лигу Чемпионов!' : (place >= 9 ? '⬇️ Клуб вылетает в ' + lg.d2Name + '.' : 'Место в Д1 сохранено.'));
        return '<div class="card col" style="border-color:var(--gld)">' +
          '<div class="sec-t"><span>🏁 Сезон ' + state.season + ' завершён (' + state.age + ' лет)</span><span class="bdg b-gld">' + place + '-е место</span></div>' +
          '<div style="font-weight:700">' + lg.flag + ' ' + (state.div === 1 ? lg.d1Name : lg.d2Name) + ': ' + zoneTxt + '</div>' +
          '<div class="muted">⭐ Чемпион ЛЧ: <b>' + esc(state.ucl.champion ? getClub(state.ucl.champion).name : '—') + '</b></div>' +
          (canRet ? '<button class="btn btn-gld" data-act="retireHof">🏛️ Завершить карьеру в Зале Славы</button>' : '') +
          (!mustRet ? '<button class="btn ' + (canRet ? 'btn-gh' : 'btn-gld') + '" data-act="nextSeason">🚀 Начать Сезон ' + (state.season + 1) + ' (' + (state.age + 1) + ' лет • Летнее окно!)</button>' : '') +
        '</div>';
      }

      var myLg = getLeagueDef(state.lgId);
      var myRoster = state.divRosters[state.lgId][state.div === 1 ? 'd1' : 'd2'].filter(function (id) { return id !== state.clubId; });
      var nextOpp = getClub(myRoster[(state.tour - 1) % myRoster.length]);
      var role = getRoleStatus(state.energy);
      return '<div class="card col">' +
        '<div class="sec-t"><span>⚽ ' + myLg.flag + ' ' + (state.div === 1 ? myLg.d1Name : myLg.d2Name) + ' • Тур ' + state.tour + '/18</span><span class="bdg ' + role.cls + '">' + role.lbl + '</span></div>' +
        '<div class="row" style="justify-content:center;gap:14px;padding:6px 0">' + badgeSVG(getClub(state.clubId), 44) + '<b style="color:var(--t2)">VS</b>' + badgeSVG(nextOpp, 44) + '</div>' +
        '<div style="text-align:center;font-weight:900;font-size:15px">' + esc(getClub(state.clubId).name) + ' — ' + esc(nextOpp.name) + '</div>' +
        '<div class="muted" style="text-align:center">Сила соперника: ' + nextOpp.ovr + ' OVR • Энергия: ' + state.energy + '%</div>' +
        '<button class="btn btn-grn" data-act="playLeague">⚽ Выйти на матч</button>' +
      '</div>';
    }

    function renderLeaguesTab() {
      var html = '<div class="tabs">' +
        '<button class="tab-btn ' + (ui.leagueSub === 'd1' ? 'active' : '') + '" data-act="lgSub" data-id="d1">🏆 Высший (Д1)</button>' +
        '<button class="tab-btn ' + (ui.leagueSub === 'd2' ? 'active' : '') + '" data-act="lgSub" data-id="d2">⬆️ Второй (Д2)</button>' +
        '<button class="tab-btn ' + (ui.leagueSub === 'ucl' ? 'active-ucl' : '') + '" data-act="lgSub" data-id="ucl">⭐ ЛЧ</button>' +
        '<button class="tab-btn ' + (ui.leagueSub === 'tr' ? 'active' : '') + '" data-act="lgSub" data-id="tr">✈️ Трансферы</button>' +
      '</div>';

      if (ui.leagueSub === 'd1' || ui.leagueSub === 'd2') {

          '<span class="pill pill-en">⚡' + state.energy + '%</span>' +
          '<span class="pill pill-eur ' + (!isOn ? 'active-w' : '') + '">💵 ' + fmtEur(state.money) + '</span>' +
          '<span class="pill pill-coin ' + (isOn ? 'active-w' : '') + '">🪙 ' + fmtCoin(state.onlineBalance) + '</span>' +
        '</div></div>';

      var body = '';
      if (ui.tab === 'profile') body = renderProfileTab();
      else if (ui.tab === 'match') body = renderMatchTab();
      else if (ui.tab === 'leagues') body = renderLeaguesTab();
      else if (ui.tab === 'shop') body = renderShopTab();
      else body = renderOnlineTab();

      var nav = '<nav class="bnav">' +
        [['profile','👤','Профиль',false],['match','⚽','Матч',matchDot],['leagues','🏆','Клуб/Лиги',false],['shop','🛍️','Магазин',false],['online','🌐','Онлайн',pvpDot]].map(function (t) {
          return '<button class="bnav-btn ' + (ui.tab === t[0] ? 'active' : '') + '" data-act="tab" data-id="' + t[0] + '">' +
            (t[3] ? '<span class="bnav-dot"></span>' : '') + '<span class="ico">' + t[1] + '</span><span>' + t[2] + '</span></button>';
        }).join('') + '</nav>';

      app.innerHTML = hud + '<div class="main">' + body + '</div>' + nav;
    }

    /* =====================================================================
       14. EVENT DELEGATION
       ===================================================================== */
    function buildWizOffers(lgId) {
      var d2Ids = getLeagueDef(lgId).initD2.slice(-3); // 3 самых слабых клуба Д2
      ui.wizOffers = d2Ids.map(function (id, idx) {
        return { clubId: id, salary: 850 + idx * 250 + randInt(0, 150) }; // строго 850–1 500 €
      });
      ui.wizClub = ui.wizOffers[0].clubId;
    }

    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'wizNameInp') ui.wizName = e.target.value;
    });

    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn || btn.disabled) return;
      var act = btn.getAttribute('data-act'), id = btn.getAttribute('data-id');

      if (act === 'tab') { ui.tab = id; if (id === 'online' && !ui.pvpOpp) pickPvpOpponent(); render(); }
      else if (act === 'randName') { ui.wizName = genRandomName(ui.wizCountry); render(); }
      else if (act === 'wizCountry') { ui.wizCountry = id; ui.wizName = genRandomName(id); render(); }
      else if (act === 'wizPos') { ui.wizPos = id; render(); }
      else if (act === 'wizLg') { ui.wizLg = id; render(); }
      else if (act === 'wizClub') { ui.wizClub = id; render(); }
      else if (act === 'wizBack') { ui.wizStep = Math.max(1, ui.wizStep - 1); render(); }
      else if (act === 'wizNext') {
        if (ui.wizStep === 2) buildWizOffers(ui.wizLg);
        ui.wizStep = Math.min(4, ui.wizStep + 1); render();
      }
      else if (act === 'wizStart') {
        var of = ui.wizOffers.find(function (o) { return o.clubId === ui.wizClub; }) || ui.wizOffers[0];
        var keepBal = state.onlineBalance, keepPvp = state.pvp, keepBuf = state.onlineBuffs;
        state = defaultState();
        state.created = true; state.age = 16;
        state.name = ui.wizName.trim() || genRandomName(ui.wizCountry);
        state.countryId = ui.wizCountry; state.pos = ui.wizPos;
        state.lgId = ui.wizLg; state.div = 2; state.clubId = of.clubId; state.salary = of.salary;
        if (keepPvp && (keepPvp.wins || keepPvp.losses)) {
          state.onlineBalance = keepBal; state.pvp = Object.assign({}, state.pvp, keepPvp); state.onlineBuffs = Object.assign({}, state.onlineBuffs, keepBuf);
        }
        var b = getPos(state.pos).base;
        state.stats = { sho: b[0], pas: b[1], dri: b[2], phy: b[3] };
        state.peakOvr = calcOVR(state.stats, state.pos);
        ui.leagueCountry = state.lgId; ui.leagueSub = 'd2'; ui.tab = 'profile';
        saveState();
        recordIncomingRef();
        setTimeout(function () { syncCloud(true); }, 80);
        showToast('🎉 Контракт подписан (16 лет, Д2)! Добро пожаловать в ' + getClub(state.clubId).name + '!');
        render();
      }
      else if (act === 'rest') {
        var rg = state.age <= 19 ? 38 : 30;
        state.energy = clamp(state.energy + rg, 0, 100); state.happiness = clamp(state.happiness + 4, 0, 100);
        saveState(); showToast('😴 Отдых: +' + rg + '% энергии'); render();
      }
      else if (act === 'adEnergy') {
        showRewardedAd('Восстановление +40% энергии для матчей и тренировок', function () {
          state.energy = clamp(state.energy + 40, 0, 100); saveState(); showToast('⚡ +40% энергии получено!'); render();
        });
      }
      else if (act === 'startTrain') startTrain(id);
      else if (act === 'trainTap') tapTrain();
      else if (act === 'trainClose') { trainGame = null; render(); }
      else if (act === 'renew') renewContract();
      else if (act === 'playLeague') {
        var rArr = state.divRosters[state.lgId][state.div === 1 ? 'd1' : 'd2'].filter(function (x) { return x !== state.clubId; });
        startMatch('league', { oppClub: getClub(rArr[(state.tour - 1) % rArr.length]) });
      }
      else if (act === 'playUcl') {
        var ev = getPendingUcl(state);
        if (!ev || !ev.myMatch) return;
        var oId = ev.myMatch.h === state.clubId ? ev.myMatch.a : ev.myMatch.h;
        startMatch('ucl', { ev: ev, oppClub: getClub(oId) });
      }
      else if (act === 'playIntl') {
        if (!state.pendingIntl) return;
        var oc = state.pendingIntl.opp;
        startMatch('intl', { isFinal: state.pendingIntl.isFinal, oppClub: { id: 'i_' + oc.id, name: 'Сборная ' + oc.name, ovr: oc.str, c1: '#b45309', c2: '#fbbf24', short: oc.id.toUpperCase() } });
      }
      else if (act === 'mChoice') pickMatchChoice(id);
      else if (act === 'mStop') stopMatchTiming();
      else if (act === 'mGoal') pickGoalZone(Number(id));
      else if (act === 'mPen') takeMatchPenalty(Number(id));
      else if (act === 'closeMatch') { liveMatch = null; render(); }
      else if (act === 'ansInt') {
        var opt = state.pendingInterview && state.pendingInterview.opts[Number(id)];
        if (opt) {
          if (opt.eff.trust) state.trust = clamp(state.trust + opt.eff.trust, 0, 100);
          if (opt.eff.fans) state.fans += opt.eff.fans;
          if (opt.eff.hap) state.happiness = clamp(state.happiness + opt.eff.hap, 0, 100);
        }
        state.pendingInterview = null; saveState(); showToast('🎙️ Ответ опубликован в прессе!'); render();
      }
      else if (act === 'ansEv') {
        var eo = state.pendingEvent && state.pendingEvent.o[Number(id)];
        if (eo && eo.eff) {
          var ef = eo.eff;
          if (ef.money) state.money += ef.money;
          if (ef.en) state.energy = clamp(state.energy + ef.en, 0, 100);
          if (ef.trust) state.trust = clamp(state.trust + ef.trust, 0, 100);
          if (ef.hap) state.happiness = clamp(state.happiness + ef.hap, 0, 100);
          if (ef.fans) state.fans += ef.fans;
          if (ef.sho) state.stats.sho = clamp(state.stats.sho + ef.sho, 40, 99);
          if (ef.pas) state.stats.pas = clamp(state.stats.pas + ef.pas, 40, 99);
          if (ef.phy) state.stats.phy = clamp(state.stats.phy + ef.phy, 40, 99);
        }
        state.pendingEvent = null; saveState(); showToast('✅ Решение принято!'); render();
      }
      else if (act === 'nextSeason') finishSeason();
      else if (act === 'retireHof') { state.retired = true; saveState(); render(); }
      else if (act === 'newCareerHof') { state.created = false; state.retired = false; ui.wizStep = 1; saveState(); render(); }
      else if (act === 'lgSub') { ui.leagueSub = id; render(); }
      else if (act === 'lgCtry') { ui.leagueCountry = id; render(); }
      else if (act === 'transfer') makeTransfer(id);
      else if (act === 'buyLife') {
        var it = LIFESTYLE_SHOP.find(function (x) { return x.id === id; });
        if (!it || state.bought[id] || state.money < it.price) return;
        state.money -= it.price; state.bought[id] = true;
        var ef2 = it.eff;
        if (ef2.sho) state.stats.sho = clamp(state.stats.sho + ef2.sho, 40, 99);
        if (ef2.pas) state.stats.pas = clamp(state.stats.pas + ef2.pas, 40, 99);
        if (ef2.dri) state.stats.dri = clamp(state.stats.dri + ef2.dri, 40, 99);
        if (ef2.phy) state.stats.phy = clamp(state.stats.phy + ef2.phy, 40, 99);
        if (ef2.en) state.energy = clamp(state.energy + ef2.en, 0, 100);
        if (ef2.hap) state.happiness = clamp(state.happiness + ef2.hap, 0, 100);
        if (ef2.fans) state.fans += ef2.fans;
        state.peakOvr = Math.max(state.peakOvr || 54, calcOVR(state.stats, state.pos));
        saveState(); showToast('✅ Куплено: ' + it.name + '!'); render();
      }
      else if (act === 'onSub') { ui.onlineSub = id; render(); }
      else if (act === 'syncCloud') syncCloud(false);
      else if (act === 'claimDiv') {
        var d2 = getEloDiv(state.pvp.elo);
        state.pvp.lastDivWeek = weekKey(); state.onlineBalance += d2.reward;
        saveState(); showToast('🎁 Дивизион ' + d2.name + ': +' + fmtCoin(d2.reward)); render();
      }
      else if (act === 'newOpp') { pickPvpOpponent(); render(); }
      else if (act === 'setTac') { state.pvp.tactic = id; saveState(); render(); }
      else if (act === 'setStake') { state.pvp.stake = Number(id); saveState(); render(); }
      else if (act === 'scoutCoin') {
        if (state.onlineBalance < 1500) { showToast('Нужно 1 500 🪙!'); return; }
        state.onlineBalance -= 1500; state.pvp.scoutedId = (ui.pvpOpp || FALLBACK_BOTS[0]).tg_id;
        saveState(); showToast('🔍 Тактика соперника раскрыта!'); render();
      }
      else if (act === 'scoutAd') {
        showRewardedAd('Разведка тактики соперника в PvP', function () {
          state.pvp.scoutedId = (ui.pvpOpp || FALLBACK_BOTS[0]).tg_id; saveState(); showToast('🔍 Тактика раскрыта!'); render();
        });
      }
      else if (act === 'playPvp') playPvp(ui.pvpOpp, null);
      else if (act === 'pvpPen') takePvpPen(Number(id));
      else if (act === 'revenge') {
        var rl = ui.revengeLogs[Number(id)];
        if (!rl) return;
        var found = ui.leaderboard.find(function (p) { return p.tg_id === rl.attacker_tg_id; }) || { tg_id: rl.attacker_tg_id, name: rl.attacker_name, club: 'Соперник', position: 'ST', ovr: calcOVR(state.stats, state.pos) + 1, tactic: 'press', rating: state.pvp.elo };
        playPvp(found, rl);
      }
      else if (act === 'oBuy') {
        if (id === 'ticket' && state.onlineBalance >= 4000 && (state.online.pvpExtra || 0) < CONFIG.DAILY_PVP_EXTRA_MAX) {
          state.onlineBalance -= 4000; state.online.pvpExtra = (state.online.pvpExtra || 0) + 1;
          saveState(); showToast('🎟️ +1 PvP-матч добавлен на сегодня!'); render();
        } else if (id === 'doping' && state.onlineBalance >= 3000 && !state.onlineBuffs.doping) {
          state.onlineBalance -= 3000; state.onlineBuffs.doping = true;
          saveState(); showToast('⚡ Тактический допинг +8% активирован!'); render();
        } else if (id === 'shield' && state.onlineBalance >= 5000 && !state.onlineBuffs.eloShield) {
          state.onlineBalance -= 5000; state.onlineBuffs.eloShield = true;
          saveState(); showToast('🛡️ Щит ELO активирован!'); render();
        } else if (id === 'vip' && state.onlineBalance >= 25000 && !state.onlineBuffs.vipFrame) {
          state.onlineBalance -= 25000; state.onlineBuffs.vipFrame = true;
          saveState(); syncCloud(true); showToast('👑 VIP-рамка куплена и видна в Топ-50!'); render();
        } else {
          showToast('Недостаточно 🪙 PRO-кредитов!');
        }
      }
      else if (act === 'adCoins') {
        showRewardedAd('Пополнение Онлайн-кошелька на +2 500 🪙', function () {
          state.onlineBalance += 2500; saveState(); showToast('🪙 +2 500 🪙 зачислено!'); render();
        });
      }
      else if (act === 'taskAct') {
        var tk = ui.tasks.find(function (x) { return x.id === id; });
        if (!tk || state.claimedTasks[id]) return;
        if (ui.taskTimers[id] === 'ready') {
          state.claimedTasks[id] = true; state.onlineBalance += Number(tk.reward) || 2500;
          delete ui.taskTimers[id]; saveState(); showToast('🎁 +' + fmtCoin(tk.reward) + ' за задание!'); render();
        } else if (!ui.taskTimers[id]) {
          try {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) window.Telegram.WebApp.openTelegramLink(tk.url);
            else window.open(tk.url, '_blank');
          } catch (ex) {}
          ui.taskTimers[id] = 5; render();
          var tiv = setInterval(function () {
            if (typeof ui.taskTimers[id] !== 'number') { clearInterval(tiv); return; }
            ui.taskTimers[id]--;
            if (ui.taskTimers[id] <= 0) { ui.taskTimers[id] = 'ready'; clearInterval(tiv); }
            render();
          }, 1000);
        }
      }
      else if (act === 'copyRef') {
        var ri = document.getElementById('refInp');
        if (ri) { ri.select(); try { document.execCommand('copy'); showToast('📋 Ссылка скопирована!'); } catch (ex) { showToast('Скопируйте ссылку из поля'); } }
      }
      else if (act === 'claimRef') claimReferrals();
    });

    /* =====================================================================
       15. SYNCHRONOUS ZERO-HANG BOOT()
       ===================================================================== */
    function boot() {
      try {
        initTelegramSafe();
        state = loadState();
        ui.leagueCountry = state.lgId || 'ru';
        ui.leagueSub = state.div === 1 ? 'd1' : 'd2';
        if (!state.created) buildWizOffers(ui.wizLg);
        pickPvpOpponent();
        render();
      } catch (err) {
        if (window.__showFatalError) window.__showFatalError(err && err.message ? err.message : String(err), '');
      } finally {
        window.__BOOT_DONE = true;
        var b = document.getElementById('boot-screen');
        if (b) b.style.display = 'none';
      }

      // Фоновые процессы строго ПОСЛЕ показа интерфейса
      setTimeout(function () {
        if (state.created) {
          recordIncomingRef();
          syncCloud(true);
        }
      }, 60);

      setInterval(function () {
        var el = document.getElementById('pvpTimer');
        if (el) el.textContent = timeToMidnight();
      }, 1000);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
</html>
