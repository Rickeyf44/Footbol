      try {
        const hf = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback;
        if (!hf) return;
        if (type === 'success' || type === 'error' || type === 'warning') hf.notificationOccurred(type);
        else hf.impactOccurred(type);
      } catch (_) {}
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-box');
      if (!box) return;
      const styles = {
        success: 'bg-emerald-950/95 border-emerald-500/60 text-emerald-200',
        error:   'bg-rose-950/95 border-rose-500/60 text-rose-200',
        gold:    'bg-amber-950/95 border-amber-400/70 text-amber-200',
        info:    'bg-slate-900/95 border-slate-600/60 text-slate-100'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-2 rounded-xl border text-xs font-semibold shadow-xl text-center anim ${styles[type] || styles.info}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 260);
      }, 2400);
    }

    function copySafe(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (_) {
        return false;
      }
    }

      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

    function getDivision(divId) {
      return DIVISIONS[Math.max(0, Math.min(DIVISIONS.length - 1, Number(divId) || 0))];
    }

    function getClubById(clubId) {
      for (const div of DIVISIONS) {
        const c = div.clubs.find(x => x.id === clubId);
        if (c) return { ...c, divId: div.id, divName: div.name, divBadge: div.badge };
      }
      const fallback = DIVISIONS[0].clubs[0];
      return { ...fallback, divId: 0, divName: DIVISIONS[0].name, divBadge: DIVISIONS[0].badge };
    }

    function calcOvr(stats, posKey) {
      const pos = POSITIONS[posKey] || POSITIONS.ST;
      const w = pos.w;
      const val =
        stats.sho * w.sho +
        stats.pas * w.pas +
        stats.pac * w.pac +
        stats.dri * w.dri +
        stats.def * w.def +
        stats.phy * w.phy;
      return Math.min(99, Math.max(45, Math.round(val)));
    }

    function getEffectiveStats() {
      const base = state.player.stats;
      const bonus = { sho: 0, pas: 0, pac: 0, dri: 0, def: 0, phy: 0 };
      const owned = state.player.ownedItems || [];
      LIFESTYLE_ITEMS.forEach(item => {
        if (!item.consumable && owned.includes(item.id) && item.ef && item.ef.stat) {
          Object.keys(item.ef.stat).forEach(k => {
            bonus[k] = Math.max(bonus[k], item.ef.stat[k]);
          });
        }
      });
      return {
        sho: Math.min(99, base.sho + bonus.sho),
        pas: Math.min(99, base.pas + bonus.pas),
        pac: Math.min(99, base.pac + bonus.pac),
        dri: Math.min(99, base.dri + bonus.dri),
        def: Math.min(99, base.def + bonus.def),
        phy: Math.min(99, base.phy + bonus.phy),
        bonus
      };
    }

    function getLifestyleBonuses() {
      const owned = state.player.ownedItems || [];
      let energyRegen = 0;
      let trainBonus = 0;
      LIFESTYLE_ITEMS.forEach(item => {
        if (!item.consumable && owned.includes(item.id) && item.ef) {
          if (item.ef.energyRegen) energyRegen += item.ef.energyRegen;
          if (item.ef.trainBonus) trainBonus += item.ef.trainBonus;
        }
      });
      return { energyRegen, trainBonus };
    }

    function buildDivisionSchedule(divId) {
      const div = getDivision(divId);
      const ids = div.clubs.map(c => c.id);
      const n = ids.length;
      const half = n / 2;
      const arr = [...ids];
      const firstHalf = [];
      for (let r = 0; r < n - 1; r++) {
        const roundMatches = [];
        for (let i = 0; i < half; i++) {
          const home = r % 2 === 0 ? arr[i] : arr[n - 1 - i];
          const away = r % 2 === 0 ? arr[n - 1 - i] : arr[i];
          roundMatches.push({ home, away });
        }
        firstHalf.push(roundMatches);
        arr.splice(1, 0, arr.pop());
      }
      const secondHalf = firstHalf.map(r => r.map(m => ({ home: m.away, away: m.home })));
      return [...firstHalf, ...secondHalf]; // 14 rounds
    }

    function buildDivisionTable(divId) {
      return getDivision(divId).clubs.map(c => ({
        clubId: c.id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0
      }));
    }

    function sortLeagueTable(rows) {
      return [...rows].sort((a, b) => (b.pts - a.pts) || ((b.gf - b.ga) - (a.gf - a.ga)) || (b.gf - a.gf));
    }

      if (typeof state.adEnergyUsedDay !== 'number') state.adEnergyUsedDay = 0;
      if (!Array.isArray(state.offers)) state.offers = [];

      const p = state.player;
      if (!POSITIONS[p.pos]) p.pos = 'ST';
      if (typeof p.divId !== 'number') p.divId = 0;
      if (!p.clubId) p.clubId = getDivision(p.divId).clubs[0].id;

      if (!Array.isArray(p.ownedItems)) p.ownedItems = [];
      if (!p.seasonStats) p.seasonStats = { m: 0, g: 0, a: 0, rSum: 0 };
      if (!p.careerStats) p.careerStats = { m: 0, g: 0, a: 0, trophies: 0 };

      if (!Array.isArray(state.schedule) || state.schedule.length === 0) {

    function getSupabaseHeaders(extra = {}) {
      const headers = {
        'apikey': CONFIG.SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        ...extra
      };
      // CRITICAL FIX: Only send Authorization: Bearer for legacy JWT keys starting with "eyJ".
      // New Supabase publishable keys ("sb_publishable_...") are NOT JWTs and cause HTTP 401 if sent in Authorization.
      if (CONFIG.SUPABASE_ANON_KEY && CONFIG.SUPABASE_ANON_KEY.startsWith('eyJ')) {
        headers['Authorization'] = 'Bearer ' + CONFIG.SUPABASE_ANON_KEY;
      }
      return headers;
    }

    function buildSupabasePlayerPayload() {
      const p = state.player;
      const club = getClubById(p.clubId);
      const eff = getEffectiveStats();
      return {
        tg_id: String(tgUser.id),
        name: String(p.name || 'Игрок').slice(0, 32),
        club: String(club.name),
        position: String(p.pos || 'ST'),
        ovr: parseInt(calcOvr(eff, p.pos), 10),
        tactic: String(state.online.defenseTactic || 'press'),
        rating: parseInt(state.online.rating || 1000, 10),
        wins: parseInt(state.online.wins || 0, 10),
        draws: parseInt(state.online.draws || 0, 10),
        losses: parseInt(state.online.losses || 0, 10),
        updated_at: new Date().toISOString()
      };
    }

    async function upsertPlayerToSupabase() {
      const url = `${CONFIG.SUPABASE_URL.replace(/\/+$/, '')}/rest/v1/players?on_conflict=tg_id`;
      const payload = buildSupabasePlayerPayload();
      const res = await fetch(url, {
        method: 'POST',
        headers: getSupabaseHeaders({
          'Prefer': 'resolution=merge-duplicates,return=representation'
        }),
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${errText.slice(0, 140)}`);
      }
      return await res.json().catch(() => []);
    }

    async function fetchSupabaseLeaderboard() {
      const url = `${CONFIG.SUPABASE_URL.replace(/\/+$/, '')}/rest/v1/players?select=*&order=rating.desc&limit=50`;
      const res = await fetch(url, {
        method: 'GET',
        headers: getSupabaseHeaders()
      });

      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${errText.slice(0, 140)}`);
      }
      const rows = await res.json();
      return Array.isArray(rows) ? rows : [];
    }

    function getTrainCost(statVal, baseCost) {
      return Math.round(baseCost * (1 + Math.max(0, statVal - 55) * 0.08));
    }

    function doTraining(statKey) {
      const p = state.player;
      const meta = STAT_LIST.find(x => x.key === statKey);
      if (!meta) return;
      if (state.trainSlots <= 0) return showToast('Тренировки на сегодня закончились!', 'error');
      if (p.stats[statKey] >= 99) return showToast('Навык уже на максимуме (99)!', 'gold');

      const cost = getTrainCost(p.stats[statKey], meta.baseCost);
      if (p.energy < meta.energy) return showToast('Недостаточно энергии! Восстановитесь или посмотрите ролик.', 'error');
      if (p.money < cost) return showToast(`Нужно ${fmtMoney(cost)} на тренировку!`, 'error');

      p.energy -= meta.energy;
      p.money -= cost;
      state.trainSlots -= 1;

      const bonuses = getLifestyleBonuses();
      const doubleChance = 0.14 + bonuses.trainBonus + (p.happiness >= 80 ? 0.1 : 0);
      const gain = Math.random() < doubleChance ? 2 : 1;
      p.stats[statKey] = Math.min(99, p.stats[statKey] + gain);
      p.form = Math.min(100, p.form + 3);
      saveState();
      haptic('success');
      render();
      showToast(`${meta.icon} ${meta.name} +${gain} (теперь ${p.stats[statKey]})!`, gain > 1 ? 'gold' : 'success');
    }

        saveState();

        showToast('+45% энергии и +1 тренировка!', 'gold');
      });
    }

    function buyLifestyleItem(itemId) {
      const item = LIFESTYLE_ITEMS.find(x => x.id === itemId);
      const p = state.player;
      if (!item) return;
      if (!item.consumable && p.ownedItems.includes(item.id)) return;
      if (p.money < item.cost) return showToast('Недостаточно средств!', 'error');

      p.money -= item.cost;
      const ef = item.ef || {};
      if (item.consumable) {
        if (ef.energyNow) p.energy = Math.min(100, p.energy + ef.energyNow);
        if (ef.happyNow) p.happiness = Math.min(100, p.happiness + ef.happyNow);
        showToast(`${item.icon} ${item.name} — отличное восстановление!`, 'success');
      } else {
        p.ownedItems.push(item.id);
        if (ef.happy) p.happiness = Math.min(100, p.happiness + ef.happy);
        if (ef.fans) p.fans += ef.fans;
        showToast(`Куплено: ${item.name}!`, 'gold');
      }
      saveState();
      haptic('success');
      render();
    }

    /* =========================================================================
       9. CAREER MATCH ENGINE & 5-LEAGUE PROGRESSION
       ========================================================================= */
    function getNextCareerMatch() {
      if (state.round >= state.schedule.length) return null;
      const roundMatches = state.schedule[state.round] || [];
      const m = roundMatches.find(x => x.home === state.player.clubId || x.away === state.player.clubId);
      if (!m) return null;
      const isHome = m.home === state.player.clubId;
      return {
        round: state.round + 1,
        totalRounds: state.schedule.length,
        home: m.home,
        away: m.away,
        isHome,
        oppId: isHome ? m.away : m.home
      };
    }

    function simulateAiScore(homeClub, awayClub) {
      const diff = (homeClub.ovr + 1.5) - awayClub.ovr;
      const poisson = lam => {
        let L = Math.exp(-lam), k = 0, p = 1;
        do { k++; p *= Math.random(); } while (p > L && k < 7);
        return k - 1;
      };
      return {
        hg: poisson(Math.max(0.35, 1.3 + diff * 0.06)),
        ag: poisson(Math.max(0.3, 1.1 - diff * 0.05))
      };
    }

    function applyLeagueResult(homeId, awayId, hg, ag) {
      const hr = state.leagueTable.find(r => r.clubId === homeId);
      const ar = state.leagueTable.find(r => r.clubId === awayId);
      if (!hr || !ar) return;
      hr.p++; ar.p++;
      hr.gf += hg; hr.ga += ag;
      ar.gf += ag; ar.ga += hg;
      if (hg > ag) { hr.w++; hr.pts += 3; ar.l++; }
      else if (ag > hg) { ar.w++; ar.pts += 3; hr.l++; }
      else { hr.d++; hr.pts++; ar.d++; ar.pts++; }
    }

    function simOtherMatchesInRound(roundIdx, excludeMatch) {
      const ms = state.schedule[roundIdx] || [];
      ms.forEach(m => {
        if (excludeMatch && m.home === excludeMatch.home && m.away === excludeMatch.away) return;
        const s = simulateAiScore(getClubById(m.home), getClubById(m.away));
        applyLeagueResult(m.home, m.away, s.hg, s.ag);
      });
    }

    function momentSuccessChance(statKey, oppOvr, bonus = 0) {
      const eff = getEffectiveStats();
      const p = state.player;
      const happyBonus = p.happiness >= 80 ? 6 : (p.happiness < 40 ? -8 : 0);
      const energyMod = p.energy < 25 ? -10 : 0;
      const formMod = Math.round((p.form - 70) * 0.25);
      return Math.max(15, Math.min(95, Math.round(54 + (eff[statKey] - oppOvr) * 1.45 + happyBonus + energyMod + formMod + bonus)));
    }

    function createCareerMoment(opp) {
      const o = opp.ovr;
      const scenarios = [
        {
          title: 'Выход 1 на 1 с вратарём!', icon: '🔥',
          desc: `Вы убегаете от защитников ${opp.name} к воротам!`,
          choices: [
            { label: 'Пробить в девятку', stat: 'sho', ch: momentSuccessChance('sho', o, 2), type: 'goal', ok: 'ГОЛ! Мяч вонзается под перекладину!', fail: 'Голкипер кончиками пальцев переводит на угловой.' },
            { label: 'Обыграть на замахе', stat: 'dri', ch: momentSuccessChance('dri', o, -1), type: 'goal', ok: 'ГОЛ! Вратарь уложен на газон!', fail: 'Защитник успел выбить мяч в подкате.' },
            { label: 'Покатить на пустые', stat: 'pas', ch: momentSuccessChance('pas', o, 8), type: 'assist', ok: 'АССИСТ! Партнёр спокойно забивает!', fail: 'Передача оказалась чуть неточной.' }
          ]
        },
        {
          title: 'Опасный прорыв по флангу!', icon: '💨',
          desc: 'Есть пространство для ускорения и обострения.',
          choices: [
            { label: 'Прорваться и пробить', stat: 'pac', ch: momentSuccessChance('pac', o, 0), type: 'goal', ok: 'ГОЛ! Сместился в центр и точно пробил!', fail: 'Удар заблокирован защитником.' },
            { label: 'Навес в штрафную', stat: 'pas', ch: momentSuccessChance('pas', o, 7), type: 'assist', ok: 'АССИСТ! Идеальная подача точно на голову!', fail: 'Вратарь уверенно сыграл на выходе.' }
          ]
        },
        {
          title: 'Опасная атака соперника!', icon: '🛡️', isDef: true,
          desc: `Игрок ${opp.name} врывается в вашу штрафную!`,
          choices: [
            { label: 'Чистый подкат', stat: 'def', ch: momentSuccessChance('def', o, 4), type: 'save', ok: 'Блестящий отбор! Атака остановлена.', fail: 'Соперник ушёл от подката и забил гол...' },
            { label: 'Поставить корпус', stat: 'phy', ch: momentSuccessChance('phy', o, 2), type: 'save', ok: 'Мощная игра корпусом — мяч ваш!', fail: 'Форвард продавил и отправил мяч в сетку.' }
          ]
        }
      ];
      return scenarios[Math.floor(Math.random() * scenarios.length)];
    }

    function startCareerMatch(quickSim = false) {
      const next = getNextCareerMatch();
      if (!next) {
        openSeasonEndModal();
        return;
      }
      if (state.player.energy < 15) {
        showToast('Слишком мало энергии (<15%)! Восстановитесь в Тренировках или Лайфстайле.', 'error');
        return;
      }

      const myClub = getClubById(state.player.clubId);
      const oppClub = getClubById(next.oppId);

      if (quickSim) {
        const s = simulateAiScore(myClub, oppClub);
        const eff = getEffectiveStats();
        const myOvr = calcOvr(eff, state.player.pos);
        const pg = s.hg > 0 && Math.random() < (0.4 + (myOvr - oppClub.ovr) * 0.015) ? (Math.random() < 0.25 && s.hg >= 2 ? 2 : 1) : 0;
        const pa = s.hg > pg && Math.random() < 0.45 ? 1 : 0;
        const rating = Number(Math.min(10, Math.max(5.6, 6.4 + pg * 1.1 + pa * 0.7 + (s.hg > s.ag ? 0.5 : -0.2))).toFixed(1));
        finishCareerMatch({ next, myClub, oppClub, ms: s.hg, os: s.ag, pg, pa, rating });
        return;
      }

      liveCareerMatch = {
        next, myClub, oppClub,
        min: 0, ms: 0, os: 0, pg: 0, pa: 0, rating: 6.3,
        momentMins: [22, 54, 79],
        momentIdx: 0,
        activeMoment: null,
        log: [{ m: 0, t: `Стартовый свисток! ${myClub.name} — ${oppClub.name}`, c: 'info' }],
        timer: null,
        done: false
      };
      renderCareerMatchModal();
      resumeCareerMatchLoop();
    }

    function resumeCareerMatchLoop() {
      if (!liveCareerMatch || liveCareerMatch.done) return;
      clearInterval(liveCareerMatch.timer);
      liveCareerMatch.timer = setInterval(() => {
        if (!liveCareerMatch || liveCareerMatch.activeMoment) return;
        liveCareerMatch.min += 3;
        const diff = liveCareerMatch.myClub.ovr - liveCareerMatch.oppClub.ovr;

        if (liveCareerMatch.min < 88) {
          if (Math.random() < Math.max(0.012, 0.025 + diff * 0.0012)) {
            liveCareerMatch.ms++;
            liveCareerMatch.log.unshift({ m: liveCareerMatch.min, t: `⚽ Партнёр по «${liveCareerMatch.myClub.name}» забивает гол!`, c: 'good' });
          } else if (Math.random() < Math.max(0.012, 0.025 - diff * 0.0012)) {
            liveCareerMatch.os++;
            liveCareerMatch.log.unshift({ m: liveCareerMatch.min, t: `🔴 «${liveCareerMatch.oppClub.name}» поражает ворота.`, c: 'bad' });
          }
        }

        if (liveCareerMatch.momentMins[liveCareerMatch.momentIdx] && liveCareerMatch.min >= liveCareerMatch.momentMins[liveCareerMatch.momentIdx]) {
          clearInterval(liveCareerMatch.timer);
          liveCareerMatch.activeMoment = createCareerMoment(liveCareerMatch.oppClub);
          liveCareerMatch.momentIdx++;
          haptic('medium');
          renderCareerMatchModal();
          return;
        }

        if (liveCareerMatch.min >= 90) {
          liveCareerMatch.min = 90;
          clearInterval(liveCareerMatch.timer);
          liveCareerMatch.done = true;
          liveCareerMatch.log.unshift({ m: 90, t: '🏁 Финальный свисток!', c: 'info' });
        }
        renderCareerMatchModal();
      }, 150);
    }

    function pickCareerMoment(choiceIdx) {
      if (!liveCareerMatch || !liveCareerMatch.activeMoment) return;
      const mom = liveCareerMatch.activeMoment;
      const choice = mom.choices[choiceIdx];
      const success = Math.random() * 100 < choice.ch;

      if (success) {
        haptic('success');
        if (choice.type === 'goal') { liveCareerMatch.ms++; liveCareerMatch.pg++; liveCareerMatch.rating = Math.min(10, liveCareerMatch.rating + 1.1); }
        else if (choice.type === 'assist') { liveCareerMatch.ms++; liveCareerMatch.pa++; liveCareerMatch.rating = Math.min(10, liveCareerMatch.rating + 0.8); }
        else { liveCareerMatch.rating = Math.min(10, liveCareerMatch.rating + 0.7); }
        liveCareerMatch.log.unshift({ m: liveCareerMatch.min, t: choice.ok, c: 'good' });
      } else {
        haptic('error');
        liveCareerMatch.rating = Math.max(4.8, liveCareerMatch.rating - 0.35);
        if (mom.isDef) liveCareerMatch.os++;
        liveCareerMatch.log.unshift({ m: liveCareerMatch.min, t: choice.fail, c: 'bad' });
      }

      liveCareerMatch.activeMoment = null;
      renderCareerMatchModal();
      setTimeout(resumeCareerMatchLoop, 380);
    }

    function renderCareerMatchModal() {
      const lm = liveCareerMatch;
      if (!lm) return;
      const momHtml = lm.activeMoment ? `
        <div class="mt-3 p-3.5 rounded-2xl bg-slate-900 border border-emerald-500/50 anim">
          <div class="text-xs font-bold text-emerald-400">${lm.activeMoment.icon} ${lm.activeMoment.title}</div>
          <div class="text-[11px] text-slate-300 mt-1 mb-2.5">${lm.activeMoment.desc}</div>
          <div class="flex flex-col gap-1.5">
            ${lm.activeMoment.choices.map((c, idx) => `
              <button onclick="pickCareerMoment(${idx})" class="w-full p-2.5 rounded-xl bg-slate-800 border border-white/10 flex justify-between items-center text-left active:scale-[0.98]">
                <span class="text-xs font-bold">${c.label} <span class="text-[10px] text-sky-300">(${c.stat.toUpperCase()})</span></span>
                <span class="font-sport text-sm font-bold ${c.ch >= 65 ? 'text-emerald-400' : 'text-amber-300'}">${c.ch}%</span>
              </button>
            `).join('')}
          </div>
        </div>
      ` : '';

      openModal(`
        <div class="w-full max-w-[430px] glass p-4 flex flex-col max-h-[90vh]">
          <div class="bg-slate-950 rounded-2xl p-3 border border-white/10">
            <div class="flex justify-between text-[11px] mb-1.5">
              <span class="text-slate-400">Тур ${lm.next.round}/${lm.next.totalRounds}</span>
              <span class="font-sport font-bold text-emerald-400">${lm.min}'</span>
              <span class="text-amber-300 font-bold">⭐ ${lm.rating.toFixed(1)}</span>
            </div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 w-[38%]">${clubCrestSvg(lm.myClub, 32)}<span class="text-xs font-bold truncate">${escapeHtml(lm.myClub.short)}</span></div>
              <div class="font-sport text-3xl font-bold">${lm.ms} : ${lm.os}</div>
              <div class="flex items-center justify-end gap-2 w-[38%]"><span class="text-xs font-bold truncate">${escapeHtml(lm.oppClub.short)}</span>${clubCrestSvg(lm.oppClub, 32)}</div>
            </div>
          </div>
          ${momHtml}
          <div class="mt-3 flex-1 overflow-y-auto space-y-1.5 max-h-44">
            ${lm.log.map(item => `
              <div class="text-[11px] px-2.5 py-1.5 rounded-lg border ${item.c === 'good' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : (item.c === 'bad' ? 'bg-rose-500/10 border-rose-500/30 text-rose-200' : 'bg-slate-900 border-white/5 text-slate-300')}">
                <b>${item.m}'</b> ${escapeHtml(item.t)}
              </div>
            `).join('')}
          </div>
          ${lm.done ? `<button onclick="completeLiveCareerMatch()" class="btn-primary py-3 text-sm mt-3 w-full">К итогам матча →</button>` : ''}
        </div>
      `);
    }

    function completeLiveCareerMatch() {
      const lm = liveCareerMatch;
      liveCareerMatch = null;
      finishCareerMatch({
        next: lm.next, myClub: lm.myClub, oppClub: lm.oppClub,
        ms: lm.ms, os: lm.os, pg: lm.pg, pa: lm.pa, rating: Number(lm.rating.toFixed(1))
      });
    }

    function finishCareerMatch(res) {
      const p = state.player;
      const won = res.ms > res.os;
      const draw = res.ms === res.os;
      const hg = res.next.isHome ? res.ms : res.os;
      const ag = res.next.isHome ? res.os : res.ms;

      applyLeagueResult(res.next.home, res.next.away, hg, ag);
      simOtherMatchesInRound(state.round, { home: res.next.home, away: res.next.away });

      state.round += 1;
      state.day += 1;
      state.trainSlots = 3;

      p.seasonStats.m += 1;
      p.seasonStats.g += res.pg;
      p.seasonStats.a += res.pa;
      p.seasonStats.rSum += res.rating;
      p.careerStats.m += 1;
      p.careerStats.g += res.pg;
      p.careerStats.a += res.pa;

      const salaryEarned = p.salary + (won ? Math.round(p.salary * 0.25) : 0) + res.pg * 1500;
      p.money += salaryEarned;
      lastCareerSalary = salaryEarned;
      salaryAdClaimed = false;

      const bonuses = getLifestyleBonuses();
      p.energy = Math.max(10, Math.min(100, p.energy - 22 + 12 + bonuses.energyRegen));
      p.happiness = Math.max(15, Math.min(100, p.happiness + (won ? 4 : (draw ? 1 : -3)) + res.pg * 2));
      p.form = Math.max(35, Math.min(100, p.form + (res.rating >= 7.5 ? 5 : (res.rating >= 6.6 ? 1 : -4))));
      p.fans += Math.round((res.pg * 1800 + res.pa * 900 + (won ? 800 : 200)) * (p.divId + 1));

      refreshTransferOffers();
      saveState();

      openModal(`
        <div class="w-full max-w-[410px] glass p-5 anim">
          <div class="text-center font-sport text-2xl font-bold ${won ? 'text-emerald-400' : (draw ? 'text-amber-300' : 'text-rose-400')}">
            ${won ? 'ПОБЕДА!' : (draw ? 'НИЧЬЯ' : 'ПОРАЖЕНИЕ')} (${res.ms} : ${res.os})
          </div>
          <div class="text-center text-[11px] text-slate-400 mt-0.5">Игровой день ${state.day - 1} завершён</div>
          <div class="grid grid-cols-3 gap-2 my-3 text-center">
            <div class="bg-slate-900 rounded-xl p-2"><div class="text-[10px] text-slate-400">Оценка</div><div class="font-sport text-xl text-amber-300">${res.rating} ⭐</div></div>
            <div class="bg-slate-900 rounded-xl p-2"><div class="text-[10px] text-slate-400">Голы</div><div class="font-sport text-xl text-emerald-400">${res.pg}</div></div>
            <div class="bg-slate-900 rounded-xl p-2"><div class="text-[10px] text-slate-400">Ассисты</div><div class="font-sport text-xl text-sky-400">${res.pa}</div></div>
          </div>
          <div class="bg-slate-900/70 rounded-xl p-3 border border-white/5 text-xs space-y-1">
            <div class="flex justify-between"><span class="text-slate-400">Зарплата и бонусы</span><b class="text-emerald-400">+${fmtMoney(salaryEarned)}</b></div>
            <div class="flex justify-between"><span class="text-slate-400">Энергия на новый день</span><b>${p.energy}%</b></div>
          </div>
          <div id="salary-ad-wrap" class="mt-3">
            <button onclick="claimDoubleSalaryAd()" class="btn-ad w-full py-3 text-xs">🎬 Удвоить зарплату (+${fmtMoney(salaryEarned)})</button>
          </div>
          <button onclick="closeCareerPostMatch()" class="btn-primary w-full py-3 text-sm mt-2">Следующий день →</button>
        </div>
      `);
    }

    function claimDoubleSalaryAd() {
      if (salaryAdClaimed) return;
      showRewardedAd('double_salary', () => {
        salaryAdClaimed = true;
        state.player.money += lastCareerSalary;
        saveState();
        const w = document.getElementById('salary-ad-wrap');
        if (w) w.innerHTML = `<div class="p-2.5 rounded-xl bg-emerald-500/15 text-emerald-300 text-xs font-bold text-center">✓ Зарплата удвоена (+${fmtMoney(lastCareerSalary)})!</div>`;
        render();
      });
    }

    function closeCareerPostMatch() {
      closeModal();
      if (state.round >= state.schedule.length) {
        openSeasonEndModal();
      } else {
        render();
      }
    }

    function refreshTransferOffers() {
      const p = state.player;
      const ovr = calcOvr(getEffectiveStats(), p.pos);
      const candidates = [];
      DIVISIONS.forEach(div => {
        div.clubs.forEach(c => {
          if (c.id !== p.clubId && c.ovr <= ovr + 4 && c.ovr >= Math.max(56, ovr - 4)) {
            candidates.push({ ...c, divId: div.id, divName: div.name, divBadge: div.badge, sal: Math.round(div.salaryBase * (1 + (c.ovr - div.minOvr) * 0.05) / 500) * 500 });
          }
        });
      });
      candidates.sort(() => Math.random() - 0.5);
      state.offers = candidates.slice(0, 3).map((c, idx) => ({
        id: 'tr_' + Date.now() + '_' + idx,
        clubId: c.id,
        divId: c.divId,
        salary: Math.max(6000, c.sal)
      }));
    }

    function acceptTransfer(offerId) {
      const o = state.offers.find(x => x.id === offerId);
      if (!o) return;
      const club = getClubById(o.clubId);
      const changedDiv = club.divId !== state.player.divId;
      state.player.clubId = club.id;
      state.player.divId = club.divId;
      state.player.salary = o.salary;
      state.player.happiness = Math.min(100, state.player.happiness + 10);
      state.offers = [];
      if (changedDiv) {
        state.round = 0;
        state.leagueTable = buildDivisionTable(club.divId);
        state.schedule = buildDivisionSchedule(club.divId);
      }
      saveState();
      haptic('success');
      render();
      showToast(`Трансфер в «${club.name}» (${club.divName})!`, 'gold');
    }

    function openSeasonEndModal() {
      const p = state.player;
      const div = getDivision(p.divId);
      const sorted = sortLeagueTable(state.leagueTable);
      const rank = sorted.findIndex(r => r.clubId === p.clubId) + 1;
      const promoted = rank <= 2 && p.divId < DIVISIONS.length - 1;
      const relegated = rank >= 7 && p.divId > 0;
      const champion = rank === 1;

      openModal(`
        <div class="w-full max-w-[410px] glass p-5 text-center anim">
          <div class="text-xs font-bold uppercase text-amber-400">Итоги сезона ${state.season}</div>
          <h2 class="font-sport text-2xl font-bold mt-1">${div.badge} ${div.name} — ${rank}-е место</h2>
          <div class="grid grid-cols-2 gap-2 my-3 text-xs">
            <div class="bg-slate-900 p-2.5 rounded-xl">Голы за сезон: <b class="text-emerald-400">${p.seasonStats.g}</b></div>
            <div class="bg-slate-900 p-2.5 rounded-xl">Ассисты: <b class="text-sky-400">${p.seasonStats.a}</b></div>
          </div>
          <div class="space-y-1.5 text-xs mb-4">
            ${champion ? `<div class="p-2.5 rounded-xl bg-amber-500/20 text-amber-200 font-bold">🏆 Чемпион дивизиона! Премия +${fmtMoney(div.salaryBase * 8)}</div>` : ''}
            ${promoted ? `<div class="p-2.5 rounded-xl bg-emerald-500/20 text-emerald-300 font-bold">⬆️ Повышение в «${DIVISIONS[p.divId + 1].name}»!</div>` : ''}
            ${relegated ? `<div class="p-2.5 rounded-xl bg-rose-500/20 text-rose-300 font-bold">⬇️ Вылет в «${DIVISIONS[p.divId - 1].name}»</div>` : ''}
          </div>
          <button onclick="startNextSeason(${rank})" class="btn-primary w-full py-3.5 text-sm">🚀 Начать Сезон ${state.season + 1}</button>
        </div>
      `);
    }

    function startNextSeason(rank) {
      const p = state.player;
      const div = getDivision(p.divId);
      if (rank === 1) {
        p.careerStats.trophies += 1;
        p.money += div.salaryBase * 8;
      }
      if (rank <= 2 && p.divId < DIVISIONS.length - 1) {
        p.divId += 1;
        p.clubId = DIVISIONS[p.divId].clubs[0].id;
        p.salary = Math.max(p.salary, DIVISIONS[p.divId].salaryBase);
      } else if (rank >= 7 && p.divId > 0) {
        p.divId -= 1;
        p.clubId = DIVISIONS[p.divId].clubs[DIVISIONS[p.divId].clubs.length - 1].id;
      }

      p.age += 1;
      p.energy = 100;
      p.seasonStats = { m: 0, g: 0, a: 0, rSum: 0 };
      state.season += 1;
      state.round = 0;
      state.trainSlots = 3;
      state.leagueTable = buildDivisionTable(p.divId);
      state.schedule = buildDivisionSchedule(p.divId);
      refreshTransferOffers();
      saveState();
      closeModal();
      render();
      showToast(`Сезон ${state.season} стартовал!`, 'gold');
    }

    /* =========================================================================
       10. ONLINE MODE: PRO LEAGUE LIVE (DAILY PvP + TOP-50 SUPABASE)
       ========================================================================= */
    function getTodayDateStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getCountdownToMidnight() {
      const now = new Date();
      const next = new Date(now);
      next.setHours(24, 0, 0, 0);
      const sec = Math.max(0, Math.floor((next - now) / 1000));
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function getDailyPvpLimit() {
      return 1 + (state.online.extraMatchDate === getTodayDateStr() ? 1 : 0);
    }

    function getDailyPvpPlayed() {
      return state.online.lastPlayDate === getTodayDateStr() ? (state.online.playedToday || 0) : 0;
    }

    function isDailyPvpAvailable() {
      return getDailyPvpPlayed() < getDailyPvpLimit();
    }

    function pickPvpOpponent(silent = false) {
      const myId = String(tgUser.id);
      const realPlayers = onlineLeaderboard.filter(row => String(row.tg_id) !== myId);
      if (realPlayers.length > 0) {
        currentPvpOpponent = { ...realPlayers[Math.floor(Math.random() * realPlayers.length)], isSparring: false };
      } else {
        // Fallback sparring opponent if no other real players exist in Supabase yet
        const myOvr = calcOvr(getEffectiveStats(), state.player.pos);
        const base = SPARRING_OPPONENTS[Math.floor(Math.random() * SPARRING_OPPONENTS.length)];
        currentPvpOpponent = {
          ...base,
          ovr: Math.max(58, Math.min(94, myOvr + Math.floor(Math.random() * 7) - 3)),
          tactic: ['press', 'tiki', 'counter'][Math.floor(Math.random() * 3)]
        };
      }
      pvpScouted = false;
      if (!silent) {
        render();
        showToast(`Соперник найден: ${currentPvpOpponent.name}`, 'info');
      }
    }

    function setOnlineAttackTactic(tac) {
      state.online.attackTactic = tac;
      saveState();
      haptic('light');
      render();
    }

    function setOnlineDefenseTactic(tac) {
      state.online.defenseTactic = tac;
      saveState();

      upsertPlayerToSupabase().catch(() => {});

      showRewardedAd('scout_opponent', () => {

    function watchExtraPvpAd() {
      if (state.online.extraMatchDate === getTodayDateStr()) {
        showToast('Дополнительный матч на сегодня уже использован.', 'info');
        return;
      }
      showRewardedAd('extra_pvp_match', () => {

        showToast('+1 дополнительный PvP-матч разблокирован!', 'gold');

    function startPvpMatch() {
      if (!isDailyPvpAvailable()) {
        showToast('Лимит PvP-матчей на сегодня исчерпан!', 'info');
        return;
      }
      if (!currentPvpOpponent) pickPvpOpponent(true);

      const p = state.player;
      const opp = currentPvpOpponent;
      const myTac = TACTICS[state.online.attackTactic] || TACTICS.press;
      const oppTac = TACTICS[opp.tactic] || TACTICS.press;

      // Rock-Paper-Scissors modifier (±12%)
      let tacMod = 0;
      if (myTac.beats === oppTac.id) tacMod = 12;
      else if (myTac.losesTo === oppTac.id) tacMod = -12;

      const myOvr = calcOvr(getEffectiveStats(), p.pos);
      const winChance = Math.max(20, Math.min(82, 50 + (myOvr - (opp.ovr || 70)) * 1.5 + tacMod));

      let ms = 0, os = 0;
      const highlightMinutes = [14, 32, 53, 72, 87];
      const highlights = highlightMinutes.map(minute => {
        const roll = Math.random() * 100;
        if (roll < winChance * 0.56) {
          ms++;
          return { m: minute, side: 'my', text: `⚽ ${p.name} вскрывает оборону и забивает гол!`, ms, os };
        }
        if (roll < winChance * 0.56 + (100 - winChance) * 0.56) {
          os++;
          return { m: minute, side: 'opp', text: `🔴 ${opp.name} реализует опасный момент!`, ms, os };
        }
        return { m: minute, side: 'neutral', text: '🧤 Опаснейший удар, но вратарь совершает суперсейв!', ms, os };
      });

      livePvp = {
        opp, myTac, oppTac, tacMod,
        highlights, shown: 0,
        finalMs: ms, finalOs: os,
        done: false,
        eloDelta: 0, moneyReward: 0,
        timer: null
      };

      renderPvpMatchModal();

      livePvp.timer = setInterval(() => {
        livePvp.shown++;
        if (livePvp.shown >= livePvp.highlights.length) {
          clearInterval(livePvp.timer);
          livePvp.done = true;

          const today = getTodayDateStr();
          state.online.playedToday = state.online.lastPlayDate === today ? (state.online.playedToday + 1) : 1;
          state.online.lastPlayDate = today;

          const eloDelta = ms > os ? 25 : (ms === os ? 5 : -15);
          const moneyReward = ms > os ? 25000 : (ms === os ? 10000 : 5000);

          if (ms > os) state.online.wins += 1;
          else if (ms === os) state.online.draws += 1;
          else state.online.losses += 1;

          state.online.rating = Math.max(500, state.online.rating + eloDelta);
          state.player.money += moneyReward;

          livePvp.eloDelta = eloDelta;
          livePvp.moneyReward = moneyReward;
          saveState();
          haptic(ms > os ? 'success' : (ms === os ? 'light' : 'error'));

          // Immediately upsert and refresh Supabase leaderboard after PvP match
          syncOnlineCloud(false);
        }
        renderPvpMatchModal();
      }, 720);
    }

              </div>
              <div class="font-sport text-3xl font-bold text-slate-500">VS</div>
              <div class="flex flex-col items-center w-[40%]">
                ${clubCrestSvg(oppClub, 56)}
                <div class="text-xs font-bold mt-2 text-center">${escapeHtml(oppClub.name)}</div>
                <div class="text-[10px] text-slate-400">OVR ${oppClub.ovr}</div>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2 text-xs">
              <div class="bg-slate-900/90 rounded-xl p-2"><div class="text-[10px] text-slate-400">Энергия</div><b class="${state.player.energy < 25 ? 'text-rose-400' : 'text-emerald-400'}">${state.player.energy}%</b></div>
              <div class="bg-slate-900/90 rounded-xl p-2"><div class="text-[10px] text-slate-400">Счастье</div><b class="text-sky-300">${state.player.happiness}%</b></div>
              <div class="bg-slate-900/90 rounded-xl p-2"><div class="text-[10px] text-slate-400">Форма</div><b class="text-amber-300">${state.player.form}%</b></div>
            </div>

            <div class="flex flex-col gap-2 pt-1">
              <button onclick="startCareerMatch(false)" class="btn-primary w-full py-3.5 text-sm">⚽ Играть матч (ключевые моменты)</button>
              <button onclick="startCareerMatch(true)" class="btn-sec w-full py-3 text-xs">⏩ Быстрая симуляция дня</button>
            </div>
          </div>

          <div class="glass p-3.5 text-xs text-slate-300 space-y-1">
            <div class="font-bold text-white">📅 Прогрессия: 1 матч = 1 игровой день</div>
            <div class="text-[11px] text-slate-400">После каждого матча обновляются 3 слота тренировок, начисляется зарплата и генерируются новые трансферные предложения.</div>
          </div>
        </div>
      `;
    }

    function renderLifestyleTab() {
      const p = state.player;
      return `
        <div class="p-4 space-y-3 anim">
          <div class="glass p-3.5 flex justify-between items-center">
            <div>
              <div class="text-xs font-bold text-amber-300">🛍️ Лайфстайл и экипировка</div>
              <div class="text-[11px] text-slate-400">Покупай бутсы, жильё, авто и персонал для роста статов</div>
            </div>
            <div class="font-sport text-lg font-bold text-emerald-400">${fmtMoney(p.money)}</div>
          </div>

          <div class="space-y-2">
            ${LIFESTYLE_ITEMS.map(item => {
              const owned = !item.consumable && p.ownedItems.includes(item.id);
              const canBuy = p.money >= item.cost;
              return `
                <div class="glass p-3.5 flex justify-between items-center gap-2.5">
                  <div class="flex items-center gap-3 min-w-0">
                    <span class="text-2xl shrink-0">${item.icon}</span>
                    <div class="min-w-0">
                      <div class="text-xs font-bold text-white truncate">${item.name}</div>
                      <div class="text-[10px] text-slate-400 leading-snug">${item.desc}</div>
                    </div>
                  </div>
                  ${owned
                    ? `<span class="text-[11px] font-bold text-emerald-400 shrink-0 px-2">Куплено ✓</span>`
                    : `<button onclick="buyLifestyleItem('${item.id}')" class="px-3 py-2 rounded-xl text-[11px] font-bold shrink-0 ${canBuy ? 'bg-amber-500/20 border border-amber-400/50 text-amber-200 active:scale-95' : 'bg-slate-800 text-slate-500'}">${fmtMoney(item.cost)}</button>`}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderLeaguesTab() {
      const p = state.player;
      const div = getDivision(p.divId);
      const sorted = sortLeagueTable(state.leagueTable);

      return `
        <div class="p-4 space-y-3.5 anim">
          <div class="glass p-3.5">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs font-bold text-emerald-400">${div.badge} ${div.name}</div>
                <div class="text-[11px] text-slate-400">Сезон ${state.season} • Сыграно туров: ${state.round}/${state.schedule.length}</div>
              </div>
              <span class="text-[10px] px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 font-bold">Уровень ${p.divId + 1}/5</span>
            </div>
            <div class="flex gap-1 mt-2.5">
              ${DIVISIONS.map(d => `
                <div class="flex-1 h-1.5 rounded-full ${d.id <= p.divId ? 'bg-emerald-400' : 'bg-slate-800'}"></div>
              `).join('')}
            </div>
          </div>

          <div class="glass overflow-hidden text-xs">
            <div class="px-3 py-2 bg-slate-900/90 flex justify-between text-[10px] font-bold text-slate-400">
              <span># Клуб</span>
              <span>И • В-Н-П • О</span>
            </div>
            ${sorted.map((row, idx) => {
              const club = getClubById(row.clubId);
              const isMe = row.clubId === p.clubId;
              const isPromo = idx < 2 && p.divId < DIVISIONS.length - 1;
              const isReleg = idx >= 6 && p.divId > 0;
              return `
                <div class="px-3 py-2.5 flex justify-between items-center border-t border-white/5 ${isMe ? 'bg-emerald-500/15 font-bold text-emerald-300' : ''}">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="w-4 text-center text-[11px] font-bold ${isPromo ? 'text-emerald-400' : (isReleg ? 'text-rose-400' : 'text-slate-400')}">${idx + 1}</span>
                    <span class="truncate">${escapeHtml(club.name)}</span>
                  </div>
                  <div class="shrink-0 text-[11px] text-slate-300">
                    ${row.p} • ${row.w}-${row.d}-${row.l} • <b class="text-white text-xs">${row.pts}</b>
                  </div>
                </div>
              `;
            }).join('')}
            <div class="px-3 py-2 bg-slate-950/70 text-[10px] text-slate-400 flex justify-between">
              <span class="text-emerald-400">● Топ-2: повышение</span>
              <span class="text-rose-400">● 7–8 место: вылет</span>
            </div>
          </div>

          <div class="glass p-3.5 space-y-2.5">
            <div class="flex justify-between items-center">
              <div class="text-xs font-bold text-amber-300">✈️ Трансферные предложения</div>
              <button onclick="refreshTransferOffers(); saveState(); render(); showToast('Скауты обновили офферы!', 'info');" class="text-[11px] text-sky-300 font-bold">🔄 Обновить</button>
            </div>
            ${state.offers.length === 0
              ? `<div class="text-xs text-slate-400 text-center py-2">Сыграй матч или нажми «Обновить», чтобы получить офферы.</div>`
              : state.offers.map(o => {
                  const c = getClubById(o.clubId);
                  return `
                    <div class="p-3 rounded-xl bg-slate-900 border border-white/10 flex justify-between items-center gap-2">
                      <div class="min-w-0">
                        <div class="text-xs font-bold text-white truncate">${c.divBadge} ${escapeHtml(c.name)} <span class="text-amber-300">(OVR ${c.ovr})</span></div>
                        <div class="text-[10px] text-slate-400">${c.divName} • ЗП: <b class="text-emerald-400">${fmtMoney(o.salary)}/матч</b></div>
                      </div>
                      <button onclick="acceptTransfer('${o.id}')" class="btn-primary px-3 py-2 text-[11px] shrink-0">Перейти</button>
                    </div>
                  `;
                }).join('')}
          </div>
        </div>
      `;
    }

    function renderOnlineTab() {
      const canPlay = isDailyPvpAvailable();
      const canExtra = state.online.extraMatchDate !== getTodayDateStr();
      const myId = String(tgUser.id);

      // Visible Cloud Status Badge
      const statusBadgeClass =
        supabaseStatus.state === 'ok'
          ? 'bg-emerald-500/15 border-emerald-400/40 text-emerald-300'
          : (supabaseStatus.state === 'error'
              ? 'bg-rose-500/15 border-rose-400/40 text-rose-300'
              : 'bg-amber-500/15 border-amber-400/40 text-amber-300');
      const statusIcon = supabaseStatus.state === 'ok' ? '🟢' : (supabaseStatus.state === 'error' ? '🔴' : '🟡');

      let bodyHtml = '';
      if (onlineSubTab === 'pvp') {
        const opp = currentPvpOpponent;
        const oppTac = opp ? (TACTICS[opp.tactic] || TACTICS.press) : TACTICS.press;

        bodyHtml = `
          ${canPlay ? `
            <div class="glass p-3.5 border-emerald-500/40 flex justify-between items-center text-xs">
              <div>
                <div class="font-bold text-emerald-300">⚔️ Ежедневный PvP-тур открыт!</div>
                <div class="text-[10px] text-slate-400">1 реальный день = 1 рейтинговый матч</div>
              </div>
              <span class="font-sport text-lg font-bold text-white">${getDailyPvpPlayed()}/${getDailyPvpLimit()}</span>
            </div>
          ` : `
            <div class="glass p-4 text-center space-y-2 border-amber-400/40">
              <div class="text-xs font-bold text-amber-300">⏳ До нового PvP-дня осталось:</div>
              <div id="pvp-countdown" class="font-sport text-3xl font-bold text-white">${getCountdownToMidnight()}</div>
              ${canExtra
                ? `<button onclick="watchExtraPvpAd()" class="btn-ad w-full py-3 text-xs">🎬 +1 доп. PvP-матч сегодня</button>`
                : `<div class="text-[11px] text-slate-400">Дополнительный матч на сегодня уже сыгран.</div>`}
            </div>
          `}

          <div class="glass p-3.5 space-y-2.5">
            <div class="flex justify-between items-center">
              <div class="text-xs font-bold text-white">Соперник на матч</div>
              <button onclick="pickPvpOpponent(false)" class="text-[11px] text-sky-300 font-bold">🔄 Другой соперник</button>
            </div>
            ${opp ? `
              <div class="p-3 rounded-xl bg-slate-900 border border-white/10 flex justify-between items-center gap-2">
                <div class="min-w-0">
                  <div class="text-sm font-bold text-white truncate">
                    ${escapeHtml(opp.name)}
                    <span class="text-xs text-amber-300 font-sport ml-1">${escapeHtml(opp.position || 'ST')}</span>
                  </div>
                  <div class="text-[10px] text-slate-400 truncate">${escapeHtml(opp.club || 'Свободный агент')} • 🏆 ${opp.rating || 1000} ELO</div>
                  <div class="text-[11px] mt-1">
                    Тактика: <b class="${pvpScouted ? 'text-emerald-300' : 'text-slate-400'}">${pvpScouted ? oppTac.icon + ' ' + oppTac.name : '❓ Скрыта (используй разведку)'}</b>
                  </div>
                  ${opp.isSparring ? `<div class="text-[10px] text-indigo-300 mt-0.5">Спарринг-матч (в облаке пока нет других игроков)</div>` : ''}
                </div>
                <div class="text-center shrink-0 pl-2">
                  <div class="text-[9px] text-slate-400 font-bold">OVR</div>
                  <div class="font-sport text-3xl font-bold text-amber-300 leading-none">${opp.ovr || 70}</div>
                </div>
              </div>
              ${!pvpScouted ? `<button onclick="watchScoutAd()" class="btn-ad w-full py-2.5 text-xs">🕵️ Разведка скаута — узнать тактику</button>` : ''}
            ` : `<div class="text-xs text-slate-400 text-center py-2">Подбор соперника...</div>`}
          </div>

          <div class="glass p-3.5 space-y-2.5">
            <div>
              <div class="text-xs font-bold text-emerald-400">Тактика на матч (±12% бонус)</div>
              <div class="text-[10px] text-slate-400">Прессинг &gt; Тики-така &gt; Контратаки &gt; Прессинг</div>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
              ${Object.values(TACTICS).map(t => `
                <button onclick="setOnlineAttackTactic('${t.id}')" class="p-2.5 rounded-xl border text-center transition ${state.online.attackTactic === t.id ? 'bg-emerald-500/20 border-emerald-400 text-white' : 'bg-slate-900 border-white/10 text-slate-400'}">
                  <div class="text-lg">${t.icon}</div>
                  <div class="text-[10px] font-bold mt-0.5">${t.short}</div>
                  <div class="text-[9px] opacity-75">${t.hint}</div>
                </button>
              `).join('')}
            </div>
            <button onclick="startPvpMatch()" ${!canPlay ? 'disabled' : ''} class="btn-primary w-full py-3.5 text-sm">⚔️ ИГРАТЬ PvP-МАТЧ</button>
          </div>

          <div class="glass p-3.5 space-y-2">
            <div class="text-xs font-bold text-slate-200">🛡️ Тактика защиты (когда нападают на тебя)</div>
            <div class="grid grid-cols-3 gap-1.5">
              ${Object.values(TACTICS).map(t => `
                <button onclick="setOnlineDefenseTactic('${t.id}')" class="py-2 rounded-xl border text-[10px] font-bold transition ${state.online.defenseTactic === t.id ? 'bg-sky-500/20 border-sky-400 text-sky-200' : 'bg-slate-900 border-white/10 text-slate-400'}">
                  ${t.icon} ${t.short}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        const myRank = onlineLeaderboard.findIndex(r => String(r.tg_id) === myId);
        bodyHtml = `
          <div class="glass p-3.5 space-y-2.5">
            <div class="flex justify-between items-center text-xs">
              <div>
                <div class="text-slate-400 text-[10px]">Твой онлайн-рейтинг</div>
                <div class="font-bold text-white">🏆 <span class="text-emerald-400">${state.online.rating} ELO</span> ${myRank >= 0 ? `• #${myRank + 1} в мире` : ''}</div>
                <div class="text-[10px] text-slate-400">В: ${state.online.wins} • Н: ${state.online.draws} • П: ${state.online.losses}</div>
              </div>
              <button onclick="shareOnlineRating()" class="btn-sec px-3 py-2 text-[11px]">✈️ Поделиться</button>
            </div>
          </div>

          <div class="glass overflow-hidden text-xs">
            <div class="px-3 py-2 bg-slate-900/90 flex justify-between text-[10px] font-bold text-slate-400">
              <span># Игрок / Клуб</span>
              <span>OVR • ELO</span>
            </div>
            ${onlineLeaderboard.length === 0 ? `
              <div class="p-6 text-center text-slate-400 text-xs">
                ${supabaseStatus.state === 'loading' ? 'Загрузка игроков из Supabase...' : 'Таблица пока пуста. Нажмите «Обновить / Синхронизировать».'}
              </div>
            ` : onlineLeaderboard.map((row, i) => {
              const isMe = String(row.tg_id) === myId;
              const medal = i < 3 ? ['🥇', '🥈', '🥉'][i] : `#${i + 1}`;
              return `
                <div class="px-3 py-2.5 flex justify-between items-center border-t border-white/5 ${isMe ? 'bg-emerald-500/15 font-bold text-emerald-300' : ''}">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="w-6 text-center shrink-0 font-bold">${medal}</span>
                    <div class="min-w-0">
                      <div class="truncate">${escapeHtml(row.name)} <span class="text-[10px] text-slate-400 font-normal">${escapeHtml(row.position || 'ST')}</span></div>
                      <div class="text-[10px] text-slate-400 truncate">${escapeHtml(row.club || 'Свободный агент')}</div>
                    </div>
                  </div>
                  <div class="shrink-0 flex items-center gap-2.5 pl-2">
                    <span class="font-sport text-sm text-amber-300">${row.ovr || 60}</span>
                    <span class="font-sport text-base font-bold text-white w-11 text-right">${row.rating || 1000}</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      return `
        <div class="p-4 space-y-3 anim">
          <div class="flex justify-between items-center">
            <div class="font-sport text-xl font-bold tracking-wide text-white">🌍 PRO LEAGUE LIVE</div>
            <button onclick="syncOnlineCloud(true)" class="px-3 py-1.5 rounded-xl bg-slate-800 border border-white/10 text-[11px] font-bold text-sky-300 active:scale-95">
              🔄 Обновить
            </button>
          </div>

          <div class="px-3 py-2 rounded-xl border text-[11px] font-semibold break-words ${statusBadgeClass}">
            ${statusIcon} ${escapeHtml(supabaseStatus.message)}
          </div>

          <div class="grid grid-cols-2 gap-1.5 bg-slate-900/90 p-1 rounded-2xl border border-white/5">
            <button onclick="onlineSubTab='pvp'; render();" class="py-2 rounded-xl text-xs font-bold transition ${onlineSubTab === 'pvp' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}">⚔️ PvP Матч</button>
            <button onclick="onlineSubTab='leaderboard'; render();" class="py-2 rounded-xl text-xs font-bold transition ${onlineSubTab === 'leaderboard' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}">🏆 Топ-50 мира</button>
          </div>

          ${bodyHtml}
        </div>
      `;
    }

    /* =========================================================================
       13. NAVIGATION & MAIN RENDER LOOP
       ========================================================================= */
    function switchTab(tabId) {
      activeTab = tabId;
      haptic('light');
      clearInterval(pvpCountdownInterval);

      if (tabId === 'online') {
        pvpCountdownInterval = setInterval(() => {
          const el = document.getElementById('pvp-countdown');
          if (el) el.textContent = getCountdownToMidnight();
        }, 1000);
        // Immediately sync player to Supabase and load live leaderboard
        syncOnlineCloud(false);
      }

      render();
      window.scrollTo(0, 0);
    }

    function render() {
      const root = document.getElementById('root');
      if (!root) return;

      try {
        if (!state || !state.player) {
          root.innerHTML = renderCreateScreen();
          return;
        }
        ensureStateIntegrity();

        const p = state.player;
        const club = getClubById(p.clubId);
        const navItems = [
          { id: 'career',    label: 'Карьера',   icon: '👤' },
          { id: 'training',  label: 'Тренир.',   icon: '🏋️' },
          { id: 'matches',   label: 'Матчи',     icon: '⚽' },
          { id: 'lifestyle', label: 'Лайфстайл', icon: '🛍️' },
          { id: 'leagues',   label: 'Лиги',      icon: '🏆' },
          { id: 'online',    label: 'Онлайн',    icon: '🌍' }
        ];

        const viewMap = {
          career: renderCareerTab,
          training: renderTrainingTab,
          matches: renderMatchesTab,
          lifestyle: renderLifestyleTab,
          leagues: renderLeaguesTab,
          online: renderOnlineTab
        };

        root.innerHTML = `
          <header class="sticky top-0 z-30 px-3 py-2.5 bg-[#050811]/95 backdrop-blur-md border-b border-white/5 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2 min-w-0">
              ${clubCrestSvg(club, 30)}
              <div class="min-w-0">
                <div class="text-xs font-bold text-white truncate">${escapeHtml(club.name)}</div>
                <div class="text-[10px] text-slate-400">Сезон ${state.season} • День ${state.day}</div>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <div class="px-2 py-1 rounded-xl bg-slate-900 border border-white/10 text-[10px] font-bold ${p.energy < 25 ? 'text-rose-400' : 'text-sky-300'}">⚡ ${p.energy}%</div>
              <div class="px-2.5 py-1 rounded-xl bg-emerald-500/15 border border-emerald-500/35 text-emerald-300 font-sport text-xs font-bold">${fmtMoney(p.money)}</div>
            </div>
          </header>

          <main class="flex-1 pb-24">
            ${(viewMap[activeTab] || renderCareerTab)()}
          </main>

          <nav class="bottom-nav grid grid-cols-6">
            ${navItems.map(item => `
              <button onclick="switchTab('${item.id}')" class="nav-btn ${activeTab === item.id ? 'active' : ''}">
                <div class="relative text-base leading-none mb-1">
                  ${item.icon}
                  ${item.id === 'online' && isDailyPvpAvailable() ? '<span class="online-dot absolute -top-0.5 -right-1.5 w-2 h-2 rounded-full bg-emerald-400"></span>' : ''}
                </div>
                <span>${item.label}</span>
              </button>
            `).join('')}
          </nav>
        `;
      } catch (err) {
        root.innerHTML = `
          <div class="p-6 text-center space-y-3">
            <div class="text-rose-400 font-bold text-sm">Ошибка отображения: ${escapeHtml(err.message)}</div>
            <button onclick="localStorage.removeItem(SAVE_KEY); state=null; render();" class="btn-primary px-5 py-2.5 text-xs">Сбросить сохранение и перезапустить</button>
          </div>
        `;
      }
    }

    /* =========================================================================
       14. SAFE STARTUP
       ========================================================================= */
    try {
      initTelegram();
      loadState();
    } catch (_) {}
    render();
  </script>
</body>
</html>
