<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PRO CAREER: TOP 5 — Футбольный симулятор</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- AdsGram Rewarded Video SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Oswald -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #060913;
      --bg-card: #101726;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #02040a;
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-sport {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.02em;
    }

    #app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: radial-gradient(circle at top center, #122442 0%, var(--bg-deep) 52%);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.85);
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }

    /* EA FC / FUT Style Player Cards */
    .fut-card {
      position: relative;
      border-radius: 20px;
      padding: 16px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    }
    .fut-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 82% 8%, rgba(255,255,255,0.2) 0%, transparent 55%),
                  repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 10px);
      pointer-events: none;
    }
    .fut-bronze {
      background: linear-gradient(145deg, #5e3b22 0%, #3d2413 48%, #211208 100%);
      border-color: rgba(217, 152, 95, 0.45);
    }
    .fut-silver {
      background: linear-gradient(145deg, #4b5a70 0%, #273244 50%, #141b26 100%);
      border-color: rgba(203, 213, 225, 0.5);
    }
    .fut-gold {
      background: linear-gradient(145deg, #8a6013 0%, #523809 50%, #241804 100%);
      border-color: rgba(251, 191, 36, 0.65);
      box-shadow: 0 14px 36px rgba(245, 158, 11, 0.24);
    }
    .fut-inform {
      background: linear-gradient(145deg, #1e1b2e 0%, #0f0d17 50%, #3b2a08 100%);
      border-color: rgba(251, 191, 36, 0.85);
      box-shadow: 0 14px 40px rgba(245, 158, 11, 0.32);
    }
    .fut-toty {
      background: linear-gradient(145deg, #1d4ed8 0%, #0f172a 48%, #047857 100%);
      border-color: rgba(52, 211, 153, 0.85);
      box-shadow: 0 14px 42px rgba(16, 185, 129, 0.35);
    }

    .glass-panel {
      background: rgba(16, 23, 38, 0.84);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #02140d;
      font-weight: 800;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.32);
      transition: transform 0.12s ease, filter 0.15s ease;
    }
    .btn-primary:active { transform: scale(0.97); filter: brightness(1.08); }

    .btn-gold {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #1c1002;
      font-weight: 800;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.28);
      transition: transform 0.12s ease;
    }
    .btn-gold:active { transform: scale(0.97); }

    .btn-ad {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      font-weight: 700;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
      transition: transform 0.12s ease, filter 0.15s ease;
    }
    .btn-ad:active { transform: scale(0.97); filter: brightness(1.1); }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.2);
      font-weight: 600;
      border-radius: 14px;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn-secondary:active { transform: scale(0.97); background: rgba(51, 65, 85, 0.95); }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(8, 12, 22, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 40;
      padding-bottom: env(safe-area-inset-bottom, 6px);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 2px;
      color: #64748b;
      font-size: 10px;
      font-weight: 600;
      transition: color 0.2s ease;
      position: relative;
    }
    .nav-btn.active { color: #34d399; }
    .nav-btn.active::after {
      content: "";
      position: absolute;
      top: 0;
      width: 24px;
      height: 3px;
      background: #10b981;
      border-radius: 0 0 4px 4px;
      box-shadow: 0 2px 10px #10b981;
    }

    /* Animations */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeSlideUp 0.24s ease-out forwards; }

    @keyframes goalPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      50% { box-shadow: 0 0 36px 8px rgba(16, 185, 129, 0.45); }
    }
    .goal-flash { animation: goalPulse 0.85s ease-in-out 2; }

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -18px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .toast-anim { animation: toastIn 0.22s ease-out forwards; }

    /* Penalty Goal Grid */
    .goal-net {
      background:
        linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px) 0 0 / 16px 16px,
        linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px) 0 0 / 16px 16px,
        linear-gradient(180deg, #064e3b 0%, #022c22 100%);
      border-top: 6px solid #f8fafc;
      border-left: 6px solid #f8fafc;
      border-right: 6px solid #f8fafc;
      border-radius: 10px 10px 0 0;
      box-shadow: inset 0 12px 28px rgba(0, 0, 0, 0.55);
    }
    .penalty-zone { transition: all 0.14s ease; }
    .penalty-zone:hover, .penalty-zone:active {
      background: rgba(16, 185, 129, 0.35);
      transform: scale(0.97);
    }
  </style>

<body>
  <div id="app-shell">

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[120] pointer-events-none w-[92%] max-w-[440px] flex flex-col gap-2 items-center"></div>

  <script>
    /*************************************************************************
     * 0. КОНФИГУРАЦИЯ ПРОЕКТА (РЕФЕРАЛКА И ADSGRAM)
     *************************************************************************/
    const CONFIG = {
      BOT_USERNAME: 'BooomBer_bot', // имя бота для реферальной ссылки
      APP_SHORT_NAME: '', // оставьте пустым или впишите короткое имя без пробелов (из /newapp)
      ADSGRAM_BLOCK_ID: '60696', // ваш Block ID из AdsGram (если пусто — работает встроенный демо-плеер)
      REFERRAL_REWARD: 20000 // 20 000 € за приглашенного друга
    };

    /*************************************************************************
     * 1. TELEGRAM WEBAPP SDK, USER INFO, HAPTIC, AUDIO & CLIPBOARD
     *************************************************************************/
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    let tgUser = { id: 'demo_1001', firstName: 'Игрок' };

    function initTelegram() {
      try {
        if (tg) {
          tg.ready();
          tg.expand();
          if (tg.setHeaderColor) tg.setHeaderColor('#060913');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#060913');
          if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            tgUser = {
              id: String(u.id || 'demo_1001'),
              firstName: [u.first_name, u.last_name].filter(Boolean).join(' ') || u.username || 'Игрок'
            };
          }
        }
      } catch (e) {
        console.warn('Telegram SDK fallback:', e);
      }
    }

    function haptic(type = 'light') {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === 'success' || type === 'error' || type === 'warning') {
            tg.HapticFeedback.notificationOccurred(type);
          } else {
            tg.HapticFeedback.impactOccurred(type);
          }
        }
      } catch (_) {}
    }

    let audioCtx = null;
    function playSfx(kind) {
      if (!state || !state.settings || !state.settings.sound) return;
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (kind === 'goal') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.09);
          osc.frequency.setValueAtTime(783.99, now + 0.18);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.46);
        } else if (kind === 'fail') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.22);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (kind === 'train') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(660, now + 0.14);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.19);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.07);
        }
      } catch (_) {}
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        success: 'bg-emerald-950/95 border-emerald-500/60 text-emerald-200',
        error: 'bg-rose-950/95 border-rose-500/60 text-rose-200',
        gold: 'bg-amber-950/95 border-amber-400/70 text-amber-200',
        info: 'bg-slate-900/95 border-slate-600/60 text-slate-100'
      };
      const el = document.createElement('div');
      el.className = `toast-anim px-4 py-2.5 rounded-xl border text-xs font-semibold shadow-xl backdrop-blur-md text-center ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity 0.3s ease';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 320);
      }, 2500);
    }

    // Iframe-safe clipboard copy using document.execCommand('copy')
    function copyTextSafe(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    /*************************************************************************
     * 2. ADSGRAM REWARDED VIDEO INTEGRATION (REAL + DEMO PLAYER)
     *************************************************************************/
    let demoAdTimer = null;

    /**
     * Единая асинхронная функция показа рекламы за вознаграждение.
     * Если CONFIG.ADSGRAM_BLOCK_ID заполнен и SDK window.Adsgram загружен —
     * вызывается реальная реклама AdsGram. Иначе запускается 5-секундный демо-плеер.
     */
    async function showRewardedAd(rewardType, onReward) {
      haptic('light');
      const hasRealAdsGram = Boolean(CONFIG.ADSGRAM_BLOCK_ID && CONFIG.ADSGRAM_BLOCK_ID.trim() !== '' && window.Adsgram);

      if (hasRealAdsGram) {
        try {
          const AdController = window.Adsgram.init({ blockId: CONFIG.ADSGRAM_BLOCK_ID.trim() });
          await AdController.show();
          // Реклама досмотрена до конца — выдаём награду
          haptic('success');
          playSfx('goal');
          if (typeof onReward === 'function') onReward();
        } catch (err) {
          haptic('error');
          showToast('Реклама не была досмотрена или сейчас недоступна.', 'error');
        }
        return;
      }

      // Встроенный стильный демо-плеер (5 секунд) для тестирования без Block ID
      const adTitles = {
        double_salary: 'Удвоение зарплаты за матч (x2)',
        free_training: '+1 бесплатная тренировка',
        heal_injury: 'Ускорение лечения (-1 тур)',
        refresh_offers: 'Свежие трансферные предложения'
      };
      const label = adTitles[rewardType] || 'Бонусная награда';
      const adLayer = document.getElementById('ad-layer');
      let secondsLeft = 5;

      const renderDemoAd = () => {
        const pct = ((5 - secondsLeft) / 5) * 100;
        adLayer.innerHTML = `
          <div class="w-full max-w-[380px] glass-panel p-5 border-indigo-400/50 text-center animate-in">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/40 text-indigo-200 text-[10px] font-bold uppercase tracking-wider mb-3">
              <span>🎬</span> AdsGram Demo Mode
            </div>
            <div class="w-full h-36 rounded-2xl bg-gradient-to-br from-indigo-950 via-slate-900 to-emerald-950 border border-white/10 flex flex-col items-center justify-center p-4 relative overflow-hidden">
              <div class="text-4xl mb-2">📺</div>
              <div class="text-xs font-bold text-white">${label}</div>
              <div class="text-[10px] text-slate-400 mt-1">Вставьте Block ID в CONFIG.ADSGRAM_BLOCK_ID для реальной рекламы</div>
            </div>

            <div class="mt-4">
              <div class="flex justify-between text-xs mb-1.5">
                <span class="text-slate-300 font-semibold">${secondsLeft > 0 ? 'Просмотр ролика...' : 'Награда готова!'}</span>
                <span class="font-sport font-bold text-indigo-300">${secondsLeft > 0 ? secondsLeft + ' сек.' : '✓'}</span>
              </div>
              <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 transition-all duration-1000 linear" style="width:${pct}%"></div>
              </div>
            </div>

            <div class="mt-4 flex gap-2">
              ${secondsLeft > 0 ? `
                <button onclick="cancelDemoAd()" class="w-full py-2.5 rounded-xl bg-slate-800/80 text-slate-400 text-xs font-semibold">
                  Закрыть (без награды)
                </button>
              ` : `
                <button id="claim-demo-ad-btn" class="btn-primary w-full py-3 text-sm">
                  🎁 Забрать награду!
                </button>
              `}
            </div>
          </div>
        `;
        if (secondsLeft <= 0) {
          const btn = document.getElementById('claim-demo-ad-btn');
          if (btn) {
            btn.onclick = () => {
              closeDemoAd();
              haptic('success');
              playSfx('goal');
              if (typeof onReward === 'function') onReward();
            };
          }
        }
      };

      adLayer.classList.remove('hidden');
      adLayer.classList.add('flex');
      renderDemoAd();

      clearInterval(demoAdTimer);
      demoAdTimer = setInterval(() => {
        secondsLeft--;
        renderDemoAd();
        if (secondsLeft <= 0) clearInterval(demoAdTimer);
      }, 1000);
    }

    function cancelDemoAd() {
      clearInterval(demoAdTimer);
      closeDemoAd();
      showToast('Вы закрыли рекламу до окончания. Награда не начислена.', 'info');
    }

    function closeDemoAd() {
      const adLayer = document.getElementById('ad-layer');
      adLayer.classList.add('hidden');
      adLayer.classList.remove('flex');
      adLayer.innerHTML = '';
    }

      },
      {
        id: 'seriea', name: 'Серия А', fullName: 'Итальянская Серия А', flag: '🇮🇹', prestige: 1.06,
        clubs: [
          { id: 'int', name: 'Интер', short: 'INT', ovr: 88, primary: '#010E80', secondary: '#000000', tier: 5 },
          { id: 'nap', name: 'Наполи', short: 'NAP', ovr: 85, primary: '#12A0D7', secondary: '#FFFFFF', tier: 4 },

    let state = null;

    function getLeagueById(id) {
      return LEAGUES.find(l => l.id === id) || LEAGUES[0];
    }

    function getClubById(clubId) {
      for (const l of LEAGUES) {
        const c = l.clubs.find(cl => cl.id === clubId);
        if (c) return { ...c, leagueId: l.id, leagueName: l.name, leagueFlag: l.flag, prestige: l.prestige };
      }
      return null;
    }

    function calcOVR(stats, posKey) {
      const w = POSITIONS[posKey].weights;
      const raw =
        stats.pac * w.pac + stats.sho * w.sho + stats.pas * w.pas +
        stats.dri * w.dri + stats.def * w.def + stats.phy * w.phy;
      return Math.min(99, Math.max(40, Math.round(raw)));
    }

    function getExpectedSalary(ovr) {
      // Expected fair per-match salary based on OVR
      if (ovr < 68) return 12000;
      if (ovr < 74) return 22000;
      if (ovr < 79) return 42000;
      if (ovr < 84) return 85000;
      if (ovr < 89) return 155000;
      return 240000;
    }

    function calcMarketValue(p) {
      const ovr = calcOVR(p.stats, p.pos);
      const league = getLeagueById(p.leagueId);
      let base = Math.pow(Math.max(1, ovr - 55), 2.38) * 32000;
      let ageMult = p.age <= 21 ? 1.35 : (p.age <= 26 ? 1.15 : (p.age >= 32 ? Math.max(0.25, 1 - (p.age - 31) * 0.14) : 1.0));
      const perfMult = 1 + Math.min(0.45, (p.seasonStats.goals * 0.025 + p.seasonStats.assists * 0.015));
      const val = Math.round((base * ageMult * league.prestige * perfMult) / 100000) * 100000;
      return Math.max(500000, val);
    }

    function formatMoney(num) {
      if (num >= 1000000) return '€' + (num / 1000000).toFixed(num >= 10000000 ? 1 : 2) + ' млн';
      if (num >= 1000) return '€' + Math.round(num / 1000) + ' тыс.';
      return '€' + Math.round(num);
    }

    function formatFans(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return String(Math.round(num));
    }

    function getRoleLabel(trust) {
      if (trust >= 70) return { label: 'Основа', color: 'text-emerald-400', moments: 4 };
      if (trust >= 35) return { label: 'Ротация', color: 'text-amber-400', moments: 3 };
      return { label: 'Запасной', color: 'text-rose-400', moments: 2 };
    }

    // Aggregates all active bonuses from owned Gear, best Housing, best Car, and Staff
    function getOwnedBonuses() {
      const owned = (state && state.player && state.player.ownedItems) ? state.player.ownedItems : [];
      const statBonus = { pac: 0, sho: 0, pas: 0, dri: 0, def: 0, phy: 0 };
      let trainBonus = 0;
      let energyRegen = 0;
      let injuryRed = 0;
      let happyFloor = 0;
      let staffHappy = 0;
      let mediaMult = 1;

      let bestHousing = SHOP_ITEMS.find(i => i.id === 'hs_dorm');
      let bestCar = null;

      SHOP_ITEMS.forEach(item => {
        if (!owned.includes(item.id)) return;
        const ef = item.effect || {};
        if (item.cat === 'gear') {
          if (ef.statBonus) {
            Object.keys(ef.statBonus).forEach(k => {
              statBonus[k] = Math.max(statBonus[k], ef.statBonus[k]);
            });
          }
          if (ef.trainBonus) trainBonus += ef.trainBonus;
          if (ef.energyRegen) energyRegen += ef.energyRegen;
          if (ef.injuryRed) injuryRed += ef.injuryRed;
        } else if (item.cat === 'housing') {
          if (item.level > bestHousing.level) bestHousing = item;
        } else if (item.cat === 'cars') {
          if (!bestCar || item.level > bestCar.level) bestCar = item;
        } else if (item.cat === 'staff') {
          if (ef.energyRegen) energyRegen += ef.energyRegen;
          if (ef.injuryRed) injuryRed += ef.injuryRed;
          if (ef.happyFloor) happyFloor = Math.max(happyFloor, ef.happyFloor);
          if (ef.happyPerTurn) staffHappy += ef.happyPerTurn;
          if (ef.trainBonus) trainBonus += ef.trainBonus;
          if (ef.mediaMult) mediaMult += ef.mediaMult;
        }
      });

      const housingHappy = bestHousing ? (bestHousing.effect.happyPerTurn || 0) : 0;
      const housingEnergy = bestHousing ? (bestHousing.effect.energyPerTurn || 0) : 0;
      const carHappy = bestCar ? (bestCar.effect.happyPerTurn || 0) : 0;

      return {
        statBonus,
        trainBonus,
        energyRegen: energyRegen + housingEnergy,
        injuryRed: Math.min(0.75, injuryRed),
        happyFloor,
        lifestyleHappy: housingHappy + carHappy + staffHappy,
        housingLevel: bestHousing ? bestHousing.level : 1,
        carLevel: bestCar ? bestCar.level : 0,
        mediaMult,
        bestHousing,
        bestCar
      };
    }

    // Detailed transparent breakdown of recurring weekly happiness factors
    function getHappinessFactorsBreakdown() {
      const p = state.player;
      const ovr = calcOVR(p.stats, p.pos);
      const b = getOwnedBonuses();
      const factors = [];

      // 1. Playing time / Coach trust
      if (p.trust >= 70) {
        factors.push({ title: 'Игровое время (Основа)', delta: +3, desc: 'Тренер вам доверяет и ставит в старт.' });
      } else if (p.trust < 35) {
        factors.push({ title: 'Сидение в запасе', delta: -4, desc: 'Вы редко выходите на поле и теряете тонус.' });
      } else {
        factors.push({ title: 'Ротация состава', delta: 0, desc: 'Стабильные выходы на поле.' });
      }

      // 2. Salary adequacy vs OVR
      const expectedSal = getExpectedSalary(ovr);
      if (ovr >= 78 && p.salary < expectedSal * 0.72) {
        factors.push({ title: 'Низкая зарплата (Требует новый контракт)', delta: -5, desc: `Для OVR ${ovr} вы ожидаете ~${formatMoney(expectedSal)}/матч, а получаете ${formatMoney(p.salary)}.` });
      } else if (p.salary >= expectedSal * 1.15) {
        factors.push({ title: 'Отличный контракт', delta: +2, desc: 'Клуб ценит вас и щедро платит.' });
      } else {
        factors.push({ title: 'Адекватная зарплата', delta: 0, desc: 'Зарплата соответствует вашему уровню.' });
      }

      // 3. Standard of living vs OVR comfort expectations
      const expectedComfort = ovr >= 86 ? 8 : (ovr >= 78 ? 5 : (ovr >= 72 ? 2 : 0));
      const netComfort = b.lifestyleHappy - expectedComfort;
      if (netComfort > 0) {
        factors.push({ title: 'Уровень жизни и персонал', delta: Math.min(8, netComfort), desc: `Жилье (${b.bestHousing.name}) и лайфстайл радуют вас.` });
      } else if (netComfort < 0) {
        factors.push({ title: 'Скромные условия для звезды', delta: Math.max(-5, netComfort), desc: `С рейтингом ${ovr} вы хотите более комфортное жилье и авто.` });
      } else {
        factors.push({ title: 'Уровень жизни', delta: 0, desc: 'Условия жизни соответствуют статусу.' });
      }

      // 4. Fatigue
      if (p.energy < 25) {
        factors.push({ title: 'Перетренированность / Усталость', delta: -5, desc: 'Энергия ниже 25%! Срочно нужен отдых.' });
      }

      // 5. Psychologist floor
      if (b.happyFloor > 0) {
        factors.push({ title: 'Спортивный психолог', delta: 0, desc: `Защита от выгорания: счастье не упадёт ниже ${b.happyFloor}%.`, special: true });
      }

      return factors;
    }

    /*************************************************************************
     * 5. SEASON SCHEDULE, SCORERS & LEAGUE SIMULATION
     *************************************************************************/
    function generateLeagueSchedule(clubs) {
      const ids = clubs.map(c => c.id);
      const n = ids.length;
      const half = n / 2;
      const rounds = [];
      const arr = [...ids];
      for (let r = 0; r < n - 1; r++) {
        const matches = [];
        for (let i = 0; i < half; i++) {
          const home = (r % 2 === 0) ? arr[i] : arr[n - 1 - i];
          const away = (r % 2 === 0) ? arr[n - 1 - i] : arr[i];
          matches.push({ home, away });
        }
        rounds.push(matches);
        const last = arr.pop();
        arr.splice(1, 0, last);
      }
      const secondHalf = rounds.map(r => r.map(m => ({ home: m.away, away: m.home })));
      return [...rounds, ...secondHalf];
    }

    function initLeagueScorers() {
      const scorers = {};
      LEAGUES.forEach(l => {
        scorers[l.id] = (AI_STARS_BY_LEAGUE[l.id] || []).map(s => ({
          name: s.name,
          clubId: s.clubId,
          goals: 0
        }));
      });
      return scorers;
    }

    function initSeasonTables() {
      const tables = {};
      const schedules = {};
      LEAGUES.forEach(l => {
        tables[l.id] = l.clubs.map(c => ({ clubId: c.id, played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }));
        schedules[l.id] = generateLeagueSchedule(l.clubs);
      });
      return { tables, schedules, scorers: initLeagueScorers() };
    }

    function sortTable(rows) {
      return [...rows].sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        const gdA = a.gf - a.ga, gdB = b.gf - b.ga;
        if (gdB !== gdA) return gdB - gdA;
        if (b.gf !== a.gf) return b.gf - a.gf;
        return a.clubId.localeCompare(b.clubId);
      });
    }

    function simulateAIMatchScore(homeClub, awayClub) {
      const diff = (homeClub.ovr + 2) - awayClub.ovr;
      const homeExp = Math.max(0.35, 1.35 + diff * 0.065);
      const awayExp = Math.max(0.30, 1.15 - diff * 0.055);
      const poisson = (lambda) => {
        let L = Math.exp(-lambda), k = 0, p = 1;
        do { k++; p *= Math.random(); } while (p > L && k < 7);
        return k - 1;
      };
      return { hg: poisson(homeExp), ag: poisson(awayExp) };
    }

    function applyMatchToTable(leagueId, homeId, awayId, hg, ag) {
      const table = state.tables[leagueId];
      const hRow = table.find(r => r.clubId === homeId);
      const aRow = table.find(r => r.clubId === awayId);
      if (!hRow || !aRow) return;
      hRow.played++; aRow.played++;
      hRow.gf += hg; hRow.ga += ag;
      aRow.gf += ag; aRow.ga += hg;
      if (hg > ag) { hRow.w++; hRow.pts += 3; aRow.l++; }
      else if (ag > hg) { aRow.w++; aRow.pts += 3; hRow.l++; }
      else { hRow.d++; hRow.pts += 1; aRow.d++; aRow.pts += 1; }

      // Credit AI star scorers realistically
      const lScorers = state.scorers[leagueId] || [];
      lScorers.forEach(sc => {
        if (sc.clubId === homeId && hg > 0 && Math.random() < 0.58) sc.goals += (hg >= 3 && Math.random() < 0.35) ? 2 : 1;
        if (sc.clubId === awayId && ag > 0 && Math.random() < 0.55) sc.goals += (ag >= 3 && Math.random() < 0.30) ? 2 : 1;
      });
    }

    function simulateOtherLeagueMatches(roundIdx, excludeLeagueId, excludeMatch) {
      LEAGUES.forEach(league => {
        const roundMatches = state.schedules[league.id][roundIdx];
        if (!roundMatches) return;
        roundMatches.forEach(m => {
          if (league.id === excludeLeagueId && excludeMatch && m.home === excludeMatch.home && m.away === excludeMatch.away) return;
          const hc = getClubById(m.home);
          const ac = getClubById(m.away);
          const { hg, ag } = simulateAIMatchScore(hc, ac);
          applyMatchToTable(league.id, m.home, m.away, hg, ag);
        });
      });
    }

    function getNextPlayerMatch() {
      const p = state.player;
      if (state.ucl && state.ucl.active && !state.ucl.finished) {
        return {
          type: 'ucl', stage: state.ucl.stage,
          home: state.ucl.currentOpponentHome ? state.ucl.opponentId : p.clubId,
          away: state.ucl.currentOpponentHome ? p.clubId : state.ucl.opponentId,
          opponentId: state.ucl.opponentId,
          isHome: !state.ucl.currentOpponentHome
        };
      }
      if (state.round >= 18) return null;
      const roundMatches = state.schedules[p.leagueId][state.round];
      const match = roundMatches.find(m => m.home === p.clubId || m.away === p.clubId);
      if (!match) return null;
      const isHome = match.home === p.clubId;
      return {
        type: 'league', round: state.round + 1,
        home: match.home, away: match.away,
        opponentId: isHome ? match.away : match.home,
        isHome
      };
    }

          </div>

    }

    function calcActionChance(statKey, oppOvr, difficultyMod = 0) {
      const p = state.player;
      const b = getOwnedBonuses();
      const hp = getHappinessProfile(p.happiness);
      const effectiveStat = p.stats[statKey] + (b.statBonus[statKey] || 0);
      const energyMod = p.energy < 30 ? -10 : (p.energy > 80 ? 3 : 0);
      const raw = 53 + (effectiveStat - oppOvr) * 1.42 + hp.matchMod + energyMod + difficultyMod;
      return Math.max(12, Math.min(95, Math.round(raw)));
    }

    function startInteractiveMatch() {
      const p = state.player;
      const next = getNextPlayerMatch();
      const myClub = getClubById(p.clubId);
      const oppClub = getClubById(next.opponentId);
      const role = getRoleLabel(p.trust);

      const count = role.moments;
      const momentMins = [];
      const startMin = role.label === 'Запасной' ? 52 : 12;
      const step = Math.floor((86 - startMin) / count);
      for (let i = 0; i < count; i++) {
        momentMins.push(startMin + i * step + Math.floor(Math.random() * 6));
      }

      liveMatch = {
        next, myClub, oppClub, minute: 0, myScore: 0, oppScore: 0,
        playerGoals: 0, playerAssists: 0, missedPenalties: 0, rating: 6.2,
        momentMins, momentIdx: 0, activeMoment: null,
        log: [{ min: 0, text: `Стартовый свисток! ${next.isHome ? myClub.name : oppClub.name} — ${next.isHome ? oppClub.name : myClub.name}.`, type: 'info' }],
        timer: null, finished: false, goalFlash: false
      };

      if (role.label === 'Запасной') {
        liveMatch.log.unshift({ min: 1, text: 'Вы начинаете матч на скамейке запасных. Выход во втором тайме.', type: 'muted' });
      }
      haptic('medium');
      renderLiveMatchModal();
      resumeMatchTimer();
    }

    function resumeMatchTimer() {
      if (!liveMatch || liveMatch.finished) return;
      clearInterval(liveMatch.timer);
      liveMatch.timer = setInterval(() => {
        if (!liveMatch || liveMatch.activeMoment) return;
        liveMatch.minute += 2;

        const diff = (liveMatch.myClub.ovr + (liveMatch.next.isHome ? 2 : 0)) - liveMatch.oppClub.ovr;
        const myBg = Math.max(0.008, 0.022 + diff * 0.0012);
        const oppBg = Math.max(0.008, 0.022 - diff * 0.0012);

        if (Math.random() < myBg && liveMatch.minute > 4 && liveMatch.minute < 89) {
          liveMatch.myScore++;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `⚽ ГОЛ! Партнёр по ${liveMatch.myClub.name} завершает атаку!`, type: 'good' });
        } else if (Math.random() < oppBg && liveMatch.minute > 4 && liveMatch.minute < 89) {
          liveMatch.oppScore++;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `🔴 ${liveMatch.oppClub.name} забивает мяч.`, type: 'bad' });
        }

        if (liveMatch.minute === 50 && getRoleLabel(state.player.trust).label === 'Запасной') {
          liveMatch.log.unshift({ min: 50, text: '🔄 Замена! Вы выходите на поле!', type: 'info' });
        }

        const targetMin = liveMatch.momentMins[liveMatch.momentIdx];
        if (targetMin && liveMatch.minute >= targetMin) {
          clearInterval(liveMatch.timer);
          liveMatch.activeMoment = buildMomentScenario(state.player.pos, liveMatch.oppClub);
          liveMatch.momentIdx++;
          haptic('medium');
          renderLiveMatchModal();
          return;
        }

        if (liveMatch.minute >= 90) {
          liveMatch.minute = 90;
          clearInterval(liveMatch.timer);
          if (liveMatch.next.type === 'ucl' && liveMatch.myScore === liveMatch.oppScore) {
            const winPen = Math.random() < (0.5 + (liveMatch.myClub.ovr - liveMatch.oppClub.ovr) * 0.02);
            if (winPen) {
              liveMatch.myScore++;
              liveMatch.log.unshift({ min: 90, text: '🏆 Серия пенальти! Ваша команда побеждает!', type: 'good' });
            } else {
              liveMatch.oppScore++;
              liveMatch.log.unshift({ min: 90, text: '💔 Серия пенальти... Соперник точнее.', type: 'bad' });
            }
          }
          liveMatch.finished = true;
          liveMatch.log.unshift({ min: 90, text: '🏁 Финальный свисток!', type: 'info' });
          renderLiveMatchModal();
          return;
        }
        renderLiveMatchModal();
      }, 165);
    }

    function resolveMomentChoice(choiceIdx) {
      if (!liveMatch || !liveMatch.activeMoment) return;
      const choice = liveMatch.activeMoment.choices[choiceIdx];
      const success = Math.random() * 100 < choice.chance;

      if (success) {
        haptic('success'); playSfx('goal');
        if (choice.outcomeType === 'goal') {
          liveMatch.myScore++; liveMatch.playerGoals++;
          liveMatch.rating = Math.min(10, liveMatch.rating + 1.15);
          liveMatch.goalFlash = true;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `⚽ ГОЛ! ${choice.successText}`, type: 'good' });
        } else if (choice.outcomeType === 'assist') {
          liveMatch.myScore++; liveMatch.playerAssists++;
          liveMatch.rating = Math.min(10, liveMatch.rating + 0.85);
          liveMatch.goalFlash = true;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `🎯 АССИСТ! ${choice.successText}`, type: 'good' });
        } else if (choice.outcomeType === 'save') {
          liveMatch.rating = Math.min(10, liveMatch.rating + 0.7);
          liveMatch.log.unshift({ min: liveMatch.minute, text: `🛡️ ОТБОР! ${choice.successText}`, type: 'good' });
        }
      } else {
        haptic('error'); playSfx('fail');
        liveMatch.rating = Math.max(4.5, liveMatch.rating - 0.35);
        if (liveMatch.activeMoment.isDefense) {
          liveMatch.oppScore++;
          liveMatch.log.unshift({ min: liveMatch.minute, text: `🔴 ПРОПУСТИЛИ! ${choice.failText}`, type: 'bad' });
        } else {
          liveMatch.log.unshift({ min: liveMatch.minute, text: `❌ Момент упущен: ${choice.failText}`, type: 'bad' });
        }
      }

      liveMatch.activeMoment = null;
      renderLiveMatchModal();
      setTimeout(() => { if (liveMatch) liveMatch.goalFlash = false; resumeMatchTimer(); }, 520);
    }

    function resolvePenaltyShot(direction) {
      if (!liveMatch || !liveMatch.activeMoment) return;
      const dirs = ['left', 'center', 'right'];
      const dirLabels = { left: 'левый угол', center: 'центр', right: 'правый угол' };
      const keeperDir = dirs[Math.floor(Math.random() * 3)];
      const shoChance = calcActionChance('sho', liveMatch.oppClub.ovr, 18);
      const scored = (direction !== keeperDir)
        ? (Math.random() * 100 < Math.min(96, shoChance + 15))
        : (Math.random() * 100 < Math.max(22, shoChance - 36));

      if (scored) {
        haptic('success'); playSfx('goal');
        liveMatch.myScore++; liveMatch.playerGoals++;
        liveMatch.rating = Math.min(10, liveMatch.rating + 1.0);
        liveMatch.goalFlash = true;
        liveMatch.log.unshift({ min: liveMatch.minute, text: `⚽ ГОЛ с пенальти! Удар в ${dirLabels[direction]}, вратарь прыгнул в ${dirLabels[keeperDir]}!`, type: 'good' });
      } else {
        haptic('error'); playSfx('fail');
        liveMatch.missedPenalties++;
        liveMatch.rating = Math.max(4.5, liveMatch.rating - 0.6);
        liveMatch.log.unshift({ min: liveMatch.minute, text: `🧤 СЕЙВ! Вратарь угадал (${dirLabels[direction]}) и отбил пенальти (-6 счастья)!`, type: 'bad' });
      }

      liveMatch.activeMoment = null;
      renderLiveMatchModal();
      setTimeout(() => { if (liveMatch) liveMatch.goalFlash = false; resumeMatchTimer(); }, 600);
    }

    function runQuickSimMatch() {
      const p = state.player;
      const next = getNextPlayerMatch();
      const myClub = getClubById(p.clubId);
      const oppClub = getClubById(next.opponentId);
      const role = getRoleLabel(p.trust);
      const hp = getHappinessProfile(p.happiness);

      const homeClub = next.isHome ? myClub : oppClub;
      const awayClub = next.isHome ? oppClub : myClub;
      const score = simulateAIMatchScore(homeClub, awayClub);
      let myScore = next.isHome ? score.hg : score.ag;
      let oppScore = next.isHome ? score.ag : score.hg;

      const ovr = calcOVR(p.stats, p.pos);
      const eff = (ovr - oppClub.ovr + hp.matchMod) / 100;
      let pGoals = 0, pAssists = 0;

      for (let i = 0; i < role.moments; i++) {
        const roll = Math.random();
        const goalProb = p.pos === 'FWD' ? 0.28 + eff : (p.pos === 'MID' ? 0.16 + eff : 0.07 + eff * 0.5);
        const astProb = p.pos === 'MID' ? 0.26 + eff : (p.pos === 'FWD' ? 0.14 + eff : 0.08 + eff * 0.5);
        if (roll < Math.max(0.05, goalProb)) pGoals++;
        else if (roll < Math.max(0.1, goalProb + astProb)) pAssists++;
      }

      if (pGoals > myScore) myScore = pGoals;
      if (pAssists > myScore) myScore = Math.max(myScore, pAssists);
      if (next.type === 'ucl' && myScore === oppScore) {
        if (Math.random() < 0.52) myScore++; else oppScore++;
      }

      const winBonus = myScore > oppScore ? 0.6 : (myScore === oppScore ? 0.1 : -0.3);
      const rating = Math.min(10, Math.max(5.2, 6.2 + pGoals * 1.05 + pAssists * 0.75 + winBonus + (Math.random() * 0.6 - 0.3)));

      finalizeMatch({
        next, myClub, oppClub, myScore, oppScore,
        playerGoals: pGoals, playerAssists: pAssists, missedPenalties: 0,
        rating: Number(rating.toFixed(1))
      });
    }

    function finalizeMatchFromLive() {
      if (!liveMatch) return;
      const result = {
        next: liveMatch.next, myClub: liveMatch.myClub, oppClub: liveMatch.oppClub,
        myScore: liveMatch.myScore, oppScore: liveMatch.oppScore,
        playerGoals: liveMatch.playerGoals, playerAssists: liveMatch.playerAssists,
        missedPenalties: liveMatch.missedPenalties || 0,
        rating: Number(liveMatch.rating.toFixed(1))
      };
      liveMatch = null;
      finalizeMatch(result);
    }

    function finalizeMatch(res) {
      const p = state.player;
      const b = getOwnedBonuses();
      const hpBefore = getHappinessProfile(p.happiness);
      const { next, myClub, oppClub, myScore, oppScore, playerGoals, playerAssists, missedPenalties, rating } = res;
      const won = myScore > oppScore;
      const draw = myScore === oppScore;

      // Update Table / UCL
      if (next.type === 'league') {
        const hg = next.isHome ? myScore : oppScore;
        const ag = next.isHome ? oppScore : myScore;
        applyMatchToTable(p.leagueId, next.home, next.away, hg, ag);
        simulateOtherLeagueMatches(state.round, p.leagueId, { home: next.home, away: next.away });
        state.round++;
      } else if (next.type === 'ucl') {
        if (won) {
          if (next.stage === 'semi') {
            state.ucl.stage = 'final';
            const otherTop = LEAGUES.filter(l => l.id !== p.leagueId).map(l => sortTable(state.tables[l.id])[0].clubId);
            const candidates = otherTop.filter(id => id !== state.ucl.opponentId);
            state.ucl.opponentId = candidates[Math.floor(Math.random() * candidates.length)] || otherTop[0];
            state.ucl.currentOpponentHome = Math.random() < 0.5;
          } else {
            state.ucl.finished = true; state.ucl.won = true;
            p.trophies.ucl++; p.fans += Math.round(250000 * b.mediaMult);
          }
        } else {
          state.ucl.finished = true; state.ucl.won = false;
        }
      }

      const isMotm = rating >= 8.2 || (won && (playerGoals + playerAssists >= 2));

      // Stats update
      p.seasonStats.matches++; p.seasonStats.goals += playerGoals; p.seasonStats.assists += playerAssists;
      p.seasonStats.ratingSum += rating; if (isMotm) p.seasonStats.motm++;
      p.careerStats.matches++; p.careerStats.goals += playerGoals; p.careerStats.assists += playerAssists;
      p.careerStats.ratingSum += rating; if (isMotm) p.careerStats.motm++;

      // Economy
      let sponsorIncome = 0;
      if (p.activeSponsorId) {
        const sp = SPONSORS.find(s => s.id === p.activeSponsorId);
        if (sp) sponsorIncome = Math.round((sp.perMatch + sp.perGoal * playerGoals) * b.mediaMult);
      }
      const winBonusMoney = won ? Math.round(p.salary * 0.25) : 0;
      const matchSalaryTotal = p.salary + winBonusMoney;
      p.money += matchSalaryTotal + sponsorIncome;

      lastMatchSalaryForAd = matchSalaryTotal;
      postMatchAdUsed = false;

      // Energy
      const prevEnergy = p.energy;
      const energyCost = Math.max(10, 26 - b.energyRegen);
      p.energy = Math.max(5, Math.min(100, p.energy - energyCost + 10 + hpBefore.energyBonus));

      // Injury risk (fatigue + burnout penalty - physio/shinguards reduction)
      let injuredNow = false;
      const baseFatigueRisk = prevEnergy < 35 ? (38 - prevEnergy) * 0.017 : 0.01;
      const totalRisk = (baseFatigueRisk + hpBefore.injuryAdd) * (1 - b.injuryRed);
      if ((prevEnergy < 35 || hpBefore.injuryAdd > 0) && Math.random() < totalRisk) {
        p.injuryRounds = Math.random() < 0.65 ? 1 : 2;
        injuredNow = true;
      }

      // Happiness delta: match events + weekly recurring factors
      const weeklyFactors = getHappinessFactorsBreakdown();
      const weeklyDelta = weeklyFactors.reduce((s, f) => s + f.delta, 0);
      let eventHappyDelta = 0;
      if (won) eventHappyDelta += 4;
      else if (!draw) eventHappyDelta -= 4;
      eventHappyDelta += playerGoals * 3 + playerAssists * 2;
      if (missedPenalties > 0) eventHappyDelta -= missedPenalties * 6;
      if (injuredNow) eventHappyDelta -= 12;

      const totalHappyDelta = weeklyDelta + eventHappyDelta;
      changeHappiness(totalHappyDelta);

      // Coach trust (with burnout penalty if happiness < 20)
      const trustDelta = (rating >= 8.0 ? 8 : (rating >= 7.0 ? 4 : (rating >= 6.3 ? 1 : -5)))
        + playerGoals * 2 + playerAssists + hpBefore.trustPenalty;
      p.trust = Math.max(10, Math.min(100, p.trust + trustDelta));

      // Fans
      const fansGain = Math.round((playerGoals * 4200 + playerAssists * 2400 + (isMotm ? 7000 : 0) + (won ? 1500 : 300)) * (myClub.tier * 0.55) * b.mediaMult);
      p.fans += fansGain;

      // Reset weekly slots & ad training flag
      state.weekActionsLeft = 3;
      state.adTrainUsedThisRound = false;

      // Windows / UCL
      let windowNotice = '';
      if (next.type === 'league' && state.round === 9) {
        state.transferWindowOpen = true;
        generateTransferOffers(false);
        windowNotice = '❄️ Открылось зимнее трансферное окно! Проверьте вкладку «Карьера → Трансферы».';
      } else if (next.type === 'league' && state.round === 18) {
        const sorted = sortTable(state.tables[p.leagueId]);
        const posIdx = sorted.findIndex(r => r.clubId === p.clubId);
        if (posIdx <= 1) {
          const otherLeaders = LEAGUES.filter(l => l.id !== p.leagueId).map(l => sortTable(state.tables[l.id])[0].clubId);
          state.ucl = {
            active: true, stage: 'semi',
            opponentId: otherLeaders[Math.floor(Math.random() * otherLeaders.length)],
            currentOpponentHome: Math.random() < 0.5, finished: false, won: false
          };
          windowNotice = '🏆 Ваш клуб в Топ-2 лиги и вышел в полуфинал Лиги Чемпионов!';
        }
      }

      saveState();
      haptic(won ? 'success' : 'light');

      renderPostMatchModal({
        next, myClub, oppClub, myScore, oppScore, won, draw,
        rating, playerGoals, playerAssists, isMotm,
        matchSalaryTotal, sponsorIncome, trustDelta, totalHappyDelta, fansGain,
        injuredNow, windowNotice
      });
    }

      state.player.money -= cost;
      state.player.injuryRounds = 0;
      state.player.energy = Math.min(100, state.player.energy + 20);
      changeHappiness(5);
      saveState(); haptic('success'); closeModal(); render();

      const p = state.player;
      const next = getNextPlayerMatch();
      if (next && next.type === 'league') {
        simulateOtherLeagueMatches(state.round, null, null);
        state.round++;
      } else if (next && next.type === 'ucl') {
        const myClub = getClubById(p.clubId), oppClub = getClubById(next.opponentId);
        const won = Math.random() < (0.45 + (myClub.ovr - oppClub.ovr) * 0.02);
        if (won && next.stage === 'semi') {
          state.ucl.stage = 'final';
          const otherTop = LEAGUES.filter(l => l.id !== p.leagueId).map(l => sortTable(state.tables[l.id])[0].clubId);

        } else {
          state.ucl.finished = true;
          state.ucl.won = won && next.stage === 'final';
          if (state.ucl.won) p.trophies.ucl++;

      }
      p.injuryRounds = Math.max(0, p.injuryRounds - 1);
      p.energy = Math.min(100, p.energy + 30);
      state.weekActionsLeft = 3;
      state.adTrainUsedThisRound = false;

        p.stats.phy = Math.max(40, p.stats.phy - drop);

      const { tables, schedules, scorers } = initSeasonTables();
      state.season++; state.round = 0;
      state.tables = tables; state.schedules = schedules; state.scorers = scorers;
      state.ucl = { active: false, stage: null, opponentId: null, finished: false, won: false };
      state.seasonAwardsGranted = false; state.transferWindowOpen = false;

    /*************************************************************************
     * 11. TRAINING & RECOVERY + ADSGRAM REWARD #2
     *************************************************************************/
    function getTrainSuccessChance(currentVal) {
      const b = getOwnedBonuses();
      const hp = getHappinessProfile(state.player.happiness);
      let base = 92 - Math.max(0, currentVal - 58) * 2.15;
      base = base * (1 + b.trainBonus + hp.trainMod);
      return Math.max(12, Math.min(97, Math.round(base)));
    }

    function performStatTraining(statKey) {
      const p = state.player;
      const meta = STAT_META.find(s => s.key === statKey);
      if (state.weekActionsLeft <= 0) { haptic('error'); showToast('Слоты закончились! Возьмите +1 за ролик или сыграйте матч.', 'error'); return; }
      if (p.energy < meta.energy) { haptic('error'); showToast('Недостаточно энергии! Отдохните перед тренировкой.', 'error'); return; }
      if (p.stats[statKey] >= 99) { showToast('Навык уже на максимуме (99)!', 'gold'); return; }

      const chance = getTrainSuccessChance(p.stats[statKey]);
      p.energy = Math.max(0, p.energy - meta.energy);
      state.weekActionsLeft--;

      // Overtraining happiness hit if energy drops below 20%
      if (p.energy < 20) changeHappiness(-4);

      if (Math.random() * 100 < chance) {
        p.stats[statKey] = Math.min(99, p.stats[statKey] + 1);
        changeHappiness(2);
        haptic('success'); playSfx('train');
        showToast(`🔥 Прогресс! ${meta.name} +1 (теперь ${p.stats[statKey]})`, 'success');
      } else {
        haptic('light'); playSfx('click');
        showToast('Интенсивная тренировка завершена, но навык пока не вырос.', 'info');
      }
      saveState(); render();
    }

    function performTeamTraining() {
      const p = state.player;
      if (state.weekActionsLeft <= 0) { haptic('error'); showToast('Слоты на эту неделю закончились!', 'error'); return; }
      if (p.energy < 12) { haptic('error'); showToast('Мало энергии для командной тренировки.', 'error'); return; }
      p.energy -= 12;
      p.trust = Math.min(100, p.trust + 7);
      changeHappiness(3);
      state.weekActionsLeft--;
      haptic('medium'); playSfx('train'); saveState(); render();

    /*************************************************************************
     * 12. TRANSFERS, AGENT + ADSGRAM REWARD #4
     *************************************************************************/
    function generateTransferOffers(isSummer = false) {
      const p = state.player;
      const ovr = calcOVR(p.stats, p.pos);
      const agent = AGENTS[p.agentId] || AGENTS[0];
      const allClubs = [];
      LEAGUES.forEach(l => l.clubs.forEach(c => {
        if (c.id !== p.clubId) allClubs.push({ ...c, leagueId: l.id, leagueName: l.name, leagueFlag: l.flag });
      }));

      const maxReach = ovr + 5 + Math.round(agent.bonusTop * 0.22) + (p.seasonStats.goals >= 10 ? 3 : 0);
      const minReach = Math.max(66, ovr - 6);
      let candidates = allClubs.filter(c => c.ovr <= maxReach && c.ovr >= minReach);
      if (candidates.length < 3) candidates = allClubs.sort((a, b) => Math.abs(a.ovr - ovr) - Math.abs(b.ovr - ovr)).slice(0, 6);

      candidates.sort(() => Math.random() - 0.5);
      const picked = candidates.slice(0, isSummer ? 4 : 3);
      state.transferOffers = picked.map((club, idx) => {
        const baseSal = Math.round((Math.pow(club.tier, 2.05) * 9500 + Math.max(0, ovr - 65) * 4500) / 1000) * 1000;
        const role = ovr >= club.ovr - 2 ? 'Ключевой игрок' : (ovr >= club.ovr - 6 ? 'Основа / Ротация' : 'Игрок ротации');
        const startTrust = ovr >= club.ovr - 2 ? 75 : (ovr >= club.ovr - 6 ? 55 : 38);
        return {
          offerId: `off_${Date.now()}_${idx}`, clubId: club.id,
          salary: Math.max(15000, baseSal), role, startTrust, negotiated: false, collapsed: false
        };
      });
      saveState();
    }

    function negotiateOffer(offerId) {
      const offer = state.transferOffers.find(o => o.offerId === offerId);
      if (!offer || offer.negotiated || offer.collapsed) return;
      const agent = AGENTS[state.player.agentId] || AGENTS[0];
      const successChance = 44 + agent.negBonus + (state.player.happiness >= 75 ? 8 : 0);
      offer.negotiated = true;

      if (Math.random() * 100 < successChance) {
        offer.salary = Math.round((offer.salary * 1.22) / 1000) * 1000;
        haptic('success'); playSfx('train');
        showToast(`Успешные торги! Зарплата повышена до ${formatMoney(offer.salary)}/матч!`, 'gold');
      } else {
        offer.collapsed = true;
        changeHappiness(-3);
        haptic('error'); playSfx('fail');
        showToast('Клуб отозвал предложение после жестких торгов.', 'error');
      }
      saveState(); render();
    }

    function acceptOffer(offerId) {
      const offer = state.transferOffers.find(o => o.offerId === offerId);
      if (!offer || offer.collapsed) return;
      const club = getClubById(offer.clubId);
      const p = state.player;
      const b = getOwnedBonuses();
      p.clubId = club.id; p.leagueId = club.leagueId;
      p.salary = offer.salary; p.trust = offer.startTrust;
      p.fans += Math.round(club.tier * 12000 * b.mediaMult);
      changeHappiness(10);
      state.transferOffers = []; state.transferWindowOpen = false;
      selectedTableLeague = club.leagueId;
      haptic('success'); playSfx('goal'); saveState(); render();
      showToast(`HERE WE GO! Вы перешли в ${club.name}! (+10% счастья)`, 'gold');
    }

    function hireAgent(agentId) {
      const ag = AGENTS[agentId];
      const p = state.player;
      if (p.agentId >= agentId) return;
      if (p.money < ag.cost) { haptic('error'); showToast('Недостаточно средств!', 'error'); return; }
      p.money -= ag.cost; p.agentId = agentId;
      haptic('success'); playSfx('train'); saveState(); render();
      showToast(`Новый агент: ${ag.name}!`, 'gold');
    }

    /*************************************************************************
     * 13. EXPANDED SHOP & SPONSORS LOGIC
     *************************************************************************/
    function buyShopItem(itemId) {
      const p = state.player;
      const item = SHOP_ITEMS.find(i => i.id === itemId);
      if (!item) return;

      if (!item.consumable && p.ownedItems.includes(item.id)) return;
      if (p.money < item.cost) {
        haptic('error'); showToast('Недостаточно средств на балансе!', 'error'); return;
      }

      p.money -= item.cost;
      const b = getOwnedBonuses();
      const ef = item.effect || {};

      if (item.consumable) {
        if (ef.happyNow) changeHappiness(ef.happyNow);
        if (ef.energyNow) p.energy = Math.min(100, p.energy + ef.energyNow);
        if (ef.fansNow) p.fans += Math.round(ef.fansNow * b.mediaMult);
        haptic('success'); playSfx('train');
        showToast(`${item.icon} ${item.name}: отличный отдых!`, 'success');
      } else {
        p.ownedItems.push(item.id);
        if (ef.fansOnce) p.fans += Math.round(ef.fansOnce * b.mediaMult);
        if (item.cat === 'housing' || item.cat === 'cars') changeHappiness(6);
        if (item.id === 'st_psych' && p.happiness < 45) p.happiness = 45;
        haptic('success'); playSfx('goal');
        showToast(`Куплено: ${item.name}!`, 'gold');
      }
      saveState(); render();
    }

    function signSponsor(sponsorId) {
      const p = state.player;
      const sp = SPONSORS.find(s => s.id === sponsorId);
      if (!sp) return;
      if (p.fans < sp.reqFans) { haptic('error'); showToast(`Нужно минимум ${formatFans(sp.reqFans)} фанатов!`, 'error'); return; }
      p.activeSponsorId = sp.id;

      showToast(`Подписан спонсор: ${sp.name}!`, 'gold');

    /**
     * Начисление реферального бонуса.
     * ПРИМЕЧАНИЕ ДЛЯ БЭКЕНДА:
     * В продакшене замените клиентскую проверку на fetch('/api/referral/claim?userId=' + tgUser.id),
     * где сервер проверяет параметр start_param (ref_<id>) у зашедших друзей в базе данных.
     */
    function claimReferralBonus() {
      const ref = state.referrals;
      const now = Date.now();
      if (!inviteSentFlag) {
        haptic('error');
        showToast('Сначала отправьте приглашение другу или скопируйте ссылку!', 'info');
        return;
      }
      if (ref.sessionClaims >= REF_MAX_SESSION) {
        haptic('error');
        showToast(`Лимит клиентских наград за сессию (${REF_MAX_SESSION}) исчерпан. Подключите бэкенд для безлимита!`, 'info');
        return;
      }
      if (now - ref.lastClaimAt < REF_COOLDOWN_MS) {
        const left = Math.ceil((REF_COOLDOWN_MS - (now - ref.lastClaimAt)) / 1000);
        haptic('error');
        showToast(`Подождите ${left} сек. перед следующей проверкой приглашения.`, 'info');
        return;
      }

      // Короткая имитация проверки
      showToast('Проверяем приглашение...', 'info');
      setTimeout(() => {
        ref.count += 1;
        ref.totalEarned += CONFIG.REFERRAL_REWARD;
        ref.lastClaimAt = Date.now();
        ref.sessionClaims += 1;
        inviteSentFlag = false;

        state.player.money += CONFIG.REFERRAL_REWARD;
        changeHappiness(5);
        saveState();
        haptic('success');
        playSfx('goal');
        render();
        showToast(`🎉 Друг присоединился! +${formatMoney(CONFIG.REFERRAL_REWARD)} и +5% к счастью!`, 'gold');
      }, 900);
    }

                          ${renderClubCrest(c, 34)}
                          <div>
                            <div class="text-xs font-bold text-white">${c.name}</div>
                            <div class="text-[10px] text-slate-400">${c.leagueFlag} ${c.leagueName} • OVR ${c.ovr}</div>
                          </div>
                        </div>
                        <div class="text-right">
                          <div class="text-xs font-bold text-emerald-400">${formatMoney(o.salary)}/матч</div>
                          <div class="text-[10px] text-amber-300">${o.role}</div>
                        </div>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <button onclick="acceptOffer('${o.offerId}')" class="btn-primary py-2 text-xs">✍️ Подписать</button>
                        <button onclick="negotiateOffer('${o.offerId}')" ${o.negotiated ? 'disabled' : ''} class="btn-secondary py-2 text-xs ${o.negotiated ? 'opacity-40' : ''}">${o.negotiated ? 'Торг завершён' : '💬 Торг (+22%)'}</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <div class="glass-panel p-4">
            <div class="text-xs font-bold uppercase text-amber-400 mb-2.5">Футбольный агент</div>
            <div class="space-y-2">
              ${AGENTS.map(ag => {
                const isCur = p.agentId === ag.id, owned = p.agentId >= ag.id;
                return `
                  <div class="p-3 rounded-xl border flex items-center justify-between gap-2 ${isCur ? 'bg-amber-500/15 border-amber-400/50' : 'bg-slate-900/70 border-white/5'}">
                    <div class="flex items-center gap-2.5">
                      <span class="text-2xl">${ag.emoji}</span>
                      <div>
                        <div class="text-xs font-bold text-white">${ag.name} ${isCur ? '<span class="text-amber-300">(Ваш)</span>' : ''}</div>
                        <div class="text-[10px] text-slate-400">${ag.desc}</div>
                      </div>
                    </div>
                    ${owned ? '<span class="text-xs font-bold text-emerald-400">✓</span>' : `<button onclick="hireAgent(${ag.id})" class="px-3 py-1.5 rounded-lg bg-amber-500/20 border border-amber-400/40 text-amber-200 text-[11px] font-bold shrink-0">${formatMoney(ag.cost)}</button>`}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (careerSubTab === 'sponsors') {
        const b = getOwnedBonuses();
        body = `
          <div class="glass-panel p-4">
            <div class="flex items-center justify-between mb-3">
              <div class="text-xs font-bold uppercase text-sky-400">📣 Спонсорские контракты</div>
              <span class="text-[11px] text-purple-300 font-bold">${formatFans(p.fans)} фанов</span>
            </div>
            ${b.mediaMult > 1 ? `<div class="mb-3 p-2 rounded-xl bg-emerald-500/10 border border-emerald-400/30 text-[11px] text-emerald-300 font-semibold">📱 Медиа-менеджер активен: +25% к выплатам спонсоров!</div>` : ''}
            <div class="space-y-2">
              ${SPONSORS.map(sp => {
                const active = p.activeSponsorId === sp.id;
                const unlocked = p.fans >= sp.reqFans;
                return `
                  <div class="p-3 rounded-xl border flex items-center justify-between gap-2 ${active ? 'bg-emerald-500/15 border-emerald-400/50' : 'bg-slate-900/75 border-white/5'}">
                    <div class="flex items-center gap-2.5">
                      <span class="text-2xl">${sp.icon}</span>
                      <div>
                        <div class="text-xs font-bold text-white">${sp.name}</div>
                        <div class="text-[10px] text-emerald-300">+${formatMoney(sp.perMatch)}/матч • +${formatMoney(sp.perGoal)}/гол</div>
                        <div class="text-[10px] text-slate-400">Нужно: ${formatFans(sp.reqFans)} фанов</div>
                      </div>
                    </div>
                    ${active
                      ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-500/25 text-emerald-300 text-[10px] font-bold shrink-0">Активен</span>`
                      : `<button onclick="signSponsor('${sp.id}')" class="px-3 py-1.5 rounded-lg text-[11px] font-bold shrink-0 ${unlocked ? 'bg-sky-500/20 border border-sky-400/50 text-sky-200' : 'bg-slate-800 text-slate-500'}">${unlocked ? 'Выбрать' : '🔒'}</button>`
                    }
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else {
        // ДРУЗЬЯ (+20 000 €)
        const ref = state.referrals;
        const link = getReferralLink();
        body = `
          <div class="glass-panel p-5 space-y-4">
            <div class="text-center">
              <div class="text-4xl mb-1.5">🎁</div>
              <h3 class="font-sport text-2xl font-bold text-white">ПРИГЛАСИ ДРУГА</h3>
              <p class="text-xs text-slate-300 mt-1">
                Получи <strong class="text-emerald-400">+${formatMoney(CONFIG.REFERRAL_REWARD)}</strong> и <strong class="text-amber-300">+5% к счастью</strong> за каждого друга в Telegram!
              </p>
            </div>

            <div class="grid grid-cols-2 gap-2.5 text-center">
              <div class="bg-slate-900/80 rounded-xl p-3 border border-white/5">
                <div class="text-[10px] text-slate-400">Приглашено друзей</div>
                <div class="font-sport text-2xl font-bold text-white">${ref.count}</div>
              </div>
              <div class="bg-slate-900/80 rounded-xl p-3 border border-white/5">
                <div class="text-[10px] text-slate-400">Заработано бонусом</div>
                <div class="font-sport text-2xl font-bold text-emerald-400">${formatMoney(ref.totalEarned)}</div>
              </div>
            </div>

            <div class="bg-slate-950/80 rounded-xl p-3 border border-white/10">
              <div class="text-[10px] text-slate-400 mb-1">Ваша персональная ссылка</div>
              <div class="text-[11px] text-sky-300 font-mono break-all select-all">${link}</div>
            </div>

            <div class="flex flex-col gap-2.5">
              <button onclick="shareReferralTelegram()" class="btn-primary py-3.5 text-sm flex items-center justify-center gap-2">
                <span>✈️</span> Пригласить в Telegram
              </button>
              <button onclick="copyReferralLink()" class="btn-secondary py-3 text-xs flex items-center justify-center gap-2">
                <span>📋</span> Скопировать ссылку
              </button>
              <button onclick="claimReferralBonus()" class="btn-gold py-3 text-xs flex items-center justify-center gap-2 ${inviteSentFlag ? '' : 'opacity-70'}">
                <span>✅</span> Проверить и забрать +${formatMoney(CONFIG.REFERRAL_REWARD)}
              </button>
            </div>
          </div>
        `;
      }

      return `
        <div class="p-4 space-y-3.5 animate-in">
          <div class="grid grid-cols-3 gap-1.5 bg-slate-900/80 p-1 rounded-2xl border border-white/10">
            <button onclick="careerSubTab='transfers'; render();" class="py-2 rounded-xl text-xs font-bold ${careerSubTab === 'transfers' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}">Трансферы</button>
            <button onclick="careerSubTab='sponsors'; render();" class="py-2 rounded-xl text-xs font-bold ${careerSubTab === 'sponsors' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}">Спонсоры</button>
            <button onclick="careerSubTab='friends'; render();" class="py-2 rounded-xl text-xs font-bold ${careerSubTab === 'friends' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}">Друзья +20к</button>
          </div>
          ${body}
        </div>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      haptic('light');
      playSfx('click');
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function renderBottomNav() {
      const items = [
        { id: 'home', label: 'Главная', icon: '🏠' },
        { id: 'match', label: 'Матч', icon: '⚽' },
        { id: 'training', label: 'Тренировка', icon: '🏋️', badge: state.weekActionsLeft > 0 ? state.weekActionsLeft : null },
        { id: 'shop', label: 'Магазин', icon: '🛍️' },
        { id: 'career', label: 'Карьера', icon: '💼', badge: state.transferOffers.filter(o => !o.collapsed).length || null }
      ];
      return `
        <nav class="bottom-nav grid grid-cols-5">
          ${items.map(it => `
            <button onclick="switchTab('${it.id}')" class="nav-btn ${activeTab === it.id ? 'active' : ''}">
              <div class="relative text-lg leading-none mb-1">
                ${it.icon}
                ${it.badge ? `<span class="absolute -top-1 -right-2.5 min-w-[15px] h-[15px] px-1 rounded-full bg-emerald-500 text-slate-950 text-[9px] font-extrabold flex items-center justify-center">${it.badge}</span>` : ''}
              </div>
              <span>${it.label}</span>
            </button>
          `).join('')}
        </nav>
      `;
    }

    function render() {
      const root = document.getElementById('root');
      if (!state || !state.player) {
        root.innerHTML = renderCreationScreen();
        return;
      }
      let content = '';
      if (activeTab === 'home') content = renderHomeTab();
      else if (activeTab === 'match') content = renderMatchTab();
      else if (activeTab === 'training') content = renderTrainingTab();
      else if (activeTab === 'shop') content = renderShopTab();
      else if (activeTab === 'career') content = renderCareerTab();

      root.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 pb-20">${content}</main>
        ${renderBottomNav()}
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTelegram();
      loadState();
      render();
    });
  </script>
</body>
  </html>
