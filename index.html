                </div>
                ${owned
                  ? '<span class="badge badge-green">Куплено</span>'
                  : `<button onclick="buyLifestyleItem('${it.id}')" ${canBuy ? '' : 'disabled'} class="btn btn-gold btn-sm">${fmtMoney(it.cost)}</button>`
                }
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderLeaguesTab() {
      const win = getWindowInfo();
      if (win.open) ensureTransferOffersForWindow();
      const tbl = getSortedTable(leagueViewId);
      const alreadyTransferred = win.open && state.lastTransferWinKey === win.key;

      return `
        <!-- Transfer Window Panel -->
        <div class="card ${win.open ? 'card-gold' : ''} stack">
          <div class="section-title" style="margin-bottom:2px;">
            <span>✈️ Трансферное окно</span>
            <span class="badge ${win.open ? 'badge-gold' : 'badge-slate'}">${win.open ? win.name : 'Закрыто'}</span>
          </div>
          ${!win.open ? `
            <div class="small muted">🔒 ${escapeHtml(win.countdown)}. В 1-м сезоне переходы закрыты, далее 2 окна за сезон: туры 1–2 и туры 9–10.</div>
          ` : alreadyTransferred ? `
            <div class="small" style="color:#34d399;">✓ Вы уже совершили трансфер в этом окне. Следующее окно откроется позже.</div>
          ` : `
            <div class="xs muted">Доступные предложения от клубов Топ-5 + РПЛ (1 переход за окно):</div>
            <div class="stack">
              ${state.transferOffers.map(o => {
                const c = getClub(o.clubId);
                return `
                  <div class="card row" style="padding:10px;background:rgba(10,17,30,0.9);">
                    <div class="row-left">
                      ${renderClubBadge(c, 34)}
                      <div style="min-width:0;">
                        <div class="bold small truncate">${c.leagueFlag} ${escapeHtml(c.name)}</div>
                        <div class="xs muted">OVR ${c.ovr} • ЗП ${fmtMoney(o.salary)} • Бонус +${fmtMoney(o.bonus)}</div>
                      </div>
                    </div>
                    <button onclick="acceptTransfer('${c.id}')" class="btn btn-primary btn-sm">Перейти</button>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>

        <!-- League Selector & Standings -->
        <div class="league-scroll">
          ${LEAGUES.map(lg => `
            <button onclick="leagueViewId='${lg.id}'; render();" class="league-pill ${leagueViewId === lg.id ? 'active' : ''}">
              ${lg.flag} ${lg.name}
            </button>
          `).join('')}
        </div>

        <div class="card">
          <div class="section-title">
            <span>🏆 Таблица • ${getLeague(leagueViewId).name}</span>
            <span class="xs muted">Тур ${state.round}/18</span>
          </div>
          <div class="tbl-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>Клуб</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>РМ</th><th>О</th></tr>
              </thead>
              <tbody>
                ${tbl.map((r, i) => {
                  const c = getClub(r.clubId);
                  const isMe = c.id === state.player.clubId;
                  return `
                    <tr class="${isMe ? 'me-row' : ''}">
                      <td class="bold">${i + 1}</td>
                      <td><div class="row-left" style="gap:6px;">${renderClubBadge(c, 20)}<span class="truncate ${isMe ? 'bold' : ''}">${escapeHtml(c.name)}</span></div></td>
                      <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
                      <td>${r.gf - r.ga}</td>
                      <td class="bold" style="color:#34d399;">${r.pts}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderOnlineTab() {
      const daily = getOnlineDailyInfo();
      const opp = onlineState.selectedOpp || SPARRING_BOTS[0];
      const scouted = onlineState.scoutedId === opp.tg_id;
      const myRank = onlineState.leaderboard.findIndex(r => r.tg_id === tgUser.id) + 1;

      const statusBanner = onlineState.status === 'ok'
        ? `<div class="badge badge-green">🟢 Облако Supabase: синхронизировано (${onlineState.leaderboard.length} игр.)</div>`
        : onlineState.status === 'syncing'
        ? `<div class="badge badge-sky">⏳ Синхронизация с Supabase...</div>`
        : onlineState.status === 'err'
        ? `<div class="card card-rose xs">🔴 Ошибка облака: ${escapeHtml(onlineState.errorText)}</div>`
        : `<div class="badge badge-slate">⚪ Нажми «Обновить» для связи с облаком</div>`;

      return `
        <div class="row">
          <div>
            <div style="font-size:18px;font-weight:900;">🌍 PRO LEAGUE LIVE</div>
            <div class="xs muted">ELO: <b style="color:#fbbf24;">${state.online.rating}</b> • ${state.online.wins}В-${state.online.draws}Н-${state.online.losses}П ${myRank > 0 ? '• #' + myRank + ' в мире' : ''}</div>
          </div>
          <button onclick="syncOnlineProfile(false)" class="btn btn-sec btn-sm">🔄 Обновить</button>
        </div>

        ${statusBanner}

        <div class="seg-tabs">
          <button onclick="onlineSubTab='pvp'; render();" class="seg-btn ${onlineSubTab === 'pvp' ? 'active' : ''}">⚔️ PvP Матч</button>
          <button onclick="onlineSubTab='top'; render();" class="seg-btn ${onlineSubTab === 'top' ? 'active' : ''}">🏆 Топ-50 мира</button>
        </div>

        ${onlineSubTab === 'pvp' ? `
          <div class="card card-highlight row">
            <div>
              <div class="bold">${daily.canPlay ? '⚔️ Ежедневный PvP-тур открыт!' : '⏳ Лимит на сегодня исчерпан'}</div>
              <div class="xs muted">${daily.canPlay ? '1 реальный день = 1 рейтинговый матч' : 'Обновление через ' + getMidnightCountdown()}</div>
            </div>
            <div style="font-size:18px;font-weight:900;color:#34d399;">${daily.played}/${daily.max}</div>
          </div>

          <div class="card stack">
            <div class="row">
              <span class="bold small">Соперник на матч</span>
              <button onclick="rerollOnlineOpponent()" class="xs bold" style="color:#38bdf8;">🔄 Другой соперник</button>
            </div>
            <div class="card row" style="padding:12px;background:rgba(10,17,30,0.9);">
              <div style="min-width:0;">
                <div class="bold truncate">${escapeHtml(opp.name)} <span class="xs" style="color:#fbbf24;">${escapeHtml(opp.position || 'ST')}</span></div>
                <div class="xs muted">${escapeHtml(opp.club || 'Клуб')} • 🏆 ${opp.rating || 1000} ELO</div>
                <div class="xs" style="margin-top:4px;">Тактика: <b>${scouted ? tacticLabel(opp.tactic) : '❓ Скрыта'}</b></div>
              </div>
              <div class="center">
                <div class="xs muted">OVR</div>
                <div style="font-size:24px;font-weight:900;color:#fbbf24;">${opp.ovr || 68}</div>
              </div>
            </div>
            ${!scouted ? `<button onclick="watchAdScout()" class="btn btn-purple btn-sm" style="width:100%;">🕵️ Разведка скаута — узнать тактику (AdsGram)</button>` : ''}
          </div>

          <div class="card stack">
            <div class="bold small">Выбери тактику (Камень-ножницы-бумага ±12%):</div>
            <div class="grid-3">
              ${[
                { id: 'press',   lbl: '🔥 Прессинг',  sub: 'бьёт Тики-таку' },
                { id: 'counter', lbl: '⚡ Контра',    sub: 'бьёт Прессинг' },
                { id: 'tiki',    lbl: '🎯 Тики-така', sub: 'бьёт Контру' }
              ].map(t => `
                <button onclick="onlineState.myTactic='${t.id}'; render();" class="chip-btn ${onlineState.myTactic === t.id ? 'selected' : ''}">
                  <div class="xs bold">${t.lbl}</div>
                  <div style="font-size:9px;color:#94a3b8;margin-top:2px;">${t.sub}</div>
                </button>
              `).join('')}
            </div>
            <button onclick="playOnlinePvP()" ${daily.canPlay ? '' : 'disabled'} class="btn btn-primary">
              ${daily.canPlay ? '⚔️ Сыграть рейтинговый PvP-матч' : '⏳ Новый тур через ' + getMidnightCountdown()}
            </button>
            ${!daily.canPlay && state.online.extraAdDay !== todayKey()
              ? `<button onclick="watchAdExtraPvP()" class="btn btn-gold">🎬 +1 доп. PvP-матч сегодня (AdsGram)</button>`
              : ''
            }
          </div>
        ` : `
          <div class="card">
            <div class="section-title"><span>🏆 Глобальный Топ-50 мира</span><span class="xs muted">Supabase Live</span></div>
            ${onlineState.leaderboard.length === 0 ? `
              <div class="center small muted" style="padding:20px 0;">Таблица загружается или пока пуста. Нажми «Обновить».</div>
            ` : `
              <div class="tbl-wrap">
                <table>
                  <thead><tr><th>#</th><th>Игрок</th><th>OVR</th><th>В-Н-П</th><th>ELO</th></tr></thead>
                  <tbody>
                    ${onlineState.leaderboard.map((r, idx) => {
                      const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1);
                      const isMe = r.tg_id === tgUser.id;
                      return `
                        <tr class="${isMe ? 'me-row' : ''}">
                          <td class="bold">${medal}</td>
                          <td>
                            <div class="bold truncate" style="max-width:135px;">${escapeHtml(r.name)}</div>
                            <div class="xs muted truncate" style="max-width:135px;">${escapeHtml(r.club || '')} • ${escapeHtml(r.position || '')}</div>
                          </td>
                          <td class="bold" style="color:#fbbf24;">${r.ovr}</td>
                          <td class="xs">${r.wins || 0}-${r.draws || 0}-${r.losses || 0}</td>
                          <td class="bold" style="color:#34d399;">${r.rating}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        `}
      `;
    }

    function setTab(tab) {
      if (liveMatch && tab !== 'match') {
        showToast('Сначала заверши текущий матч!', 'error');
        return;
      }
      activeTab = tab;
      haptic('light');
      if (tab === 'online' && (onlineState.status === 'idle' || Date.now() - onlineState.lastSyncedAt > 45000)) {
        syncOnlineProfile(false);
        return;
      }
      render();
      window.scrollTo(0, 0);
    }

    function render() {
      try {
        const app = document.getElementById('app');
        if (!app) return;

        if (!state) {
          app.innerHTML = renderOnboarding();
          return;
        }

        const p = state.player;
        const club = getClub(p.clubId);
        const eCls = p.energy >= 50 ? 'pill-energy-hi' : p.energy >= 25 ? 'pill-energy-md' : 'pill-energy-lo';
        const pvpCanPlay = getOnlineDailyInfo().canPlay;

        let content = '';
        if (activeTab === 'career') content = renderCareerTab();
        else if (activeTab === 'train') content = renderTrainingTab();
        else if (activeTab === 'match') content = renderMatchTab();
        else if (activeTab === 'life') content = renderLifestyleTab();
        else if (activeTab === 'leagues') content = renderLeaguesTab();
        else if (activeTab === 'online') content = renderOnlineTab();

        app.innerHTML = `
          <header class="hud">
            <div class="hud-club">
              ${renderClubBadge(club, 32)}
              <div class="hud-club-meta">
                <div class="hud-club-name">${escapeHtml(club.name)}</div>
                <div class="hud-sub">Сезон ${state.season} • Тур ${Math.min(18, state.round + 1)}/18</div>
              </div>
            </div>
            <div class="hud-pills">
              <div class="pill ${eCls}">⚡ ${p.energy}%</div>
              <div class="pill pill-money">${fmtMoney(p.money)}</div>
            </div>
          </header>

          <main class="main-content anim">${content}</main>

          <nav class="bottom-nav">
            <button onclick="setTab('career')"  class="nav-btn ${activeTab === 'career'  ? 'active' : ''}"><span class="ico">👤</span><span>Карьера</span></button>
            <button onclick="setTab('train')"   class="nav-btn ${activeTab === 'train'   ? 'active' : ''}"><span class="ico">🏋️</span><span>Тренир.</span></button>
            <button onclick="setTab('match')"   class="nav-btn ${activeTab === 'match'   ? 'active' : ''}"><span class="ico">⚽</span><span>Матч</span></button>
            <button onclick="setTab('life')"    class="nav-btn ${activeTab === 'life'    ? 'active' : ''}"><span class="ico">💎</span><span>Лайфстайл</span></button>
            <button onclick="setTab('leagues')" class="nav-btn ${activeTab === 'leagues' ? 'active' : ''}"><span class="ico">🏆</span><span>Лиги</span></button>
            <button onclick="setTab('online')"  class="nav-btn ${activeTab === 'online'  ? 'active' : ''}">
              <span class="ico">🌍</span><span>Онлайн</span>
              ${pvpCanPlay ? '<span class="nav-dot"></span>' : ''}
            </button>
          </nav>
        `;
      } catch (err) {
        const app = document.getElementById('app');
        if (app) {
          app.innerHTML = '<div style="padding:24px;text-align:center;"><p style="color:#fb7185;">Ошибка рендера: ' + escapeHtml(err.message) + '</p><button onclick="resetSaveHard()" class="btn btn-primary" style="margin-top:12px;">Перезапустить</button></div>';
        }
      }
    }

    /* =========================================================================
       16. SAFE INITIALIZATION ON LOAD
       ========================================================================= */
    function bootApp() {
      try {
        initTelegram();
        state = loadState();
        if (state) {
          leagueViewId = state.player.leagueId || 'rpl';
        }
        render();
        registerIncomingReferralIfAny();
      } catch (e) {
        render();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
